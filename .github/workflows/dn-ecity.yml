# e-City Đà Nẵng: nhà Overture toàn thành phố -> PMTiles, ranh phường OSM. Chạy trên nhánh claude/danang-data.
name: Dữ liệu e-City Đà Nẵng
on:
  push:
    branches: [claude/danang-data]
    paths: ['dn-ecity/fetch.py', 'dn-ecity/nam.py', '.github/workflows/dn-ecity.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install overturemaps shapely rasterio pyproj numpy pillow
      - name: Cài tippecanoe
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe || (git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tc && cd /tmp/tc && make -j4 >/dev/null && sudo make install >/dev/null)
          tippecanoe --version
      - run: python dn-ecity/fetch.py
      - run: python dn-ecity/nam.py
      - name: Lưu dữ liệu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add dn-ecity/out
          git commit -m "dn-ecity: nhà Overture PMTiles + ranh phường [skip ci]" || echo "không có gì mới"
          git pull --rebase -q origin claude/danang-data && git push
