# Tải dữ liệu OpenStreetMap quanh Sun FourS Tower (16.0096, 108.2426) bán kính ~6 km cho mô hình 3D·4D·5D.
# Anh Hiệp cho phép dùng GitHub tải hộ (máy làm việc của Claude bị chặn Overpass). Chỉ chạy trên nhánh này.
name: Sun FourS OSM data
on:
  push:
    branches: [claude/sun-fours-osm]
    paths: [.github/workflows/sun-fours-osm.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tải Overpass
        run: |
          D=projects/sun-fours/osm; mkdir -p $D
          UA="hoang-hiep-crm-sun-fours-4d/1.0 (github.com/hiephoangmt-debug/hoang-hiep-crm)"
          get() {
            [ -s "$D/$1" ] && { echo "đã có $1"; return 0; }
            for try in 1 2 3; do
              for h in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
                if curl -sS --fail --max-time 240 -A "$UA" -H "Accept: application/json" --data-urlencode "data=$2" "$h" -o "$D/$1" && python3 -c "import json;d=json.load(open('$D/$1'));print('$1',len(d['elements']))"; then return 0; fi
                rm -f "$D/$1"; sleep 15
              done
            done
            return 1
          }
          get sf-osm-roads.json '[out:json][timeout:300];(way["highway"~"motorway|trunk|primary|secondary|tertiary|residential|unclassified|living_street|pedestrian"](15.955,108.180,16.065,108.305);way["natural"~"water|beach|coastline"](15.950,108.170,16.075,108.330);relation["natural"="water"](15.950,108.170,16.075,108.330);way["waterway"](15.950,108.170,16.075,108.310);way["landuse"](15.985,108.215,16.035,108.270);way["leisure"](15.985,108.215,16.035,108.270);way["bridge"](16.000,108.200,16.080,108.245););(._;>;);out;'
          get sf-osm-buildings.json '[out:json][timeout:300];(way["building"](15.987,108.219,16.032,108.266);relation["building"](15.987,108.219,16.032,108.266););(._;>;);out;' || echo "không tải được nhà"
          get sf-osm-tall.json '[out:json][timeout:300];(way["building"]["building:levels"](15.955,108.180,16.075,108.305);way["building"]["height"](15.955,108.180,16.075,108.305););(._;>;);out;' || echo "không tải được nhà cao tầng"
          get sf-osm-poi.json '[out:json][timeout:240];(nwr["tourism"~"hotel|resort|apartment|attraction|viewpoint"](15.955,108.190,16.065,108.310);nwr["shop"~"mall|supermarket|department_store"](15.955,108.190,16.065,108.310);nwr["amenity"~"hospital|university|marketplace|place_of_worship"](15.970,108.200,16.050,108.290););out center tags;' || echo "không tải được công trình"
          ls -la $D
      - name: Lưu vào kho
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/sun-fours/osm/
          git commit -m "Dữ liệu OpenStreetMap quanh Sun FourS (tải bằng GitHub Actions)" || echo "không có thay đổi"
          git pull --rebase origin ${GITHUB_REF_NAME} && git push
