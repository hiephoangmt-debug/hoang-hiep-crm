# Kiểm tra 7 trang FourS sau khi xuất bản: chữ cũ đã hết, có ưu đãi mới; thử chatbot + bảng tính.
name: Kiem tra trang ADS F2
on:
  push:
    branches: [claude/test-tele]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in "" toa-f2 bang-tinh-f2 phap-ly gio-hang hoi-dap can-ho-bien-da-nang; do
            curl -sSL -A "Mozilla/5.0" "https://www.sun-fours-tower.com/$p?v=$(date +%s)" -o p.html
            echo "/$p: $(wc -c <p.html)B | 26/10=$(grep -o '26/10' p.html|wc -l) 07/11=$(grep -o '07/11' p.html|wc -l) 15,5=$(grep -o '15,5' p.html|wc -l) | 25/11/2026=$(grep -o '25/11/2026' p.html|wc -l) 'Căn chính sách mới'=$(grep -o 'Căn chính sách mới' p.html|wc -l) 2026-11-25=$(grep -o '2026-11-25T23:59' p.html|wc -l)"
          done
      - run: |
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();
          for (const path of ['','toa-f2','hoi-dap']) { const p=await b.newPage();const err=[];p.on('pageerror',e=>err.push(e.message));
            await p.route(/script\.google\.com/,r=>r.fulfill({status:200,body:'{}'}));
            await p.goto('https://www.sun-fours-tower.com/'+path,{waitUntil:'networkidle'});await p.waitForTimeout(1500);
            await p.click('#chatBtn');await p.waitForTimeout(1200);
            await p.fill('#chatIn','Chiết khấu bao nhiêu?');await p.press('#chatIn','Enter');await p.waitForTimeout(9000);
            const t=await p.innerText('#chatBody');console.log('/'+path,'| days:',await p.evaluate(()=>[...document.querySelectorAll('[data-days]')].map(e=>e.textContent).join(',')),'| err:',err.length?err:'0');
            console.log('   bot:',(t.match(/Có 2 loại căn[^\n]{0,160}/)||['(không thấy câu trả lời mới)'])[0]); await p.close(); }
          const p=await b.newPage();await p.route(/script\.google\.com/,r=>r.fulfill({status:200,body:'{}'}));
          await p.goto('https://www.sun-fours-tower.com/bang-tinh-f2',{waitUntil:'networkidle'});await p.waitForTimeout(1500);
          const st=()=>p.evaluate(()=>[...document.querySelectorAll('input[name=plan]')].filter(r=>r.value.startsWith('tts')).map(r=>r.disabled).join(','));
          console.log('bang-tinh mới: tts disabled=',await st());await p.check('input[name=pol][value=cu]');await p.waitForTimeout(400);console.log('bang-tinh cũ: tts disabled=',await st());
          await b.close();})();
          JS
          node t.js
