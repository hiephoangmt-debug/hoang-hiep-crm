# Kiểm tra trang toa-f2-ads: HTML thô trả về (độ dài, phần đầu, phần cuối). Anh Hiệp báo trang trắng.
name: Kiem tra trang ADS F2
on:
  push:
    branches: [claude/test-tele]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.sun-fours-tower.com/toa-f2-ads https://www.sun-fours-tower.com/toa-f2; do
            curl -sSL -A "Mozilla/5.0" "$u" -o p.html -w "\n== $u %{http_code} %{size_download} bytes\n"
            echo "-- head:"; head -c 1500 p.html; echo; echo "-- tail:"; tail -c 600 p.html; echo
            grep -c "<script" p.html || true
          done
