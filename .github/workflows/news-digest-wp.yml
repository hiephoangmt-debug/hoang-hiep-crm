# Đăng bản tin quy hoạch – hạ tầng trong ngày lên hiephoangmt.com (WordPress).
# 08:20 mỗi sáng đăng bản tin tổng hợp toàn bộ tin của ngày hôm trước.
# Cần secret: WP_USER, WP_APP_PASSWORD (Application Password trong WordPress).
name: Bản tin lên website

on:
  schedule:
    - cron: '20 1 * * *'    # 08:20 giờ Việt Nam (GitHub có thể trễ vài phút)
  workflow_dispatch:
    inputs:
      date:
        description: 'Ngày của tin (YYYY-MM-DD), để trống = hôm qua'
        required: false
        default: ''
      draft:
        description: 'Chỉ lưu bản nháp (chưa hiện trên web)'
        type: boolean
        default: false
      preview:
        description: 'Xem thử: lấy tin mới nhất, lưu bản nháp [XEM THỬ]'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news-telegram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: news-telegram/requirements.txt
      - run: pip install -r requirements.txt
      - run: python publish_digest.py
        env:
          WP_USER: ${{ secrets.WP_USER || vars.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DIGEST_DATE: ${{ inputs.date }}
          WP_STATUS: ${{ inputs.draft && 'draft' || 'publish' }}
          PREVIEW: ${{ inputs.preview && '1' || '' }}
