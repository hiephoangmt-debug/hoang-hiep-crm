# Tự động build ứng dụng Nhà 3D (floorplan-3d/) và đăng lên GitHub Pages
# mỗi khi có thay đổi được merge vào main. Cũng chạy tay được từ tab Actions.
name: Deploy Nhà 3D lên GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'floorplan-3d/**'
      - 'dau-tu/**'
      - 'banner-ads/**'
      - '.github/workflows/deploy-floorplan-3d.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: floorplan-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: floorplan-3d/package-lock.json
      - run: npm ci
      - run: npm run build
      # Trang Thống kê đầu tư (tĩnh) nằm ở /dau-tu/
      - name: Thêm trang đầu tư
        run: mkdir -p dist/dau-tu && cp -r ../dau-tu/index.html ../dau-tu/data dist/dau-tu/
      # Xưởng Banner (tĩnh) nằm ở /banner-ads/
      - name: Thêm Xưởng Banner
        run: mkdir -p dist/banner-ads && cp ../banner-ads/index.html dist/banner-ads/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: floorplan-3d/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
