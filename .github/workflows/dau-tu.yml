# Lấy giá vàng, chứng khoán, khối ngoại, USD, Bitcoin mỗi ngày cho trang Thống kê đầu tư (dau-tu/).
# Chạy mỗi giờ trong phiên (9:15 → 15:15, thứ 2–6) và 18:30 mỗi ngày (giờ VN), rồi đăng lại trang web.
# GitHub có thể chạy trễ 5–15 phút so với lịch.
name: Thống kê đầu tư

on:
  schedule:
    - cron: '15 2-8 * * 1-5'   # 9:15, 10:15 … 15:15 giờ VN
    - cron: '30 11 * * *'      # 18:30 giờ VN (cả cuối tuần: vàng, Bitcoin…)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dau-tu
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dau-tu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dau-tu/requirements.txt
      - run: pip install -r requirements.txt
      - run: python fetch_prices.py
      - name: Lưu số liệu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "dau-tu: cập nhật giá $(TZ=Asia/Ho_Chi_Minh date '+%F %H:%M') [skip ci]"
          # bot tin tức cũng đẩy lên main -> thử lại nếu bị trùng lúc
          for i in 1 2 3 4; do git pull --rebase origin main && git push && exit 0; sleep $((i * 5)); done
          exit 1
      # Đăng lại trang web để hiện số mới
      - name: Đăng lại trang
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-floorplan-3d.yml --ref main
