# Lấy giá vàng, chứng khoán, khối ngoại, USD, Bitcoin mỗi ngày cho trang Thống kê đầu tư (dau-tu/).
# Chạy 15:45 (sau phiên chiều) và 18:30 giờ Việt Nam, rồi đăng lại trang web.
name: Thống kê đầu tư

on:
  schedule:
    - cron: '45 8 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dau-tu
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dau-tu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dau-tu/requirements.txt
      - run: pip install -r requirements.txt
      - run: python fetch_prices.py
      - name: Lưu số liệu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "dau-tu: cập nhật giá $(TZ=Asia/Ho_Chi_Minh date +%F) [skip ci]" && git pull --rebase origin main && git push)
      # Đăng lại trang web để hiện số mới
      - name: Đăng lại trang
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-floorplan-3d.yml --ref main
