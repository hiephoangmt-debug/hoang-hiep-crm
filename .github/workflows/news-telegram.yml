# Quét tin Sở Xây dựng / quy hoạch / hạ tầng / BĐS mỗi 30 phút và gửi về Telegram.
# Cần 2 secret trong Settings → Secrets and variables → Actions:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: Tin BĐS về Telegram

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      test_message:
        description: 'Chỉ gửi 1 tin thử để kiểm tra bot'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-telegram
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news-telegram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: news-telegram/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scan_news.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test_message && '1' || '' }}
      # Lưu danh sách bài đã gửi (không gửi trùng) và tin trong ngày (để đăng bản tin lên web).
      - name: Lưu trạng thái
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add seen.json digest
          git diff --cached --quiet || (git commit -m "news-telegram: cập nhật bài đã gửi [skip ci]" && git pull --rebase origin main && git push)
