<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Đà Nẵng 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #0b1220; --fg: #eef2ff; --chip: #ffffff24; --accent: #f59e0b; --accent-fg: #1f1300; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b1220; } }
  :root[data-theme="dark"] { --bg: #0b1220; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; }
  .top { position: fixed; top: 0; left: 0; right: 0; padding: max(10px, env(safe-area-inset-top)) 16px 12px; background: linear-gradient(#0b1220aa, transparent); pointer-events: none; }
  .top h1 { margin: 0; font-size: 16px; }
  .top small { font-size: 12px; opacity: .8; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 16px max(10px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, #0b1220e6 35%); }
  .time { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font: 600 13px Inter, sans-serif; }
  .time output { min-width: 58px; }
  .time input { flex: 1; accent-color: var(--accent); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; border-radius: 999px; padding: 8px 12px; font: 600 13px Inter, sans-serif; color: var(--fg); background: var(--chip); backdrop-filter: blur(6px); cursor: pointer; white-space: nowrap; }
  .chip.active { background: var(--accent); color: var(--accent-fg); }
  .credit { font-size: 10px; opacity: .6; margin-top: 6px; }
  .pins { position: fixed; inset: 0; pointer-events: none; }
  .pin { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .pin b { font: 600 12px Inter, sans-serif; background: #fffffff0; color: #111827; padding: 4px 9px; border-radius: 999px; white-space: nowrap; box-shadow: 0 2px 8px #0006; }
  .pin.lotpin b { background: #e5281f; color: #fff; }
  .pin.small b { font-size: 11px; background: #111827d9; color: #fff; }
  .pin span { width: 2px; height: 18px; background: linear-gradient(#fff, #fff0); }
  .unit { position: fixed; left: 12px; right: 12px; bottom: 112px; max-width: 420px; margin: 0 auto; background: #0f172af2; border: 1px solid #ffffff22; border-radius: 14px; padding: 14px 14px 12px; font-size: 13px; box-shadow: 0 8px 30px #0008; }
  .unit b { display: block; font-size: 15px; } .unit small { opacity: .75; }
  .unit table { width: 100%; border-collapse: collapse; margin: 8px 0; } .unit td { padding: 4px 0; border-bottom: 1px solid #ffffff14; vertical-align: top; } .unit td:first-child { opacity: .7; width: 38%; }
  .unit .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .x { position: absolute; top: 8px; right: 8px; border: 0; background: #ffffff1f; color: var(--fg); border-radius: 999px; width: 30px; height: 30px; cursor: pointer; }
  .plan { position: fixed; inset: 0; background: #000d; overflow: auto; z-index: 5; padding: 50px 12px 20px; text-align: center; }
  .plan img { max-width: 100%; width: 720px; border-radius: 8px; background: #fff; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); font-size: 14px; transition: opacity .6s; text-align: center; padding: 16px; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="pins" id="pins"></div>
<header class="top"><h1>Đà Nẵng 3D · 5D</h1><small>Toạ độ, nhà, cầu, sông, biển, núi theo dữ liệu thật — kéo để xoay, chụm để phóng</small></header>
<footer class="bar">
  <div class="time"><output id="clock">18:45</output><input id="hour" type="range" min="0" max="24" step="0.05" value="18.75" aria-label="Giờ trong ngày" /></div>
  <div class="chips">
    <button class="chip active" id="tourBtn">🎬 Tự bay</button>
    <button class="chip" id="flowBtn">⏩ Thời gian trôi</button>
    <button class="chip" data-h="12">☀️ Trưa</button>
    <button class="chip" data-h="17.6">🌇 Hoàng hôn</button>
    <button class="chip" data-h="18.75">🌆 Chạng vạng</button>
    <button class="chip" data-h="21.5">🌃 Đêm</button>
    <button class="chip active" id="pinBtn">🏷 Nhãn</button>
    <button class="chip active" id="carBtn">🚗 Xe &amp; tàu</button>
    <button class="chip" id="veBtn">📏 Độ cao ×2</button>
    <button class="chip" id="homeBtn">↺ Đà Nẵng</button>
    <button class="chip" id="haBtn">🏮 Hội An</button>
    <button class="chip" id="lotBtn">📍 Lô đất Hoàng Sa</button>
    <button class="chip" id="caBtn" hidden>🏡 Casamia</button>
    <button class="chip active" id="hvbBtn" hidden>🏗 Hải Vân Bay hoàn thiện</button>
  </div>
  <div class="credit">Bản đồ © OpenStreetMap contributors (ODbL) · Địa hình: Terrain Tiles (Mapzen, AWS Open Data)</div>
</footer>
<div class="unit" id="unit" hidden>
  <button class="x" id="unitX" aria-label="Đóng">✕</button>
  <b id="unitT"></b><small id="unitS"></small>
  <table id="unitTb"></table>
  <div class="row" id="unitPlans"></div>
</div>
<div class="plan" id="plan" hidden><button class="x" id="planX" aria-label="Đóng">✕</button><img id="planImg" alt="Mặt bằng căn điển hình Park Home" /></div>
<div class="loading" id="loading">Đang tải dữ liệu Đà Nẵng…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (id) => document.getElementById(id);
const say = (t) => { const l = $('loading'); if (l) l.textContent = t; };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const mod = (a, n) => ((a % n) + n) % n;
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ===== Tải dữ liệu =====
const texLoader = new THREE.TextureLoader();
const b64 = async (r) => { if (!r.ok) throw new Error(r.url); const t = (await r.text()).trim(); const s = atob(t), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a.buffer; };
const loadTex = (u) => new Promise((res, rej) => texLoader.load(u, res, undefined, () => rej(new Error('Không tải được ' + u))));
const [meta, bldBuf, demBuf, landNear, maskNear, landFar, maskFar] = await Promise.all([
  fetch('meta.json').then((r) => r.json()), fetch('bld.txt').then(b64), fetch('dem.txt').then(b64),
  loadTex('land-near.jpg'), loadTex('mask-near.png'), loadTex('land-far.jpg'), loadTex('mask-far.png'),
]).catch((e) => { say('Lỗi tải dữ liệu: ' + e.message); throw e; });
say('Đang dựng thành phố…');
await new Promise((r) => setTimeout(r, 30));

const ringArea = (r) => Math.abs(r.reduce((a, p, i) => { const q = r[(i + 1) % r.length]; return a + p[0] * q[1] - q[0] * p[1]; }, 0) / 2);
const inRing = (r, x, z) => { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const [xi, zi] = r[i], [xj, zj] = r[j]; if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) c = !c; } return c; };
const findProject = (re, fallback) => {
  const list = (meta.projects || []).filter((p) => p.rings && p.id[0] === 'w' && re.test(p.name || ''));
  const pick = list.sort((a, b) => ringArea(b.rings[0]) - ringArea(a.rings[0]))[0];
  return pick || (fallback ? (meta.projects || []).filter((p) => p.rings && fallback(p)).sort((a, b) => ringArea(b.rings[0]) - ringArea(a.rings[0]))[0] : null);
};
const LL = (lat, lon) => [(lon - meta.origin[1]) * meta.kx, -(lat - meta.origin[0]) * meta.kz];

const HA = LL(15.8772, 108.3282); // trung tâm phố cổ Hội An
// Casamia Balanca Hội An: từng lô lấy từ mặt bằng 363 lô, đã khớp toạ độ thật
const CASA_DATA = await fetch('casamia.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
// Lô đất Tờ 126 Thửa 30, Thọ Quang, Sơn Trà – góc Hoàng Sa × Hồ Học Lãm (587 m²)
const LOT = { ring: [[16.0901963, 108.2498741], [16.090422, 108.249988], [16.0904882, 108.249792], [16.0902628, 108.2496928]].map(([la, lo]) => LL(la, lo)) };
const CASA_RING = CASA_DATA ? CASA_DATA.site.map(([la, lo]) => LL(la, lo)) : null;
const CASA = findProject(/casamia|balanca/i);
const HVB = findProject(/^(vinhomes )?(hải vân bay|hai van bay)/i);
// ===== Renderer, camera =====
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
const DPR = Math.min(devicePixelRatio, 1.5);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 2, 300000);
const world = new THREE.Group(); // mọi thứ trên mặt đất (để phóng độ cao)
scene.add(world);

// ===== Địa hình (độ cao thật, mét) =====
const [DW, DH] = meta.dem;
const DEM = new Int16Array(demBuf);
const [fx0, fz0, fx1, fz1] = meta.far;
function demAt(x, z) {
  const fi = ((x - fx0) / (fx1 - fx0)) * DW - 0.5, fj = ((z - fz0) / (fz1 - fz0)) * DH - 0.5;
  const i = THREE.MathUtils.clamp(Math.floor(fi), 0, DW - 2), j = THREE.MathUtils.clamp(Math.floor(fj), 0, DH - 2);
  const u = THREE.MathUtils.clamp(fi - i, 0, 1), v = THREE.MathUtils.clamp(fj - j, 0, 1);
  const a = DEM[j * DW + i], b = DEM[j * DW + i + 1], c = DEM[(j + 1) * DW + i], d = DEM[(j + 1) * DW + i + 1];
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
const groundY = (x, z) => Math.max(demAt(x, z), 1.5);

function landPlane([x0, z0, x1, z1], map, alpha, segX, offY, order) {
  const w = x1 - x0, h = z1 - z0;
  const g = new THREE.PlaneGeometry(w, h, segX, Math.round((segX * h) / w));
  g.rotateX(-Math.PI / 2);
  g.translate((x0 + x1) / 2, 0, (z0 + z1) / 2);
  const p = g.attributes.position, col = new Float32Array(p.count * 3);
  for (let k = 0; k < p.count; k++) {
    const e = demAt(p.getX(k), p.getZ(k));
    p.setY(k, Math.max(e, 1.5) + offY);
    // vùng cao chuyển dần sang màu rừng
    const t = THREE.MathUtils.smoothstep(e, 25, 140), r = THREE.MathUtils.smoothstep(e, 700, 1300);
    col.set([1 - 0.42 * t + 0.25 * r, 1 - 0.12 * t + 0.1 * r, 1 - 0.38 * t + 0.25 * r], k * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map, alphaMap: alpha, alphaTest: 0.5, vertexColors: true, roughness: 0.95 }));
  m.renderOrder = order;
  world.add(m);
  return m;
}
landPlane(meta.far, landFar, maskFar, 640, -2, 0);
landPlane(meta.near, landNear, maskNear, 760, 0, 1);

// Mặt nạ nước (độ phân giải thấp) để kiểm tra một điểm là đất hay nước
const MASK = (() => {
  const img = maskNear.image, W = 1024, H = Math.round((1024 * img.height) / img.width);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, W, H);
  const d = g.getImageData(0, 0, W, H).data, a = new Uint8Array(W * H);
  for (let i = 0; i < a.length; i++) a[i] = d[i * 4] > 127 ? 1 : 0;
  const [x0, z0, x1, z1] = meta.near;
  return (x, z) => {
    const i = Math.floor(((x - x0) / (x1 - x0)) * W), j = Math.floor(((z - z0) / (z1 - z0)) * H);
    return i < 0 || j < 0 || i >= W || j >= H ? 1 : a[j * W + i];
  };
})();

// ===== Bầu trời & ngày đêm (chiều thứ 4) =====
const skyU = { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, sunDir: { value: V3(0, 1, 0) }, sunCol: { value: new THREE.Color() } };
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top, hor, sunDir, sunCol; varying vec3 vP;
    void main(){ float h = vP.y;
      vec3 c = mix(hor, top, smoothstep(-0.02, 0.45, h));
      c = mix(c, hor * 0.6, smoothstep(0.0, -0.2, h));
      float s = max(dot(vP, normalize(sunDir)), 0.);
      c += sunCol * (pow(s, 600.) * 4. + pow(s, 12.) * 0.35);
      gl_FragColor = vec4(c, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(150000, 32, 16), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);
const skyScene = new THREE.Scene();
skyScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), skyMat));
const pmrem = new THREE.PMREMGenerator(renderer);

const KEYS = [
  [0, '#040816', '#141d38', '#8899cc', 0.0, 0.35, 1.0, 1.0],
  [5.2, '#0d1730', '#3a3a62', '#ff9a66', 0.0, 0.4, 0.9, 1.0],
  [6.2, '#35558f', '#f2a77a', '#ffb37a', 0.8, 0.7, 0.35, 0.95],
  [8, '#3a72c4', '#cfe0f0', '#fff1dc', 2.2, 1.0, 0.0, 0.9],
  [12, '#2f6fd6', '#bcd8f2', '#ffffff', 2.8, 1.1, 0.0, 0.85],
  [16.5, '#3767b0', '#f1d4a6', '#ffe2b0', 2.2, 1.0, 0.0, 0.9],
  [17.7, '#33549a', '#f39a62', '#ff9a50', 1.3, 0.8, 0.3, 0.95],
  [18.75, '#1d3a78', '#9fa3c8', '#ff9a6a', 0.3, 0.6, 0.85, 1.05],
  [19.8, '#0c1735', '#3a3f6e', '#6070a0', 0.0, 0.45, 1.0, 1.05],
  [24, '#040816', '#141d38', '#8899cc', 0.0, 0.35, 1.0, 1.0],
].map(([h, a, b, c, ...n]) => [h, new THREE.Color(a), new THREE.Color(b), new THREE.Color(c), ...n]);
const hemi = new THREE.HemisphereLight(0xffffff, 0x333344, 1);
const sun = new THREE.DirectionalLight(0xffffff, 1);
scene.add(hemi, sun, sun.target);
scene.fog = new THREE.Fog(0x000000, 9000, 90000);

// ===== Biển =====
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const normalTex = canvasTex(256, 256, (g, w, h) => {
  const img = g.createImageData(w, h);
  const f = (x, y) => Math.sin(x * 0.11 + Math.sin(y * 0.07) * 2) + Math.sin(y * 0.13 + Math.sin(x * 0.05) * 3) * 0.7 + Math.sin((x + y) * 0.23) * 0.3;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = f(x + 1, y) - f(x - 1, y), dy = f(x, y + 1) - f(x, y - 1);
    const n = V3(-dx, -dy, 2).normalize(), i = (y * w + x) * 4;
    img.data[i] = (n.x * 0.5 + 0.5) * 255; img.data[i + 1] = (n.y * 0.5 + 0.5) * 255; img.data[i + 2] = (n.z * 0.5 + 0.5) * 255; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}, false);
normalTex.wrapS = normalTex.wrapT = THREE.RepeatWrapping;
normalTex.repeat.set(5000, 5000);
const water = new THREE.Mesh(new THREE.PlaneGeometry(300000, 300000),
  new THREE.MeshStandardMaterial({ color: 0x1b3a66, roughness: 0.08, metalness: 0.9, normalMap: normalTex, normalScale: new THREE.Vector2(0.3, 0.3) }));
water.rotation.x = -Math.PI / 2;
water.renderOrder = -1;
water.material.depthWrite = false; // biển là lớp dưới cùng: không che các mặt phẳng sát mặt nước
scene.add(water);

// ===== Nhà (đúng hình dạng & chiều cao theo OpenStreetMap) =====
const U = { uNight: { value: 0 }, uLit: { value: 0.5 } };
const PAL = [
  ['#e9e4da', '#f1eee8', '#e7d9b8', '#d8e2ea', '#efe2c9', '#f0d7cf', '#dfe6d6', '#cfd8e2'], // nhà ở
  ['#e8eef6', '#d6e2f0', '#f4f2ee', '#c9d8ea'], // chung cư
  ['#dfe9f5', '#c4d6ec', '#f2f2f2', '#b9cde6'], // khách sạn
  ['#d6dde6', '#c9d3df', '#e6e1d6'], // thương mại
  ['#c7c9cc', '#b8c0c8', '#d0cec8'], // công nghiệp
  ['#efe3c4', '#e8d8b0'], // trường học, bệnh viện
  ['#e9c36b', '#d99a4e', '#c9584a'], // chùa, nhà thờ
];
const buildings = (() => {
  const dv = new DataView(bldBuf);
  let o = 0, nv = 0, ni = 0, nb = 0;
  while (o < dv.byteLength) { const n = dv.getUint8(o); nv += n * 5; ni += n * 6 + (n - 2) * 3; o += 6 + n * 4; nb++; }
  const pos = new Float32Array(nv * 3), nor = new Int8Array(nv * 3), col = new Uint8Array(nv * 3), wuv = new Float32Array(nv * 3);
  const idx = new Uint32Array(ni);
  let v = 0, k = 0; o = 0;
  const xs = [], zs = [], c = new THREE.Color();
  while (o < dv.byteLength) {
    const n = dv.getUint8(o), type = dv.getUint8(o + 1), h = dv.getUint16(o + 2, true) / 10, minH = dv.getUint16(o + 4, true) / 10;
    o += 6;
    xs.length = zs.length = 0;
    let cx = 0, cz = 0;
    for (let i = 0; i < n; i++) { const x = dv.getInt16(o, true) * 2, z = dv.getInt16(o + 2, true) * 2; o += 4; xs.push(x); zs.push(z); cx += x; cz += z; }
    cx /= n; cz /= n;
    const base = groundY(cx, cz) + minH, top = groundY(cx, cz) + h;
    if (HVB && inRing(HVB.rings[0], cx, cz)) continue; // thay bằng mô phỏng khi hoàn thiện
    if (CASA_RING && inRing(CASA_RING, cx, cz)) continue; // thay bằng mặt bằng Casamia
    if (inRing(LOT.ring, cx, cz)) continue;               // lô đất trống
    const oldTown = Math.hypot(cx - HA[0], cz - HA[1]) < 560 && h < 16;
    const pal = oldTown ? ['#e8c25a', '#f0cf6e', '#e2b552', '#f3d98a', '#d9a94a'] : PAL[type] || PAL[0];
    c.set(pal[(rnd() * pal.length) | 0]);
    const cr = c.r * 255, cg = c.g * 255, cb = c.b * 255, sd = rnd();
    let area = 0;
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; area += xs[i] * zs[j] - xs[j] * zs[i]; }
    let per = 0;
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n, dx = xs[j] - xs[i], dz = zs[j] - zs[i], L = Math.hypot(dx, dz) || 1;
      const nx = (area > 0 ? dz : -dz) / L, nz = (area > 0 ? -dx : dx) / L;
      const quad = [[xs[i], base, zs[i], per, 0], [xs[j], base, zs[j], per + L, 0], [xs[j], top, zs[j], per + L, top - base], [xs[i], top, zs[i], per, top - base]];
      for (const [x, y, z, u, w] of quad) {
        pos.set([x, y, z], v * 3); nor.set([nx * 127, 0, nz * 127], v * 3); col.set([cr, cg, cb], v * 3); wuv.set([u, w, sd], v * 3); v++;
      }
      const b0 = v - 4;

  const H1 = 5.0, HF = 3.3, NF = 22;
  prism(inset(ring, 1.5), 0, H1, glassH);                       // sảnh tầng 1 cao 5 m, kính
  prism(inset(ring, 1.0), H1, 0.6, slabMat);
  prism(inset(ring, 1.5), H1 + 0.6, 2 * HF - 0.6, podMat);     // tầng 2–3: nhà hàng, spa
  const tower = inset(ring, 3.2);
  for (let f = 3; f < NF; f++) {                                // tầng phòng: kính + ban công trắng
    const y = H1 + (f - 1) * HF;
    prism(tower, y, HF - 0.35, glassH);
    prism(inset(ring, 2.2), y + HF - 0.35, 0.35, slabMat);
  }
  const top = H1 + (NF - 1) * HF;
  prism(inset(ring, 2.2), top, 1.2, slabMat);                   // sân thượng, hồ bơi vô cực
  const poolTop = prism(inset(ring, 4.5), top + 1.2, 0.3, new THREE.MeshStandardMaterial({ color: 0x48c9d6, roughness: 0.1, emissive: 0x1aa0b0, emissiveIntensity: 0.3 }));
  prism(inset(ring, 6.5).map(([x, z]) => [x - (x - cx) * 0.3, z - (z - cz) * 0.3]), top + 1.2, 4, glassH);   // sky bar
  hotel.visible = true; LOT.hotel = hotel; LOT.glass = glassH; LOT.topY = y0 + top;
  vol.visible = edge.visible = false; beam.position.y = y0 + top + 120;
  const lotPos = V3(cx, y0 + top + 18, cz);
  PLACES.push({ name: '📍 Bán lô 583,6 m² · 4 mặt tiền Hoàng Sa · KS 5* 22 tầng · 190 tỷ', pos: lotPos, big: true, lot: true });
  for (const p of PLACES) if ((p.lot || p.lotEdge) && !p.el) {
    const el = document.createElement('div'); el.className = 'pin' + (p.big ? ' lotpin' : ' small'); el.innerHTML = '<b></b><span></span>';
    el.querySelector('b').textContent = p.name; el.onclick = () => (p.lot ? $('lotBtn').click() : null); $('pins').appendChild(el); p.el = el;
  }
  casaAnim.push((t, night) => { glassH.emissiveIntensity = night * 0.55; beam.material.opacity = 0.18 + 0.1 * Math.sin(t * 2); fill.material.opacity = 0.35 + 0.15 * Math.sin(t * 2); });
  const showLot = () => {
    $('unitT').textContent = 'Bán lô đất 4 mặt tiền Võ Nguyên Giáp – Hoàng Sa';
    $('unitS').textContent = 'View trực diện biển · Tặng giấy phép xây dựng + đầy đủ thiết kế khách sạn 5 sao 22 tầng, 94 phòng';
    const tb = $('unitTb'); tb.textContent = '';
    for (const [k, v] of [['Giá', '190 tỷ (thương lượng) ≈ 325 triệu/m²'], ['Diện tích', '583,6 m² · ngang 27,6 m (bản đồ địa chính: 587 m²)'], ['Pháp lý', 'Tờ 126 · Thửa 30 · Thọ Quang, Sơn Trà · mã đất 119 (QHSDĐ 2020)'], ['Tặng kèm', 'Giấy phép xây dựng + thiết kế KS 5 sao 22 tầng, 94 phòng'], ['Mặt tiền', '4 mặt tiền: Hoàng Sa (view biển), Hồ Học Lãm, 2 đường nhánh'], ['Khối 3D', 'Minh hoạ: sảnh 5 m, tầng 2–3 nhà hàng/spa, 19 tầng phòng (~5 phòng/tầng), sân thượng hồ bơi + sky bar · cao ≈ 75 m']]) {
      const tr = tb.insertRow(); tr.insertCell().textContent = k; tr.insertCell().textContent = v;
    }
    const pl = $('unitPlans'); pl.textContent = '';
    const mkb = (t, f) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = t; b.onclick = f; pl.appendChild(b); };
    mkb('🏨 Bật/tắt khối khách sạn', () => { hotel.visible = !hotel.visible; vol.visible = edge.visible = !hotel.visible; });
    mkb('👁 View từ sân thượng tầng 22', () => { $('unit').hidden = true; const sea = V3(cx + 600, LOT.topY, cz - 280); flyTo(sea, V3(cx - 8, LOT.topY + 6, cz + 4)); });
    mkb('🛰 Toàn cảnh khu vực', () => { $('unit').hidden = true; flyTo(V3(cx, 0, cz), V3(cx - 900, 650, cz + 1100)); });
    $('unit').hidden = false; setTour(false);
  };
  $('lotBtn').onclick = () => { flyTo(V3(cx, 30, cz), V3(cx + 230, 160, cz + 260)); setTimeout(showLot, 1800); };
  LOT.vol = vol; LOT.show = showLot;
}
if (casaPos) { $('caBtn').hidden = false; $('caBtn').onclick = () => flyTo(casaPos.clone(), V3(casaPos.x + 420, 380, casaPos.z + 720)); }
if (hvbPos) { $('hvbBtn').hidden = false; $('hvbBtn').onclick = () => { hvbGroup.visible = !hvbGroup.visible; $('hvbBtn').classList.toggle('active', hvbGroup.visible); if (hvbGroup.visible) flyTo(hvbPos.clone(), V3(hvbPos.x + 1200, 1500, hvbPos.z + 2600)); }; }

// ===== Kết xuất =====
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight); composer.setPixelRatio(DPR);
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 0.8 ? 60 : 45; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const timer = new THREE.Timer();
function tick() {
  timer.update();
  const dt = Math.min(timer.getDelta(), 0.1);
  if (flow) { hour = mod(hour + dt * 0.6, 24); $('hour').value = hour; }
  applyTime(hour);
  envTimer -= dt;
  if (Math.abs(envAt - hour) > 0.15 && envTimer <= 0) { refreshEnv(); envAt = hour; envTimer = 0.4; }
  normalTex.offset.x += dt * 0.004; normalTex.offset.y += dt * 0.002;
  wheel.userData.spin.rotation.z += dt * 0.05;
  const col = wheelLights.geometry.attributes.color, tt = performance.now() / 1000;
  for (let i = 0; i < col.count; i++) { tmpC.setHSL(mod(i / col.count + tt * 0.15, 1), 0.9, 0.6); col.setXYZ(i, tmpC.r, tmpC.g, tmpC.b); }
  col.needsUpdate = true;
  if (night > 0.5) dragonMat.emissive.setHSL(mod(tt * 0.05, 1), 0.9, 0.5); else dragonMat.emissive.set(0xffb000);
  if (carPts.visible) { updateCars(dt); updateBoats(dt); }
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 2);
    const e = fly.t < 0.5 ? 4 * fly.t ** 3 : 1 - (-2 * fly.t + 2) ** 3 / 2;
    camera.position.lerpVectors(fly.c0, fly.c1, e); controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (fly.t >= 1) fly = null;
  } else if (tour) {
    tourT += dt * 0.05;
    const off = camera.position.clone().sub(controls.target), sph = new THREE.Spherical().setFromVector3(off);
    sph.theta += (Math.sin(tourT) * 0.6 - sph.theta) * dt * 0.6;
    sph.radius += (9000 + Math.cos(tourT * 1.7) * 2500 - sph.radius) * dt * 0.3;
    sph.phi += (1.05 + Math.sin(tourT * 1.3) * 0.12 - sph.phi) * dt * 0.4;
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph));
  }
  controls.update();
  composer.render();
  updatePins();
  requestAnimationFrame(tick);
}
applyTime(hour); refreshEnv(); envAt = hour;
tick();
$('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 700);
// chạm vào một căn Park Home -> bảng thông tin + mặt bằng mẫu
{
  const el = renderer.domElement, ray2 = new THREE.Raycaster(); let down = null;
  const mark = new THREE.Mesh(new THREE.TorusGeometry(9, 0.6, 6, 40), new THREE.MeshBasicMaterial({ color: 0xffd34d })); mark.rotation.x = Math.PI / 2; mark.visible = false; world.add(mark);
  el.addEventListener('pointerdown', (e) => (down = [e.clientX, e.clientY]));
  el.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
    if (LOT.vol) { ray2.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera); if (ray2.intersectObjects([LOT.vol, LOT.hotel], true).length) { LOT.show(); return; } }
    const U = casaGroup.userData; if (!U.phBody) return;
    ray2.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
    const hits = [[U.phBody, U.phLots], [U.btBody, U.btLots]].map(([b, L]) => { const h = b && ray2.intersectObject(b)[0]; return h && { d: h.distance, l: L[b === U.btBody ? Math.floor(h.instanceId / 3) : h.instanceId] }; }).filter(Boolean).sort((a, b) => a.d - b.d);
    if (!hits.length) return;
    const l = hits[0].l; let rows, plans;
    if (l.t === 'PH') {
      $('unitT').textContent = `Park Home · dãy ${l.row} · căn ${l.pair ? 'song lập' : 'đơn lập'}`;
      $('unitS').textContent = l.pair ? 'Ghép đôi chung tường với căn bên cạnh, sân trước 5 m có chỗ đỗ xe' : (l.row === 'SL3' || l.row === 'SL4' ? 'Căn đầu hồi, đứng riêng' : 'Căn giáp vệt cây xanh giữa dãy, đứng riêng');
      rows = [['Diện tích đất', '178 m² (8 × 22,25 m)'], ['Sàn xây dựng', '316,09 m²'], ['Sân vườn', '78,22 m²'], ['Quy mô', '3 tầng + tầng kỹ thuật, sân thượng 20 m²'], ['Công năng', '4 phòng ngủ (2 master), 5 WC, phòng khách 27 m², bếp + ăn 38 m², phòng đọc, phòng đa năng']];
      plans = [['ph-noi-that.jpg', 'Mặt bằng mẫu nội thất'], ['ph-mat-ngoai.jpg', 'Mặt bằng mẫu mặt ngoài']];
    } else {
      const NAME = { B1: 'BT3–BT8', B2: 'BT9–BT12', B3: 'BT2 · BT12A', B4: 'BT1', B5: 'BT14' };
      $('unitT').textContent = `Biệt thự ven kênh · dãy ${NAME[l.t] || 'BT'}`;
      $('unitS').textContent = 'Theo mẫu BT1 / BT1A: sân trước đỗ xe, nhà lệch một bên chừa sân hông 1,8 m, hồ bơi riêng sát kênh';
      const area = (l.w * l.d).toFixed(0);
      rows = [['Kích thước lô (trên bản đồ)', `${l.w.toFixed(1)} × ${l.d.toFixed(1)} m ≈ ${area} m²`], ['Quy mô', `${l.f} tầng + tầng kỹ thuật (2 khối mái dốc, sân thượng 12 m²)`],
        ['Tầng trệt', 'Phòng khách + ăn 55,6 m², bếp 13,5 m², hiên 8,7 m², phòng đa năng, WC, hồ bơi 21,8 m²'], ['Tầng 1', 'P.ngủ 17,1 m² + 19,6 m², thông tầng, phòng thay đồ, 2 WC'],
        ['Tầng 2', 'P.ngủ 17,1 m² + 19,6 m², phòng đa năng, phòng thay đồ, 2 WC'], ['Tầng kỹ thuật', 'Phòng giặt 6,7 m², sân 12,2 m² + 12,5 m²']];
      plans = [['bt1.jpg', 'Mặt bằng mẫu BT1'], ['bt1a.jpg', 'Mặt bằng mẫu BT1A'], ['https://claude.ai/artifact/Xgffx63YKZaomsDYDCSQBS', 'Phối cảnh chi tiết dãy BT']];
    }
    const tb = $('unitTb'); tb.textContent = '';
    for (const [k, v] of rows) { const tr = tb.insertRow(); tr.insertCell().textContent = k; tr.insertCell().textContent = v; }
    const pl = $('unitPlans'); pl.textContent = '';
    for (const [src, label] of plans) { const b = document.createElement('button'); b.className = 'chip'; b.textContent = '📐 ' + label; b.onclick = () => { if (src.startsWith('http')) { window.open(src, '_blank'); return; } $('planImg').src = src; $('plan').hidden = false; }; pl.appendChild(b); }
    $('unit').hidden = false; mark.position.copy(l.ctr).setY(l.ctr.y + 0.5); mark.visible = true; setTour(false);
  });
  $('unitX').onclick = () => { $('unit').hidden = true; mark.visible = false; };
  $('planX').onclick = () => ($('plan').hidden = true);
}
window.dn = { flyTo, PLACES, camera, controls, V3, setTour, scene, casaGroup, THREE };
console.log('buildings', buildings.count, 'lamps', lamp.length / 3, 'bridges', deckBoxes.length);
