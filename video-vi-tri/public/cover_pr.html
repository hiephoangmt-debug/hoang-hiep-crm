<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Ảnh bìa Sun Saphia PR</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html,body{margin:0;background:#050E22}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;color:#fff;
    background:radial-gradient(ellipse 90% 60% at 50% 30%,#163763 0%,#0A1A33 55%,#050E22 100%)}
  .photo{position:absolute;left:0;top:560px;width:1080px;height:1060px;object-fit:cover;object-position:50% 40%;-webkit-mask-image:linear-gradient(transparent 0,#000 220px,#000 78%,transparent 100%)}
  .fadeT{position:absolute;left:0;right:0;top:540px;height:260px;background:linear-gradient(#0B1C38,rgba(11,28,56,0))}
  .fadeB{position:absolute;left:0;right:0;top:1300px;height:340px;background:linear-gradient(rgba(5,14,34,0),#050E22)}
  .kick{position:absolute;top:96px;left:0;right:0;text-align:center;font-weight:800;font-size:38px;letter-spacing:10px;color:#FFB547}
  h1{position:absolute;top:160px;left:0;right:0;margin:0;text-align:center;font-weight:900;font-size:112px;line-height:1.04;letter-spacing:-2px;text-shadow:0 10px 40px rgba(0,0,0,.6)}
  h1 em{font-style:normal;color:#FF7A1A}
  .pin{position:absolute;left:40px;top:930px;display:flex;align-items:center;gap:14px}
  .pin .dot{width:30px;height:30px;border-radius:50%;background:#FF7A1A;box-shadow:0 0 0 10px rgba(255,122,26,.35),0 0 40px #FF7A1A}
  .pin .lb{background:#FF7A1A;font-weight:900;font-size:46px;padding:12px 26px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);white-space:nowrap}
  .stats{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center;gap:22px}
  .st{background:rgba(5,14,34,.88);border:3px solid #FF7A1A;border-radius:22px;padding:16px 24px;text-align:center;min-width:250px}
  .st b{display:block;font-weight:900;font-size:62px;color:#FF7A1A;line-height:1}
  .st span{display:block;font-weight:700;font-size:28px;margin-top:6px}
  .badge{position:absolute;top:1720px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:16px;padding:12px 32px 12px 12px;border-radius:999px;
    background:rgba(8,22,46,.9);border:3px solid #FF7A1A;box-shadow:0 0 30px rgba(255,122,26,.4);white-space:nowrap}
  .badge .ph{width:62px;height:62px;border-radius:50%;background:#FF7A1A;display:grid;place-items:center}
  .badge b{font-weight:900;font-size:50px}
  .badge i{font-style:normal;font-weight:700;font-size:36px;color:#FFB547;padding-left:16px;border-left:3px solid rgba(255,255,255,.25)}
</style></head><body>
<div id="stage">
  <img class="photo" src="ex/p1.jpg">
  <div class="kick">SUN SAPHIA RESIDENCE</div>
  <h1>VÌ SAO<br>SUN GROUP<br>CHỌN <em>GÓC NÀY?</em></h1>
  <div class="pin"><div class="lb">Cách biển ~400 m</div><div class="dot"></div></div>
  <div class="stats">
    <div class="st"><b>3</b><span>mặt đường</span></div>
    <div class="st"><b>782</b><span>căn hộ</span></div>
    <div class="st"><b>2/3</b><span>là studio</span></div>
  </div>
  <div class="badge"><span class="ph"><svg width="36" height="36" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="#fff"/></svg></span><b>0904 567 009</b><i>Hoàng Hiệp</i></div>
</div>
<script>Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=r))]).then(()=>{window.READY=true})</script>
</body></html>
