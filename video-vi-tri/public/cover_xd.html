<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Ảnh bìa video xây dựng</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html,body{margin:0;background:#050E22}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;color:#fff;background:#06122A}
  .photo{position:absolute;left:0;top:500px;width:1080px;height:1180px;object-fit:cover;object-position:50% 30%;filter:brightness(1.25) saturate(1.1);
    -webkit-mask-image:linear-gradient(transparent 0,#000 200px,#000 82%,transparent 100%)}
  .kick{position:absolute;top:262px;left:0;right:0;text-align:center;font-weight:800;font-size:38px;letter-spacing:10px;color:#FFB547}
  h1{position:absolute;top:312px;left:0;right:0;margin:0;text-align:center;font-weight:900;font-size:100px;line-height:1.04;letter-spacing:-2px;text-shadow:0 10px 40px rgba(0,0,0,.6)}
  h1 em{font-style:normal;color:#FF7A1A}
  .inset{position:absolute;left:44px;top:1060px;width:330px;height:232px;border-radius:20px;overflow:hidden;border:4px solid #fff;box-shadow:0 18px 40px rgba(0,0,0,.6)}
  .inset img{width:100%;height:100%;object-fit:cover;object-position:50% 70%}
  .inset b{position:absolute;left:12px;top:12px;background:#0A1A33;border:2px solid #fff;font-weight:900;font-size:26px;padding:4px 14px;border-radius:10px}
  .after{position:absolute;left:400px;top:1150px;display:flex;align-items:center;gap:12px;font-weight:900;font-size:34px}
  .after span{background:#FF7A1A;padding:6px 16px;border-radius:10px;box-shadow:0 0 24px rgba(255,122,26,.6)}
  .after svg{width:70px;height:40px}
  .tags{position:absolute;top:1355px;left:0;right:0;display:flex;justify-content:center;gap:16px}
  .tags div{background:rgba(5,14,34,.9);border:3px solid #FF7A1A;border-radius:18px;padding:10px 22px;font-weight:800;font-size:32px}
  .tags b{color:#FF7A1A}
  .note{position:absolute;right:26px;top:566px;font-weight:600;font-size:22px;color:rgba(255,255,255,.75)}
  .logo{position:absolute;left:50%;top:1478px;transform:translateX(-50%);background:#fff;border:3px solid rgba(166,120,46,.9);border-radius:24px;padding:20px 30px;box-shadow:0 12px 34px rgba(0,0,0,.5)}
  .logo img{display:block;width:430px}
  .badge{position:absolute;top:1500px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:16px;padding:12px 32px 12px 12px;border-radius:999px;
    background:rgba(8,22,46,.9);border:3px solid #FF7A1A;box-shadow:0 0 30px rgba(255,122,26,.4);white-space:nowrap}
  .badge .ph{width:62px;height:62px;border-radius:50%;background:#FF7A1A;display:grid;place-items:center}
  .badge b{font-weight:900;font-size:50px}.badge i{font-style:normal;font-weight:700;font-size:36px;color:#FFB547;padding-left:16px;border-left:3px solid rgba(255,255,255,.25)}
  .hh .logo{display:none}.hh .badge{display:inline-flex}
</style></head><body>
<div id="stage">
  <img class="photo" src="ex/xd_night.jpg">
  <div class="kick">SUN SAPHIA RESIDENCE</div>
  <h1>TỪ ĐẤT TRỐNG<br>ĐẾN <em>30 TẦNG</em></h1>
  <div class="note">Hình ảnh mô phỏng minh họa</div>
  <div class="inset"><img src="ex/xd_before.jpg"><b>TRƯỚC</b></div>
  <div class="after"><svg viewBox="0 0 70 40"><path d="M2 20h56M44 6l16 14-16 14" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>SAU</span></div>
  <div class="tags"><div>Cách biển <b>~400 m</b></div><div>Bàn giao dự kiến <b>11/2028</b></div></div>
  <div class="logo"><img src="tati_col.png"></div>
  <div class="badge"><span class="ph"><svg width="36" height="36" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="#fff"/></svg></span><b>0904 567 009</b><i>Hoàng Hiệp</i></div>
<div id="safe" style="display:none;position:absolute;left:0;right:0;top:240px;height:1440px;outline:4px dashed #0f0"></div>
</div>
<script>
if (location.hash.includes('hh')) document.body.className = 'hh';
if (location.hash.includes('safe')) document.getElementById('safe').style.display = 'block';
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=r))]).then(()=>{window.READY=true})</script>
</body></html>
