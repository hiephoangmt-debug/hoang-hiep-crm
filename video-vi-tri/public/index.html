<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Video vị trí dự án</title>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --navy-950: #040C1D; --navy-900: #061229; --navy-800: #0A1C3A; --navy-700: #0B1F3A;
    --navy-500: #16325C; --white: #FFFFFF; --orange: #FF7A1A; --orange-300: #FFB547;
  }
  html, body { margin: 0; padding: 0; background: var(--navy-900); overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Be Vietnam Pro', sans-serif; }
  #map { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #grade { background: var(--navy-700); mix-blend-mode: soft-light; opacity: .30; }
  #haze { background: linear-gradient(180deg, rgba(4,12,29,.96) 0%, rgba(4,12,29,.55) 14%, rgba(4,12,29,0) 32%, rgba(4,12,29,0) 74%, rgba(4,12,29,.75) 100%); }
  #vignette { background: radial-gradient(ellipse 75% 60% at 50% 52%, rgba(4,12,29,0) 55%, rgba(4,12,29,.85) 100%); }
  #grain { opacity: .07; mix-blend-mode: overlay; }
  #fade { background: var(--navy-950); opacity: 0; }

  /* Thẻ tiện ích */
  .poi { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; will-change: transform; }
  .poi .card { display: flex; align-items: center; gap: 14px; padding: 14px 24px 14px 16px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(14,36,70,.94), rgba(8,22,46,.94)); border: 2px solid var(--orange);
    box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset, 0 10px 30px rgba(0,0,0,.45), 0 0 26px rgba(255,122,26,.45);
    color: #fff; white-space: nowrap; }
  .poi .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--orange); display: grid; place-items: center; flex: none; }
  .poi .ico svg { width: 26px; height: 26px; }
  .poi .t1 { font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: .2px; }
  .poi .t2 { font-weight: 600; font-size: 22px; color: var(--orange-300); margin-top: 3px; letter-spacing: .3px; }
  .poi .beam { position: absolute; left: 0; width: 4px; margin-left: -2px; background: linear-gradient(180deg, rgba(255,181,71,1), rgba(255,122,26,.0));
    box-shadow: 0 0 14px rgba(255,181,71,.9), 0 0 34px rgba(255,122,26,.6); border-radius: 2px; }
  .poi .dot { position: absolute; left: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 6px rgba(255,122,26,.55), 0 0 26px 8px rgba(255,122,26,.75); }

  /* Ghim dự án */
  .pin { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; }
  .pin svg { display: block; width: 92px; height: 120px; transform: translate(-50%, -100%); filter: drop-shadow(0 0 18px rgba(255,122,26,.85)); }
  .pin .ring { position: absolute; left: 0; top: 0; width: 60px; height: 22px; margin: -11px 0 0 -30px; border: 3px solid var(--orange); border-radius: 50%; }

  /* Nhãn khoảng cách */
  .dist { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  .dist .b { transform: translate(-50%, -50%); padding: 10px 22px; border-radius: 999px; background: var(--orange); color: #fff; font-weight: 900;
    font-size: 36px; letter-spacing: .5px; box-shadow: 0 0 30px rgba(255,122,26,.7), 0 6px 18px rgba(0,0,0,.4); white-space: nowrap; border: 3px solid #fff; }
  .dist .b small { font-weight: 700; font-size: 24px; opacity: .95; margin-left: 6px; }

  #plane { position: absolute; left: 0; top: 0; width: 86px; height: 86px; margin: -43px 0 0 -43px; filter: drop-shadow(0 0 14px rgba(255,255,255,.9)); }

  /* Chữ lớn trên màn hình */
  .title { position: absolute; left: 0; right: 0; text-align: center; color: #fff; }
  .kicker { display: inline-block; font-weight: 700; font-size: 30px; letter-spacing: 9px; color: var(--orange-300); text-transform: uppercase; }
  .h1 { font-weight: 900; font-size: 104px; line-height: 1.02; letter-spacing: -1px; text-shadow: 0 6px 40px rgba(0,0,0,.55); }
  .h1 em { font-style: normal; color: var(--orange); }
  .rule { width: 160px; height: 6px; background: var(--orange); margin: 26px auto 0; border-radius: 3px; box-shadow: 0 0 24px rgba(255,122,26,.8); transform-origin: 50% 50%; }
  .sub { font-weight: 600; font-size: 34px; color: rgba(255,255,255,.88); margin-top: 22px; letter-spacing: .5px; }

  .chip { position: absolute; left: 60px; top: 150px; display: flex; align-items: center; gap: 16px; color: #fff; }
  .chip .n { font-weight: 900; font-size: 26px; color: var(--navy-900); background: var(--orange); width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; }
  .chip .l { font-weight: 800; font-size: 38px; letter-spacing: .3px; text-shadow: 0 4px 20px rgba(0,0,0,.6); }
  .chip .l span { display: block; font-weight: 600; font-size: 24px; color: var(--orange-300); letter-spacing: 3px; text-transform: uppercase; }

  #end { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #12305C 0%, #0A1C3A 45%, #040C1D 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
  #end .logo { width: 170px; height: 170px; border-radius: 40px; border: 4px solid var(--orange); display: grid; place-items: center; box-shadow: 0 0 60px rgba(255,122,26,.45); }
  #end .logo svg { width: 100px; height: 100px; }
  #end .name { color: #fff; font-weight: 900; font-size: 92px; margin-top: 48px; letter-spacing: -1px; text-align: center; line-height: 1.05; }
  #end .tag { color: rgba(255,255,255,.82); font-weight: 600; font-size: 34px; margin-top: 18px; letter-spacing: 1px; }
  #end .hot { margin-top: 70px; background: var(--orange); color: #fff; font-weight: 900; font-size: 64px; padding: 22px 54px; border-radius: 999px; box-shadow: 0 0 50px rgba(255,122,26,.6); letter-spacing: 1px; }
  #end .hot small { display: block; font-size: 24px; font-weight: 700; letter-spacing: 6px; text-align: center; opacity: .95; }
  #end .note { position: absolute; bottom: 120px; color: rgba(255,255,255,.45); font-size: 22px; font-weight: 500; }
  .photo { position: absolute; inset: 0; overflow: hidden; background: var(--navy-950); }
  .photo .img { position: absolute; inset: -2%; background-size: cover; background-position: 50% 30%; transform-origin: 50% 40%; }
  .photo .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,12,29,.55) 0%, rgba(4,12,29,0) 22%, rgba(4,12,29,0) 55%, rgba(4,12,29,.92) 82%, rgba(4,12,29,1) 100%); }
  .photo .cap { position: absolute; left: 0; right: 0; bottom: 230px; text-align: center; color: #fff; }
  .photo .pname { font-weight: 900; font-size: 88px; line-height: 1.02; letter-spacing: -1px; margin-top: 14px; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  .credit { position: absolute; right: 22px; bottom: 16px; color: rgba(255,255,255,.35); font-size: 16px; font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <div id="map"></div>
  <div id="grade" class="layer"></div>
  <div id="haze" class="layer"></div>
  <div id="vignette" class="layer"></div>
  <svg id="grain" class="layer" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div id="ui" class="layer"></div>
  <div id="fade" class="layer"></div>
  <div class="credit">Dữ liệu bản đồ © OpenStreetMap contributors, Overture Maps</div>
</div>
<script src="lib/maplibre-gl.js"></script>
<script src="lib/turf.min.js"></script>
<script src="config.js"></script>
<script src="engine.js"></script>
</body>
</html>
