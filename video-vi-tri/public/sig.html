<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chữ ký</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; position: absolute; left: 0; top: 0; }
  /* Vệt sáng chạy qua nút hotline + website ở cảnh kết (toạ độ đo từ trang chính) */
  .pill { position: absolute; left: 240.47px; top: 1117.09px; width: 599.05px; height: 155px; border-radius: 999px; overflow: hidden; opacity: 0; }
  .pill .band, .pill2 .band { position: absolute; top: -50%; left: 0; width: 150px; height: 200%; transform: translateX(-300px) skewX(-22deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75) 50%, rgba(255,255,255,0)); }
  .pill2 { position: absolute; left: 249.55px; top: 1748px; width: 580.91px; height: 74px; border-radius: 999px; overflow: hidden; opacity: 0; }
  .pill2 .band { width: 80px; }
  .ring { position: absolute; left: 240.47px; top: 1117.09px; width: 599.05px; height: 155px; border-radius: 999px; border: 3px solid #FFC56E;
    box-sizing: border-box; opacity: 0; box-shadow: 0 0 22px rgba(255,150,40,.8); }
  .webshine { position: absolute; left: 292.95px; top: 1302.09px; width: 494.09px; height: 43px; white-space: nowrap; opacity: 0;
    font: 700 34px 'Be Vietnam Pro', sans-serif; letter-spacing: 1px; color: transparent;
    background: linear-gradient(100deg, rgba(255,190,90,0) 42%, #FFD08A 50%, rgba(255,190,90,0) 58%) no-repeat; background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 8px rgba(255,150,40,.7)); }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="pill2"><div class="band"></div></div><div class="ring"></div><div class="pill"><div class="band"></div></div><div class="webshine">sun-saphia-residence.com</div>
<script>
// Lớp chữ ký "Hoàng Hiệp – Đà Nẵng" (từ file hoanghiep_1.mov), tự viết ra rồi giữ nguyên.
// Khung hình theo video chính (30 fps). Ảnh nét chữ: sig/s000.png … s193.png (600 × 421).
const N = 194;
const SLOTS = [
  // cảnh bản đồ: nhỏ, ngay trên dải hotline; viết lại nhẹ nhàng vài lần
  { from: 40, to: 1495, w: 330, cx: 540, bottom: 1742, writes: [50, 520, 990], speed: 1 },
  // cảnh kết: lớn hơn, dưới địa chỉ website
  { from: 1652, to: 1800, w: 520, cx: 540, bottom: 1735, writes: [1656], speed: 2 },
];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ctx = document.getElementById('c').getContext('2d');
const imgs = [];
let loaded = 0;
for (let i = 0; i < N; i++) {
  const im = new Image();
  im.onload = () => { if (++loaded === N) Promise.all([document.fonts.load('700 34px "Be Vietnam Pro"'), document.fonts.load('800 40px "Be Vietnam Pro"', 'HOÀNG HIỆP')]).then(() => { window.READY = true; }); };
  im.src = `sig/s${String(i).padStart(3, '0')}.png`;
  imgs.push(im);
}
// Watermark mờ chống sao chép: 1 dòng nằm ngang giữa khung hình
const WM = { text: 'HOÀNG HIỆP · 0904 567 009', alpha: 0.16, y: 960 };
function watermark(f) {
  ctx.save();
  // ảnh phối cảnh (nền sáng) cần đậm hơn một chút
  const photo = Math.min(clamp((f - 1500) / 12), clamp((1652 - f) / 12));
  ctx.globalAlpha = (WM.alpha + photo * 0.08) * clamp((f - 20) / 20);
  ctx.font = '800 40px "Be Vietnam Pro"'; ctx.letterSpacing = '8px';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,10,30,.8)'; ctx.fillStyle = '#FFFFFF';
  ctx.strokeText(WM.text, 544, WM.y); ctx.fillText(WM.text, 544, WM.y);
  ctx.restore();
}
window.renderSig = f => {
  ctx.clearRect(0, 0, 1080, 1920);
  watermark(f);
  for (const s of SLOTS) {
    const vis = Math.min(clamp((f - s.from) / 12), clamp((s.to - f) / 12));
    if (vis <= 0) continue;
    let k = -1;                                   // lần viết đang áp dụng
    s.writes.forEach((t, i) => { if (f >= t) k = i; });
    if (k < 0) continue;
    const t0 = s.writes[k], next = s.writes[k + 1];
    const idx = Math.min(N - 1, Math.floor((f - t0) * s.speed));
    let a = vis;
    if (next != null) a *= clamp((next - f) / 15);   // mờ dần trước khi viết lại
    const h = s.w * 421 / 600, x = s.cx - s.w / 2, y = s.bottom - h;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowColor = 'rgba(2,8,22,.85)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 2;
    ctx.drawImage(imgs[idx], x, y, s.w, h);
    ctx.shadowColor = 'rgba(255,122,26,.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 0;
    ctx.globalAlpha = a * .5;
    ctx.drawImage(imgs[idx], x, y, s.w, h);
    ctx.restore();
  }
  // vệt sáng nhẹ qua dải hotline nhỏ ở cảnh bản đồ (mỗi 5 giây)
  const p2 = document.querySelector('.pill2'), b2 = p2.querySelector('.band');
  if (f >= 120 && f < 1480) {
    const t2 = clamp(((f - 120) % 150) / 30);
    p2.style.opacity = t2 > 0 && t2 < 1 ? .8 : 0;
    b2.style.transform = `translateX(${(-160 + t2 * 900).toFixed(1)}px) skewX(-22deg)`;
  } else p2.style.opacity = 0;
  // vệt sáng + vòng sáng lan quanh nút hotline (lặp mỗi 2,2 giây)
  const S0 = 1708, P = 66, band = document.querySelector('.pill .band'), pill = document.querySelector('.pill');
  const ring = document.querySelector('.ring'), web = document.querySelector('.webshine');
  if (f >= S0) {
    const t = (f - S0) % P, live = clamp((1800 - f) / 6);
    const sweep = clamp(t / 34);
    pill.style.opacity = live; band.style.transform = `translateX(${(-300 + sweep * 1100).toFixed(1)}px) skewX(-22deg)`;
    const rp = clamp(t / 42);
    ring.style.opacity = ((1 - rp) * .85 * live).toFixed(3); ring.style.transform = `scale(${(1 + rp * .1).toFixed(4)}, ${(1 + rp * .38).toFixed(4)})`;
    const wp = clamp((t - 10) / 34);
    web.style.opacity = (wp > 0 && wp < 1 ? 1 : 0) * live; web.style.backgroundPosition = `${(100 - wp * 100).toFixed(1)}% 0`;
  } else { pill.style.opacity = 0; ring.style.opacity = 0; web.style.opacity = 0; }
  return true;
};
</script>
</body>
</html>
