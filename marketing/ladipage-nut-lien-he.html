<style>
#ct-fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:2147483000;display:flex;flex-direction:column;gap:12px;font-family:"Be Vietnam Pro",Arial,sans-serif}
#ct-fab a{position:relative;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-weight:800;font-size:13px;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);transition:transform .2s}
#ct-fab a:hover{transform:scale(1.08)}
#ct-fab svg{width:26px;height:26px}
#ct-fab .ct-call{background:#f26b1d;animation:ct-ring-o 2.4s infinite}
#ct-fab .ct-call svg{animation:ct-shake 2.4s infinite}
#ct-fab .ct-zalo{background:#0068ff;animation:ct-ring-b 2.4s .8s infinite}
#ct-fab .ct-form{background:#0b2a5b;animation:ct-ring-n 2.4s 1.6s infinite}
#ct-fab .ct-form i{position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;background:#2ecc71;border:2px solid #fff}
#ct-fab a::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:ct-halo 2.4s infinite}
#ct-fab .ct-call::after{color:#f26b1d}
#ct-fab .ct-zalo::after{color:#0068ff;animation-delay:.8s}
#ct-fab .ct-form::after{color:#13366f;animation-delay:1.6s}
@keyframes ct-ring-o{0%,100%{box-shadow:0 0 0 0 rgba(242,107,29,.55)}50%{box-shadow:0 0 0 12px rgba(242,107,29,0)}}
@keyframes ct-ring-b{0%,100%{box-shadow:0 0 0 0 rgba(0,104,255,.5)}50%{box-shadow:0 0 0 12px rgba(0,104,255,0)}}
@keyframes ct-ring-n{0%,100%{box-shadow:0 0 0 0 rgba(19,54,111,.5)}50%{box-shadow:0 0 0 12px rgba(19,54,111,0)}}
@keyframes ct-halo{0%{transform:scale(.85);opacity:.6}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}
@keyframes ct-shake{0%,50%,100%{transform:rotate(0)}5%,15%,25%{transform:rotate(-14deg)}10%,20%{transform:rotate(14deg)}}
@media (max-width:767px){#ct-fab{right:12px;gap:10px}#ct-fab a{width:50px;height:50px}#ct-fab svg{width:22px;height:22px}}
@media (prefers-reduced-motion:reduce){#ct-fab a,#ct-fab svg,#ct-fab a::after{animation:none!important}}
</style>
