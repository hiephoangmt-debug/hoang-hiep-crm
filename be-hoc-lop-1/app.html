<title>Bé Vui Học</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one column "school notebook" — tabs on top, a lined ô-li page below, big tap targets for small fingers */
:root {
  --bg: #eef4fb;          /* paper-blue page */
  --paper: #ffffff;       /* notebook sheet */
  --ink: #1d2340;         /* text */
  --muted: #5b6386;
  --tim: #6a3fb5;         /* "mực tím" school ink, main accent */
  --tim-soft: #ece4fa;
  --sun: #ffb21e;         /* stars, highlights */
  --sun-soft: #fff1d1;
  --ok: #1f9d5a;
  --ok-soft: #dcf5e7;
  --bad: #d6453b;
  --bad-soft: #fde3e0;
  --blue: #2563c9;
  --grid: #cfe0f5;
  --grid-strong: #9dbbe6;
  --line: #dbe3f0;
  --shadow: 0 2px 0 #d3dcec;
  --f-display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141729; --paper: #1d2138; --ink: #eef0fb; --muted: #a8aed0;
  --tim: #b597f2; --tim-soft: #2f2752; --sun: #ffc54d; --sun-soft: #3a311a;
  --ok: #4cd38a; --ok-soft: #173b2a; --bad: #ff7d72; --bad-soft: #43201e;
  --blue: #7fb0ff; --grid: #2a3356; --grid-strong: #3e4c7e; --line: #2d3355; --shadow: 0 2px 0 #0d0f1d;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141729; --paper: #1d2138; --ink: #eef0fb; --muted: #a8aed0;
  --tim: #b597f2; --tim-soft: #2f2752; --sun: #ffc54d; --sun-soft: #3a311a;
  --ok: #4cd38a; --ok-soft: #173b2a; --bad: #ff7d72; --bad-soft: #43201e;
  --blue: #7fb0ff; --grid: #2a3356; --grid-strong: #3e4c7e; --line: #2d3355; --shadow: 0 2px 0 #0d0f1d;
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* header */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.brand h1 { font-size: 30px; color: var(--tim); font-weight: 800; }
.brand span { font-weight: 800; color: var(--muted); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.stars { display: inline-flex; align-items: center; gap: 6px; background: var(--sun-soft); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stars svg { width: 20px; height: 20px; fill: var(--sun); }
.iconbtn { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 800; }

/* main tabs */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tab { border: 0; border-radius: 18px; padding: 10px 6px; background: var(--paper); box-shadow: var(--shadow); display: grid; justify-items: center; gap: 0; }
.tab b { font-family: var(--f-display); font-size: 26px; line-height: 1.1; color: var(--tim); }
.tab small { font-weight: 800; font-size: 15px; }
.tab[aria-selected="true"] { background: var(--tim); }
.tab[aria-selected="true"] b, .tab[aria-selected="true"] small { color: var(--paper); }

.subtabs { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 15px; }
.chip[aria-pressed="true"] { border-color: var(--tim); background: var(--tim-soft); color: var(--tim); }

.sheet { background: var(--paper); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 16px; min-width: 0; }
.hint { color: var(--muted); margin: 0; font-size: 15px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ô li notebook grid */
.oli {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px);
  background-size: 48px 48px, 48px 48px, 12px 12px;
  border: 2px solid var(--grid-strong); border-radius: 14px;
}

/* letter / word cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.card { border: 2px solid var(--line); background: var(--paper); border-radius: 16px; padding: 10px 8px; display: grid; justify-items: center; gap: 2px; text-align: center; min-width: 0; transition: transform .12s; }
.card:active { transform: scale(.96); }
.card .big { font-family: var(--f-display); font-size: 40px; line-height: 1.05; color: var(--tim); font-weight: 800; }
.card .pic { font-size: 34px; line-height: 1.2; }
.card .w { font-weight: 800; font-size: 18px; overflow-wrap: anywhere; }
.card .ipa { color: var(--muted); font-size: 14px; }
.card .vi { color: var(--blue); font-weight: 700; font-size: 14px; }
.card.on { border-color: var(--sun); background: var(--sun-soft); }

/* tones */
.tones { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.tone .big { font-size: 52px; }

/* syllable builder */
.builder { display: grid; gap: 14px; }
.stage { display: grid; justify-items: center; gap: 8px; padding: 22px 12px; }
.syll { font-family: var(--f-display); font-size: clamp(64px, 18vw, 120px); font-weight: 800; line-height: 1; letter-spacing: .02em; }
.syll .c { color: var(--tim); } .syll .r { color: var(--blue); }
.formula { font-weight: 800; color: var(--muted); font-size: 16px; text-align: center; }
.note { background: var(--sun-soft); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 15px; }
.pick h3 { font-size: 18px; margin-bottom: 6px; }
.pick .grp { color: var(--muted); font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin: 8px 0 4px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.key { min-width: 48px; border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 4px 10px; font-family: var(--f-display); font-size: 22px; font-weight: 800; }
.key[aria-pressed="true"] { background: var(--tim); border-color: var(--tim); color: var(--paper); }
.key:disabled { opacity: .3; cursor: not-allowed; }

.btn { border: 0; border-radius: 14px; padding: 10px 18px; font-weight: 800; background: var(--tim); color: var(--paper); box-shadow: var(--shadow); }
.btn.alt { background: var(--tim-soft); color: var(--tim); }
.btn.sun { background: var(--sun); color: #2a1d00; }

/* reading */
.sentence { display: flex; flex-wrap: wrap; gap: 6px 4px; padding: 18px 14px; }
.word { border: 0; background: transparent; border-radius: 10px; padding: 0 6px; font-family: var(--f-display); font-size: clamp(30px, 7vw, 44px); font-weight: 800; color: var(--ink); }
.word.on { background: var(--sun); color: #2a1d00; }
.list { display: grid; gap: 6px; }
.list button { text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 8px 12px; font-weight: 700; }
.list button[aria-pressed="true"] { border-color: var(--tim); background: var(--tim-soft); }

/* quiz */
.q { display: grid; justify-items: center; gap: 14px; text-align: center; }
.q .prompt { font-family: var(--f-display); font-size: clamp(40px, 11vw, 72px); font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.q .objs { font-size: clamp(32px, 8vw, 46px); line-height: 1.3; max-width: 520px; overflow-wrap: anywhere; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; width: 100%; max-width: 560px; }
.opt { border: 3px solid var(--line); background: var(--paper); border-radius: 18px; padding: 10px; font-family: var(--f-display); font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; min-height: 76px; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); animation: shake .35s; }
.feedback { min-height: 30px; font-weight: 800; font-size: 20px; }
.feedback.ok { color: var(--ok); } .feedback.bad { color: var(--bad); }
.plus { color: var(--muted); font-size: .6em; padding: 0 .2em; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { 50% { transform: scale(1.25); } }
.pop { animation: pop .4s; }

/* settings */
.settings { display: grid; gap: 12px; }
.settings label { display: grid; gap: 4px; font-weight: 800; font-size: 15px; }
.settings select, .settings input[type="range"] { width: 100%; font: inherit; padding: 6px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); }
.warn { background: var(--bad-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.warn b { color: var(--bad); }
.word.miss { background: var(--bad-soft); color: var(--bad); text-decoration: underline wavy var(--bad); }
.word.good { color: var(--ok); }
.word.on.miss { background: var(--sun); color: #2a1d00; }
.status { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 800; color: var(--muted); font-size: 15px; }
.dots { display: inline-flex; gap: 5px; align-items: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bad); display: inline-block; }
.dots i.x { background: var(--bad); }
.mic { font-size: 20px; padding: 14px 24px; border-radius: 999px; }
.mic.listening { background: var(--bad); animation: pop 1s infinite; }
.judge { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.judge .btn { font-size: 18px; padding: 14px; }
.btn.okb { background: var(--ok); } .btn.badb { background: var(--bad); }
.spellbox { background: var(--tim-soft); border-radius: 14px; padding: 10px 14px; font-weight: 800; color: var(--tim); font-size: 18px; display: grid; gap: 2px; }
.heard { color: var(--muted); font-size: 15px; margin: 0; }
details { border: 2px dashed var(--line); border-radius: 14px; padding: 8px 12px; }
summary { font-weight: 800; cursor: pointer; }
textarea { width: 100%; min-height: 120px; font: inherit; border-radius: 10px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); padding: 8px; margin: 8px 0; }
.settings input[type="text"] { width: 100%; font: inherit; padding: 6px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); }
.book { display: grid; gap: 6px; }
.booklbl { font-weight: 800; color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
#lessonSearch { width: 100%; font: inherit; font-size: 18px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--tim); background: var(--paper); color: var(--ink); }
.lessonlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-height: 200px; overflow-y: auto; padding: 2px; }
.lessonlist button { text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 6px 10px; font-size: 15px; }
.lessonlist button b { color: var(--tim); }
.lessonlist button[aria-pressed="true"] { border-color: var(--tim); background: var(--tim-soft); }
.lessonname { font-size: 22px; color: var(--tim); }
.lessonname small { font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 480px) { .tab b { font-size: 22px; } .tab small { font-size: 13px; } .sheet { padding: 14px; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Bé Vui Học</h1><span>Lớp 1</span></div>
    <div class="stars" title="Số sao bé đã đạt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg><span id="starCount">0</span></div>
    <button class="iconbtn" id="btnSettings" aria-expanded="false">Giọng đọc</button>
  </header>

  <section class="sheet settings" id="settings" hidden>
    <h2>Cài đặt giọng đọc</h2>
    <div id="voiceWarn"></div>
    <label for="kidName">Tên của bé (máy sẽ gọi tên bé)
      <input type="text" id="kidName" maxlength="30"></label>
    <label for="viVoice">Giọng tiếng Việt
      <select id="viVoice"></select></label>
    <label for="enVoice">Giọng tiếng Anh
      <select id="enVoice"></select></label>
    <label for="easy">Mức chấm khi máy nghe bé đọc
      <select id="easy"><option value="1">Dễ – chấp nhận đọc gần đúng (nên dùng)</option><option value="0">Chuẩn – phải đúng từng âm, từng dấu</option></select></label>
    <label for="rate">Tốc độ đọc: <span id="rateVal"></span>
      <input type="range" id="rate" min="0.5" max="1.2" step="0.05"></label>
    <div class="row">
      <button class="btn" data-say="Xin chào, bé cùng học tiếng Việt nhé." data-lang="vi">Thử giọng Việt</button>
      <button class="btn alt" data-say="Hello! Let's learn English together." data-lang="en">Thử giọng Anh</button>
    </div>
    <p class="hint">Giọng đọc lấy từ máy của bé. Giọng chuẩn nhất: Microsoft Edge (giọng HoaiMy, NamMinh), Chrome (Google Tiếng Việt), iPhone (Linh).</p>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="vn"><b>Aa</b><small>Tiếng Việt</small></button>
    <button class="tab" role="tab" data-tab="math"><b>1+2</b><small>Toán</small></button>
    <button class="tab" role="tab" data-tab="en"><b>ABC</b><small>Tiếng Anh</small></button>
  </nav>

  <div class="subtabs" id="subtabs"></div>
  <main class="sheet" id="view"></main>
</div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rand = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("bvh-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("bvh-" + k, JSON.stringify(v)); } catch (e) {} }
};

/* ================= GIỌNG ĐỌC ================= */
const synth = window.speechSynthesis;
const S = { easy: store.get("easy", true), name: store.get("name", "Hà My"), voices: [], rate: store.get("rate", 0.85), vi: store.get("viVoice", ""), en: store.get("enVoice", "") };
const norm = l => (l || "").replace("_", "-").toLowerCase();
function scoreVoice(v, lang) {
  let s = 0; const n = v.name;
  if (/natural|neural|online/i.test(n)) s += 50;
  if (/google/i.test(n)) s += 30;
  if (/hoaimy|namminh|linh|ava|aria|jenny|samantha|sonia|libby/i.test(n)) s += 15;
  if (lang === "en" && norm(v.lang) === "en-us") s += 20;
  if (lang === "en" && norm(v.lang) === "en-gb") s += 10;
  return s;
}
function voicesFor(lang) { return S.voices.filter(v => norm(v.lang).startsWith(lang)).sort((a, b) => scoreVoice(b, lang) - scoreVoice(a, lang)); }
function pickVoice(lang) {
  const list = voicesFor(lang);
  return list.find(v => v.voiceURI === S[lang]) || list[0] || null;
}
function fillVoiceSelect(lang) {
  const sel = $("#" + lang + "Voice"), list = voicesFor(lang), cur = pickVoice(lang);
  sel.innerHTML = list.length ? list.map(v => `<option value="${esc(v.voiceURI)}"${cur && v.voiceURI === cur.voiceURI ? " selected" : ""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")
    : `<option value="">Không tìm thấy giọng — máy dùng giọng mặc định</option>`;
}
function loadVoices() {
  if (!synth) return;
  S.voices = synth.getVoices();
  fillVoiceSelect("vi"); fillVoiceSelect("en");
  const w = $("#voiceWarn");
  if (S.voices.length && !voicesFor("vi").length) {
    w.innerHTML = `<div class="warn"><b>Máy chưa có giọng tiếng Việt.</b> Android: Cài đặt › Hệ thống › Ngôn ngữ › Đầu ra chuyển văn bản thành giọng nói › chọn "Dịch vụ lời nói của Google" và tải gói Tiếng Việt. iPhone/iPad: Cài đặt › Trợ năng › Nội dung được đọc › Giọng nói › Tiếng Việt. Máy tính: mở trang bằng Microsoft Edge hoặc Chrome.</div>`;
  } else w.innerHTML = "";
}
if (synth) { loadVoices(); synth.addEventListener ? synth.addEventListener("voiceschanged", loadVoices) : (synth.onvoiceschanged = loadVoices); }

let speakToken = 0;
function speakOne(text, lang, token) {
  return new Promise(resolve => {
    if (!synth || token !== speakToken) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(lang);
    u.lang = v ? v.lang : (lang === "vi" ? "vi-VN" : "en-US");
    if (v) u.voice = v;
    u.rate = S.rate; u.pitch = 1.05;
    let done = false; const fin = () => { if (!done) { done = true; resolve(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 1500 + text.length * 180 / S.rate); // phòng khi trình duyệt không báo "đọc xong"
    synth.speak(u);
  });
}
/* đọc lần lượt: items = [{t, lang, el}] — el được tô sáng khi đang đọc */
async function speakSeq(items, gap = 250) {
  if (!synth) return;
  const token = ++speakToken;
  synth.cancel();
  document.querySelectorAll(".on[data-hl]").forEach(e => e.classList.remove("on"));
  for (const it of items) {
    if (token !== speakToken) return;
    if (it.wait) { if (it.el) it.el.classList.add("on"); await new Promise(r => setTimeout(r, it.wait)); if (it.el) it.el.classList.remove("on"); continue; }
    if (it.el) { it.el.classList.add("on"); it.el.dataset.hl = "1"; }
    await speakOne(it.t, it.lang || "vi", token);
    if (it.el) it.el.classList.remove("on");
    if (gap) await new Promise(r => setTimeout(r, gap));
  }
}
const say = (t, lang = "vi") => speakSeq([{ t, lang }], 0);

/* ================= SAO THƯỞNG ================= */
let stars = store.get("stars", 0);
function addStar() {
  stars++; store.set("stars", stars);
  const el = $("#starCount"); el.textContent = stars;
  el.parentElement.classList.remove("pop"); void el.offsetWidth; el.parentElement.classList.add("pop");
}
$("#starCount").textContent = stars;
const PRAISE = ["Đúng rồi! Con giỏi quá!", "Tuyệt vời!", "Chính xác! Con làm tốt lắm!", "Hoan hô bé!"];
const TRY = "Chưa đúng rồi, con thử lại nhé!";

/* ================= TIẾNG VIỆT: DỮ LIỆU ================= */
// 29 chữ cái: [chữ, cách đọc âm theo sách Tiếng Việt 1, từ ví dụ, hình]
const ALPHABET = [
  ["a","a","cá","🐟"],["ă","á","tắm","🛁"],["â","ớ","cân","⚖️"],["b","bờ","bò","🐄"],["c","cờ","cà","🍆"],
  ["d","dờ","dê","🐐"],["đ","đờ","đèn","💡"],["e","e","xe","🚗"],["ê","ê","dế","🦗"],["g","gờ","gà","🐔"],
  ["h","hờ","hoa","🌸"],["i","i","mì","🍜"],["k","ca","kéo","✂️"],["l","lờ","lá","🍃"],["m","mờ","mèo","🐱"],
  ["n","nờ","nơ","🎀"],["o","o","ong","🐝"],["ô","ô","ô","☂️"],["ơ","ơ","cờ","🚩"],["p","pờ","pin","🔋"],
  ["q","quờ","quà","🎁"],["r","rờ","rổ","🧺"],["s","sờ","sao","⭐"],["t","tờ","táo","🍎"],["u","u","cua","🦀"],
  ["ư","ư","sư tử","🦁"],["v","vờ","voi","🐘"],["x","xờ","xe đạp","🚲"],["y","i dài","y tá","👩‍⚕️"]

};
const isV = c => VF[c] !== undefined;
// Vị trí đặt dấu thanh (quy tắc chính tả dùng trong sách giáo khoa mới: hoà, thuý)
function toneIndex(ch) {
  const s = ch.join("");
  const uo = s.indexOf("ươ"); if (uo >= 0) return uo + 1;
  for (let i = 0; i < ch.length; i++) if ("ăâêôơư".includes(ch[i])) return i;
  const vs = []; ch.forEach((c, i) => { if (isV(c)) vs.push(i); });
  if (!vs.length) return -1;
  if (!isV(ch[ch.length - 1])) return vs[vs.length - 1];      // có âm cuối: dấu trên nguyên âm cuối cùng
  if (vs.length === 1) return vs[0];
  if (vs.length >= 3) return vs[1];
  const pair = ch[vs[0]] + ch[vs[1]];
  return ["oa", "oe", "uy"].includes(pair) ? vs[1] : vs[0];
}
function applyTone(word, t) {
  if (!t) return word;
  const ch = [...word], i = toneIndex(ch);
  if (i < 0) return word;
  ch[i] = VF[ch[i]][t];
  return ch.join("");
}

function buildSyllable(cons, rhyme, tone) {
  let c = cons, r = rhyme, note = "", bad = "";
  const f = r[0];
  if (c === "c" && "eêiy".includes(f)) { c = "k"; note = "Đứng trước e, ê, i ta viết k (đọc là ca)."; }
  if (c === "g" && "eêi".includes(f)) { c = "gh"; note = "Đứng trước e, ê, i ta viết gh (gờ kép)."; }
  if (c === "ng" && "eêi".includes(f)) { c = "ngh"; note = "Đứng trước e, ê, i ta viết ngh (ngờ kép)."; }
  if (c === "gi" && f === "i") r = r.slice(1) || "";
  if (c === "qu" && "uưoô".includes(f)) bad = "Âm qu không ghép với vần bắt đầu bằng " + f + ".";
  if (!c && r.startsWith("iê")) { r = "y" + r.slice(1); note = "Không có âm đầu thì viết yê (yên, yêu)."; }
  let rt = applyTone(r, tone);
  if (c === "gi" && !r) rt = applyTone("i", tone), c = "g"; // gi + i = gì
  return { c, r: rt, base: c + r, word: c + rt, note, bad };
}

/* ================= BÉ TỰ ĐỌC (nghe bé đọc, sai thì đọc lại, 3 lần sai thì đánh vần) ================= */
const TONE_OF = {};
for (const [b, s] of Object.entries(VF)) [...s].forEach((ch, i) => TONE_OF[ch] = [b, i]);
const ONSETS = ["ngh","ng","gh","gi","qu","ch","kh","nh","ph","th","tr","b","c","d","đ","g","h","k","l","m","n","p","r","s","t","v","x"];
const cleanW = w => w.toLowerCase().normalize("NFC").replace(/[.,!?;:"“”()…]/g, "");
// tách một tiếng thành âm đầu + vần + thanh, ví dụ "túi" -> t + ui + sắc
function parseSyl(w) {
  w = cleanW(w);
  let tone = 0, base = "";
  for (const ch of w) { const t = TONE_OF[ch]; if (t) { base += t[0]; if (t[1]) tone = t[1]; } else base += ch; }
  let on = ONSETS.find(o => base.startsWith(o) && base.length > o.length) || "";
  if (!on && base === "gi") on = "gi";
  let rh = base.slice(on.length);
  if (on === "gi" && !rh) rh = "i";
  return { on, rh, base, tone, word: w };
}
// chuỗi đánh vần như cô giáo: "tờ – ui – tui – sắc – túi"
function spellParts(w) {
  const p = parseSyl(w), out = [];
  if (p.on) out.push(CONS_SAY[p.on] || p.on, p.rh, p.base); else out.push(p.rh);
  if (p.tone) out.push(TONES[p.tone].short, p.word);
  return out;
}

      }
      bdNoHear = 0;
      heardEl.textContent = "Máy nghe được: " + alts[0];
      const heard = alts.join(" ").split(/\s+/).map(cleanW).filter(Boolean).map(parseSyl);
      const single = words.length === 1 && !parseSyl(words[0]).on; // thẻ chỉ có vần, vd "ui"
      const miss = words.map((w, i) => sylMatch(w, heard, single) ? -1 : i).filter(i => i >= 0);
      const allow = S.easy ? Math.floor(words.length * 0.25) : (words.length >= 6 ? 1 : 0);
      judge(miss.length <= allow, miss);
    }
    // bố mẹ bấm chấm tay thì ngắt lượt nghe đang chạy
    const manual = ok => { if (curRec) { round++; abortRec(); busy = false; micState(false); } judge(ok, []); };

    $("#ok").onclick = () => manual(true);
    $("#bad").onclick = () => manual(false);
    $("#spellBtn").onclick = () => { round++; abortRec(); busy = false; micState(false); const m = missed(); guide(m.length ? m : wEls.map((_, i) => i)).then(() => { if (alive() && bdRunning) listenRound(false); }); };
    $("#model").onclick = () => { round++; abortRec(); busy = false; micState(false); speakSeq(words.length > 1 ? [{ t: text }] : [{ t: cleanW(text), el: wEls[0] }]).then(() => { if (alive() && bdRunning) listenRound(false); }); };
    $("#prev").onclick = () => next(-1);
    $("#next").onclick = () => next(1);
    const listEl = $("#lessonList"), search = $("#lessonSearch");
    const renderList = () => {
      const found = searchLessons(query);
      listEl.innerHTML = found.length ? found.map(L => `<button data-n="${L.n}" aria-pressed="${L.n === N}"><b>Bài ${L.n}</b> ${esc(L.title)}</button>`).join("") : `<p class="hint">Không thấy bài nào. Thử gõ số bài hoặc một vần khác.</p>`;
      listEl.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { N = +b.dataset.n; I = 0; tries = 0; query = ""; draw(); });
      const cur = listEl.querySelector('[aria-pressed="true"]'); if (cur && !query) listEl.scrollTop = cur.offsetTop - listEl.offsetTop - 40;
    };
    renderList();
    search.oninput = () => { query = search.value; renderList(); };
    search.onkeydown = e => { if (e.key === "Enter") { const f = searchLessons(query); if (f.length) { N = f[0].n; I = 0; tries = 0; query = ""; draw(); } } };
    $("#saveCustom").onclick = () => { const lines = $("#customTxt").value.split("\n").map(x => x.trim()).filter(Boolean); store.set("custom-" + N, lines); draw(); };
    $("#clearCustom").onclick = () => { store.set("custom-" + N, []); I = 0; draw(); };
    if (mic) mic.onclick = () => {
      if (bdRunning) { bdStop(); bdMsg = ["", "Đã dừng nghe."]; draw(); }
      else {
        // iPad/iPhone: phải mở khoá giọng đọc và xin quyền micro ngay trong lúc bấm
        try { if (synth) synth.speak(new SpeechSynthesisUtterance(" ")); } catch (e) {}
        mic.textContent = "Đang bật micro…";
        // xin quyền micro trước, tắt hẳn rồi mới bắt đầu nghe (iPad không cho dùng micro hai nơi cùng lúc)
        const go = () => { bdRunning = true; bdNoHear = 0; draw(); };
        const md = navigator.mediaDevices;
        if (!md || !md.getUserMedia) return go();
        md.getUserMedia({ audio: true })
          .then(st => { st.getTracks().forEach(t => t.stop()); setTimeout(go, 400); })
          .catch(e => {
            if (e && e.name === "NotAllowedError") { srBroken = true; bdMsg = ["bad", micHelp("not-allowed")]; draw(); }
            else go();
          });
      }
    };
    const retry = $("#micRetry");
    if (retry) retry.onclick = () => { srBroken = false; bdMsg = null; draw(); };
    abortRec();
    setTimeout(() => {
      if (!alive()) return;
      if (bdRunning) listenRound(true);
      else if (!busy) say(`${S.name} đọc nhé!`);
    }, 300);
  };
  draw();
};

/* ---------- Toán ---------- */
function quiz(v, { title, hint, make, top, bind }) {
  const round = () => {
    const q = make();
    v.innerHTML = `<div><h2>${title}</h2><p class="hint">${hint}</p></div>${top || ""}
    <div class="q">${q.html}
      <div class="opts">${q.options.map(o => `<button class="opt" data-o="${esc(o)}"${q.optLang === "en" ? "" : ""}>${q.label ? q.label(o) : esc(o)}</button>`).join("")}</div>
      <div class="feedback" id="fb" aria-live="polite"></div>
      <div class="row"><button class="btn alt" id="again">Nghe lại</button><button class="btn alt" id="skip">Câu khác</button></div>
    </div>`;
    if (bind) bind(v);
    let locked = false;
    const ask = () => q.speak && speakSeq(q.speak);
    ask();
    $("#again").onclick = ask;
    $("#skip").onclick = round;
    v.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (locked) return;
      const fb = $("#fb");
      if (b.dataset.o === String(q.answer)) {
        locked = true; b.classList.add("ok"); addStar();
        const p = PRAISE[rand(PRAISE.length)];
        fb.className = "feedback ok"; fb.textContent = p;
        speakSeq((q.after || []).concat([{ t: p }])).then(() => setTimeout(round, 400));
      } else {
        b.classList.add("bad"); fb.className = "feedback bad"; fb.textContent = TRY; say(TRY);
      }
    });
  };
  round();
}
function numOptions(ans, max, n = 4) {
  const set = new Set([ans]);
  let guard = 0;
  while (set.size < n && guard++ < 200) { const d = rand(5) + 1, x = ans + (Math.random() < .5 ? -d : d); if (x >= 0 && x <= max) set.add(x); }
  for (let x = 0; set.size < n && x <= max; x++) set.add(x);
  return shuffle([...set]);
}
const OBJS = [["🐔","con gà"],["🍎","quả táo"],["🌸","bông hoa"],["⭐","ngôi sao"],["🐟","con cá"],["🚗","chiếc ô tô"],["🎈","quả bóng bay"],["🐱","con mèo"]];

VIEWS["math:tinh"] = v => {
  const lv = store.get("mathLv", 10);
  const make = () => {
    let a, b, op = Math.random() < .5 ? "+" : "−";
    if (lv === 10) { a = rand(11); b = op === "+" ? rand(11 - a) : rand(a + 1); }
    else if (lv === 20) { a = rand(21); b = op === "+" ? rand(21 - a) : rand(a + 1); }
    else { // phạm vi 100, không nhớ
      const t1 = rand(9) + 1, u1 = rand(10);
      if (op === "+") { const t2 = rand(10 - t1), u2 = rand(10 - u1); a = t1 * 10 + u1; b = t2 * 10 + u2; }
      else { const t2 = rand(t1 + 1), u2 = rand(u1 + 1); a = t1 * 10 + u1; b = t2 * 10 + u2; }
    }
    const ans = op === "+" ? a + b : a - b, word = op === "+" ? "cộng" : "trừ";
    const dots = lv === 10 ? `<div class="objs" aria-hidden="true">${op === "+" ? "🍎".repeat(a) + '<span class="plus">+</span>' + "🍎".repeat(b) : "🍎".repeat(a - b) + "🍏".repeat(b)}</div>` : "";
    return { html: `<div class="prompt oli" style="padding:10px 24px">${a} ${op} ${b} = ?</div>${dots}${lv === 10 && op === "−" ? `<p class="hint">Bớt đi ${b} quả táo xanh</p>` : ""}`,
      options: numOptions(ans, lv === 100 ? 99 : lv), answer: ans,
      speak: [{ t: `${a} ${word} ${b} bằng mấy?` }], after: [{ t: `${a} ${word} ${b} bằng ${ans}.` }] };
  };
  const top = `<div class="keys">${[[10,"Phạm vi 10"],[20,"Phạm vi 20"],[100,"Phạm vi 100 (không nhớ)"]].map(([k, n]) => `<button class="chip" data-lv="${k}" aria-pressed="${k === lv}">${n}</button>`).join("")}</div>`;
  quiz(v, { title: "Phép cộng, phép trừ", hint: "Chọn phạm vi số, rồi chọn đáp án đúng.", make, top,

};
