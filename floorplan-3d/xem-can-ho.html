<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Căn hộ mẫu – Tòa F2</title>
  <meta name="description" content="Xem căn hộ mẫu tòa F2 FourS Tower Đà Nẵng: mặt bằng 2D, phối cảnh 3D, tham quan 4D từng loại căn studio, 1PN, 2PN, 3PN." />
  <link rel="canonical" href="https://hiephoangmt-debug.github.io/hoang-hiep-crm/xem-can-ho.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Căn hộ mẫu – Tòa F2" />
  <meta property="og:description" content="Xem căn hộ mẫu tòa F2 FourS Tower Đà Nẵng: mặt bằng 2D, phối cảnh 3D, tham quan 4D từng loại căn studio, 1PN, 2PN, 3PN." />
  <meta property="og:url" content="https://hiephoangmt-debug.github.io/hoang-hiep-crm/xem-can-ho.html" />
  <meta property="og:image" content="https://hiephoangmt-debug.github.io/hoang-hiep-crm/units/2pn-a.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
  <link rel="stylesheet" href="./src/unit-page.css" />
</head>
<body class="unitpage">
  <header class="topbar">
    <div class="brand"><span class="logo">⌂</span><div><b>Căn hộ mẫu · Tòa F2</b><small>Mặt bằng 2D · 3D · 4D</small></div></div>
    <div class="actions">
      <a class="btnlink" href="./toa-nha.html" data-link="toa-nha.html">🏢 Bảng hàng tòa nhà</a>
      <a class="btnlink internal" href="./index.html" title="Công cụ thiết kế (nội bộ)">✏️ Thiết kế</a>
    </div>
  </header>
  <div class="up-wrap">
    <nav class="up-units" id="units" aria-label="Chọn loại căn"></nav>
    <section class="up-stage">
      <div class="up-tabs" role="tablist">
        <button data-tab="2d" role="tab">2D · Mặt bằng</button>
        <button data-tab="3d" role="tab" class="active">3D · Phối cảnh</button>
        <button data-tab="4d" role="tab">4D · Tham quan</button>
      </div>
      <div class="up-view">
        <div class="up-2d" id="view2d" hidden><img id="planImg" alt="Mặt bằng căn hộ" /></div>
        <div class="up-3d" id="view3d"><div id="viewer"></div></div>
        <div class="up-caption" id="caption" hidden></div>
        <button class="up-ptsave" id="ptSave" hidden>⬇ Tải ảnh như thật</button>
        <div class="up-progress" id="progress" hidden><i></i></div>
        <div class="up-bar" id="bar3d">
          <div class="chips" id="styles"></div>
          <div class="chips">
            <button id="dayBtn" class="chip active">☀️ Ban ngày</button>
            <button id="nightBtn" class="chip">🌙 Buổi tối</button>
            <button id="adBtn" class="chip" title="Kiểu ảnh quảng cáo: đặt căn trên đế như cuốn sách, nắng sáng có bóng lá, chú thích cảm xúc">🎨 Kiểu quảng cáo</button>
            <button id="saveAdBtn" class="chip" hidden title="Tải ảnh quảng cáo 5:6 có chú thích cảm xúc, mũi tên cong">⬇ Tải ảnh quảng cáo</button>
            <button id="cutBtn" class="chip active" title="Cắt ngang tường, bỏ trần để nhìn rõ bố trí các phòng">✂️ Mặt cắt</button>
            <button id="topBtn" class="chip">⬇ Nhìn từ trên</button>
            <button id="realBtn" class="chip active" title="Nội thất mô hình thật, ánh sáng HDRI">✨ Như thật</button>
            <button id="saveBtn" class="chip" title="Ảnh mặt bằng 5:6 nhìn thẳng từ trên: tên, diện tích, dài × rộng từng phòng và kích thước tổng">⬇ Tải mặt bằng</button>
            <button id="saveViewBtn" class="chip" title="Ảnh 5:6 theo góc đang xem">⬇ Tải phối cảnh</button>
            <button id="videoBtn" class="chip" title="Video dọc 9:16 kiểu TikTok: mở cửa bước vào, đi qua từng phòng ở tầm mắt, có tên phòng và diện tích">🎬 Quay video 9:16</button>
            <button id="softBtn" class="chip" title="Ảnh 5:6 như thật theo góc đang xem: bóng đổ mềm, khử răng cưa, bóng tối góc – vài giây là tải xong">📸 Chụp ảnh như thật</button>
            <button id="photoBtn" class="chip" title="Dò tia ánh sáng vật lý (path tracing): đẹp nhất nhưng chậm, cần máy có card đồ hoạ">✨ Siêu thật (máy mạnh)</button>
            <button id="labelBtn" class="chip" title="Hiện / ẩn tên và diện tích phòng">🏷 Tên phòng</button>
            <button id="peopleBtn" class="chip" title="Hiện / ẩn người trong căn hộ">👪 Người</button>
            <button id="landBtn" class="chip" title="Bật/tắt sân vườn, cây xanh xung quanh">🌳 Sân vườn</button>
            <button id="walkBtn" class="chip">🚶 Đi bộ</button>
          </div>
        </div>
        <div class="up-bar" id="bar4d" hidden>
          <div class="chips"><button id="tourBtn" class="chip active">⏸ Tạm dừng</button><button id="tourAgain" class="chip">↺ Xem lại</button></div>
        </div>
      </div>
    </section>
    <aside class="up-info" id="info"></aside>
  </div>
  <div class="walkhint up-walkhint" id="walkhint">W A S D để đi · chuột để nhìn · <b>Esc</b> để thoát</div>
  <div class="toast" id="toast"></div>
  <script type="module" src="./src/unit-page.js"></script>
</body>
</html>
