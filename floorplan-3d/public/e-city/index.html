<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>e-City Đà Nẵng</title>
<meta name="description" content="Bản đồ số 3D Đà Nẵng: khối nhà toàn thành phố, nền địa hình, ranh phường, công trình biểu tượng và dự án bất động sản." />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #0b1220; --bar: #0d1626; --panel: #0f1a2ced; --line: #ffffff1c; --fg: #e8eef8; --muted: #93a1b8; --acc: #4c9cff; --gold: #f0c26a; --red: #ff5a52; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  button { font-family: inherit; color: inherit; }
  #map { position: fixed; top: 44px; left: 56px; right: 0; bottom: 24px; }
  /* thanh trên */
  .top { position: fixed; top: 0; left: 0; right: 0; height: 44px; background: var(--bar); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 12px; z-index: 10; }
  .logo { font-weight: 700; font-size: 16px; letter-spacing: .2px; white-space: nowrap; }
  .crumb { color: var(--muted); font-size: 12.5px; padding-left: 12px; border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search { margin-left: auto; position: relative; width: min(320px, 40vw); }
  .search input { width: 100%; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: #ffffff0d; color: var(--fg); padding: 0 10px 0 30px; font: 13px Inter, sans-serif; }
  .search svg { position: absolute; left: 9px; top: 8px; }
  .results { position: absolute; top: 34px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-height: 50vh; overflow: auto; display: none; }
  .results button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .results button small { color: var(--muted); margin-left: 6px; }
  .tb { display: flex; gap: 4px; }
  .ib { height: 30px; min-width: 30px; border: 0; border-radius: 8px; background: none; cursor: pointer; display: grid; place-items: center; color: var(--fg); font-size: 12.5px; padding: 0 8px; }
  .ib:hover, .ib.on { background: #ffffff14; }
  /* thanh trái */
  .rail { position: fixed; top: 44px; left: 0; bottom: 24px; width: 56px; background: var(--bar); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding-top: 8px; gap: 2px; z-index: 10; overflow-y: auto; scrollbar-width: none; }
  .rail button { width: 50px; border: 0; background: none; border-radius: 8px; padding: 7px 0 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9.5px; line-height: 1.15; color: var(--muted); }
  .rail button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .rail button.on, .rail button:hover { color: var(--fg); background: #ffffff12; }
  /* thanh trạng thái */
  .status { position: fixed; left: 0; right: 0; bottom: 0; height: 24px; background: var(--bar); border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 10px; padding: 0 12px; z-index: 10; white-space: nowrap; overflow: hidden; }
  .status b { color: var(--fg); font-weight: 600; }
  .status .src { margin-left: auto; }
  /* bảng nổi */
  .panel { position: fixed; z-index: 9; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 30px #0008; backdrop-filter: blur(6px); }
  .filter { top: 56px; left: 68px; padding: 8px 10px; min-width: 190px; }
  .filter .hd { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .filter .bd { margin-top: 8px; display: grid; gap: 6px; font-size: 12.5px; }
  .filter label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .filter input { accent-color: var(--acc); }
  .tour { top: 56px; right: 12px; padding: 10px; width: 220px; display: none; }
  .tour h4, .card h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .tour button { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #ffffff08; border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
  .tour button:hover { background: #ffffff16; }
  .card { right: 12px; top: 56px; width: min(340px, calc(100vw - 80px)); padding: 14px; display: none; max-height: calc(100vh - 100px); overflow: auto; }
  .card h3 { margin: 0 26px 4px 0; font-size: 18px; }
  .card .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .card .x { position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: #ffffff14; cursor: pointer; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .kpi { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .kpi span { display: block; font-size: 11px; color: var(--muted); } .kpi b { font-size: 16px; }
  .row { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row small { color: var(--muted); display: block; }
  .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .acts a { flex: 1; text-align: center; text-decoration: none; padding: 9px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; background: var(--acc); color: #fff; }
  .acts a.alt { background: #ffffff14; color: var(--fg); }
  .note { font-size: 11px; color: var(--muted); margin-top: 10px; }
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 20; display: none; }
  .load { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 30; font-size: 14px; color: var(--muted); }
  .maplibregl-ctrl-scale { background: #0d1626cc; color: var(--fg); border-color: var(--fg); font-size: 10px; }
  .maplibregl-ctrl-attrib { display: none; }
  .wlbl { font: 600 12px Inter, sans-serif; }
  @media (max-width: 640px) {
    #map { left: 0; bottom: 66px; } .rail { top: auto; bottom: 24px; left: 0; right: 0; width: auto; height: 42px; flex-direction: row; padding: 0 4px; border-right: 0; border-top: 1px solid var(--line); }
    .rail button { width: auto; flex: 0 0 auto; padding: 4px 8px; } .rail button span { display: none; }
    .crumb, .tb .lbl { display: none; } .search { width: 46vw; } .filter { left: 10px; top: 52px; } .card, .tour { right: 8px; left: 8px; width: auto; top: auto; bottom: 74px; max-height: 55vh; }
    .status .zoomtxt { display: none; }
  }
</style>
</head>
<body>
<div class="load" id="load">Đang tải bản đồ số Đà Nẵng…</div>
<header class="top">
  <div class="logo">e-City</div>
  <div class="crumb" id="crumb">Đà Nẵng · Toàn thành phố · 3D</div>
  <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#93a1b8" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Tìm phường, dự án hoặc công trình…" autocomplete="off" /><div class="results" id="res"></div></div>
  <div class="tb">
    <button class="ib" id="dashBtn" title="Dashboard"><span class="lbl">▦ Dashboard</span><span style="display:none">▦</span></button>
    <button class="ib on" id="lblBtn" title="Ẩn/hiện nhãn">👁</button>
    <button class="ib" id="fsBtn" title="Toàn màn hình">⛶</button>
  </div>
</header>
<nav class="rail" id="rail">
  <button data-m="dieuhanh" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Điều<br>hành</span></button>
  <button data-m="quyhoach"><svg viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg><span>Quy<br>hoạch</span></button>
  <button data-m="dichvu"><svg viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg><span>Dịch<br>vụ</span></button>
  <button data-m="tuonglai"><svg viewBox="0 0 24 24"><path d="M4 21V9l5-3v15M9 21V4l6 3v14M15 21V11l5 2v8M2 21h20"/></svg><span>Tương<br>lai</span></button>
  <button data-m="vung"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3c3 3 3 15 0 18M3 12h18"/></svg><span>Vùng</span></button>
  <button data-m="khuvuc"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span>Khu<br>vực</span></button>
  <button data-m="thamquan"><svg viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z"/></svg><span>Tham<br>quan</span></button>
  <button data-m="phantich"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Phân<br>tích</span></button>
  <button data-m="dulieu"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5"/></svg><span>Dữ liệu</span></button>
</nav>
<div id="map"></div>
<div class="panel filter" id="filter">
  <div class="hd" id="fhd"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18M6 12h12M10 19h4"/></svg> Lọc bản đồ <span style="margin-left:auto;color:var(--muted)" id="farr">▾</span></div>
  <div class="bd" id="fbd">
    <label><input type="checkbox" data-l="nha" checked /> Khối nhà 3D</label>
    <label><input type="checkbox" data-l="sat" checked /> Ảnh vệ tinh</label>
    <label><input type="checkbox" data-l="phuong" checked /> Ranh phường, xã</label>
    <label><input type="checkbox" data-l="duong" checked /> Đường phố</label>
    <label><input type="checkbox" data-l="duan" checked /> Dự án bất động sản</label>
    <label><input type="checkbox" data-l="bieutuong" checked /> Công trình biểu tượng</label>
    <label><input type="checkbox" data-l="diahinh" checked /> Địa hình 3D</label>
  </div>
</div>
<div class="panel tour" id="tour"><h4>Tham quan</h4></div>
<div class="panel card" id="card"><button class="x" id="cx" aria-label="Đóng">✕</button><div id="cbody"></div></div>
<div class="toast" id="toast"></div>
<footer class="status"><b id="stArea">Đà Nẵng</b><span class="zoomtxt" id="stZoom">Zoom 12</span><span>Khối nhà gần đúng · chi tiết thích nghi</span><span class="src">Copernicus/AWS Terrain · Overture · OpenStreetMap · Esri</span></footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="../da-nang-3d/projects.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { makeTower408, makeGalaxy } from '../song-han-3d/thap408.js';
import { addBridges } from '../song-han-3d/cau.js';
const $ = (id) => document.getElementById(id);
const HOTLINE = '0904567009';
const toast = (t) => { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (e.style.display = 'none'), 2600); };

const proto = new pmtiles.Protocol(); maplibregl.addProtocol('pmtiles', proto.tile);
const PALETTE = ['#4c7cb8', '#3f9c8a', '#a87c3f', '#8b62b0', '#b85c6e', '#5d9c4a', '#c08a3a', '#4a8fb0', '#9a6b5a', '#6a74c4'];

// ---- dự án: khối 3D tô vàng từ projects.js (cùng toạ độ & mô hình với Đà Nẵng 3D) ----
function projectBlocks() {
  const F = [];
  const kz = 110600;
  for (const P of window.PROJECTS_DATA || []) {
    const M = P.model; if (!M) continue;
    const ang = M.rot ?? 0, c = Math.cos(ang), s = Math.sin(ang), kx = 111320 * Math.cos(P.lat * Math.PI / 180);
    const W = (px, pz) => { const dx = px * c - pz * s, dz = px * s + pz * c; return [P.lon + dx / kx, P.lat - dz / kz]; };
    const rect = (px, pz, w, d) => [[W(px - w / 2, pz - d / 2), W(px + w / 2, pz - d / 2), W(px + w / 2, pz + d / 2), W(px - w / 2, pz + d / 2), W(px - w / 2, pz - d / 2)]];
    for (const [px, pz, w, d, h] of M.podiums || []) F.push({ type: 'Feature', properties: { h, b: 0, k: 'pod', p: P.name }, geometry: { type: 'Polygon', coordinates: rect(px, pz, w, d) } });
    for (const T of M.towers || []) { const [px, pz, w, d, fl, fh = 3.4, base = 0] = T; F.push({ type: 'Feature', properties: { h: base + fl * fh, b: base, k: 'tow', p: P.name }, geometry: { type: 'Polygon', coordinates: rect(px, pz, w, d) } }); }
    for (const [px, pz, r, h] of M.domes || []) { const ring = []; for (let i = 0; i <= 24; i++) { const a = i / 24 * Math.PI * 2; ring.push(W(px + Math.cos(a) * r, pz + Math.sin(a) * r)); } F.push({ type: 'Feature', properties: { h, b: 0, k: 'dome', p: P.name }, geometry: { type: 'Polygon', coordinates: [ring] } }); }
  }
  return { type: 'FeatureCollection', features: F };
}

const map = new maplibregl.Map({
  container: 'map', center: [108.215, 16.045], zoom: 12.3, pitch: 58, bearing: -18, maxPitch: 80, hash: true, attributionControl: false,
  style: {
    version: 8, glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources: {
      ofm: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' },
      sat: { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, maxzoom: 19, attribution: '© Esri' },
      dem: { type: 'raster-dem', tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], encoding: 'terrarium', tileSize: 256, maxzoom: 14 },
      demh: { type: 'raster-dem', tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], encoding: 'terrarium', tileSize: 256, maxzoom: 14 },
      b: { type: 'vector', url: 'pmtiles://data/buildings.pmtiles' },
      prj: { type: 'geojson', data: projectBlocks() },
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#16202e' } },
      { id: 'water0', type: 'fill', source: 'ofm', 'source-layer': 'water', paint: { 'fill-color': '#1f4a68' } },
      { id: 'sat', type: 'raster', source: 'sat', paint: { 'raster-opacity': 0.9, 'raster-saturation': -0.25, 'raster-brightness-max': 0.82, 'raster-contrast': 0.05 } },
      { id: 'water', type: 'fill', source: 'ofm', 'source-layer': 'water', paint: { 'fill-color': '#2a6d97', 'fill-opacity': 0.35 } },
      { id: 'hill', type: 'hillshade', source: 'demh', paint: { 'hillshade-exaggeration': 0.35, 'hillshade-shadow-color': '#0b1220' } },
      { id: 'road-minor', type: 'line', source: 'ofm', 'source-layer': 'transportation', minzoom: 13, filter: ['in', ['get', 'class'], ['literal', ['minor', 'service', 'street']]], paint: { 'line-color': '#c9d2de', 'line-opacity': 0.35, 'line-width': ['interpolate', ['linear'], ['zoom'], 13, 0.4, 17, 4] } },
      { id: 'road-major', type: 'line', source: 'ofm', 'source-layer': 'transportation', filter: ['in', ['get', 'class'], ['literal', ['motorway', 'trunk', 'primary', 'secondary', 'tertiary']]], paint: { 'line-color': '#e6ecf4', 'line-opacity': 0.6, 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 0.6, 17, 10] } },
      { id: 'b3d', type: 'fill-extrusion', source: 'b', 'source-layer': 'b', minzoom: 12,
        paint: { 'fill-extrusion-height': ['get', 'h'], 'fill-extrusion-base': 0, 'fill-extrusion-vertical-gradient': true, 'fill-extrusion-opacity': 0.96,
          'fill-extrusion-color': ['case', ['has', 'n'], '#7fa6d8', ['interpolate', ['linear'], ['get', 'h'], 4, '#e8d9bf', 14, '#e9e2d4', 30, '#d9dfe8', 80, '#b9c8dc']] } },
      { id: 'prj3d', type: 'fill-extrusion', source: 'prj', paint: { 'fill-extrusion-height': ['get', 'h'], 'fill-extrusion-base': ['get', 'b'], 'fill-extrusion-opacity': 0.97,
          'fill-extrusion-color': ['match', ['get', 'k'], 'pod', '#d9b46a', 'dome', '#f0c26a', '#e3c37f'], 'fill-extrusion-vertical-gradient': true } },
      { id: 'blbl', type: 'symbol', source: 'b', 'source-layer': 'b', minzoom: 15, filter: ['has', 'n'], layout: { 'text-field': ['get', 'n'], 'text-font': ['Noto Sans Regular'], 'text-size': 11, 'text-offset': [0, -1] },
        paint: { 'text-color': '#f0c26a', 'text-halo-color': '#0b1220', 'text-halo-width': 1.5 } },
    ],
  },
});
map.addControl(new maplibregl.ScaleControl({ maxWidth: 110, unit: 'metric' }), 'bottom-left');
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

// ---- công trình biểu tượng dựng bằng three.js (tháp 408 m, Sun Galaxy, các cầu sông Hàn) ----
const O = [16.0515, 108.228];                      // gốc toạ độ giống Sông Hàn 3D
const LL = (lat, lon) => [(lon - O[1]) * 106980.03, -(lat - O[0]) * 110600];
const icons = {
  id: 'bieutuong', type: 'custom', renderingMode: '3d',
  onAdd(m, gl) {
    this.cam = new THREE.Camera(); this.scene = new THREE.Scene();
    this.scene.add(new THREE.HemisphereLight(0xf2f6ff, 0x8a7f6a, 3.2)); const sun = new THREE.DirectionalLight(0xfff0d6, 3.2); sun.position.set(-300, 600, 400); this.scene.add(sun);
    const T = makeTower408(THREE), t = LL(16.03866, 108.23323); T.group.position.set(t[0], 0, t[1]); T.group.rotation.y = 0.217; this.scene.add(T.group);
    const G = makeGalaxy(THREE); const g = LL(16.04315, 108.2376); G.group.position.set(g[0], 0, g[1]); G.group.rotation.y = -1.36; this.scene.add(G.group);
    this.B = addBridges(THREE, this.scene, LL); this.nights = [T, G, this.B];
    const o = maplibregl.MercatorCoordinate.fromLngLat([O[1], O[0]], 0), s = o.meterInMercatorCoordinateUnits();
    this.l = new THREE.Matrix4().makeTranslation(o.x, o.y, o.z).scale(new THREE.Vector3(s, -s, s)).multiply(new THREE.Matrix4().makeRotationX(Math.PI / 2));
    this.r = new THREE.WebGLRenderer({ canvas: m.getCanvas(), context: gl, antialias: true }); this.r.autoClear = false;
  },
  render(gl, args) {
    const m = new THREE.Matrix4().fromArray(args.defaultProjectionData ? args.defaultProjectionData.mainMatrix : args);
    this.cam.projectionMatrix = m.multiply(this.l); this.r.resetState(); this.r.render(this.scene, this.cam);
  },
};

// ---- ranh phường ----
let WARDS = [], LEVEL = '6';
function centroid(g) { const r = g.type === 'Polygon' ? g.coordinates[0] : g.coordinates.reduce((a, p) => (p[0].length > a.length ? p[0] : a), []); let x = 0, y = 0; r.forEach((p) => { x += p[0]; y += p[1]; }); return [x / r.length, y / r.length]; }
function areaKm2(g) { const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates; let A = 0; for (const p of polys) { const r = p[0], k = 111.32 * Math.cos(r[0][1] * Math.PI / 180); let a = 0; for (let i = 0; i < r.length - 1; i++) a += r[i][0] * k * r[i + 1][1] * 110.6 - r[i + 1][0] * k * r[i][1] * 110.6; A += Math.abs(a) / 2; } return A; }
function inPoly(pt, g) { const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates; for (const p of polys) { const r = p[0]; let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { if ((r[i][1] > pt[1]) !== (r[j][1] > pt[1]) && pt[0] < (r[j][0] - r[i][0]) * (pt[1] - r[i][1]) / (r[j][1] - r[i][1]) + r[i][0]) c = !c; } if (c) return true; } return false; }

let PROJ = [];
let inited = false;
map.on('style.load', async () => { if (inited) return; inited = true;
  map.setTerrain({ source: 'dem', exaggeration: 1.5 });
  map.addLayer(icons);
  try {
    const wg = await (await fetch('data/phuong.geojson')).json();
    const lv = {}; wg.features.forEach((f) => (lv[f.properties.lv] = (lv[f.properties.lv] || 0) + 1));
    LEVEL = (lv['6'] || 0) >= (lv['8'] || 0) ? '6' : '8';     // sau sáp nhập 2025 phường/xã thường là cấp 6 trên OSM
    const DN = wg.features.find((f) => f.properties.lv === '4' && /Đà Nẵng/.test(f.properties.name));
    WARDS = wg.features.filter((f) => f.properties.lv === LEVEL && /^(Phường|Xã|Đặc khu)/.test(f.properties.name) && (!DN || inPoly(centroid(f.geometry), DN.geometry)));
    WARDS.forEach((f, i) => { f.id = i; f.properties.col = PALETTE[i % PALETTE.length]; f.properties.km2 = +areaKm2(f.geometry).toFixed(2); });
    map.addSource('w', { type: 'geojson', data: { type: 'FeatureCollection', features: WARDS } });
    map.addSource('wl', { type: 'geojson', data: { type: 'FeatureCollection', features: WARDS.map((f) => ({ type: 'Feature', properties: { name: f.properties.name.replace(/^Phường /, 'Phường ') }, geometry: { type: 'Point', coordinates: centroid(f.geometry) } })) } });
    map.addLayer({ id: 'w-fill', type: 'fill', source: 'w', paint: { 'fill-color': ['get', 'col'], 'fill-opacity': ['case', ['boolean', ['feature-state', 'sel'], false], 0.38, 0.2] } }, 'hill');
    map.addLayer({ id: 'w-line', type: 'line', source: 'w', paint: { 'line-color': '#dfe8f5', 'line-opacity': 0.55, 'line-width': ['case', ['boolean', ['feature-state', 'sel'], false], 2.4, 0.9] } }, 'b3d');
    map.addLayer({ id: 'w-lbl', type: 'symbol', source: 'wl', maxzoom: 15, layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'], 'text-size': ['interpolate', ['linear'], ['zoom'], 10, 11, 14, 14], 'text-allow-overlap': false },
      paint: { 'text-color': '#ffffff', 'text-halo-color': '#0b1220', 'text-halo-width': 1.6 } });
  } catch (e) { console.warn('chưa có ranh phường', e); }
  try {
    const pg = await (await fetch('../du-an-da-nang/du-an-da-nang.geojson')).json();
    PROJ = pg.features.map((f) => ({ ...f, properties: { ...f.properties }, geometry: f.geometry.type === 'Point' ? f.geometry : { type: 'Point', coordinates: centroid(f.geometry) } }));
    map.addSource('dp', { type: 'geojson', data: { type: 'FeatureCollection', features: PROJ } });
    map.addLayer({ id: 'dp-dot', type: 'circle', source: 'dp', paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 4, 15, 8], 'circle-color': ['match', ['get', 'grp'], 'ban', '#ff5a52', '#f2a33a'], 'circle-stroke-color': '#fff', 'circle-stroke-width': 1.5, 'circle-pitch-alignment': 'viewport' } });
    map.addLayer({ id: 'dp-lbl', type: 'symbol', source: 'dp', layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'], 'text-size': 12, 'text-offset': [0, -1.3], 'text-anchor': 'bottom', 'text-allow-overlap': false },
      paint: { 'text-color': '#ffd98f', 'text-halo-color': '#0b1220', 'text-halo-width': 1.8 } });
  } catch (e) { console.warn('chưa có dự án', e); }
  $('load').style.display = 'none';
  upd();
});
map.on('error', (e) => console.warn(e && e.error && e.error.message));
setTimeout(() => ($('load').style.display = 'none'), 12000);

// ---- trạng thái, chọn phường ----
let selW = null;
function wardAt(ll) { return WARDS.find((f) => inPoly(ll, f.geometry)); }
function upd() { const c = map.getCenter(), w = wardAt([c.lng, c.lat]); $('stArea').textContent = w ? w.properties.name : 'Đà Nẵng'; $('stZoom').textContent = 'Zoom ' + map.getZoom().toFixed(1); }
map.on('moveend', upd);
function selectWard(f) {
  if (selW !== null) map.setFeatureState({ source: 'w', id: selW }, { sel: false });
  selW = f.id; map.setFeatureState({ source: 'w', id: f.id }, { sel: true });
  const prj = PROJ.filter((p) => inPoly(p.geometry.coordinates, f.geometry));
  $('crumb').textContent = 'Đà Nẵng · ' + f.properties.name + ' · 3D';
  $('cbody').innerHTML = `<h4>Địa bàn</h4><h3></h3><div class="sub">Đơn vị hành chính sau sắp xếp 2025 · ranh theo OpenStreetMap</div>
    <div class="kpis"><div class="kpi"><span>Diện tích (đo theo ranh)</span><b>${f.properties.km2.toLocaleString('vi-VN')} km²</b></div><div class="kpi"><span>Dự án đang theo dõi</span><b>${prj.length}</b></div>
    <div class="kpi"><span>Dân số</span><b>${f.properties.pop ? (+f.properties.pop).toLocaleString('vi-VN') : '—'}</b></div><div class="kpi"><span>Mã ĐVHC</span><b>${f.properties.ref || '—'}</b></div></div>
    <div id="wprj"></div><div class="note">Dân số lấy từ OSM nếu có; "—" là chưa có dữ liệu.</div>`;
  $('cbody').querySelector('h3').textContent = f.properties.name;
  const box = $('wprj'); prj.forEach((p) => { const r = document.createElement('div'); r.className = 'row'; r.style.cursor = 'pointer'; r.innerHTML = '<span></span><small></small>'; r.firstChild.textContent = p.properties.name; r.lastChild.textContent = [p.properties.scale, p.properties.price].filter(Boolean).join(' · '); r.onclick = () => showProject(p); box.appendChild(r); });
  $('card').style.display = 'block';
  const b = new maplibregl.LngLatBounds(); (f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates).forEach((p) => p[0].forEach((q) => b.extend(q)));
  map.fitBounds(b, { padding: 60, pitch: 55, duration: 1400 });
}
function showProject(p) {
  const q = p.properties, [lon, lat] = p.geometry.coordinates;
  $('cbody').innerHTML = `<h4>Dự án</h4><h3></h3><div class="sub"></div><div id="prow"></div>
    <div class="acts"><a href="tel:${HOTLINE}">📞 Gọi tư vấn</a><a class="alt" href="https://zalo.me/${HOTLINE}" target="_blank" rel="noopener">Zalo</a></div><div class="acts" id="plinks"></div>`;
  $('cbody').querySelector('h3').textContent = q.name; $('cbody').querySelector('.sub').textContent = q.area || '';
  for (const [k, v] of [['Quy mô', q.scale], ['Giá tham khảo', q.price], ['Điểm nổi bật', q.headline]]) if (v) { const r = document.createElement('div'); r.className = 'row'; r.innerHTML = '<small></small><span></span>'; r.firstChild.textContent = k; r.lastChild.textContent = v; $('prow').appendChild(r); }
  if (q.url) { const a = document.createElement('a'); a.className = 'alt'; a.href = q.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '🌐 Trang dự án'; $('plinks').appendChild(a); }
  $('card').style.display = 'block';
  map.flyTo({ center: [lon, lat], zoom: 16.2, pitch: 62, duration: 1600 });
}
map.on('click', (e) => {
  const hit = map.queryRenderedFeatures(e.point, { layers: ['dp-dot', 'dp-lbl'].filter((l) => map.getLayer(l)) });
  if (hit.length) { const p = PROJ.find((x) => x.properties.name === hit[0].properties.name); if (p) return showProject(p); }
  const w = wardAt([e.lngLat.lng, e.lngLat.lat]); if (w && map.getLayer('w-fill') && map.getLayoutProperty('w-fill', 'visibility') !== 'none') selectWard(w);
});
$('cx').onclick = () => { $('card').style.display = 'none'; };

// ---- lọc lớp ----
const LAYERS = { nha: ['b3d', 'blbl'], sat: ['sat'], phuong: ['w-fill', 'w-line', 'w-lbl'], duong: ['road-minor', 'road-major'], duan: ['dp-dot', 'dp-lbl', 'prj3d'], bieutuong: ['bieutuong'] };
document.querySelectorAll('#fbd input').forEach((i) => (i.onchange = () => {
  if (i.dataset.l === 'diahinh') return map.setTerrain(i.checked ? { source: 'dem', exaggeration: 1.5 } : null);
  (LAYERS[i.dataset.l] || []).forEach((l) => map.getLayer(l) && map.setLayoutProperty(l, 'visibility', i.checked ? 'visible' : 'none'));
}));
$('fhd').onclick = () => { const b = $('fbd'); b.style.display = b.style.display === 'none' ? '' : 'none'; $('farr').textContent = b.style.display === 'none' ? '▸' : '▾'; };
if (innerWidth < 640) $('fhd').onclick();
$('lblBtn').onclick = () => { const on = !$('lblBtn').classList.toggle('on') ? 'none' : 'visible'; ['w-lbl', 'dp-lbl', 'blbl'].forEach((l) => map.getLayer(l) && map.setLayoutProperty(l, 'visibility', on)); };
$('fsBtn').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());

// ---- tham quan ----
const TOUR = [
  ['🏙 Toàn cảnh Đà Nẵng', { center: [108.215, 16.045], zoom: 12.3, pitch: 58, bearing: -18 }],
  ['🌉 Trung tâm sông Hàn', { center: [108.2265, 16.0585], zoom: 15.4, pitch: 64, bearing: 20 }],
  ['🏗 Da Nang Downtown – tháp 408 m', { center: [108.2318, 16.0405], zoom: 15.6, pitch: 68, bearing: -60 }],
  ['🏢 Hòa Xuân – Cora, Spana, S-Light', { center: [108.2295, 16.0205], zoom: 15.2, pitch: 62, bearing: 10 }],
  ['⛰ Bán đảo Sơn Trà', { center: [108.268, 16.112], zoom: 12.6, pitch: 70, bearing: 160 }],
  ['🏖 Biển Mỹ Khê – Ngũ Hành Sơn', { center: [108.255, 16.02], zoom: 13.6, pitch: 66, bearing: -30 }],
  ['🏮 Hội An', { center: [108.33, 15.877], zoom: 14.4, pitch: 60, bearing: 0 }],
  ['🛣 Đèo Hải Vân', { center: [108.15, 16.19], zoom: 12.2, pitch: 70, bearing: 200 }],
];
TOUR.forEach(([t, v]) => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => { map.flyTo({ ...v, duration: 2200 }); if (innerWidth < 640) $('tour').style.display = 'none'; }; $('tour').appendChild(b); });

// ---- thanh trái ----
document.querySelectorAll('#rail button').forEach((b) => (b.onclick = () => {
  document.querySelectorAll('#rail button').forEach((x) => x.classList.toggle('on', x === b));
  const m = b.dataset.m; $('tour').style.display = m === 'thamquan' ? 'block' : 'none';
  if (m === 'khuvuc') { if (!WARDS.length) return toast('Đang tải ranh phường…'); toast('Bấm vào một phường trên bản đồ để xem địa bàn'); map.flyTo({ center: [108.215, 16.045], zoom: 11.6, pitch: 45, bearing: 0, duration: 1500 }); }
  else if (m === 'dieuhanh') { $('card').style.display = 'none'; }
  else if (m !== 'thamquan') toast('Phần này đang được xây dựng (bước tiếp theo)');
}));
$('dashBtn').onclick = () => toast('Dashboard đang được xây dựng (bước tiếp theo)');

// ---- tìm kiếm ----
$('q').oninput = () => {
  const s = $('q').value.trim().toLowerCase(), box = $('res'); box.innerHTML = '';
  if (s.length < 2) return (box.style.display = 'none');
  const items = [...WARDS.map((f) => [f.properties.name, 'Phường/xã', () => selectWard(f)]), ...PROJ.map((p) => [p.properties.name, 'Dự án', () => showProject(p)]), ...TOUR.map(([t, v]) => [t.replace(/^\S+ /, ''), 'Địa điểm', () => map.flyTo({ ...v, duration: 2000 })])]
    .filter(([n]) => n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').includes(s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd'))).slice(0, 12);
  items.forEach(([n, k, fn]) => { const b = document.createElement('button'); b.innerHTML = '<span></span><small></small>'; b.firstChild.textContent = n; b.lastChild.textContent = k; b.onclick = () => { box.style.display = 'none'; $('q').value = ''; fn(); }; box.appendChild(b); });
  box.style.display = items.length ? 'block' : 'none';
};
window.ecity = { map };
</script>
</body>
</html>
