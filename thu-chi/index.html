<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thu Chi Mẹ Vân</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#f0eee9; --border:#e2dfd8;
  --text:#1f2328; --muted:#6b6f76; --accent:#b4232a; --accent-soft:#fbe9ea;
  --thu:#1a7f4b; --thu-soft:#e3f4ea; --chi:#c0392b; --chi-soft:#fbe8e5;
  --warn:#b26a00; --warn-soft:#fff3dc; --info:#2457a6; --info-soft:#e6eefb;
  --hl:#fff36b; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --surface:#1e2125; --surface-2:#262a2f; --border:#33383e;
    --text:#e8e9eb; --muted:#9aa0a8; --accent:#ff6b6b; --accent-soft:#3a2224;
    --thu:#4cc38a; --thu-soft:#1d3329; --chi:#ff7a6b; --chi-soft:#3a2420;
    --warn:#f0b04a; --warn-soft:#3a2f1a; --info:#7aa7ff; --info-soft:#1e2a40;
    --hl:#5c5520; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1e2125; --surface-2:#262a2f; --border:#33383e;
  --text:#e8e9eb; --muted:#9aa0a8; --accent:#ff6b6b; --accent-soft:#3a2224;
  --thu:#4cc38a; --thu-soft:#1d3329; --chi:#ff7a6b; --chi-soft:#3a2420;
  --warn:#f0b04a; --warn-soft:#3a2f1a; --info:#7aa7ff; --info-soft:#1e2a40;
  --hl:#5c5520; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0}
.top h1{font-size:20px;margin:0;color:var(--accent);letter-spacing:.2px;flex:1 1 auto}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:2px}
.month b{min-width:112px;text-align:center}
.iconbtn{border:0;background:transparent;cursor:pointer;padding:6px 10px;border-radius:8px}
.iconbtn:hover{background:var(--surface-2)}
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.thu{background:var(--thu);border-color:var(--thu);color:#fff}
.btn.chi{background:var(--chi);border-color:var(--chi);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--muted);white-space:nowrap}
nav.tabs button.on{background:var(--text);color:var(--bg)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:16px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .lbl{color:var(--muted);font-size:13px}
.kpi .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
.pos{color:var(--thu)} .neg{color:var(--chi)}
.two{grid-template-columns:1fr 1fr} .three{grid-template-columns:2fr 1fr}
@media (max-width:820px){.two,.three{grid-template-columns:1fr}}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;font-weight:600}
tr.sec td{background:var(--hl);font-weight:700}
tr.total td{font-weight:700;border-top:2px solid var(--text)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--surface-2);white-space:nowrap}
.pill.thu{background:var(--thu-soft);color:var(--thu)}
.pill.chi{background:var(--chi-soft);color:var(--chi)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.done{background:var(--thu-soft);color:var(--thu)}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--thu)}
.bar>i.warn{background:var(--warn)} .bar>i.over{background:var(--chi)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin-bottom:10px}
.catrow .bar{grid-column:1/-1}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);min-width:0}
.filters input[type=search]{flex:1 1 200px}
.list .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.list .item:last-child{border-bottom:0}
.list .item .main{flex:1;min-width:0}
.list .item .name{font-weight:600;overflow-wrap:anywhere}
.datebox{width:46px;text-align:center;border-radius:10px;background:var(--surface-2);padding:4px 0;flex:none}
.datebox b{display:block;font-size:17px;line-height:1.1}
.datebox span{font-size:11px;color:var(--muted)}
.datebox.over{background:var(--chi-soft);color:var(--chi)} .datebox.soon{background:var(--warn-soft);color:var(--warn)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.alert{padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.bad{background:var(--chi-soft);color:var(--chi)} .alert.ok{background:var(--thu-soft);color:var(--thu)}
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--text);width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(980px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.dlg-b{padding:16px;display:grid;gap:12px;max-height:70vh;overflow:auto}
.dlg-f{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.trend svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.report h2{text-align:center;color:var(--accent);margin:4px 0 12px;font-size:22px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.addbtns{display:flex;gap:8px}
.fab{display:none}
@media (max-width:640px){
  .top .addbtns{display:none}
  .fab{display:flex;position:fixed;right:16px;bottom:16px;gap:8px;z-index:30}
  .fab .btn{box-shadow:0 6px 18px rgba(0,0,0,.25);padding:12px 16px}
  .kpi .val{font-size:19px}
  .hide-sm{display:none}
  th,td{padding:7px 5px}
}
@media print{
  header,.fab,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card{border:0;box-shadow:none}
}
</style>
</head>

<main class="wrap" id="view"></main>

<script>
// Hiện lỗi lên màn hình (để chụp gửi hỗ trợ)
window.addEventListener('error', function (e) {
  var d = document.getElementById('fatal') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'fatal' }));
  d.style.cssText = 'margin:16px;padding:12px;border-radius:10px;background:#fbe8e5;color:#c0392b;font:13px/1.4 monospace;white-space:pre-wrap';
  d.textContent += 'Lỗi: ' + (e.message || e) + (e.lineno ? ' (dòng ' + e.lineno + ':' + e.colno + ')' : '') + '\n';
});
</script>
<script>
/* ============ Tiện ích ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n || 0).toLocaleString('en-US');
const fmtS = n => (n < 0 ? '(' + fmt(-n) + ')' : fmt(n));
const fmtShort = n => {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + ' tỷ';
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'tr';
  if (a >= 1e3) return Math.round(n / 1e3) + 'k';
  return String(n);
};
// "3tr", "3.5tr", "500k", "1ty", "3,000,000" -> số
function parseMoney(s) {
  s = String(s || '').trim().toLowerCase().replace(/\s/g, '');
  if (!s) return 0;
  const m = s.match(/^([\d.,]+)(tr|triệu|trieu|m|k|nghìn|nghin|ngàn|ty|tỷ|tỉ)?$/);
  if (!m) return Number(s.replace(/[^\d]/g, '')) || 0;
  const unit = m[2] || '';
  let num = m[1];
  if (unit) num = Number(num.replace(',', '.'));
  else num = Number(num.replace(/[.,]/g, ''));
  const mul = /^(tr|triệu|trieu|m)$/.test(unit) ? 1e6 : /^(k|nghìn|nghin|ngàn)$/.test(unit) ? 1e3 : /^(ty|tỷ|tỉ)$/.test(unit) ? 1e9 : 1;
  return Math.round(num * mul) || 0;
}
const today = (() => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; })();
const monthOf = d => d.slice(0, 7);
const monthLabel = m => `Tháng ${Number(m.slice(5))}/${m.slice(0, 4)}`;
const addMonth = (m, k) => { let [y, mo] = m.split('-').map(Number); mo += k; while (mo > 12) { mo -= 12; y++; } while (mo < 1) { mo += 12; y--; } return `${y}-${pad(mo)}`; };
const daysIn = m => new Date(Number(m.slice(0, 4)), Number(m.slice(5)), 0).getDate();
const dayDiff = (a, b) => Math.round((Date.UTC(...b.split('-').map((v, i) => i === 1 ? v - 1 : +v)) - Date.UTC(...a.split('-').map((v, i) => i === 1 ? v - 1 : +v))) / 864e5);
const ddmm = d => `${d.slice(8)}/${d.slice(5, 7)}`;
const ddmmyyyy = d => `${d.slice(8)}/${d.slice(5, 7)}/${d.slice(0, 4)}`;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }

/* ============ Dữ liệu mẫu (từ bảng Thu chi tháng 8/2026) ============ */
const SEED_CATS = [
  { id: 'luong', name: 'Lương & hoa hồng', kind: 'thu' },
  { id: 'thu_khac', name: 'Thu khác / hoàn phí', kind: 'thu' },
  { id: 'an_uong', name: 'Ăn uống & đi chợ', kind: 'chi' },
  { id: 'lai_vay', name: 'Lãi vay căn hộ FPT', kind: 'chi' },
  { id: 'dong_nha', name: 'Đóng tiền căn hộ (theo đợt)', kind: 'chi' },
  { id: 'bao_hiem', name: 'Bảo hiểm (BHXH)', kind: 'chi' },
  { id: 'con', name: 'Con cái (Mon)', kind: 'chi' },
  { id: 'di_lai', name: 'Xăng xe & gửi xe', kind: 'chi' },
  { id: 'hoa_don', name: 'Điện, nước, điện thoại', kind: 'chi' },
  { id: 'mua_sam', name: 'Mua sắm cá nhân', kind: 'chi' },
  { id: 'gia_dung', name: 'Đồ gia dụng & trả góp', kind: 'chi' },
  { id: 'hieu_hi', name: 'Hiếu hỉ, sinh nhật, cúng lễ', kind: 'chi' },
  { id: 'giao_luu', name: 'Giao lưu, ăn nhậu', kind: 'chi' },
  { id: 'y_te', name: 'Thuốc & sức khỏe', kind: 'chi' },
  { id: 'cong_viec', name: 'Công việc & marketing', kind: 'chi' },
  { id: 'khac', name: 'Chi khác', kind: 'chi' },
];
function seedState() {
  let n = 0;
  const T = (date, type, group, cat, desc, amount) => ({ id: 's' + (++n), date, type, group, cat, desc, amount });
  const tx = [
    T('2026-08-05', 'thu', 'co_dinh', 'luong', 'Lương ck + hoa hồng', 54000000),
    T('2026-08-05', 'thu', 'co_dinh', 'luong', 'Lương vk + lãi làm thẻ + vé máy bay', 40851000),
    T('2026-08-05', 'chi', 'co_dinh', 'an_uong', 'Chợ + gas', 3000000),
    T('2026-08-05', 'chi', 'co_dinh', 'lai_vay', 'Lãi căn hộ FPT T8', 8014000),
    T('2026-08-05', 'chi', 'co_dinh', 'bao_hiem', 'BHXH T8', 1540000),
    T('2026-08-05', 'chi', 'co_dinh', 'con', 'Học Mon', 1505000),
    T('2026-08-05', 'chi', 'co_dinh', 'con', 'Sữa Mon', 562000),
    T('2026-08-05', 'chi', 'co_dinh', 'an_uong', 'Ăn', 3556000),
    T('2026-08-05', 'chi', 'co_dinh', 'hoa_don', 'Card', 240000),
    T('2026-08-05', 'chi', 'co_dinh', 'di_lai', 'Xăng ô tô + xe máy', 493000),
    T('2026-08-05', 'chi', 'co_dinh', 'hoa_don', 'Điện', 1714000),
    T('2026-08-05', 'chi', 'co_dinh', 'di_lai', 'Bãi xe T8', 800000),
    T('2026-08-05', 'chi', 'phat_sinh', 'giao_luu', 'Nhậu Thùy + A Phụng', 1168000),
    T('2026-08-05', 'chi', 'phat_sinh', 'mua_sam', 'Đồ ck + đồ Mon + đồ vk', 3277000),
    T('2026-08-05', 'chi', 'phat_sinh', 'hieu_hi', 'Cúng + chùa + Đám ma ông Đen + đồ cúng', 947000),
    T('2026-08-05', 'chi', 'phat_sinh', 'cong_viec', 'Dán kính + cpn vp', 743000),
    T('2026-08-05', 'chi', 'phat_sinh', 'hieu_hi', 'SN Sơ Ri + SN vk + đi núi thần tài', 7612000),
    T('2026-08-05', 'chi', 'phat_sinh', 'mua_sam', 'Vỏ máy ảnh, ốp ipad', 405000),
    T('2026-08-12', 'chi', 'phat_sinh', 'dong_nha', 'Đóng tiền FPT đợt 3', 83056000),
    T('2026-08-12', 'thu', 'phat_sinh', 'thu_khac', 'Hoàn phí thường niên VIB', 1299000),
    T('2026-08-16', 'chi', 'phat_sinh', 'gia_dung', 'Góp tủ lạnh T2', 500000),
    T('2026-08-16', 'chi', 'phat_sinh', 'mua_sam', 'Kem cn, son, kem dưỡng', 800000),
    T('2026-08-16', 'chi', 'phat_sinh', 'y_te', 'Thuốc', 231000),
    T('2026-08-16', 'chi', 'phat_sinh', 'gia_dung', 'Ra gối mền', 2779000),
    T('2026-08-31', 'chi', 'phat_sinh', 'cong_viec', 'Mkt ck', 1000000),
  ];
  let k = 0;
  const R = (name, type, cat, amount, day, extra = {}) => ({ id: 'r' + (++k), name, type, group: 'co_dinh', cat, amount, day, start: '2026-10', end: '', active: true, ...extra });
  const recurring = [
    R('Lương ck + hoa hồng', 'thu', 'luong', 54000000, 5),
    R('Lương vk + lãi làm thẻ', 'thu', 'luong', 40851000, 5),
    R('Chợ + gas', 'chi', 'an_uong', 3000000, 5),
    R('Lãi căn hộ FPT', 'chi', 'lai_vay', 8014000, 5),
    R('BHXH', 'chi', 'bao_hiem', 1540000, 5),
    R('Học Mon', 'chi', 'con', 1505000, 5),
    R('Sữa Mon', 'chi', 'con', 562000, 5),
    R('Ăn', 'chi', 'an_uong', 3556000, 5),
    R('Card điện thoại', 'chi', 'hoa_don', 240000, 5),
    R('Xăng ô tô + xe máy', 'chi', 'di_lai', 493000, 5),
    R('Điện', 'chi', 'hoa_don', 1714000, 5),
    R('Bãi xe', 'chi', 'di_lai', 800000, 5),
    R('Góp tủ lạnh', 'chi', 'gia_dung', 500000, 16, { group: 'phat_sinh', note: 'Kỳ T2 đã đóng 16/08/2026' }),
  ];
  const budgets = { default: {
    an_uong: 7000000, lai_vay: 8100000, bao_hiem: 1540000, con: 2500000, di_lai: 1400000,
    hoa_don: 2100000, mua_sam: 2500000, gia_dung: 1000000, hieu_hi: 2000000, giao_luu: 1000000,
    y_te: 500000, cong_viec: 1500000, khac: 1000000,
  }, months: {} };
  return { v: 2, categories: SEED_CATS.map(c => ({ ...c })), tx, recurring, plans: [], skips: {}, budgets, deleted: {}, meta: {}, log: [] };
}

/* ============ Lưu trữ ============ */
const KEY = 'thuchi-me-van-v1';
let S;
function normalize(d) {
  d = d || {};
  for (const c of ['categories', 'tx', 'recurring', 'plans', 'log']) d[c] = Array.isArray(d[c]) ? d[c] : [];
  d.skips = d.skips || {}; d.deleted = d.deleted || {}; d.meta = d.meta || {};

}
function load() {

/* --- Đánh dấu thay đổi (để gộp dữ liệu giữa các máy) --- */
const now = () => Date.now();
// thêm mới / cập nhật 1 bản ghi theo id (luôn tìm lại trong S hiện tại vì dữ liệu có thể vừa được đồng bộ)
function upsert(col, rec) {
  rec.u = now();
  const i = S[col].findIndex(x => x.id === rec.id);
  if (i >= 0) S[col][i] = { ...S[col][i], ...rec }; else S[col].push(rec);
  return S[col].find(x => x.id === rec.id);
}
function remove(col, id) { S[col] = S[col].filter(x => x.id !== id); S.deleted[id] = now(); }
const touch = k => { S.meta[k] = now(); };
function setBudget(scope, catId, n) {
  const target = scope === 'default' ? S.budgets.default : (S.budgets.months[scope] ||= {});
  if (n == null) delete target[catId]; else target[catId] = n;
  touch(scope === 'default' ? `b:default:${catId}` : `b:m:${scope}:${catId}`);
}
function setSkip(key, on) { if (on) S.skips[key] = true; else delete S.skips[key]; touch('s:' + key); }

/* --- Gộp 2 bản dữ liệu: bản ghi nào sửa sau thì thắng, có ghi nhớ khoản đã xóa --- */
function flatMeta(s) {
  const f = {};
  for (const [c, v] of Object.entries(s.budgets?.default || {})) f['b:default:' + c] = v;
  for (const [m, o] of Object.entries(s.budgets?.months || {})) for (const [c, v] of Object.entries(o || {})) f[`b:m:${m}:${c}`] = v;
  for (const [k, v] of Object.entries(s.skips || {})) if (v) f['s:' + k] = true;
  return f;
}
function mergeState(a, b) {
  a = normalize(a); b = normalize(b);
  const out = normalize({});
  for (const s of [a, b]) for (const [id, t] of Object.entries(s.deleted)) out.deleted[id] = Math.max(out.deleted[id] || 0, t);
  for (const col of ['categories', 'tx', 'recurring', 'plans', 'log']) {
    const map = new Map();
    for (const s of [a, b]) for (const r of s[col]) { const cur = map.get(r.id); if (!cur || (r.u || 0) > (cur.u || 0)) map.set(r.id, r); }
    out[col] = [...map.values()].filter(r => !((out.deleted[r.id] || 0) >= (r.u || 0) && out.deleted[r.id]));
  }
  if (out.log.length > 1000) out.log = out.log.sort((p, q) => p.t - q.t).slice(-1000);
  const fa = flatMeta(a), fb = flatMeta(b);
  for (const k of new Set([...Object.keys(fa), ...Object.keys(fb), ...Object.keys(a.meta), ...Object.keys(b.meta)])) {
    const ta = a.meta[k] || 0, tb = b.meta[k] || 0;
    const src = tb > ta ? fb : ta > tb ? fa : (k in fa ? fa : fb);
    if (ta || tb) out.meta[k] = Math.max(ta, tb);
    if (!(k in src)) continue;
    if (k.startsWith('s:')) out.skips[k.slice(2)] = true;
    else if (k.startsWith('b:default:')) out.budgets.default[k.slice(10)] = src[k];
    else { const [, , m, c] = k.split(':'); (out.budgets.months[m] ||= {})[c] = src[k]; }
  }
  return out;
}
// chuỗi JSON ổn định (sắp xếp khóa & bản ghi) để so sánh 2 bản dữ liệu
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).sort().join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v);
}

/* --- Đồng bộ với Google Sheets (Apps Script) --- */
const SYNC_KEY = KEY + '-sync';
const SY = { cfg: {}, state: 'off', msg: '', last: 0, busy: false, again: false, timer: 0 };
try { SY.cfg = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}'); } catch (e) {}
const injectedUrl = (document.getElementById('syncUrl')?.dataset.url || '');
if (!SY.cfg.url && /^https:\/\//.test(injectedUrl)) SY.cfg.url = injectedUrl;
const saveCfg = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY.cfg)); } catch (e) {} };
const syncOn = () => !!(SY.cfg.url && SY.cfg.key && SY.cfg.linked);

async function api(action, payload = {}, cfg = SY.cfg) {
  let r;
  if (action === 'load') r = await fetch(`${cfg.url}?action=load&key=${encodeURIComponent(cfg.key)}&t=${now()}`);
  else r = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, key: cfg.key, ...payload }) });
  const txt = await r.text();
  try { return JSON.parse(txt); } catch (e) { throw new Error('Địa chỉ đồng bộ không đúng hoặc chưa cấp quyền "Bất kỳ ai"'); }
}
function setSync(state, msg = '') { SY.state = state; SY.msg = msg; paintSync(); }
function paintSync() {
  const el = document.getElementById('syncChip'); if (!el) return;
  const t = SY.last ? new Date(SY.last).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '';
  const map = { off: ['☁ Chưa đồng bộ', ''], syncing: ['⟳ Đang đồng bộ…', 'info'], ok: ['☁ Đã đồng bộ ' + t, 'done'], error: ['⚠ Lỗi đồng bộ', 'warn'], offline: ['⚠ Mất mạng – sẽ đồng bộ lại', 'warn'] };
  const [txt, cls] = map[syncOn() ? SY.state : 'off'];
  el.textContent = txt; el.className = 'pill ' + cls; el.title = SY.msg || '';
  const st = document.getElementById('syncStatus'); if (st) st.textContent = SY.msg ? txt + ' – ' + SY.msg : txt;
}
function scheduleSync() { if (!syncOn()) return; clearTimeout(SY.timer); SY.timer = setTimeout(() => syncNow(), 1200); }
// mode: 'merge' (mặc định) | 'force' (ghi đè máy chủ bằng dữ liệu máy này) | 'remote' (lấy dữ liệu máy chủ)
async function syncNow(mode = 'merge') {
  if (!syncOn()) return;
  if (SY.busy) { SY.again = true; return; }
  SY.busy = true; setSync('syncing');
  try {
    for (let i = 0; i < 4; i++) {
      const res = await api('load');
      if (!res.ok) throw new Error(res.error || 'Lỗi máy chủ');
      const remote = res.data ? normalize(res.data) : null;
      const merged = mode === 'force' || !remote ? S : mode === 'remote' ? remote : mergeState(S, remote);
      if (stable(merged) !== stable(S)) { S = merged; saveLocal(); safeRender(); }
      if (remote && stable(merged) === stable(remote)) break;
      const w = await api('save', { baseRev: res.rev, data: S, force: mode === 'force' });
      if (w.ok) break;
      if (!w.conflict) throw new Error(w.error || 'Không lưu được');
      mode = 'merge'; // máy khác vừa lưu: tải lại rồi gộp tiếp
    }
    SY.last = now(); setSync('ok');
  } catch (e) {
    setSync(navigator.onLine === false ? 'offline' : 'error', e.message);
  } finally {
    SY.busy = false;
    if (SY.again) { SY.again = false; syncNow(); }
  }
}
// không vẽ lại khi đang gõ trong ô nhập (tránh mất chữ), sẽ vẽ lại sau
let pendingRender = false;
function safeRender() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#view') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) { pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !document.activeElement?.closest?.('#view input,#view select')) { pendingRender = false; render(); } }, 50));
setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
window.addEventListener('online', () => syncNow());

/* ============ Truy vấn ============ */
const cat = id => S.categories.find(c => c.id === id) || { id, name: 'Chưa phân loại', kind: 'chi' };
const txOfMonth = m => S.tx.filter(t => monthOf(t.date) === m);
const sum = (arr, f = x => x.amount) => arr.reduce((a, x) => a + (f(x) || 0), 0);
function totals(m) {
  const t = txOfMonth(m);
  const thu = sum(t.filter(x => x.type === 'thu')), chi = sum(t.filter(x => x.type === 'chi'));
  return { thu, chi, ton: thu - chi, t };
}
function budgetFor(m) { return { ...S.budgets.default, ...(S.budgets.months[m] || {}) }; }

// Các khoản dự kiến (cố định hằng tháng + kế hoạch riêng) của 1 tháng
function occurrences(m) {
  const out = [];
  for (const r of S.recurring) {
    if (!r.active || (r.start && m < r.start) || (r.end && m > r.end)) continue;
    const date = `${m}-${pad(Math.min(r.day || 1, daysIn(m)))}`;
    const key = `${m}|${r.id}`;
    const done = S.tx.find(t => t.recId === r.id && monthOf(t.date) === m);
    out.push({ key, kind: 'rec', ref: r, date, name: r.name, type: r.type, group: r.group, cat: r.cat, amount: r.amount, note: r.note,
      status: done ? 'done' : S.skips[key] ? 'skipped' : 'pending', tx: done });
  }
  for (const p of S.plans) {
    if (monthOf(p.date) !== m) continue;
    const done = p.txId && S.tx.find(t => t.id === p.txId);
    out.push({ key: 'p|' + p.id, kind: 'plan', ref: p, date: p.date, name: p.name, type: p.type, group: p.group, cat: p.cat, amount: p.amount, note: p.note,
      status: done ? 'done' : p.skipped ? 'skipped' : 'pending', tx: done });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date) || (a.type === 'thu' ? -1 : 1));
}
function earliestPlanMonth() {
  const ms = [...S.recurring.filter(r => r.active).map(r => r.start || today.slice(0, 7)), ...S.plans.map(p => monthOf(p.date))];
  return ms.length ? ms.sort()[0] : today.slice(0, 7);
}
// Tất cả khoản chưa xử lý từ tháng sớm nhất tới tháng `toM`
function pendingUntil(toM) {
  const out = []; let m = earliestPlanMonth();
  for (let i = 0; m <= toM && i < 120; i++, m = addMonth(m, 1)) out.push(...occurrences(m).filter(o => o.status === 'pending'));
  return out;
}

/* ============ Trạng thái giao diện ============ */
function defaultMonth() {
  const cur = today.slice(0, 7);
  if (txOfMonth(cur).length) return cur;
  const ms = [...new Set(S.tx.map(t => monthOf(t.date)))].sort();
  return ms.length ? ms[ms.length - 1] : cur;
}
const UI = { m: defaultMonth(), tab: 'overview', f: { q: '', type: '', group: '', cat: '' }, h: { q: '', type: '', cat: '', from: '', to: '', range: 'all', limit: 300 } };
try { const t = localStorage.getItem(KEY + '-tab'); if (t) UI.tab = t; } catch (e) {}

/* ============ Tab: Tổng quan ============ */
function overview() {
  const m = UI.m, T = totals(m), prev = totals(addMonth(m, -1));
  const occ = occurrences(m);
  const pend = occ.filter(o => o.status === 'pending');
  const pThu = sum(pend.filter(o => o.type === 'thu')), pChi = sum(pend.filter(o => o.type === 'chi'));
  const fixedChi = sum(T.t.filter(x => x.type === 'chi' && x.group === 'co_dinh'));
  const psChi = T.chi - fixedChi;
  const B = budgetFor(m), bTotal = sum(Object.values(B), x => x);
  const budgetedChi = sum(T.t.filter(x => x.type === 'chi' && B[x.cat] != null));
  const delta = (a, b) => b ? `${a >= b ? '▲' : '▼'} ${Math.abs(Math.round((a - b) / b * 100))}% so với tháng trước` : 'Tháng trước chưa có dữ liệu';

  // chi theo danh mục
  const byCat = {};
  T.t.filter(x => x.type === 'chi').forEach(x => byCat[x.cat] = (byCat[x.cat] || 0) + x.amount);
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 1;

  // cảnh báo ngân sách
  const alerts = [];
  for (const [c, lim] of Object.entries(B)) {
    const used = byCat[c] || 0;
    if (!lim) continue;
    if (used > lim) alerts.push(`<div class="alert bad">⚠ <b>${esc(cat(c).name)}</b> vượt ngân sách ${fmt(used - lim)} đ (${Math.round(used / lim * 100)}%)</div>`);
    else if (used >= lim * .85) alerts.push(`<div class="alert warn">● <b>${esc(cat(c).name)}</b> đã dùng ${Math.round(used / lim * 100)}% ngân sách</div>`);
  }
  const bigNonBudget = sum(T.t.filter(x => x.type === 'chi' && B[x.cat] == null));

  // sắp đến hạn (tính theo hôm nay)
  const horizon = addMonth(today.slice(0, 7), 1);
  const upcoming = pendingUntil(horizon).filter(o => dayDiff(today, o.date) <= 14).slice(0, 8);

  const top = T.t.filter(x => x.type === 'chi').sort((a, b) => b.amount - a.amount).slice(0, 5);

  const emptyBanner = T.t.length ? '' : `<div class="alert warn" style="margin-top:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap">

    <div class="card kpi"><div class="lbl">Tổng chi</div><div class="val neg">${fmt(T.chi)}</div><div class="sub">Cố định ${fmtShort(fixedChi)} · Phát sinh ${fmtShort(psChi)}</div></div>
    <div class="card kpi"><div class="lbl">Tồn (thu − chi)</div><div class="val ${T.ton < 0 ? 'neg' : 'pos'}">${fmtS(T.ton)}</div><div class="sub">${T.thu ? `Tỷ lệ tiết kiệm ${Math.round(T.ton / T.thu * 100)}%` : '—'}</div></div>
    <div class="card kpi"><div class="lbl">Ngân sách còn lại</div><div class="val ${bTotal - budgetedChi < 0 ? 'neg' : ''}">${fmtS(bTotal - budgetedChi)}</div><div class="sub">Đã dùng ${bTotal ? Math.round(budgetedChi / bTotal * 100) : 0}% / ${fmtShort(bTotal)}</div></div>
    <div class="card kpi"><div class="lbl">Dự kiến tồn cuối tháng</div><div class="val ${T.ton + pThu - pChi < 0 ? 'neg' : 'pos'}">${fmtS(T.ton + pThu - pChi)}</div><div class="sub">Còn phải chi ${fmtShort(pChi)} · sắp thu ${fmtShort(pThu)}</div></div>
  </div>

  <div class="grid three">
    <div class="card">
      <h3>Chi theo danh mục <span class="muted small">${monthLabel(m)}</span></h3>
      ${cats.length ? cats.map(([c, v]) => {
        const lim = B[c]; const pct = lim ? v / lim : null;
        return `<div class="catrow"><span>${esc(cat(c).name)} ${lim ? `<span class="muted small">/ ${fmtShort(lim)}</span>` : ''}</span>
          <span class="num"><b>${fmt(v)}</b> <span class="muted small">${Math.round(v / T.chi * 100)}%</span></span>

    </div>
  </div>`;
}

function trendChart(m) {
  const months = Array.from({ length: 6 }, (_, i) => addMonth(m, i - 5));
  const data = months.map(mm => totals(mm));
  const max = Math.max(1, ...data.map(d => Math.max(d.thu, d.chi)));
  const W = 560, H = 220, L = 44, Bm = 26, top = 10, cw = (W - L) / 6, bw = Math.min(26, cw / 3);
  const y = v => top + (H - top - Bm) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, yy = y(v);
    g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--border)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtShort(v)}</text>`;
  }
  data.forEach((d, i) => {
    const cx = L + cw * i + cw / 2;
    g += `<rect x="${cx - bw - 2}" y="${y(d.thu)}" width="${bw}" height="${H - Bm - y(d.thu)}" rx="3" fill="var(--thu)"><title>Thu ${fmt(d.thu)}</title></rect>`;
    g += `<rect x="${cx + 2}" y="${y(d.chi)}" width="${bw}" height="${H - Bm - y(d.chi)}" rx="3" fill="var(--chi)"><title>Chi ${fmt(d.chi)}</title></rect>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${months[i] === m ? 'var(--text)' : 'var(--muted)'}" font-weight="${months[i] === m ? 700 : 400}">T${Number(months[i].slice(5))}/${months[i].slice(2, 4)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Thu chi 6 tháng">${g}</svg>
    <div class="legend"><span><i style="background:var(--thu)"></i>Thu</span><span><i style="background:var(--chi)"></i>Chi</span></div>`;
}

function occItem(o) {
  const dd = dayDiff(today, o.date);
  const cls = o.status !== 'pending' ? '' : dd < 0 ? 'over' : dd <= 3 ? 'soon' : '';

  const amt = o.tx ? o.tx.amount : o.amount;
  return `<div class="item">
    <div class="datebox ${cls}"><b>${o.date.slice(8)}</b><span>T${Number(o.date.slice(5, 7))}</span></div>

    <div style="text-align:right">
      <div class="num ${o.type === 'thu' ? 'pos' : 'neg'}"><b>${o.type === 'thu' ? '+' : '−'}${fmt(amt)}</b></div>

/* ============ Tab: Sổ thu chi ============ */
function ledger() {
  const f = UI.f;
  let rows = txOfMonth(UI.m);
  if (f.type) rows = rows.filter(x => x.type === f.type);
  if (f.group) rows = rows.filter(x => x.group === f.group);
  if (f.cat) rows = rows.filter(x => x.cat === f.cat);
  if (f.q) { const q = f.q.toLowerCase(); rows = rows.filter(x => (x.desc + ' ' + (x.note || '') + ' ' + cat(x.cat).name).toLowerCase().includes(q)); }
  rows.sort((a, b) => a.date.localeCompare(b.date));
  const thu = sum(rows.filter(x => x.type === 'thu')), chi = sum(rows.filter(x => x.type === 'chi'));
  return `
  <div class="filters">
    <input type="search" id="fq" placeholder="Tìm khoản thu chi…" value="${esc(f.q)}">
    <select id="ftype"><option value="">Thu & Chi</option><option value="thu" ${f.type === 'thu' ? 'selected' : ''}>Chỉ Thu</option><option value="chi" ${f.type === 'chi' ? 'selected' : ''}>Chỉ Chi</option></select>
    <select id="fgroup"><option value="">Mọi loại</option><option value="co_dinh" ${f.group === 'co_dinh' ? 'selected' : ''}>Cố định</option><option value="phat_sinh" ${f.group === 'phat_sinh' ? 'selected' : ''}>Phát sinh</option></select>
    <select id="fcat"><option value="">Mọi danh mục</option>${S.categories.map(c => `<option value="${c.id}" ${f.cat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
  </div>
  <div class="actions noprint" style="margin-bottom:8px"><button class="btn" data-import>⬆ Nhập từ Excel</button><button class="btn" data-xlsx="month">⬇ Tải Excel tháng này</button></div>
  <div class="card tablewrap">
    <table>
      <thead><tr><th>Ngày</th><th>Diễn giải</th><th class="hide-sm">Danh mục</th><th class="num">Thu</th><th class="num">Chi</th><th></th></tr></thead>
      <tbody>
      ${rows.map(x => `<tr>
        <td class="small">${ddmm(x.date)}</td>
        <td><div>${esc(x.desc)}</div><div class="small muted">${x.group === 'co_dinh' ? 'Cố định' : 'Phát sinh'}<span class="hide-sm"></span>${x.note ? ' · ' + esc(x.note) : ''}</div></td>
        <td class="hide-sm small">${esc(cat(x.cat).name)}</td>
        <td class="num pos">${x.type === 'thu' ? fmt(x.amount) : ''}</td>
        <td class="num neg">${x.type === 'chi' ? fmt(x.amount) : ''}</td>
        <td class="num"><button class="iconbtn" data-edit="${x.id}" aria-label="Sửa">✎</button></td></tr>`).join('') || `<tr><td colspan="6" class="empty">${monthLabel(UI.m)} chưa có giao dịch.<br><br><button class="btn primary" data-import>&#x1F4F7; Nhập ${monthLabel(UI.m).toLowerCase()} từ ảnh chụp / Excel</button><br><br><span class="small">hoặc bấm “+ Thu”, “+ Chi” để thêm từng khoản</span></td></tr>`}
      </tbody>
      <tfoot><tr class="total"><td></td><td>Cộng (${rows.length} khoản)</td><td class="hide-sm"></td><td class="num pos">${fmt(thu)}</td><td class="num neg">${fmt(chi)}</td><td class="num ${thu - chi < 0 ? 'neg' : 'pos'}">${fmtS(thu - chi)}</td></tr></tfoot>
    </table>
  </div>`;
}

/* ============ Tab: Kế hoạch sắp tới ============ */
function plan() {
  const m = UI.m, occ = occurrences(m), T = totals(m);
  const pend = occ.filter(o => o.status === 'pending');
  const pThu = sum(pend.filter(o => o.type === 'thu')), pChi = sum(pend.filter(o => o.type === 'chi'));
  const overdue = m >= today.slice(0, 7) ? pendingUntil(addMonth(m, -1)) : [];
  const next = occurrences(addMonth(m, 1));
  const nThu = sum(next.filter(o => o.type === 'thu' && o.status !== 'skipped')), nChi = sum(next.filter(o => o.type === 'chi' && o.status !== 'skipped'));
  return `
  <div class="grid kpis">
    <div class="card kpi"><div class="lbl">Đã thu / đã chi</div><div class="val"><span class="pos">${fmtShort(T.thu)}</span> / <span class="neg">${fmtShort(T.chi)}</span></div><div class="sub">${monthLabel(m)}</div></div>
    <div class="card kpi"><div class="lbl">Còn phải chi (dự kiến)</div><div class="val neg">${fmt(pChi)}</div><div class="sub">${pend.filter(o => o.type === 'chi').length} khoản chưa chi</div></div>
    <div class="card kpi"><div class="lbl">Sắp thu (dự kiến)</div><div class="val pos">${fmt(pThu)}</div><div class="sub">${pend.filter(o => o.type === 'thu').length} khoản chưa thu</div></div>
    <div class="card kpi"><div class="lbl">Dự kiến tồn cuối tháng</div><div class="val ${T.ton + pThu - pChi < 0 ? 'neg' : 'pos'}">${fmtS(T.ton + pThu - pChi)}</div><div class="sub">= tồn hiện tại + sắp thu − còn phải chi</div></div>
  </div>
  ${overdue.length ? `<div class="card" style="margin-bottom:12px;border-color:var(--chi)"><h3 class="neg">Quá hạn từ tháng trước (${overdue.length})</h3><div class="list">${overdue.map(occItem).join('')}</div></div>` : ''}
  <div class="grid three">
    <div class="card">
      <h3>Lịch thu chi ${monthLabel(m)} <button class="btn sm primary" data-newplan>+ Thêm kế hoạch</button></h3>
      <div class="list">${occ.length ? occ.map(occItem).join('') : '<div class="empty">Chưa có kế hoạch cho tháng này.<br>Thêm khoản cố định trong <b>Cài đặt</b> hoặc bấm “+ Thêm kế hoạch”.</div>'}</div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card">
        <h3>Dự báo ${monthLabel(addMonth(m, 1))}</h3>
        <table><tbody>
          <tr><td>Dự kiến thu</td><td class="num pos">${fmt(nThu)}</td></tr>
          <tr><td>Dự kiến chi</td><td class="num neg">${fmt(nChi)}</td></tr>
          <tr class="total"><td>Dự kiến tồn</td><td class="num ${nThu - nChi < 0 ? 'neg' : 'pos'}">${fmtS(nThu - nChi)}</td></tr>
        </tbody></table>
        <p class="hint">Gồm các khoản cố định hằng tháng và kế hoạch riêng đã nhập cho tháng sau.</p>
      </div>
      <div class="card">
        <h3>Kế hoạch lớn sắp tới</h3>
        <div class="list">${S.plans.filter(p => !p.txId && !p.skipped && p.date >= today).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 6).map(p => `
          <div class="item"><div class="main"><div class="name">${esc(p.name)}</div><div class="small muted">${ddmmyyyy(p.date)} · ${esc(cat(p.cat).name)}</div></div>
          <div class="num ${p.type === 'thu' ? 'pos' : 'neg'}"><b>${fmt(p.amount)}</b><br><button class="iconbtn small" data-editplan="${p.id}">✎ Sửa</button></div></div>`).join('') || '<div class="empty small">Chưa có. Ví dụ: “Đóng tiền FPT đợt 4”, “Học phí kỳ mới”, “Đám cưới”…</div>'}</div>
      </div>
    </div>
  </div>`;
}

/* ============ Tab: Ngân sách ============ */
function budget() {
  const m = UI.m, B = budgetFor(m), T = totals(m), ov = S.budgets.months[m] || {};
  const used = {};
  T.t.filter(x => x.type === 'chi').forEach(x => used[x.cat] = (used[x.cat] || 0) + x.amount);
  const pend = occurrences(m).filter(o => o.status === 'pending' && o.type === 'chi');
  const pendBy = {}; pend.forEach(o => pendBy[o.cat] = (pendBy[o.cat] || 0) + o.amount);
  const chiCats = S.categories.filter(c => c.kind === 'chi');
  let tB = 0, tU = 0, tP = 0;
  const rows = chiCats.map(c => {
    const lim = B[c.id], u = used[c.id] || 0, p = pendBy[c.id] || 0;
    if (lim != null) { tB += lim; tU += u; tP += p; }
    const pct = lim ? u / lim : 0;
    return `<tr>
      <td><div>${esc(c.name)}</div>${lim ? `<div class="bar" style="margin-top:6px"><i class="${pct > 1 ? 'over' : pct >= .85 ? 'warn' : ''}" style="width:${Math.min(100, pct * 100)}%"></i></div>` : '<div class="small muted">Không đặt ngân sách</div>'}</td>
      <td class="num"><input inputmode="numeric" class="bud" data-cat="${c.id}" value="${lim != null ? fmt(lim) : ''}" placeholder="—" style="width:120px;text-align:right;padding:6px 8px;border:1px solid ${ov[c.id] != null ? 'var(--info)' : 'var(--border)'};border-radius:8px;background:var(--bg)"></td>
      <td class="num neg">${u ? fmt(u) : '<span class="muted">0</span>'}</td>
      <td class="num hide-sm muted">${p ? fmt(p) : ''}</td>
      <td class="num ${lim != null && lim - u < 0 ? 'neg' : ''}">${lim != null ? fmtS(lim - u) : ''}<div class="small muted">${lim ? Math.round(pct * 100) + '%' : ''}</div></td></tr>`;
  }).join('');
  return `
  <div class="grid kpis">
    <div class="card kpi"><div class="lbl">Tổng ngân sách chi</div><div class="val">${fmt(tB)}</div><div class="sub">${monthLabel(m)}</div></div>
    <div class="card kpi"><div class="lbl">Đã chi (trong ngân sách)</div><div class="val neg">${fmt(tU)}</div><div class="sub">${tB ? Math.round(tU / tB * 100) : 0}% ngân sách</div></div>
    <div class="card kpi"><div class="lbl">Còn lại</div><div class="val ${tB - tU < 0 ? 'neg' : 'pos'}">${fmtS(tB - tU)}</div><div class="sub">Sau các khoản dự kiến: ${fmtS(tB - tU - tP)}</div></div>
    <div class="card kpi"><div class="lbl">Thu nhập tháng</div><div class="val pos">${fmt(T.thu)}</div><div class="sub">${T.thu ? `Ngân sách = ${Math.round(tB / T.thu * 100)}% thu nhập` : 'Chưa có khoản thu'}</div></div>
  </div>
  <div class="card tablewrap">
    <h3>Ngân sách theo danh mục
      <span class="seg" style="width:auto" id="budMode">
        <button type="button" data-mode="default" class="${UI.budMode !== 'month' ? 'on' : ''}">Mọi tháng</button>
        <button type="button" data-mode="month" class="${UI.budMode === 'month' ? 'on' : ''}">Riêng ${monthLabel(m).replace('Tháng ', 'T')}</button>
      </span></h3>
    <p class="hint" style="margin-top:0">Gõ số tiền rồi bấm ra ngoài để lưu (có thể gõ tắt: <b>3tr</b>, <b>500k</b>). Chế độ “Mọi tháng” là ngân sách mặc định; “Riêng tháng” chỉ áp dụng cho tháng đang xem (viền xanh). Xóa trắng ô để bỏ.</p>
    <table>
      <thead><tr><th>Danh mục</th><th class="num">Ngân sách</th><th class="num">Đã chi</th><th class="num hide-sm">Sắp chi</th><th class="num">Còn lại</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="total"><td>Tổng</td><td class="num">${fmt(tB)}</td><td class="num neg">${fmt(tU)}</td><td class="num hide-sm">${fmt(tP)}</td><td class="num ${tB - tU < 0 ? 'neg' : ''}">${fmtS(tB - tU)}</td></tr></tfoot>
    </table>
  </div>`;
}

/* ============ Tab: Báo cáo tháng (giống file Excel) ============ */
function report() {
  const m = UI.m, T = totals(m);
  const sec = (g, title) => {
    const r = T.t.filter(x => x.group === g).sort((a, b) => a.date.localeCompare(b.date) || (a.type === 'thu' ? -1 : 1));
    const thu = sum(r.filter(x => x.type === 'thu')), chi = sum(r.filter(x => x.type === 'chi'));
    let last = '';
    const body = r.map(x => { const d = x.date !== last ? ddmmyyyy(x.date) : ''; last = x.date;
      return `<tr><td class="small">${d}</td><td>${esc(x.desc)}</td><td class="num">${x.type === 'thu' ? fmt(x.amount) : ''}</td><td class="num">${x.type === 'chi' ? fmt(x.amount) : ''}</td><td></td></tr>`; }).join('');
    return `<tr class="sec"><td></td><td style="color:var(--accent)">${title}</td><td class="num">${fmt(thu)}</td><td class="num">${fmt(chi)}</td><td class="num ${thu - chi < 0 ? 'neg' : ''}">${fmtS(thu - chi)}</td></tr>${body}`;
  };
  return `
  <div class="noprint" style="display:flex;gap:8px;justify-content:flex-end;margin:16px 0">
    <button class="btn" data-xlsx="month">⬇ Tải Excel</button>
    <button class="btn" onclick="window.print()">In / Lưu PDF</button>
  </div>
  <div class="card report tablewrap">
    <h2>THU CHI ${monthLabel(m).toUpperCase()}</h2>
    <table>
      <thead><tr><th>Ngày</th><th>Diễn giải</th><th class="num">Thu</th><th class="num">Chi</th><th class="num">Tồn</th></tr></thead>
      <tbody>${sec('co_dinh', 'CHI PHÍ CỐ ĐỊNH')}${sec('phat_sinh', 'CHI PHÍ PHÁT SINH')}</tbody>
      <tfoot><tr class="sec"><td style="color:var(--accent)" colspan="2">TỔNG CỘNG</td><td class="num">${fmt(T.thu)}</td><td class="num">${fmt(T.chi)}</td><td class="num ${T.ton < 0 ? 'neg' : ''}">${fmtS(T.ton)}</td></tr></tfoot>
    </table>
  </div>`;
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============ Tab: Thống kê theo tháng / năm ============ */
function statsTab() {
  const Y = UI.m.slice(0, 4);
  const months = Array.from({ length: 12 }, (_, i) => `${Y}-${pad(i + 1)}`);
  const rows = months.map(m => {
    const T = totals(m);
    const cd = sum(T.t.filter(x => x.type === 'chi' && x.group === 'co_dinh'));
    return { m, ...T, cd, ps: T.chi - cd, n: T.t.length };
  });
  const prevYearTon = sum(S.tx.filter(t => t.date < `${Y}-01-01`), t => t.type === 'thu' ? t.amount : -t.amount);
  let acc = prevYearTon;
  rows.forEach(r => { acc += r.ton; r.acc = acc; });
  const used = rows.filter(r => r.n);
  const yThu = sum(rows, r => r.thu), yChi = sum(rows, r => r.chi);
  const avgChi = used.length ? yChi / used.length : 0, avgThu = used.length ? yThu / used.length : 0;
  const maxChi = used.slice().sort((a, b) => b.chi - a.chi)[0];
  // ma trận danh mục × tháng
  const byCat = {};
  S.tx.filter(t => t.date.startsWith(Y)).forEach(t => {
    const o = byCat[t.cat] ||= { type: t.type, m: {} };
    const k = monthOf(t.date); o.m[k] = (o.m[k] || 0) + t.amount;
  });
  const usedMonths = used.map(r => r.m);
  const catRows = (type) => Object.entries(byCat).filter(([, o]) => o.type === type)
    .map(([c, o]) => ({ c, o, total: sum(Object.values(o.m), x => x) })).sort((a, b) => b.total - a.total);
  const matrix = type => catRows(type).map(({ c, o, total }) => `<tr><td>${esc(cat(c).name)}</td>${usedMonths.map(m => `<td class="num">${o.m[m] ? fmt(o.m[m]) : '<span class="muted">–</span>'}</td>`).join('')}
    <td class="num"><b>${fmt(total)}</b></td><td class="num">${fmt(total / (usedMonths.length || 1))}</td><td class="num muted">${(type === 'chi' ? yChi : yThu) ? Math.round(total / (type === 'chi' ? yChi : yThu) * 100) + '%' : ''}</td></tr>`).join('');
  return `
  <div class="noprint" style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:16px 0 0">
    <div class="month"><button class="iconbtn" data-year="-1">◀</button><b>Năm ${Y}</b><button class="iconbtn" data-year="1">▶</button></div>
    <button class="btn" data-xlsx="year">⬇ Tải Excel cả năm</button>
  </div>
  <div class="grid kpis">
    <div class="card kpi"><div class="lbl">Tổng thu năm ${Y}</div><div class="val pos">${fmt(yThu)}</div><div class="sub">TB ${fmtShort(avgThu)}/tháng</div></div>
    <div class="card kpi"><div class="lbl">Tổng chi năm ${Y}</div><div class="val neg">${fmt(yChi)}</div><div class="sub">TB ${fmtShort(avgChi)}/tháng</div></div>
    <div class="card kpi"><div class="lbl">Tồn năm ${Y}</div><div class="val ${yThu - yChi < 0 ? 'neg' : 'pos'}">${fmtS(yThu - yChi)}</div><div class="sub">${yThu ? 'Tiết kiệm ' + Math.round((yThu - yChi) / yThu * 100) + '% thu nhập' : '—'}</div></div>
    <div class="card kpi"><div class="lbl">Tháng chi nhiều nhất</div><div class="val">${maxChi ? monthLabel(maxChi.m).replace('Tháng ', 'T') : '—'}</div><div class="sub">${maxChi ? fmt(maxChi.chi) : ''}</div></div>
    <div class="card kpi"><div class="lbl">Số giao dịch</div><div class="val">${sum(rows, r => r.n)}</div><div class="sub">${used.length} tháng có dữ liệu</div></div>
  </div>
  <div class="card trend" style="margin-bottom:12px"><h3>Thu chi 12 tháng năm ${Y}</h3>${barChart(months, UI.m)}</div>
  <div class="card tablewrap" style="margin-bottom:12px">
    <h3>Thống kê theo tháng <span class="hint">Bấm vào tháng để xem chi tiết</span></h3>
    <table>
      <thead><tr><th>Tháng</th><th class="num">Thu</th><th class="num">Chi</th><th class="num hide-sm">Chi cố định</th><th class="num hide-sm">Chi phát sinh</th><th class="num">Tồn</th><th class="num hide-sm">Tồn lũy kế</th><th class="num hide-sm">Tiết kiệm</th><th class="num hide-sm">Số GD</th></tr></thead>
      <tbody>${rows.map(r => `<tr style="cursor:pointer;${r.n ? '' : 'opacity:.45'}" data-gomonth="${r.m}">
        <td><b>${monthLabel(r.m).replace('Tháng ', 'T')}</b></td><td class="num pos">${fmt(r.thu)}</td><td class="num neg">${fmt(r.chi)}</td>
        <td class="num hide-sm">${fmt(r.cd)}</td><td class="num hide-sm">${fmt(r.ps)}</td>
        <td class="num ${r.ton < 0 ? 'neg' : 'pos'}"><b>${fmtS(r.ton)}</b></td><td class="num hide-sm ${r.acc < 0 ? 'neg' : ''}">${fmtS(r.acc)}</td>
        <td class="num hide-sm">${r.thu ? Math.round(r.ton / r.thu * 100) + '%' : '–'}</td><td class="num hide-sm">${r.n || ''}</td></tr>`).join('')}</tbody>
      <tfoot><tr class="total"><td>Cả năm</td><td class="num pos">${fmt(yThu)}</td><td class="num neg">${fmt(yChi)}</td><td class="num hide-sm">${fmt(sum(rows, r => r.cd))}</td><td class="num hide-sm">${fmt(sum(rows, r => r.ps))}</td>
        <td class="num ${yThu - yChi < 0 ? 'neg' : 'pos'}">${fmtS(yThu - yChi)}</td><td class="num hide-sm">${fmtS(acc)}</td><td class="num hide-sm">${yThu ? Math.round((yThu - yChi) / yThu * 100) + '%' : ''}</td><td class="num hide-sm">${sum(rows, r => r.n)}</td></tr></tfoot>
    </table>
    ${prevYearTon ? `<p class="hint">Tồn lũy kế tính cả số dư các năm trước: ${fmtS(prevYearTon)}</p>` : ''}
  </div>
  <div class="card tablewrap">
    <h3>Chi theo danh mục từng tháng</h3>
    ${usedMonths.length ? `<table>
      <thead><tr><th>Danh mục</th>${usedMonths.map(m => `<th class="num">T${Number(m.slice(5))}</th>`).join('')}<th class="num">Cả năm</th><th class="num">TB/tháng</th><th class="num">%</th></tr></thead>
      <tbody>${matrix('chi')}<tr class="sec"><td>Tổng chi</td>${usedMonths.map(m => `<td class="num">${fmt(totals(m).chi)}</td>`).join('')}<td class="num">${fmt(yChi)}</td><td class="num">${fmt(avgChi)}</td><td></td></tr>
      ${matrix('thu')}<tr class="sec"><td>Tổng thu</td>${usedMonths.map(m => `<td class="num">${fmt(totals(m).thu)}</td>`).join('')}<td class="num">${fmt(yThu)}</td><td class="num">${fmt(avgThu)}</td><td></td></tr></tbody>
    </table>` : '<div class="empty">Chưa có dữ liệu năm này</div>'}
  </div>`;
}

function barChart(months, hl) {
  const data = months.map(mm => totals(mm));
  const max = Math.max(1, ...data.map(d => Math.max(d.thu, d.chi)));
  const n = months.length, W = 560, H = 220, L = 44, Bm = 26, top = 10, cw = (W - L) / n, bw = Math.min(26, cw / 3);
  const y = v => top + (H - top - Bm) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, yy = y(v);
    g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--border)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtShort(v)}</text>`;
  }
  data.forEach((d, i) => {
    const cx = L + cw * i + cw / 2, on = months[i] === hl;
    g += `<rect x="${cx - bw - 1}" y="${y(d.thu)}" width="${bw}" height="${H - Bm - y(d.thu)}" rx="3" fill="var(--thu)"><title>${monthLabel(months[i])} – Thu ${fmt(d.thu)}</title></rect>`;
    g += `<rect x="${cx + 1}" y="${y(d.chi)}" width="${bw}" height="${H - Bm - y(d.chi)}" rx="3" fill="var(--chi)"><title>${monthLabel(months[i])} – Chi ${fmt(d.chi)}</title></rect>`;

/* ============ Excel: nhập & xuất ============ */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res; s.onerror = () => rej(new Error('Không tải được thư viện Excel – kiểm tra kết nối mạng'));
    document.head.appendChild(s);

}
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/\s+/g, ' ').trim();
const CAT_RULES = [
  ['dong_nha', /dong ?tien ?(fpt|can ?ho|nha)|\bdot ?\d|fpt ?dot/], ['lai_vay', /lai (can ho|vay|nha)/], ['bao_hiem', /bhxh|bhyt|bao hiem/],
  ['con', /\bmon\b|hoc phi|\bhoc\b|sua\b|bim|ta\b/], ['di_lai', /xang|bai xe|gui xe|grab|taxi|ve xe|ve may bay|sua xe|rua xe/],
  ['hoa_don', /\bdien\b|\bnuoc\b|card|internet|wifi|\bnet\b|truyen hinh|cuoc/], ['y_te', /thuoc|kham|benh vien|nha khoa|vitamin/],
  ['hieu_hi', /cung|chua|dam (ma|cuoi|gio)|\bsn\b|sinh nhat|cuoi|mung|\ble\b|than tai|ram|gio/], ['giao_luu', /nhau|karaoke|bia|tiec/],
  ['gia_dung', /tu lanh|ra goi|men|chan|noi|gop|may giat|dieu hoa|do gia dung|ban ghe/], ['cong_viec', /mkt|marketing|\bvp\b|van phong|cpn|chuyen phat|quang cao|dan kinh/],
  ['an_uong', /cho\b|gas|\ban\b|com|sieu thi|bun|pho|cafe|ca phe|do an|thuc pham|gao/], ['mua_sam', /\bdo\b|kem|son|quan|ao|giay|op|vo may|my pham|shopee|lazada|tiki/],
];
function guessCat(desc, type) {
  const n = norm(desc).replace(/\bt\d{1,2}\b/g, '').replace(/\d+/g, '').trim();
  const hit = S.tx.filter(t => t.type === type && norm(t.desc).replace(/\bt\d{1,2}\b/g, '').replace(/\d+/g, '').trim() === n).sort((a, b) => (b.u || 0) - (a.u || 0))[0];
  if (hit && S.categories.some(c => c.id === hit.cat)) return hit.cat;
  if (type === 'thu') return /luong|hoa hong|thuong (thang|tet|quy|nam|du an)|^thuong$/.test(n) ? 'luong' : (S.categories.find(c => c.id === 'thu_khac') || S.categories.find(c => c.kind === 'thu'))?.id;
  for (const [c, re] of CAT_RULES) if (re.test(n) && S.categories.some(x => x.id === c)) return c;
  return (S.categories.find(c => c.id === 'khac') || S.categories.find(c => c.kind === 'chi'))?.id;
}
function cellDate(v, defYear) {
  if (v == null || v === '') return '';
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})(?:[-\/.](\d{2,4}))?$/);
  if (m) { let y = m[3] ? Number(m[3]) : Number(defYear); if (y < 100) y += 2000; const d = Number(m[1]), mo = Number(m[2]); if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12) return `${y}-${pad(mo)}-${pad(d)}`; }
  return '';
}
function cellMoney(v) {
  if (typeof v === 'number') return Math.abs(Math.round(v));
  const s = String(v ?? '').replace(/[()đ₫\s]|vn[dđ]/gi, '');
  return s ? parseMoney(s) : 0;
}
// Đọc bảng (mảng 2 chiều) theo mẫu "THU CHI THÁNG x" hoặc "Sổ giao dịch" → danh sách giao dịch
function gridToTx(grid, defMonth) {
  grid = grid.map(r => (r || []).map(c => (typeof c === 'string' ? c.trim() : c)));
  for (const r of grid.slice(0, 8)) for (const c of r) { const m = norm(c).match(/thang\s*(\d{1,2})\s*[\/\-.]\s*(\d{4})/); if (m) { defMonth = `${m[2]}-${pad(m[1])}`; break; } }
  let hi = grid.findIndex((r, i) => i < 15 && r.some(c => /dien giai|noi dung|mo ta|khoan/.test(norm(c))));
  const H = hi >= 0 ? grid[hi].map(norm) : [];
  const col = re => H.findIndex(h => re.test(h));
  let C = { date: col(/^ngay|date/), desc: col(/dien giai|noi dung|mo ta|khoan/), thu: col(/^thu$|^tien thu|^so tien thu/), chi: col(/^chi$|^tien chi|^so tien chi/),
    amount: col(/^so tien$|^tien$/), type: col(/^loai/), group: col(/^nhom/), cat: col(/danh muc/), note: col(/ghi chu/) };
  if (hi < 0) { // không có dòng tiêu đề: giả định Ngày | Diễn giải | Thu | Chi
    C = { date: 0, desc: 1, thu: 2, chi: 3, amount: -1, type: -1, group: -1, cat: -1, note: -1 };
    if (grid.every(r => r.length <= 3)) C = { date: -1, desc: 0, thu: -1, chi: -1, amount: 1, type: -1, group: -1, cat: -1, note: 2 };
  }
  const get = (r, k) => (C[k] >= 0 ? r[C[k]] : '');
  const out = [];
  let section = 'phat_sinh', lastDate = '';
  const totals = {};
  for (const r of grid.slice(hi + 1)) {
    const desc = String(get(r, 'desc') ?? '').trim(), nd = norm(desc);
    if (!desc && r.every(c => c === '' || c == null)) continue;
    const isSec = /(^|\s)chi ph/.test(nd) && nd.length < 30;
    if (/^tong( cong)?$|^cong$|^tong thu|^tong chi|t\w{0,3}ng c\w{0,2}ng/.test(nd)) {
      if (C.thu >= 0) { totals.thu = cellMoney(get(r, 'thu')) || totals.thu; totals.chi = cellMoney(get(r, 'chi')) || totals.chi; }
      continue;
    }
    if (/^(chi phi |chi )?co dinh$/.test(nd) || (isSec && /dinh/.test(nd))) { section = 'co_dinh'; continue; }
    if (/^(chi phi |chi )?phat sinh$/.test(nd) || (isSec && /sinh|phat/.test(nd))) { section = 'phat_sinh'; continue; }
    const d = cellDate(get(r, 'date'), defMonth.slice(0, 4));
    if (d) lastDate = d;
    const date = d || lastDate || `${defMonth}-01`;
    const g = norm(get(r, 'group'));
    const group = /co dinh/.test(g) ? 'co_dinh' : /phat sinh/.test(g) ? 'phat_sinh' : section;
    const catName = norm(get(r, 'cat'));
    const catByName = catName && S.categories.find(c => norm(c.name) === catName);
    const note = String(get(r, 'note') ?? '');
    const push = (type, amount) => { if (amount > 0 && desc) out.push({ date, type, group, desc, amount, note, cat: catByName && catByName.kind === type ? catByName.id : guessCat(desc, type) }); };
    if (C.amount >= 0) {
      const t = norm(get(r, 'type'));
      push(/^thu/.test(t) ? 'thu' : 'chi', cellMoney(get(r, 'amount')));
    } else { push('thu', cellMoney(get(r, 'thu'))); push('chi', cellMoney(get(r, 'chi'))); }
  }
  const keyOf = x => `${x.date}|${x.type}|${x.amount}|${norm(x.desc)}`;
  const have = new Set(S.tx.map(keyOf));
  out.forEach(x => { x.dup = have.has(keyOf(x)); x.on = !x.dup; });
  out.totals = totals; // dòng TỔNG CỘNG trong bảng (nếu có) để đối chiếu
  return out;
}

  }
}

/* ============ Đọc ảnh chụp (OCR tiếng Việt, chạy ngay trên máy, miễn phí) ============ */
const OCR_CDN = {
  lib: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',

  if (window.Tesseract) return Promise.resolve();

    const s = document.createElement('script'); s.src = OCR_CDN.lib;
    s.onload = res; s.onerror = () => rej(new Error('Không tải được bộ đọc ảnh – kiểm tra kết nối mạng'));

// Chuẩn bị ảnh: phóng to, chuyển đen trắng, xóa đường kẻ ô của bảng (giúp đọc chữ chính xác hơn)

async function ocrImage(file, onProgress) {
  await loadTesseract();

  const worker = await Tesseract.createWorker('vie', 1, {
    workerPath: OCR_CDN.workerPath, corePath: OCR_CDN.corePath, langPath: OCR_CDN.langPath,

  });

    await worker.setParameters({ tessedit_pageseg_mode: window.OCR_PSM || '4', preserve_interword_spaces: '1' });

// --- làm sạch từng từ OCR ---
const ocrStrip = t => t.replace(/[|]/g, '').replace(/^[\u201E\u201C\u201D\x22\x27\u2018\u2019\x60,.\xA1!\[\](){}:;_~^*\\\/\x3C\x3E\xAB\xBB\u2014\u2013-]+/, '').replace(/[\u201E\u201C\u201D\x22\x27\u2018\u2019\x60\xA1!\[\](){}:;_~^*\\\x3C\x3E\xAB\xBB\u2014\u2013|.,]+$/, '').trim();
// "05082026", "160822026", "5/8/2026" → "dd/mm/yyyy"
function ocrDate(t, prefMonth) {
  let m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/);
  if (m) return m[3] ? `${m[1]}/${m[2]}/${m[3]}` : `${m[1]}/${m[2]}`;
  if (!/^\d{8,9}$/.test(t)) return '';
  // "05082026" hoặc thừa 1 chữ số do OCR ("120082026") → thử bỏ từng chữ số
  const cands = t.length === 8 ? [t] : [...t].map((_, i) => t.slice(0, i) + t.slice(i + 1));
  const ok = cands.map(c => c.match(/^(\d{2})(\d{2})(20\d{2})$/)).filter(m => m && +m[1] >= 1 && +m[1] <= 31 && +m[2] >= 1 && +m[2] <= 12);
  const best = ok.find(m => prefMonth && +m[2] === prefMonth) || ok[0];
  return best ? `${best[1]}/${best[2]}/${best[3]}` : '';
}
// "54,000,000", "8014000.", "...5840,851.000", "3tr" → số tiền (0 nếu không phải tiền)
function ocrMoney(t) {
  if (/^\d+([.,]\d+)?(tr|k|triệu|trieu)$/i.test(t)) return parseMoney(t);
  const c = t.replace(/[oO]/g, '0').replace(/[lI]/g, '1').replace(/[đ₫]$/i, '').replace(/[.,]+$/, '');
  if (!/\d/.test(c) || /[^\d.,()]/.test(c.replace(/^[^\d]+/, ''))) return 0;
  const body = c.replace(/^[^\d]+/, '');
  let v = Number(body.replace(/\D/g, ''));
  if (v > 999999999 || /^[^\d]/.test(c)) { const g = body.match(/\d{1,3}(?:[.,]\d{3})+$/); if (g) v = Number(g[0].replace(/\D/g, '')); } // có ký tự rác phía trước → lấy phần đuôi đúng dạng 1,234,000
  // số quá lớn thường do đường kẻ dọc bị đọc thành chữ số thừa ở đầu ("840,851,000" → 40,851,000)
  if (v >= 300000000) { const g = body.match(/\d{1,2}(?:[.,]\d{3})+$/); const v2 = g ? Number(g[0].replace(/\D/g, '')) : Number(String(v).slice(1)); if (v2 >= 1000) v = v2; }
  if (v >= 100000 && v % 1000 && (v % 1000 < 20 || v % 1000 > 980)) v = Math.round(v / 1000) * 1000; // "3277.009" → 3,277,000
  return v >= 1000 ? v : 0;
}
// Kết quả OCR (các từ + vị trí) → bảng [Ngày, Diễn giải, Thu, Chi] để dùng chung bộ đọc Excel
function ocrToGrid(data) {
  let words = (data.words || []).map(w => ({ t: ocrStrip(w.text || ''), x0: w.bbox.x0, x1: w.bbox.x1, xc: (w.bbox.x0 + w.bbox.x1) / 2, yc: (w.bbox.y0 + w.bbox.y1) / 2, h: w.bbox.y1 - w.bbox.y0 }))
    .filter(w => w.t);
  if (!words.length) return [];
  const hs = words.map(w => w.h).sort((a, b) => a - b), hMed = hs[hs.length >> 1] || 10;
  const maxX = Math.max(...words.map(w => w.x1));
  // gom thành các dòng theo vị trí dọc
  words.sort((a, b) => a.yc - b.yc);
  const rows = [];
  for (const w of words) {
    const r = rows[rows.length - 1];
    if (r && Math.abs(w.yc - r.yc) < hMed * 0.6) { r.ws.push(w); r.yc += (w.yc - r.yc) / r.ws.length; } else rows.push({ yc: w.yc, ws: [w] });
  }
  rows.forEach(r => {
    r.ws.sort((a, b) => a.x0 - b.x0);
    const m = []; // nối các mảnh số bị tách ("54,000," + "000")
    for (const w of r.ws) {
      const p = m[m.length - 1];
      if (p && (/[.,]/.test(p.t) || /^\d{3}$/.test(w.t)) && /[\d.,]$/.test(p.t) && /^\d/.test(w.t) && w.x0 - p.x1 < hMed * 0.7 && ocrMoney(p.t + w.t) && !ocrDate(p.t)) { p.t += w.t; p.x1 = w.x1; p.xc = (p.x0 + p.x1) / 2; }
      else m.push({ ...w });
    }
    r.ws = m;
  });
  // dòng tiêu đề NGÀY | DIỄN GIẢI | THU | CHI | TỒN
  let hi = -1, numCols = null, numLeft = maxX * 0.45, dateRight = maxX * 0.2;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const f = re => rows[i].ws.find(w => re.test(norm(w.t)));
    const thu = f(/^thu$/), chi = f(/^chi$/);
    if (thu && chi && (f(/^ngay/) || f(/^dien|giai$/) || f(/^ton$/)) && !f(/^thang/)) {
      hi = i; numCols = [['thu', thu.xc], ['chi', chi.xc]];
      const ton = f(/^ton$/); if (ton) numCols.push(['ton', ton.xc]);
      const step = Math.abs(chi.xc - thu.xc);
      numLeft = Math.min(thu.xc, chi.xc) - step * 0.7;
      const dg = f(/^dien|giai$/); if (dg) dateRight = Math.min(dateRight, dg.x0);
      break;
    }
  }
  // không thấy tiêu đề: đoán vị trí cột Thu / Chi từ các dòng có từ 2 số tiền trở lên (dòng tổng, dòng nhóm)
  if (!numCols) {
    const xs = [[], [], []];
    rows.forEach(r => { const n = r.ws.filter(w => w.xc >= numLeft && ocrMoney(w.t)); if (n.length === 3) n.forEach((w, k) => xs[k].push(w.xc)); }); // dòng nhóm/tổng: Thu | Chi | Tồn
    const med = a => a.sort((p, q) => p - q)[a.length >> 1];
    if (xs[0].length && xs[1].length && med(xs[1]) - med(xs[0]) > hMed * 3) {
      numCols = [['thu', med(xs[0])], ['chi', med(xs[1])]];
      if (xs[2].length) numCols.push(['ton', med(xs[2])]);
    }
  }
  const titleM = (() => { for (const r of rows.slice(0, 6)) { const m = norm(r.ws.map(w => w.t).join(' ')).match(/thang\s*(\d{1,2})\s*[\/\-.]/); if (m) return +m[1]; } return 0; })();
  const junk = t => t.length === 1 && !/[a-zA-Z0-9À-ỹ+&]/.test(t);
  const out = [];
  let lastM = 0;
  rows.forEach((r, i) => {
    if (i < hi || (hi < 0 && i < 4 && /thang\s*\d/.test(norm(r.ws.map(w => w.t).join(' '))))) { out.push([r.ws.map(w => w.t).join(' ')]); return; } // vd "THU CHI THÁNG 8/2026"
    if (i === hi) { out.push(['Ngày', 'Diễn giải', 'Thu', 'Chi']); return; }
    let date = '', thu = 0, chi = 0;
    const desc = [], nums = [];
    for (const w of r.ws) {
      const d = w.x0 < dateRight || !desc.length ? ocrDate(w.t, titleM || lastM) : '';
      if (d) lastM = +d.split('/')[1];
      const v = w.xc >= numLeft ? ocrMoney(w.t) : 0;
      if (d && !date) date = d;
      else if (v) nums.push({ v, xc: w.xc, x1: w.x1 });
      else if (w.xc < numLeft && !junk(w.t)) desc.push(w.t);
    }
    if (numCols) {
      // số tiền canh lề phải → so mép phải của số với ranh giới giữa các cột
      const cs = numCols.slice().sort((a, b) => a[1] - b[1]);
      for (const n of nums) {
        let col = cs[cs.length - 1][0];
        for (let k = 0; k < cs.length - 1; k++) if (n.x1 <= (cs[k][1] + cs[k + 1][1]) / 2 + hMed * 0.3) { col = cs[k][0]; break; }
        if (col === 'thu' && !thu) thu = n.v; else if (col === 'chi' && !chi) chi = n.v;
      }
    } else if (nums.length) { // không có tiêu đề (danh sách tự ghi, hóa đơn…): đoán thu/chi theo nội dung
      const d = norm(desc.join(' '));
      if (/luong|hoa hong|thuong|hoan|tien ve|nhan tien|\bthu\b/.test(d)) thu = nums[0].v; else chi = nums[0].v;
    }
    out.push([date, desc.join(' ').replace(/\s+/g, ' ').trim(), thu || '', chi || '']);
  });
  if (hi < 0) out.unshift(['Ngày', 'Diễn giải', 'Thu', 'Chi']);
  return out;
}

    st.push([`T${Number(m.slice(5))}/${m.slice(0, 4)}`, t, c, cd, c - cd, t - c, t ? Math.round((t - c) / t * 100) + '%' : '', r.length]); });
  const ws3 = XLSX.utils.aoa_to_sheet(st); ws3['!cols'] = [{ wch: 10 }, ...Array(5).fill({ wch: 15 }), { wch: 11 }, { wch: 8 }];
  money(ws3, [1, 2, 3, 4, 5], 1); XLSX.utils.book_append_sheet(wb, ws3, 'Thống kê tháng');
  // 4) Theo danh mục × tháng
  const cats = [...new Set(tx.map(x => x.cat))];
  const dm = [['Danh mục', 'Loại', ...ms.map(m => `T${Number(m.slice(5))}/${m.slice(2, 4)}`), 'Tổng']];
  cats.sort((a, b) => (cat(a).kind > cat(b).kind ? -1 : 1)).forEach(c => { const r = tx.filter(x => x.cat === c); dm.push([cat(c).name, cat(c).kind === 'thu' ? 'Thu' : 'Chi', ...ms.map(m => sum(r.filter(x => monthOf(x.date) === m)) || ''), sum(r)]); });
  const ws4 = XLSX.utils.aoa_to_sheet(dm); ws4['!cols'] = [{ wch: 28 }, { wch: 6 }, ...ms.map(() => ({ wch: 13 })), { wch: 15 }];
  money(ws4, Array.from({ length: ms.length + 1 }, (_, i) => i + 2), 1); XLSX.utils.book_append_sheet(wb, ws4, 'Theo danh mục');
  XLSX.writeFile(wb, name + '.xlsx');
  toast('Đã tải file Excel');
}

/* ============ Hộp thoại ============ */
function openDialog(title, bodyHTML, buttons, onSubmit) {
  const d = $('#dlg');
  $('#dlgTitle').textContent = title;
  $('#dlgBody').innerHTML = bodyHTML;
  $('#dlgFoot').innerHTML = buttons;
  d.onclose = null;
  $('#dlgForm').onsubmit = e => {
    const act = e.submitter?.value;
    if (act === 'cancel' || !act) return;
    const res = onSubmit(act, $('#dlgBody'));
    if (res === false) e.preventDefault();
  };
  // segmented buttons
  $$('.seg', $('#dlgBody')).forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('button', seg).forEach(x => x.classList.toggle('on', x === b));
    seg.dataset.val = b.dataset.v; seg.dispatchEvent(new Event('change'));
  }));
  d.showModal();
  setTimeout(() => $('[autofocus]', d)?.focus(), 30);
}
const segHTML = (name, opts, val) => `<div class="seg" data-name="${name}" data-val="${val}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" class="${v === val ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const catOptions = (kind, sel) => S.categories.filter(c => c.kind === kind).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
const val = (b, n) => { const el = $(`[name="${n}"]`, b) || $(`.seg[data-name="${n}"]`, b); return el?.dataset?.val ?? el?.value; };
function moneyField(name, v, label = 'Số tiền (đ)') {
  return `<label class="f">${label}<input name="${name}" inputmode="decimal" autocomplete="off" value="${v ? fmt(v) : ''}" placeholder="vd: 1,500,000 hoặc 1.5tr / 500k" required>
    <span class="hint" data-preview="${name}"></span></label>`;
}
function wireMoney(b) {
  $$('input[inputmode=decimal]', b).forEach(i => {
    const p = $(`[data-preview="${i.name}"]`, b);
    const upd = () => { const n = parseMoney(i.value); p.textContent = n ? '= ' + fmt(n) + ' đ' : ''; };
    i.addEventListener('input', upd); upd();
  });
}
function wireTypeSwitch(b) {
  const seg = $('.seg[data-name="type"]', b), sel = $('[name="cat"]', b);
  if (!seg || !sel) return;
  seg.addEventListener('change', () => { sel.innerHTML = catOptions(seg.dataset.val); });
}

function txDialog(tx, preset = {}, after) {
  const isNew = !tx;
  const x = tx || { date: UI.m === today.slice(0, 7) ? today : `${UI.m}-01`, type: 'chi', group: 'phat_sinh', cat: '', desc: '', amount: 0, note: '', ...preset };
  if (!x.cat) x.cat = S.categories.find(c => c.kind === x.type)?.id;
  openDialog(isNew ? (x.type === 'thu' ? 'Thêm khoản thu' : 'Thêm khoản chi') : 'Sửa giao dịch', `
    ${segHTML('type', [['chi', 'Chi'], ['thu', 'Thu']], x.type)}
    <label class="f">Diễn giải<input name="desc" value="${esc(x.desc)}" required ${isNew && !x.desc ? 'autofocus' : ''} placeholder="vd: Chợ + gas"></label>
    <div class="frow">${moneyField('amount', x.amount)}<label class="f">Ngày<input type="date" name="date" value="${x.date}" required></label></div>
    <div class="frow"><label class="f">Danh mục<select name="cat">${catOptions(x.type, x.cat)}</select></label>
    <label class="f">Nhóm<select name="group"><option value="co_dinh" ${x.group === 'co_dinh' ? 'selected' : ''}>Cố định</option><option value="phat_sinh" ${x.group === 'phat_sinh' ? 'selected' : ''}>Phát sinh</option></select></label></div>
    <label class="f">Ghi chú<input name="note" value="${esc(x.note || '')}" placeholder="không bắt buộc"></label>`,
    `${isNew ? '' : '<button class="btn" value="del" style="color:var(--chi);margin-right:auto" formnovalidate>Xóa</button>'}<button class="btn" value="cancel" formnovalidate>Hủy</button><button class="btn primary" value="ok">Lưu</button>`,
    (act, b) => {
      if (act === 'del') { if (!confirm('Xóa giao dịch này?')) return false; remove('tx', tx.id); logTx('del', tx); S.plans.filter(p => p.txId === tx.id).forEach(p => upsert('plans', { id: p.id, txId: undefined })); save(); render(); toast('Đã xóa'); return; }
      const amount = parseMoney(val(b, 'amount'));
      if (!amount) { alert('Vui lòng nhập số tiền'); return false; }
      const data = { date: val(b, 'date'), type: val(b, 'type'), group: val(b, 'group'), cat: val(b, 'cat'), desc: val(b, 'desc').trim(), amount, note: val(b, 'note').trim() };
      let saved;
      logTx(isNew ? 'add' : 'edit', data, isNew || tx.amount === data.amount ? {} : { prev: tx.amount });
      saved = upsert('tx', isNew ? { id: uid(), ...data, ...(preset.recId ? { recId: preset.recId } : {}) } : { id: tx.id, ...data });
      after && after(saved);
      save(); UI.m = monthOf(data.date); render(); toast('Đã lưu ' + (data.type === 'thu' ? '+' : '−') + fmt(amount));
    });
  wireMoney($('#dlgBody')); wireTypeSwitch($('#dlgBody'));
}

      upsert('recurring', { id: isNew ? uid() : r.id, ...data });

function catDialog(c) {
  const isNew = !c, x = c || { name: '', kind: 'chi' };
  const used = c ? S.tx.some(t => t.cat === c.id) || S.recurring.some(r => r.cat === c.id) || S.plans.some(p => p.cat === c.id) : false;
  openDialog(isNew ? 'Thêm danh mục' : 'Sửa danh mục', `
    ${isNew ? segHTML('kind', [['chi', 'Chi'], ['thu', 'Thu']], x.kind) : ''}
    <label class="f">Tên danh mục<input name="name" value="${esc(x.name)}" required autofocus></label>
    ${used ? '<p class="hint">Danh mục đang được dùng nên không thể xóa.</p>' : ''}`,
    `${!isNew && !used ? '<button class="btn" value="del" style="color:var(--chi);margin-right:auto" formnovalidate>Xóa</button>' : ''}<button class="btn" value="cancel" formnovalidate>Hủy</button><button class="btn primary" value="ok">Lưu</button>`,
    (act, b) => {
      if (act === 'del') { remove('categories', c.id); setBudget('default', c.id, null); save(); render(); return; }
      const name = val(b, 'name').trim();
      upsert('categories', isNew ? { id: 'c_' + uid(), name, kind: val(b, 'kind') } : { id: c.id, name });
      save(); render();
    });
}

function findOcc(key) {
  if (key.startsWith('p|')) { const p = S.plans.find(q => q.id === key.slice(2)); return p && { kind: 'plan', ref: p, key }; }
  const [m, rid] = key.split('|'); const r = S.recurring.find(q => q.id === rid);
  return r && { kind: 'rec', ref: r, key, m };
}

/* ============ Gắn sự kiện ============ */
function bindView(v) {
  v.onclick = e => {
    const gm = e.target.closest('[data-gomonth]');
    if (gm && !e.target.closest('button')) { UI.m = gm.dataset.gomonth; UI.tab = 'ledger'; render(); return; }
    const t = e.target.closest('button,[data-go]'); if (!t) return;
    const d = t.dataset;
    if (d.go) { UI.tab = d.go; render(); }
    else if (d.import !== undefined) importDialog();
    else if (d.xlsx) exportXlsx(d.xlsx);
    else if (d.year) { UI.m = addMonth(UI.m, 12 * Number(d.year)); render(); }
    else if (d.range) { setRange(d.range); render(); }
    else if (d.more !== undefined) { UI.h.limit += 300; render(); }
    else if (d.edit) txDialog(S.tx.find(x => x.id === d.edit));
    else if (d.newplan !== undefined) planDialog();
    else if (d.editplan) planDialog(S.plans.find(p => p.id === d.editplan));
    else if (d.newrec !== undefined) recDialog();
    else if (d.editrec) recDialog(S.recurring.find(r => r.id === d.editrec));
    else if (d.newcat !== undefined) catDialog();
    else if (d.editcat) catDialog(S.categories.find(c => c.id === d.editcat));
    else if (d.mode) { UI.budMode = d.mode; render(); }
    else if (d.pay) {
      const o = findOcc(d.pay); if (!o) return;
      if (o.kind === 'rec') {
        const r = o.ref, date = `${o.m}-${pad(Math.min(r.day, daysIn(o.m)))}`;
        txDialog(null, { type: r.type, group: r.group, cat: r.cat, desc: `${r.name} T${Number(o.m.slice(5))}`, amount: r.amount, date: date <= today ? date : today, recId: r.id });
      } else {
        const p = o.ref;
        txDialog(null, { type: p.type, group: p.group, cat: p.cat, desc: p.name, amount: p.amount, note: p.note, date: p.date <= today ? p.date : today }, saved => { upsert('plans', { id: p.id, txId: saved.id }); });
      }
    }
    else if (d.skip) { const o = findOcc(d.skip); if (o.kind === 'rec') setSkip(d.skip, true); else upsert('plans', { id: o.ref.id, skipped: true }); save(); render(); }
    else if (d.unskip) { const o = findOcc(d.unskip); if (o.kind === 'rec') setSkip(d.unskip, false); else upsert('plans', { id: o.ref.id, skipped: undefined }); save(); render(); }
  };
  // bộ lọc sổ
  const fq = $('#fq', v);
  if (fq) {
    fq.oninput = () => { UI.f.q = fq.value; const pos = fq.selectionStart; render(); const n = $('#fq'); n.focus(); n.setSelectionRange(pos, pos); };
    [['#ftype', 'type'], ['#fgroup', 'group'], ['#fcat', 'cat']].forEach(([s, k]) => $(s, v).onchange = e => { UI.f[k] = e.target.value; render(); });
  }
  // lịch sử
  const hq = $('#hq', v);
  if (hq) {
    hq.oninput = () => { UI.h.q = hq.value; const pos = hq.selectionStart; render(); const n = $('#hq'); n.focus(); n.setSelectionRange(pos, pos); };
    $('#htype', v).onchange = e => { UI.h.type = e.target.value; render(); };
    $('#hcat', v).onchange = e => { UI.h.cat = e.target.value; render(); };
    $('#hfrom', v).onchange = e => { UI.h.from = e.target.value; UI.h.range = ''; render(); };
    $('#hto', v).onchange = e => { UI.h.to = e.target.value; UI.h.range = ''; render(); };
  }
  $('#devName', v) && ($('#devName', v).onchange = e => { try { localStorage.setItem(KEY + '-dev', e.target.value.trim()); } catch (er) {} toast('Đã lưu tên máy'); });
  // ngân sách
  $$('input.bud', v).forEach(i => i.onchange = () => {
    const n = i.value.trim() === '' ? null : parseMoney(i.value);
    setBudget(UI.budMode === 'month' ? UI.m : 'default', i.dataset.cat, n);
    save(); render(); toast('Đã cập nhật ngân sách');
  });
  $('#syConnect', v) && ($('#syConnect', v).onclick = connectSync);
  $('#syNow', v) && ($('#syNow', v).onclick = () => syncNow());
  $('#syOff', v) && ($('#syOff', v).onclick = () => { if (!confirm('Ngắt đồng bộ trên máy này? Dữ liệu trên máy và trên Google Sheet vẫn giữ nguyên.')) return; SY.cfg.linked = false; saveCfg(); render(); });
  paintSync();
  $('#bk', v) && ($('#bk', v).onclick = () => download(`thu-chi-me-van-${today}.json`, JSON.stringify(S, null, 1), 'application/json'));
  $('#rs', v) && ($('#rs', v).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (!d.tx || !d.categories) throw 0; if (!confirm(`Khôi phục ${d.tx.length} giao dịch? Dữ liệu hiện tại${syncOn() ? ' (và dữ liệu trên Google Sheet)' : ''} sẽ bị thay thế.`)) return; S = normalize(d); saveLocal(); syncNow('force'); UI.m = defaultMonth(); render(); toast('Đã khôi phục'); }
    catch { alert('File sao lưu không hợp lệ'); }
  });
  $('#reset', v) && ($('#reset', v).onclick = () => { if (!confirm('Xóa toàn bộ dữ liệu và nạp lại dữ liệu mẫu tháng 8/2026?' + (syncOn() ? ' Dữ liệu trên Google Sheet cũng bị thay thế.' : ''))) return; S = seedState(); saveLocal(); syncNow('force'); UI.m = defaultMonth(); render(); });
}

async function connectSync() {
  const cfg = { url: $('#syUrl').value.trim(), key: $('#syKey').value.trim() };
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(cfg.url)) { alert('Địa chỉ đồng bộ phải có dạng https://script.google.com/macros/s/…/exec'); return; }
  if (!cfg.key) { alert('Vui lòng nhập mã bảo mật'); return; }
  const btn = $('#syConnect'); btn.disabled = true; btn.textContent = 'Đang kết nối…';
  try {
    const res = await api('load', {}, cfg);
    if (!res.ok) throw new Error(res.error || 'Không kết nối được');
    let mode = 'merge';
    if (res.data && (res.data.tx || []).length) {
      mode = confirm(`Google Sheet đã có ${res.data.tx.length} giao dịch.\n\nOK = Dùng dữ liệu trên Google Sheet (khuyên dùng khi mở trên máy mới).\nHủy = Gộp chung với dữ liệu đang có trên máy này.`) ? 'remote' : 'merge';
    }
    SY.cfg = { ...cfg, linked: true }; saveCfg();
    await syncNow(mode);
    render(); toast(SY.state === 'ok' ? 'Đã kết nối đồng bộ' : 'Kết nối lỗi: ' + SY.msg);
  } catch (e) {
    alert('Không kết nối được: ' + e.message); btn.disabled = false; btn.textContent = 'Kết nối';
  }
}
$('#syncChip').onclick = () => { UI.tab = 'settings'; render(); setTimeout(() => $('#syncCard')?.scrollIntoView({ behavior: 'smooth' }), 50); };

$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; UI.tab = b.dataset.tab; try { localStorage.setItem(KEY + '-tab', UI.tab); } catch (e) {} render(); };
$('#mPrev').onclick = () => { UI.m = addMonth(UI.m, -1); render(); };
$('#mNext').onclick = () => { UI.m = addMonth(UI.m, 1); render(); };
$$('[data-add]').forEach(b => b.onclick = () => txDialog(null, { type: b.dataset.add, group: 'phat_sinh' }));

render();
paintSync();
syncNow();
</script>
</body>
</html>
