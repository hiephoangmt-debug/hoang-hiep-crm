<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Căn hộ Sun FourS Tower</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Căn hộ dành riêng cho quý khách – Sun FourS Tower">
<meta property="og:image" content="bh-img/fours-pk-f2-f3.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,600&family=Great+Vibes&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--br:#2b1a0b;--br2:#5a3a16;--gd:#c9a25a;--gd2:#f3d38a;--cr:#f7efe2;--ink:#2a2118;--mut:#7a6b5a;--red:#d32f2f;--line:#eadfcd}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:#fffdf9;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
/* header */
.hd{position:fixed;inset:0 0 auto 0;z-index:30;transition:background .3s,box-shadow .3s}
.hd .wrap{display:flex;align-items:center;gap:12px;height:62px}
.hd img{height:38px;background:#fff;border-radius:8px;padding:3px 8px}
.hd b{flex:1;color:#fff;font-size:14px;letter-spacing:.14em;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.hd.on{background:rgba(43,26,11,.92);backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:12px 22px;font:700 15px 'Be Vietnam Pro',sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.b-gd{background:linear-gradient(135deg,#f3d38a,#c9a25a);color:#2b1a0b;box-shadow:0 6px 20px rgba(201,162,90,.45)}
.b-gl{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(4px)}
.b-zl{background:#0068ff;color:#fff}
.hd .btn{padding:8px 16px;font-size:13px}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);animation:kb 14s ease-out forwards}
@keyframes kb{to{transform:scale(1)}}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,12,4,.45) 0%,rgba(20,12,4,.05) 30%,rgba(20,12,4,.55) 60%,rgba(20,12,4,.94) 100%)}
.hero .wrap{position:relative;z-index:1;padding-bottom:42px;width:100%}
.kick{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gd2);font-weight:700}
.hero h1{font-size:clamp(54px,13vw,120px);line-height:.95;margin:8px 0 12px;font-weight:900;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);backdrop-filter:blur(4px);border-radius:99px;padding:5px 13px;font-size:13.5px;font-weight:600}
.hview{margin:12px 0 0;font-size:15px;opacity:.92}
.hprice{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:20px 0 18px}
.hprice span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gd2)}
.hprice b{font-size:clamp(38px,8vw,58px);font-weight:900;line-height:1}
.hprice s{opacity:.7;font-size:15px}
.hcta{display:flex;gap:10px;flex-wrap:wrap}
.cd{margin-top:18px;display:inline-flex;gap:10px;align-items:center;background:rgba(211,47,47,.9);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600}
.cd b{font-variant-numeric:tabular-nums;font-size:15px;letter-spacing:.04em}
.scroll{position:absolute;left:50%;bottom:10px;z-index:1;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;opacity:.7;animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translate(-50%,5px)}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-34px;position:relative;z-index:2}
.st{background:#fff;border-radius:18px;padding:16px 14px;box-shadow:0 10px 30px rgba(60,40,10,.12);border-top:4px solid var(--gd);text-align:center}
.st span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--br2)}
.st b{display:block;font-size:42px;font-weight:900;line-height:1.1;margin:4px 0;background:linear-gradient(180deg,#b07a26,#4a2e0c);-webkit-background-clip:text;background-clip:text;color:transparent}
.st b i{font-style:normal;font-size:18px}
.st small{display:block;font-size:12.5px;color:var(--mut);line-height:1.4}.st small b{display:inline;font-size:inherit;color:var(--br);-webkit-text-fill-color:var(--br);background:none;margin:0}
.st em{display:block;font-style:normal;font-size:10.5px;color:#a89580;margin-top:3px}
/* sections */
section.s{padding:70px 0 10px}
.sh{text-align:center;margin-bottom:26px}
.sh i{font-style:normal;font-family:'Playfair Display',serif;font-size:15px;color:var(--gd);letter-spacing:.1em}
.sh h2{margin:6px 0 6px;font-size:clamp(26px,5vw,38px);color:var(--br);font-weight:800;line-height:1.2}
.sh p{margin:0;color:var(--mut);font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 26px rgba(60,40,10,.07)}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 18px;font:600 14px 'Be Vietnam Pro',sans-serif;color:var(--br2);cursor:pointer}
.tabs button.on{background:var(--br);border-color:var(--br);color:#fff}
.pane{display:none}.pane.on{display:block}
.tw3d{cursor:grab;touch-action:none;user-select:none;max-width:560px;margin:0 auto}.tw3d:active{cursor:grabbing}.tw3d svg{display:block;width:100%;height:auto}
.hint{text-align:center;font-size:12.5px;color:var(--mut);padding:8px 0 14px}
.plan{position:relative}.plan svg{position:absolute;inset:0;width:100%;height:100%}
.view{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:16/9;min-height:300px}
.view img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.view div{position:absolute;inset:auto 0 0 0;padding:90px 26px 24px;background:linear-gradient(transparent,rgba(20,12,4,.88));color:#fff}
.view b{font-size:clamp(22px,4vw,32px);display:block}.view small{opacity:.8;font-size:12.5px}
.lay{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
.lay .card{padding:10px}.lay .card img{max-height:620px;margin:0 auto;object-fit:contain}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spec div{background:var(--cr);border-radius:14px;padding:12px 14px}
.spec span{display:block;font-size:12px;color:var(--mut)}.spec b{font-size:19px;color:var(--br)}
.spec .w{grid-column:1/-1}
.map{position:relative;border-radius:24px;overflow:hidden}
.band{position:absolute;left:61%;width:18%;height:2.4%;transform:translateY(-50%);background:rgba(229,57,53,.85);box-shadow:0 0 0 2px #fff,0 0 18px 6px rgba(255,80,60,.75);border-radius:3px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px #fff,0 0 30px 12px rgba(255,80,60,.55)}}
.pin{position:absolute;left:81%;transform:translateY(-50%);background:var(--red);color:#fff;border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap}
.pin b{display:block;font-size:16px}.pin::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);border:8px solid transparent;border-right-color:var(--red);border-left:0}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.gal figure{margin:0;border-radius:16px;overflow:hidden;position:relative}.gal img{width:100%;aspect-ratio:16/10;height:auto;object-fit:cover;transition:transform .6s}.gal figure:hover img{transform:scale(1.06)}
.gal figcaption{position:absolute;inset:auto 0 0 0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-weight:700;font-size:14px}
.plans{display:flex;gap:8px;overflow-x:auto;padding:10px 4px 6px;margin-bottom:14px;scrollbar-width:none;justify-content:center}
.plans button{flex:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font:600 13.5px 'Be Vietnam Pro',sans-serif;color:var(--br2);cursor:pointer;position:relative}
.plans button.on{background:var(--br);color:#fff;border-color:var(--br)}
.plans button sup{position:absolute;top:-8px;right:-4px;background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:1px 6px}
.pbox{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pbox div{border-radius:18px;padding:18px;background:var(--cr);text-align:center}
.pbox div.hot{background:linear-gradient(135deg,#2b1a0b,#6b4520);color:#fff}
.pbox span{display:block;font-size:12.5px;opacity:.8}.pbox b{display:block;font-size:clamp(24px,4.4vw,32px);font-weight:900;margin:4px 0}.pbox small{font-size:12px;opacity:.75}
.pnote{text-align:center;color:var(--mut);font-size:13px;margin:12px 0 0}
.why{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.why div{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.5}
.why div::before{content:'✦';color:var(--gd);font-size:18px;line-height:1.3}
.final{margin:70px 0 0;background:linear-gradient(135deg,#1e1206,#5a3a16);color:#fff;padding:60px 0 120px;text-align:center;position:relative;overflow:hidden}
.final::before{content:'';position:absolute;inset:0;background:url(bh-img/fours-pk-hoang-hon.jpg) center/cover;opacity:.18}
.final .wrap{position:relative}
.final i{font-style:normal;color:var(--gd2);letter-spacing:.2em;font-size:12px;text-transform:uppercase;font-weight:700}
.final h2{font-size:clamp(26px,5vw,40px);margin:10px 0}
.final p{opacity:.85;margin:0 0 22px}
.av{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,#f3d38a,#c9a25a);color:#2b1a0b;display:grid;place-items:center;font-size:30px;font-weight:900;margin:0 auto 10px}
.final .nm{font-size:20px;font-weight:800}.final .tt{opacity:.75;font-size:14px;margin-bottom:18px}
.foot{font-size:11.5px;opacity:.6;margin-top:30px;line-height:1.6}
.bar{position:fixed;inset:auto 0 0 0;z-index:40;display:none;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,253,249,.96);backdrop-filter:blur(8px);box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.bar .btn{flex:1;padding:13px 10px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
.err{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px;color:var(--mut)}
@media(max-width:760px){
  .stats{grid-template-columns:1fr 1fr;gap:10px}.st b{font-size:34px}
  .lay,.why,.pbox{grid-template-columns:1fr}.gal{grid-template-columns:1fr 1fr}.gal figure:first-child{grid-column:1/-1}
  .view{min-height:220px}.bar{display:flex}.hd .btn{display:none}
  section.s{padding-top:54px}.pin{font-size:11px;padding:4px 8px}.pin b{font-size:13px}
  .plans{justify-content:flex-start}
}
@media print{
  @page{size:A4;margin:0}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff}.hd,.bar,.scroll,.hint,.tabs,.plans,.pdfb,.hcta{display:none!important}
  .rv{opacity:1!important;transform:none!important;transition:none!important}
  .wrap{max-width:none;padding:0 12mm}
  .hero{min-height:0;height:140mm}.cd{margin-top:8px}.hprice{margin:10px 0 0}.hero>img{animation:none;transform:none}.hero .wrap{padding-bottom:10mm}.hero h1{font-size:76px}
  .stats{margin-top:-10mm;gap:3mm}.st{box-shadow:none;border:1px solid var(--line);border-top:4px solid var(--gd);padding:10px}.st b{font-size:34px;color:#6b4520!important;background:none!important}
  section.s{padding:5mm 0 0;break-inside:avoid}.sh h2{font-size:21px!important}.sh{margin-bottom:3mm!important}.swhy{padding-top:6mm!important}.swhy .sh{margin-bottom:3mm}.swhy h2{font-size:20px!important}.sh{margin-bottom:5mm}.sh h2{font-size:24px}
  .pg{break-before:page;padding-top:12mm!important}
  .pane{display:block!important}.pane+.pane{margin-top:4mm}.card{box-shadow:none}
  .tw3d{max-width:92mm}.view{min-height:0;aspect-ratio:16/9;height:auto}.view img{min-height:0;height:100%}.lay{grid-template-columns:100mm 1fr}.lay .card img{max-height:118mm}.spec b{font-size:16px}.spec div{padding:8px 12px}
  .gal img{height:auto;aspect-ratio:2/1;object-fit:cover}.gal{margin-top:3mm}.map img{width:100%;height:auto;max-height:none}.ptab{font-size:11.5px!important}.ptab th,.ptab td{padding:4px 8px!important}.pnote{margin-top:4px}
  .pbox{display:none}.ptab{display:table!important}
  .s5{padding-top:4mm!important}.final{margin-top:5mm;padding:6mm 0 6mm;break-inside:avoid}.final h2{font-size:24px;margin:4px 0}.final p{display:none}.final i{display:none}.final .nm{font-size:16px}.final .tt{font-size:12px}.foot{margin-top:4px!important}.final .tt{margin-bottom:4px}.final .ph{display:block!important;font-size:22px!important}.final .av{display:none}.final h2{font-size:21px!important}.final::before{opacity:.12}.av{width:52px;height:52px;font-size:22px}
  .why div{padding:8px 12px;font-size:12.5px;break-inside:avoid}.foot{margin-top:12px}
}
.ptab{display:none;width:100%;border-collapse:collapse;font-size:13px}.ptab th,.ptab td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}.ptab th:first-child,.ptab td:first-child{text-align:left}.ptab th{color:var(--mut);font-weight:600;background:var(--cr)}.ptab tr.best td{font-weight:800;color:var(--br)}
.pdfb{position:fixed;right:16px;bottom:18px;z-index:41;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media(max-width:760px){.pdfb{bottom:84px;right:12px;padding:10px 14px;font-size:13px}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.hero>img{animation:none;transform:none}}

/* ===== Phong cách sang trọng: nền tối, vàng champagne, chữ có chân ===== */
:root{--bg:#0d0a07;--bg2:#15100b;--bg3:#1c160f;--gold:#d6b46a;--gold2:#f1dca4;--hair:rgba(214,180,106,.32);--txt:#ece3d2;--txt2:#b6a68c}
body{background:var(--bg);color:var(--txt)}
.serif,.hero h1,.sh h2,.st>b,.hprice b,.final h2,.pbox b,.spec b,.view b{font-family:'Playfair Display',Georgia,serif}
.gold-t,.sh h2,.st>b,.hprice b{background:linear-gradient(180deg,#f7e7b8 0%,#d6b46a 55%,#9c7a34 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd.on{background:rgba(13,10,7,.88);border-bottom:1px solid var(--hair)}
.hd b{font-family:'Playfair Display',serif;letter-spacing:.32em;font-weight:700}
.hero::after{background:linear-gradient(180deg,rgba(13,10,7,.55) 0%,rgba(13,10,7,0) 28%,rgba(13,10,7,.35) 55%,rgba(13,10,7,.97) 100%)}
.kick{color:var(--gold);letter-spacing:.38em;font-size:11px}
.kick::before{content:'';display:inline-block;width:38px;height:1px;background:var(--gold);vertical-align:middle;margin-right:12px}
.hero h1{font-weight:700;letter-spacing:.03em;font-size:clamp(58px,13vw,128px);text-shadow:0 6px 40px rgba(0,0,0,.5)}
.chips span{background:transparent;border:1px solid var(--hair);color:var(--gold2);font-weight:500;letter-spacing:.04em;border-radius:2px}
.hprice span{color:var(--gold);letter-spacing:.3em}.hprice b{font-weight:700}
.btn{border-radius:2px;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.b-gd{background:linear-gradient(135deg,#f1dca4,#c9a25a 60%,#a17c38);box-shadow:0 10px 30px rgba(201,162,90,.25)}
.b-gl{border-color:var(--hair);color:var(--gold2)}
.b-zl{background:transparent;border:1px solid var(--gold);color:var(--gold2)}
.cd{background:transparent;border:1px solid rgba(229,57,53,.6);border-radius:2px;color:#ffcdc9}
.stats{margin-top:-30px;gap:0;border:1px solid var(--hair);background:rgba(13,10,7,.92);backdrop-filter:blur(6px)}
.st{background:transparent;box-shadow:none;border:0;border-radius:0;border-right:1px solid var(--hair);padding:22px 14px}.st:last-child{border-right:0}
.st span{color:var(--gold);letter-spacing:.22em;font-weight:600;font-size:10.5px}
.st>b{font-size:50px;font-weight:700;margin:6px 0 4px}.st>b i{font-size:20px}
.st small{color:var(--txt2)}.st small b{color:var(--gold2);-webkit-text-fill-color:var(--gold2)}.st em{color:#8a7b63}
section.s{padding:90px 0 10px}
.sh i{font-family:'Be Vietnam Pro',sans-serif;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
.sh h2{font-weight:700;font-size:clamp(30px,5.4vw,46px);margin:12px 0 10px}
.sh p{color:var(--txt2);letter-spacing:.04em}
.sh::after{content:'';display:block;width:64px;height:1px;background:var(--gold);margin:16px auto 0;box-shadow:0 0 0 0}
.card{background:var(--bg2);border:1px solid var(--hair);border-radius:4px;box-shadow:none}
.tabs button{background:transparent;border:1px solid var(--hair);color:var(--txt2);border-radius:2px;letter-spacing:.06em}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#1a1209}
.hint{color:#8a7b63}
.tw3d{background:#f4efe6;border-radius:3px;padding:6px}
.plan{background:#fff;border-radius:3px;overflow:hidden}
.view{border-radius:4px;border:1px solid var(--hair)}.view div{background:linear-gradient(transparent,rgba(13,10,7,.92))}.view b{font-weight:700;letter-spacing:.02em}
.lay .card{background:#f7f3ec}
.spec div{background:var(--bg2);border:1px solid var(--hair);border-radius:2px}
.spec span{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}.spec b{color:var(--txt);font-weight:700;font-size:21px}
.map{border-radius:4px;border:1px solid var(--hair)}
.gal figure{border-radius:3px;border:1px solid var(--hair)}.gal figcaption{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;letter-spacing:.02em}
.plans button{background:transparent;border:1px solid var(--hair);color:var(--txt2);border-radius:2px}
.plans button.on{background:var(--gold);color:#1a1209;border-color:var(--gold)}
.pbox div{background:var(--bg2);border:1px solid var(--hair);border-radius:2px}.pbox div.hot{background:linear-gradient(135deg,#2a1f12,#4a3518);border-color:var(--gold)}
.pbox span{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;opacity:1}.pbox b{color:var(--gold2);font-weight:700}.pbox small{color:var(--txt2)}
.pnote{color:#8a7b63}
.ptab th{background:transparent;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:10.5px;border-bottom:1px solid var(--gold)}
.ptab td{border-bottom:1px solid var(--hair);color:var(--txt)}.ptab tr.best td{color:var(--gold2)}
.why div{background:transparent;border:0;border-top:1px solid var(--hair);border-radius:0;color:var(--txt);padding:16px 4px}
.why div::before{content:'◆';color:var(--gold);font-size:11px;line-height:2}
.why b{color:var(--gold2)}
.final{background:var(--bg);border-top:1px solid var(--hair)}.final::before{opacity:.22}
.final i{color:var(--gold);letter-spacing:.4em}.final h2{font-weight:700}
.av{background:transparent;border:1px solid var(--gold);color:var(--gold2);font-family:'Playfair Display',serif}
.foot{color:#8a7b63;opacity:1}
.bar{background:rgba(13,10,7,.95);border-top:1px solid var(--hair)}
.pin{background:#b71c1c;border-radius:2px;border:1px solid rgba(255,255,255,.6)}
.err{color:var(--txt2)}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.st:nth-child(2){border-right:0}.st:nth-child(-n+2){border-bottom:1px solid var(--hair)}.st>b{font-size:40px}}
@media print{
  html,body{background:var(--bg)!important}
  .wrap{padding:0 12mm}
  .stats{margin-top:-8mm}.st{padding:10px}.st>b{font-size:36px;color:var(--gold)!important;-webkit-text-fill-color:var(--gold)!important;background:none!important}

    <table class="ptab"><thead><tr>${TX.th.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${plans.map(p => `<tr class="${p === best ? 'best' : ''}"><td>${E(trPlan(p.name))}${p === best ? ' ★' : ''}</td><td>${money(p.total)}</td><td>${money(p.own)}</td><td>${money(p.first)}</td></tr>`).join('')}</tbody></table><p class="pnote" data-x="${E(TX.pnote2)}">${TX.pnote}</p>
  </div></section>



  <div class="final"><div class="wrap"><i>${TX.fk}</i><h2>${TX.fh(E(D.c))}</h2><p>${TX.fp}</p>
    <div class="av">${E(String(D.n || 'S').trim().split(/\s+/).pop()[0] || 'S')}</div><div class="nm">${E(D.n)}</div><div class="tt">${E(trTitle(D.ti))}</div><div class="ph" style="display:none;font-size:26px;font-weight:900;color:#f3d38a">📞 ${E(D.ph)} · Zalo</div>
    <div class="hcta" style="justify-content:center"><a class="btn b-gd" href="${tel}">📞 ${E(D.ph)}</a><a class="btn b-zl" href="${zalo}" target="_blank" rel="noopener">💬 Chat Zalo</a><button class="btn b-gl cpb" type="button">${TX.copy}</button><button class="btn b-gl shb" type="button">${TX.share}</button></div>
    <div class="foot">${TX.foot}</div></div></div>
  <div class="fbtn"><button class="btn b-gl cpb" type="button">${TX.copy}</button><button class="btn b-gl shb" type="button">${TX.share}</button><button class="btn b-gd pdfb" id="pdfb">${TX.pdf}</button></div><div class="toastc" id="toastc"></div><div class="thm" title="Đổi màu"><button data-th="cham" aria-label="Champagne"></button><button data-th="navy" aria-label="Navy cam"></button></div>
  <div class="lng">${[['vi', 'VI'], ['en', 'EN'], ['ko', '한국어']].map(([k, t]) => `<button data-lg="${k}" class="${k === LANG ? 'on' : ''}">${t}</button>`).join('')}</div>
  <div class="bar"><a class="btn b-gd" href="${tel}">${TX.callNow}</a><a class="btn b-zl" href="${zalo}" target="_blank" rel="noopener">💬 Zalo</a><button class="btn b-gl cpb bsh" type="button" aria-label="${TX.copy}">📋</button><button class="btn b-gl shb bsh" type="button" aria-label="${TX.share}">🔗</button><button class="btn b-gl bpdf" type="button">⬇ PDF</button></div>`;

  setTh(TH); app.querySelectorAll('[data-th]').forEach(b => b.onclick = () => setTh(b.dataset.th));
  app.querySelectorAll('[data-lg]').forEach(b => b.onclick = () => { hp.set('lang', b.dataset.lg); hp.delete('print'); location.hash = hp.toString(); location.reload(); });
  // khối 3D: mái là mặt bằng tầng của căn
  window.planOf = () => ({img: (img(D.pl) || 'bh-img/mat-bang-tang-8-19-toa-f2-fours-tower.jpg').replace('bh-img/sach/', 'bh-img/')}); /* khối 3D tự đổi sang bản sạch */ window.TW_ROOF = 'cdt';
  const U0 = {u: D.u, floor: D.f, code: D.c}, tw = document.getElementById('tw');
  let rot = 0, k = .574; const TWL = {en: [['Sông Hàn · biển · pháo hoa DIFF', 'Han River · Sea · DIFF fireworks'], ['Ngũ Hành Sơn · CV Đầm Sen', 'Marble Mtns · Dam Sen Park'], ['Nội khu · Nam Hòa Xuân', 'Internal amenities · Nam Hoa Xuan'], ['Sông · Sunneva', 'River · Sunneva Island'], [/ · tầng (\w+)/g, ' · floor $1'], ['Mái: mặt bằng tầng của căn (khung đỏ) · minh họa, không theo tỉ lệ', 'Roof: floor plan of the unit (red frame) · illustrative, not to scale']],
    ko: [['Sông Hàn · biển · pháo hoa DIFF', '한강 · 바다 · DIFF 불꽃축제'], ['Ngũ Hành Sơn · CV Đầm Sen', '오행산 · 담센 공원'], ['Nội khu · Nam Hòa Xuân', '단지 내부 · 남호아쑤언'], ['Sông · Sunneva', '강 · 선네바 아일랜드'], [/ · tầng (\w+)/g, ' · $1층'], ['Mái: mặt bằng tầng của căn (khung đỏ) · minh họa, không theo tỉ lệ', '옥상: 해당 층 평면도 (빨간 테두리) · 참고용, 축척 아님']]}[LANG] || [];
  const draw = () => { let h = towerSVGraw(U0, rot, k); TWL.forEach(([a, b]) => { h = h.split ? (a instanceof RegExp ? h.replace(a, b) : h.split(a).join(b)) : h; }); tw.innerHTML = h; }; draw();
  let G = null, raf = 0;
  tw.addEventListener('pointerdown', e => { G = {x: e.clientX, y: e.clientY, r: rot, k}; tw.setPointerCapture(e.pointerId); });
  tw.addEventListener('pointermove', e => { if (!G) return; rot = G.r + (e.clientX - G.x) * .012; k = Math.min(.92, Math.max(.32, G.k + (e.clientY - G.y) * .004)); if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); });
  ['pointerup', 'pointercancel'].forEach(t => tw.addEventListener(t, () => G = null));
  tw.addEventListener('dblclick', () => { rot = 0; k = .574; draw(); });
  // tự xoay nhẹ khi mới vào khung nhìn để khách biết là xoay được
  let spun = false; new IntersectionObserver(es => es.forEach(en => { if (!en.isIntersecting || spun) return; spun = true; const t0 = performance.now();
    const step = t => { const p = Math.min(1, (t - t0) / 2200); rot = Math.sin(p * Math.PI * 2) * .55; draw(); if (p < 1 && !G) requestAnimationFrame(step); else if (!G) { rot = 0; draw(); } }; requestAnimationFrame(step); }), {threshold: .5}).observe(tw);

  // layout 3D: nghiêng mặt bằng căn như mô hình, kéo để xoay
  const stage = document.getElementById('stage'), slab = document.getElementById('slab'); let lr = -28, lt = 52, l3 = !!img(D.wl), LG = null; /* ảnh layout đã là 3D (căn sân vườn) thì hiện thẳng */
  const lset = () => { slab.style.transform = l3 ? `rotateX(${lt}deg) rotateZ(${lr}deg) scale(.98)` : 'none'; stage.classList.toggle('d3', l3); }; lset();
  app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { l3 = b.dataset.l === '3d'; app.querySelectorAll('[data-l]').forEach(x => x.classList.toggle('on', x === b)); lset(); });
  stage.addEventListener('pointerdown', e => { if (!l3) return; LG = {x: e.clientX, y: e.clientY, r: lr, t: lt}; slab.style.transition = 'none'; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => { if (!LG) return; lr = LG.r + (e.clientX - LG.x) * .35; lt = Math.min(70, Math.max(0, LG.t - (e.clientY - LG.y) * .25)); lset(); });
  ['pointerup', 'pointercancel'].forEach(t => stage.addEventListener(t, () => { LG = null; slab.style.transition = ''; }));

  // Chia sẻ: điện thoại mở bảng chia sẻ (Zalo, Messenger…); máy tính copy link (bỏ phần tự in PDF)
  const shareUrl = () => { if (sid) { const lg = new URLSearchParams(location.hash.slice(1)).get('lang'); return location.origin + '/c/' + sid + (lg ? '?lang=' + lg : ''); } const h = new URLSearchParams(location.hash.slice(1)); h.delete('print'); return location.href.split('#')[0] + '#' + h.toString(); };
  const toastc = m => { const t = document.getElementById('toastc'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600); };
  const doShare = async () => { const url = shareUrl(), title = TX.shareT(D.c);
    if (navigator.share) { try { await navigator.share({title, text: title + (D.n ? ' · ' + D.n + ' ' + (D.ph || '') : ''), url}); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(url); } catch (_) { const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); }
    toastc(TX.copied); };
  const doCopy = async () => { const url = shareUrl(), msg = `${TX.shareT(D.c)}\n${url}${D.ph ? '\n' + (D.n || '') + ' · ' + D.ph : ''}`;
    try { await navigator.clipboard.writeText(msg); } catch (_) { const ta = document.createElement('textarea'); ta.value = msg; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); }
    toastc(TX.copied); };
  app.querySelectorAll('.shb').forEach(b => b.onclick = doShare); app.querySelectorAll('.cpb').forEach(b => b.onclick = doCopy);
  // tabs
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { app.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b)); app.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === b.dataset.tab)); });
  // phương án thanh toán
  const pbox = document.getElementById('pbox');
  const showP = i => { const p = plans[i]; if (!p) return; app.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('on', +b.dataset.p === i));
    pbox.innerHTML = `<div class="hot"><span>${TX.pTot}</span><b>${ty(p.total)}</b><small>${money(p.total)} ${LANG === 'vi' ? 'đ' : 'VND'}</small></div><div><span>${TX.pOwn}</span><b>${ty(p.own)}</b><small>${E(trPlan(p.name))}</small></div><div><span>${TX.pFirst}</span><b>${ty(p.first)}</b><small>${p.dep ? TX.fNote(ty(p.dep), ty(p.first - p.dep), p.fp) : TX.pDisc + ' ' + ty(p.disc)}</small></div>`; };
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => showP(+b.dataset.p)); showP(Math.max(0, plans.indexOf(best)));
  // đếm ngược hạn chính sách
  const cd = document.getElementById('cd'), end = D.dl ? new Date(D.dl + 'T23:59:59+07:00').getTime() : 0;
  const tick = () => { if (!cd) return; let s = Math.max(0, Math.floor((end - Date.now()) / 1000)); const dd = Math.floor(s / 86400); s %= 86400;
    cd.textContent = `${dd} ${TX.days} ${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  if (cd) { tick(); setInterval(tick, 1000); }
  // header + hiệu ứng xuất hiện + đếm số
  const hd = document.getElementById('hd'); addEventListener('scroll', () => hd.classList.toggle('on', scrollY > 40), {passive: true});
  const io = new IntersectionObserver(es => es.forEach(en => { if (!en.isIntersecting) return; en.target.classList.add('in'); io.unobserve(en.target);
    const b = en.target.querySelector('b[data-n]'); if (b && /^[\d.,]+$/.test(b.dataset.n)) { const tgt = parseFloat(b.dataset.n.replace(',', '.')), dec = /[.,]/.test(b.dataset.n), u = b.querySelector('i').outerHTML, t0 = performance.now();
      const st = t => { const p = Math.min(1, (t - t0) / 1100), v = tgt * (1 - Math.pow(1 - p, 3)); b.innerHTML = (dec ? v.toLocaleString('vi-VN', {maximumFractionDigits: 1}) : Math.round(v)) + u; if (p < 1) requestAnimationFrame(st); }; requestAnimationFrame(st); } }), {threshold: .15});
  app.querySelectorAll('.rv').forEach(x => io.observe(x)); setTimeout(() => app.querySelectorAll('.rv').forEach(x => x.classList.add('in')), 5000); // dự phòng: luôn hiện đủ nội dung
  // Tải PDF: in trang (chọn "Lưu dưới dạng PDF"); ?print=1 từ CRM thì tự mở hộp thoại in khi ảnh tải xong
  // gọi print() NGAY trong lần bấm (Safari/Mac chặn hộp thoại in nếu gọi trễ sau setTimeout)
  const doPrint = () => { app.querySelectorAll('.rv').forEach(x => x.classList.add('in')); document.title = ({vi: 'Chi-can-', en: 'Unit-', ko: 'Unit-KO-'}[LANG]) + String(D.c).replace(/[^\w-]+/g, '-'); try { print(); } catch (e) {} };
  document.getElementById('pdfb').onclick = doPrint; app.querySelector('.bpdf').onclick = doPrint;
  if (/(^|&)print=1/.test(location.hash.slice(1))) {
    // mở từ CRM để in: hiện nút lớn (Safari chỉ mở hộp thoại in khi người dùng bấm) + thử tự in khi ảnh tải xong (Chrome)
    const mac = /Mac/.test(navigator.platform || navigator.userAgent), bar = document.createElement('div'); bar.className = 'prbar';
    bar.innerHTML = `<button type="button">🖨 In / Lưu PDF</button><span>${mac ? 'hoặc nhấn <b>⌘ + P</b>' : 'hoặc nhấn <b>Ctrl + P</b>'} → chọn “Lưu dưới dạng PDF”</span><i title="Đóng">✕</i>`;
    document.body.appendChild(bar); bar.querySelector('button').onclick = doPrint; bar.querySelector('i').onclick = () => bar.remove();
    const safari = /Safari/.test(navigator.userAgent) && !/Chrome|CriOS|Edg|Firefox/.test(navigator.userAgent);
    if (!safari) { const imgs = [...document.images]; Promise.race([Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))), new Promise(r => setTimeout(r, 6000))]).then(() => setTimeout(doPrint, 300)); } }
})();
