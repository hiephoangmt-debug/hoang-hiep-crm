<style>
/* Layout: full-bleed video stage (two buffered <video>s); light glass UI floats on top: logo centre, back left, register right, picker card right, room label bottom-left, hotspots on the frozen last frame. Single cinematic look. */
html{padding:0}
body{margin:0}
:root{
  --ink:#071016; --glass:rgba(255,255,255,.16); --glass-strong:rgba(255,255,255,.26); --line:rgba(255,255,255,.34);
  --text:#ffffff; --muted:rgba(255,255,255,.78); --blue:#2f7cf6; --blue-ink:#ffffff; --gold:#e8c48f;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden}
.stage{position:fixed;inset:0;background:var(--ink) url("https://cdn.jsdelivr.net/gh/hiephoangmt-debug/hoang-hiep-crm@e115c342d26bd142ba1eada36f2182a6b57a58b3/landing/sun-saphia/tour/p/hero.jpg") center/cover no-repeat;overflow:hidden}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1);transition:opacity .7s ease,transform .9s cubic-bezier(.5,0,.2,1),filter .9s ease}
.stage video.on{opacity:1}
.stage video.push-out{opacity:0;transform:scale(1.14);filter:blur(3px)}
.stage video.push-in{transform:scale(1.07)}
.stage video.drift{transform:scale(1.06);transition:transform 16s linear,opacity .7s ease}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(4,10,14,.45),transparent 20%,transparent 72%,rgba(4,10,14,.55))}

.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}
.pill{font:500 13px var(--body);color:var(--text);border-radius:999px;padding:9px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.pill.blue{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:600}
.pill:focus-visible{outline:2px solid #fff;outline-offset:2px}

.top{position:fixed;z-index:5;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .l{justify-self:start}.top .r{justify-self:end}
.logo{text-align:center;line-height:1;letter-spacing:.32em;text-transform:uppercase}
.logo b{display:block;font:600 20px var(--display);letter-spacing:.34em}
.logo small{display:block;font:500 9px var(--body);letter-spacing:.42em;color:var(--muted);margin-top:5px}

.picker{position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:min(300px,calc(100vw - 32px));
  border-radius:22px;padding:22px;display:grid;gap:14px;transition:opacity .4s,transform .4s}
.picker.off{opacity:0;transform:translate(20px,-50%);pointer-events:none}
.picker h2{margin:0;font:600 30px/1 var(--display)}
.picker p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.type{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.1)}
.type output{font:600 44px/1 var(--display);text-align:center;flex:1}
.type small{display:block;font:500 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.arrow{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);font-size:16px;cursor:pointer}
.arrow:focus-visible{outline:2px solid #fff;outline-offset:2px}
.picker .pill.blue{justify-content:center;padding:12px}
.picker .alt{justify-content:center;background:transparent}

.hs{position:absolute;z-index:4;transform:translate(-50%,-50%);border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .45s}
.hs.show{opacity:1;pointer-events:auto}
.hs .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(47,124,246,.35);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(47,124,246,0)}}

.badge{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 70px);border-radius:16px;padding:12px 16px;display:grid;gap:2px;transition:opacity .4s}
.badge.off{opacity:0}
.badge small{font:500 10.5px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.badge b{font:600 26px/1.05 var(--display)}

.dock{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;overflow-x:auto;scrollbar-width:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .pill{flex:none}
.dock .pill[aria-pressed="true"]{background:#fff;color:#0b1b26}
.busy .hs,.busy .dock .pill,.busy .picker .pill,.busy .arrow{pointer-events:none}

.intro{position:fixed;inset:0;z-index:15;display:grid;place-items:center;text-align:center;background:rgba(4,10,14,.35);transition:opacity 1.2s ease;pointer-events:none}
.intro.gone{opacity:0}
.intro b{display:block;font:600 clamp(34px,7vw,72px)/1 var(--display);letter-spacing:.3em;text-transform:uppercase;padding-left:.3em}
.intro small{display:block;margin-top:14px;font:500 12px var(--body);letter-spacing:.5em;text-transform:uppercase;color:var(--muted)}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(4,10,14,.55);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet form{width:min(400px,100%);border-radius:22px;padding:22px;display:grid;gap:12px;background:rgba(18,32,42,.72)}
.sheet h2{margin:0;font:600 28px var(--display)}
.sheet label{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
.sheet input,.sheet select{font:15px var(--body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text)}
.sheet .row{display:flex;gap:8px;justify-content:flex-end}
.ok{color:#9fd0ff;font-size:14px;margin:0}

@media (max-width:640px){
  .logo b{font-size:15px}.logo small{display:none}
  .top .pill{padding:8px 11px;font-size:12px}
  .picker{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:none;right:16px;left:16px;width:auto;padding:16px;gap:10px}
  .picker.off{transform:translateY(20px)}
  .picker p{display:none}
  .type output{font-size:36px}
  .dock{justify-content:flex-start}
  .badge b{font-size:21px}
}
@media (prefers-reduced-motion:reduce){.hs .dot{animation:none}.stage video{transition:none}}
</style>
</head>
<body>

<div class="stage" id="stage">
  <video id="vA" muted playsinline preload="auto" poster="https://cdn.jsdelivr.net/gh/hiephoangmt-debug/hoang-hiep-crm@e115c342d26bd142ba1eada36f2182a6b57a58b3/landing/sun-saphia/tour/p/hero.jpg"></video>
  <video id="vB" muted playsinline preload="auto"></video>
  <div class="shade"></div>
</div>

<div class="intro" id="intro"><div><b>Sun Saphia</b><small>Residence</small></div></div>

<header class="top">
  <div class="l"><button class="pill glass" id="back" type="button" hidden>← Về toà tháp</button></div>
  <div class="logo"><b>Sun Saphia</b><small>Residence</small></div>
  <div class="r"><button class="pill blue" id="register" type="button">Đăng ký quan tâm</button></div>
</header>

<section class="picker glass" id="picker" aria-label="Chọn căn hộ">
  <h2>Chọn căn hộ</h2>
  <p>Toà tháp ven biển, mọi căn đều có ban công hướng biển hoặc thành phố.</p>
  <div class="type">
    <button class="arrow" id="prev" type="button" aria-label="Loại căn trước">‹</button>
    <output id="typeName" aria-live="polite">Studio<small>Căn hộ</small></output>
    <button class="arrow" id="nextT" type="button" aria-label="Loại căn sau">›</button>
  </div>
  <button class="pill blue" id="enter" type="button">Vào căn hộ →</button>
  <button class="pill glass alt" id="amen" type="button">Xem tiện ích</button>
</section>

<div class="badge glass off" id="badge"><small id="badgeK"></small><b id="badgeT"></b></div>
<nav class="dock" id="dock" aria-label="Phòng"></nav>

<div class="sheet" id="sheet" hidden>
  <form id="form" class="glass">
    <h2>Đăng ký quan tâm</h2>
    <label for="f-name">Họ tên<input id="f-name" required autocomplete="name"></label>
    <label for="f-phone">Số điện thoại / Zalo<input id="f-phone" required inputmode="tel" ></label>
    <label for="f-type">Loại căn
      <select id="f-type"><option>Studio</option><option>1PN</option><option>2PN</option></select>
    </label>
    <p class="ok" id="ok" hidden></p>
    <div class="row">
      <button class="pill glass" type="button" id="close">Đóng</button>
      <button class="pill blue" type="submit">Gửi</button>
    </div>
  </form>
</div>

<script>
const TYPES={
  Studio:{label:"Căn hộ studio",rooms:[
    {id:"st-bed",name:"Phòng ngủ",hx:.62,hy:.5},
    {id:"st-kitchen",name:"Bếp & tủ",hx:.4,hy:.5},
    {id:"st-bath",name:"Phòng tắm",hx:.55,hy:.55}]},
  "1PN":{label:"1 phòng ngủ",rooms:[
    {id:"p1-living",name:"Phòng khách",hx:.35,hy:.55},
    {id:"p1-bed",name:"Phòng ngủ",hx:.55,hy:.5},
    {id:"p1-kitchen",name:"Bếp",hx:.4,hy:.5}]},
  "2PN":{label:"2 phòng ngủ",rooms:[
    {id:"p2-living",name:"Phòng khách",hx:.35,hy:.6},
    {id:"p2-bed",name:"Phòng ngủ",hx:.6,hy:.45},
    {id:"p2-dining",name:"Góc ăn",hx:.45,hy:.45}]}
};
const AMEN=[{id:"am-pool",name:"Bể bơi"},{id:"am-gym",name:"Gym & Yoga"},{id:"am-spa",name:"Spa & Sauna"},{id:"am-beach",name:"Bãi tắm"}];
const typeKeys=Object.keys(TYPES);
let tIdx=0,mode="hero",room=-1,busy=false;
const $=id=>document.getElementById(id);
const vids=[$("vA"),$("vB")];let front=0;
const stage=$("stage"),dock=$("dock"),picker=$("picker"),badge=$("badge");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function play(name,{loop=false,push=false}={}){
  return new Promise(res=>{
    const v=vids[1-front],old=vids[front];
    v.loop=loop;v.src="https://cdn.jsdelivr.net/gh/hiephoangmt-debug/hoang-hiep-crm@f9d6d428d0be30d3cb4797089990a0623c80c8ec/landing/sun-saphia/tour/v2/"+name+".mp4";v.currentTime=0;
    v.className=push?"push-in":"";
    const go=()=>{requestAnimationFrame(()=>{v.classList.add("on");v.classList.remove("push-in")});
      old.classList.remove("drift");if(push)old.classList.add("push-out");old.classList.remove("on");
      setTimeout(()=>{old.pause();old.className=""},900);front=1-front;if(loop)res()};
    v.onended=()=>{if(!reduce)v.classList.add("drift");res()};
    const p=v.play();
    v.addEventListener("playing",go,{once:true});
    if(p&&p.catch)p.catch(()=>{go();res()});
  });
}

// hotspot on the frozen frame, positioned with object-fit:cover math (16:9 source)
const hs=document.createElement("button");hs.type="button";hs.className="hs pill glass";
hs.innerHTML='<span class="dot"></span><span id="hsT"></span>';stage.appendChild(hs);
let hsAt=null;
function placeHs(){
  if(!hsAt)return;const W=innerWidth,H=innerHeight,k=Math.max(W/1280,H/720),w=1280*k,h=720*k;
  hs.style.left=Math.min(W-90,Math.max(90,(W-w)/2+hsAt.x*w))+"px";hs.style.top=((H-h)/2+hsAt.y*h)+"px";
}
function showHs(x,y,text,fn){hsAt={x,y};$("hsT").textContent=text;hs.onclick=fn;placeHs();hs.classList.add("show")}
function hideHs(){hs.classList.remove("show")}
addEventListener("resize",placeHs);

function setBadge(k,t){if(!t){badge.classList.add("off");return}$("badgeK").textContent=k;$("badgeT").textContent=t;badge.classList.remove("off")}
function setDock(items,active,fn){
  dock.innerHTML="";
  items.forEach((it,i)=>{const b=document.createElement("button");b.type="button";b.className="pill glass";b.textContent=it.name;
    b.setAttribute("aria-pressed",i===active);b.onclick=()=>fn(i);dock.appendChild(b)});
}
function lock(on){busy=on;document.body.classList.toggle("busy",on)}
function renderType(){const k=typeKeys[tIdx];$("typeName").innerHTML=k+"<small>"+TYPES[k].label+"</small>";$("f-type").value=k}

async function toHero(fromInside){
  lock(true);hideHs();setBadge();dock.innerHTML="";$("back").hidden=true;
  if(fromInside)await play("out-"+{Studio:"st","1PN":"p1","2PN":"p2"}[typeKeys[tIdx]],{push:room>0});
  mode="hero";room=-1;await play("hero",{loop:true});
  picker.classList.remove("off");lock(false);
}
async function enterUnit(){
  if(busy)return;lock(true);picker.classList.add("off");mode="unit";
  const T=TYPES[typeKeys[tIdx]];
  $("back").hidden=false;setDock(T.rooms,-1,goRoom);
  setBadge("Căn "+typeKeys[tIdx],"Đang bay vào căn…");
  await play("enter-"+{Studio:"st","1PN":"p1","2PN":"p2"}[typeKeys[tIdx]]);
  room=0;arrived(T,0);
  lock(false);
}
async function goRoom(i){
  if(busy)return;lock(true);hideHs();room=i;
  const key=typeKeys[tIdx],T=TYPES[key],r=T.rooms[i];
  setDock(T.rooms,i,goRoom);setBadge("Căn "+key,r.name);
  await play(r.id,{push:true});
  arrived(T,i);
  lock(false);
}
function arrived(T,i){
  const r=T.rooms[i],n=(i+1)%T.rooms.length;
  setDock(T.rooms,i,goRoom);setBadge("Căn "+typeKeys[tIdx],r.name);
  showHs(r.hx,r.hy,"Sang "+T.rooms[n].name.toLowerCase(),()=>goRoom(n));
}
async function goAmen(i){
  if(busy)return;lock(true);hideHs();picker.classList.add("off");mode="amen";$("back").hidden=false;
  setDock(AMEN,i,goAmen);setBadge("Tiện ích",AMEN[i].name);
  await play(AMEN[i].id,{push:true});
  const n=(i+1)%AMEN.length;showHs(.6,.45,"Tiếp: "+AMEN[n].name,()=>goAmen(n));
  lock(false);
}
$("enter").onclick=enterUnit;
$("amen").onclick=()=>goAmen(0);
$("back").onclick=()=>{if(!busy)toHero(mode==="unit")};
$("prev").onclick=()=>{tIdx=(tIdx+typeKeys.length-1)%typeKeys.length;renderType()};
$("nextT").onclick=()=>{tIdx=(tIdx+1)%typeKeys.length;renderType()};

const sheet=$("sheet"),ok=$("ok");
$("register").onclick=()=>{ok.hidden=true;sheet.hidden=false;$("f-name").focus()};
$("close").onclick=()=>sheet.hidden=true;
$("form").addEventListener("submit",e=>{e.preventDefault();
  const r=window.hhcLead?window.hhcLead({name:$("f-name").value.trim(),phone:$("f-phone").value,interest:"Tour video – căn "+$("f-type").value,form:"Tour video"}):"";
  ok.textContent=r==="ok"?"Cảm ơn anh/chị! Chuyên viên sẽ gửi bảng giá & mặt bằng qua Zalo 0904 567 009 trong ít phút.":r==="dup"?"Số này đã đăng ký trước đó, chuyên viên sẽ liên hệ sớm.":"Số điện thoại chưa đúng, anh/chị kiểm tra lại giúp.";
  ok.hidden=false;});
addEventListener("keydown",e=>{if(e.key==="Escape")sheet.hidden=true});

renderType();
toHero(false);
setTimeout(()=>$("intro").classList.add("gone"),reduce?0:1400);
</script>

  /* Nguồn quảng cáo: giữ trong phiên để gửi kèm */
  var SRC_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'gclid', 'fbclid', 'ttclid'];
  var qs = {}; try { location.search.replace(/^\?/, '').split('&').forEach(function (p) { var i = p.indexOf('='); if (i > 0) qs[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1).replace(/\+/g, ' ')); }); } catch (e) {}
  SRC_KEYS.forEach(function (k) { if (qs[k]) sset('hhc_' + k, qs[k]); });
  function src() { var d = {}; SRC_KEYS.forEach(function (k) { var v = qs[k] || sget('hhc_' + k); if (v) d[k] = v; }); return d; }

  /* Số điện thoại Việt Nam: di động 0[35789]xxxxxxxx hoặc bàn 02xxxxxxxxx */
  function normPhone(p) {
    p = String(p || '').replace(/[^\d+]/g, '');
    if (p.indexOf('+84') === 0) p = '0' + p.slice(3); else if (p.indexOf('84') === 0 && (p.length === 11 || p.length === 12)) p = '0' + p.slice(2);

  function beacon(u, body) { try { if (navigator.sendBeacon && navigator.sendBeacon(u, body)) return true; } catch (e) {} return false; }
  function postJSON(u, d) {
    var s = JSON.stringify(d);
    if (beacon(u, new Blob([s], {type: 'text/plain;charset=utf-8'}))) return;
    try { fetch(u, {method: 'POST', mode: 'no-cors', keepalive: true, headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: s}).catch(function () {}); } catch (e) {}
  }
  function postMail(d) {
    var p = []; for (var k in d) if (d[k] !== '' && d[k] != null) p.push(encodeURIComponent(k) + '=' + encodeURIComponent(String(d[k])));
    var body = p.join('&');
    try { fetch(MAIL, {method: 'POST', mode: 'no-cors', keepalive: true, headers: {'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json'}, body: body}).catch(function () {}); }
    catch (e) { beacon(MAIL, new Blob([body], {type: 'application/x-www-form-urlencoded'})); }
  }
  var sentMem = {};
  function wasSent(ph) { return sentMem[ph] || sget('hhc_sent_' + ph) || lget('hhc_sent_' + ph); }
  function markSent(ph) { sentMem[ph] = 1; sset('hhc_sent_' + ph, '1'); lset('hhc_sent_' + ph, String(Date.now())); }

  /* d: {name, phone, interest, cau_hoi, hoi_thoai, ...}. Trả về 'ok' | 'dup' | '' (số sai) */
  function lead(d) {
    d = Object.assign({}, d, src(), {time: vnTime(), source: location.href.split('#')[0].split('?')[0]});
    if (d.thong_bao) { postJSON(TG, d); return 'ok'; }
    var ph = normPhone(d.phone); if (!ph) return '';
    if (wasSent(ph)) return 'dup';
    markSent(ph); d.phone = ph;
    postJSON(TG, d);
    postJSON(CRM, Object.assign({project: PROJECT, url: d.source, message: [d.interest, d.cau_hoi].filter(Boolean).join(' · ').slice(0, 500)}, d));
    postMail(Object.assign({_subject: 'Khách Sun Saphia: ' + (d.name || 'chưa rõ tên') + ' - ' + ph, _template: 'table', _captcha: 'false'}, d));
    try { if (window.gtag) gtag('event', 'generate_lead', {event_label: d.interest || ''}); } catch (e) {}
    try { if (window.gtag && window.HHC_ADS_SEND_TO) gtag('event', 'conversion', {send_to: window.HHC_ADS_SEND_TO}); } catch (e) {}  // Google Ads: Sun Saphia – Gửi form
    try { if (window.fbq) fbq('track', 'Lead', {content_name: d.interest || ''}); } catch (e) {}
    return 'ok';
  }
  window.hhcLead = lead;
})();

</script>
