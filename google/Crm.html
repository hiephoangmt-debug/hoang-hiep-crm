<!doctype html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Hoàng Hiệp</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#1b1f27;--mut:#667085;--bd:#e4e7ec;--pri:#b0172d;--blu:#0068ff;--grn:#16a34a;--red:#dc2626;--amb:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1e28;--tx:#e8eaf0;--mut:#98a2b3;--bd:#2b3140;--pri:#ef4a62;--blu:#5b9bff}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;color:var(--pri)}.sp{flex:1}.mut{color:var(--mut)}.small{font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;width:100%}
nav button{border:0;background:none;color:var(--mut);padding:7px 11px;border-radius:8px;font:inherit;cursor:pointer;position:relative}
nav button.on{background:var(--pri);color:#fff}
nav .dot{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.kpi b{display:block;font-size:22px}.kpi span{color:var(--mut);font-size:12px}
.kpi.alert{border-color:var(--red)}.kpi.alert b{color:var(--red)}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{border:1px solid var(--bd);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn.z{background:var(--blu);border-color:var(--blu);color:#fff}.btn.g{background:var(--grn);border-color:var(--grn);color:#fff}.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}textarea{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd);white-space:nowrap}
.tag.red{background:#fee2e2;color:#b91c1c;font-weight:600}.tag.blu{background:#dbeafe;color:#1d4ed8}.tag.grn{background:#dcfce7;color:#15803d}.tag.amb{background:#fef3c7;color:#b45309}
@media (prefers-color-scheme:dark){.tag.red{background:#4c1d1d;color:#fca5a5}.tag.blu{background:#1b2a4d;color:#93c5fd}.tag.grn{background:#14351f;color:#86efac}.tag.amb{background:#3d2e0d;color:#fcd34d}}
.lead{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.lead.todo{border-left:4px solid var(--red)}
.lead h3{margin:0;font-size:15px}.acts{display:flex;gap:6px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mut);font-size:12px}.tw{overflow-x:auto}
dialog{border:1px solid var(--bd);border-radius:14px;padding:0;background:var(--card);color:var(--tx);width:min(640px,96vw);max-height:92vh}
dialog::backdrop{background:#0008}.dlg{padding:14px}.tl{list-style:none;margin:0;padding:0}.tl li{padding:5px 0;border-bottom:1px dashed var(--bd)}
code,pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;font-size:12px}pre{padding:8px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:6px 0}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:20}
#diag{color:var(--red);padding:8px 12px}
</style>
</head>
<body>
<header>
  <h1>CRM Hoàng Hiệp</h1><span class="sp"></span>
  <span class="mut small" id="who"></span>
  <button class="btn" id="reload">Tải lại</button>
  <nav id="nav">
    <button data-t="home" class="on">Tổng quan</button>
    <button data-t="leads">Khách hàng<span class="dot" id="dLeads" hidden></span></button>
    <button data-t="clicks">Lượt bấm<span class="dot" id="dClicks" hidden></span></button>
    <button data-t="camp">Chiến dịch</button>
    <button data-t="sites">Website & mã nhúng</button>
  </nav>
</header>
<div id="diag"></div>
<main id="main"><p class="mut">Đang tải…</p></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast"></div>

<script>
window.onerror = function (m, s, l) { var d = document.getElementById('diag'); if (d) d.textContent = 'Lỗi trang: ' + m + (l ? ' (dòng ' + l + ')' : ''); };
var KEY = '', D = null, tab = 'home', F = { status: 'todo', site: '', q: '', clicks: 'todo' };
var STATUS = ['Mới', 'Đã liên hệ', 'Quan tâm', 'Hẹn xem', 'Chốt', 'Mất'];
var CH = { zalo: 'Zalo', phone: 'Gọi điện', messenger: 'Messenger', sms: 'SMS', other: 'Khác' };
function $(s, r) { return (r || document).querySelector(s); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function run(fn) {
  var a = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, ko) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { ko(new Error(e && e.message ? e.message : String(e))); });
    r[fn].apply(r, [KEY].concat(a));
  });
}
function toast(m) { var t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 2800); }
function fail(e) { toast('Lỗi: ' + e.message); }
function fmt(iso) { if (!iso) return ''; var d = new Date(iso); return d.toLocaleString('vi-VN', { hour12: false, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
function ago(iso) { var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000); return m < 1 ? 'vừa xong' : m < 60 ? m + ' phút trước' : m < 1440 ? Math.round(m / 60) + ' giờ trước' : Math.round(m / 1440) + ' ngày trước'; }
function vnd(n) { return Math.round(n || 0).toLocaleString('vi-VN') + 'đ'; }
var todo = function (l) { return !l.called && !l.messaged && l.status === 'Mới'; };

function load() {
  return run('crmLoad').then(function (d) { D = d; $('#who').textContent = d.user; badges(); render(); }).catch(function (e) { $('#main').innerHTML = '<div class="card">Không tải được dữ liệu: ' + esc(e.message) + '<br><span class="mut">Hãy mở bằng link CRM có khoá: trong file Sheet, menu CRM → Link vào CRM.</span></div>'; });
}
function badges() {
  var a = D.leads.filter(todo).length, b = D.clicks.filter(function (c) { return c.alert; }).length;
  $('#dLeads').textContent = a; $('#dLeads').hidden = !a; $('#dClicks').textContent = b; $('#dClicks').hidden = !b;
}
$('#nav').onclick = function (e) { var t = e.target.dataset.t; if (!t) return; tab = t; document.querySelectorAll('#nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); }); render(); };
$('#reload').onclick = load;

function render() { if (!D) return; ({ home: home, leads: leads, clicks: clicks, camp: camp, sites: sites }[tab])(); }

function home() {
  var k = D.kpis.slice(1).map(function (r, i) { var red = (i === 0 || i === 8) && Number(String(r[1]).replace(/\D/g, '')) > 0; return '<div class="kpi ' + (red ? 'alert' : '') + '"><b>' + esc(r[1]) + '</b><span>' + esc(r[0]) + '</span></div>'; }).join('');
  var st = D.siteStats, rows = st.slice(1).map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td>' + (i === 0 ? '<b>' + esc(c) + '</b>' : esc(c)) + '</td>'; }).join('') + '</tr>'; }).join('');
  $('#main').innerHTML = '<p class="mut small">Khoảng thời gian chỉnh ở ô "Số ngày gần đây" trong tab Tổng quan của file Sheet.</p><div class="grid">' + k + '</div>' +
    '<div class="card tw"><b>Theo website</b><table><tr>' + st[0].map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr>' + (rows || '<tr><td class="mut">Chưa có dữ liệu</td></tr>') + '</table></div>';
}

function leads() {
  var sites = D.sites.map(function (s) { return s.name; });
  var list = D.leads.filter(function (l) {
    if (F.status === 'todo' && !todo(l)) return false;
    if (STATUS.indexOf(F.status) >= 0 && l.status !== F.status) return false;
    if (F.site && l.site !== F.site) return false;
    if (F.q) { var q = F.q.toLowerCase(); if ((l.name + ' ' + l.phone + ' ' + l.email).toLowerCase().indexOf(q) < 0) return false; }
    return true;
  });
  $('#main').innerHTML = '<div class="row"><select id="fs"><option value="all">Tất cả trạng thái</option><option value="todo">Chưa gọi, chưa nhắn</option>' + STATUS.map(function (s) { return '<option>' + s + '</option>'; }).join('') + '</select>' +
    '<select id="fw"><option value="">Tất cả website</option>' + sites.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('') + '</select>' +
    '<input id="fq" placeholder="Tìm tên / SĐT / email" value="' + esc(F.q) + '"><span class="mut">' + list.length + ' khách</span></div>' +
    (list.map(function (l) { return leadCard(l); }).join('') || '<div class="card mut">Không có khách nào.</div>');
  $('#fs').value = F.status; $('#fw').value = F.site;
  $('#fs').onchange = function (e) { F.status = e.target.value; leads(); };
  $('#fw').onchange = function (e) { F.site = e.target.value; leads(); };
  $('#fq').onkeydown = function (e) { if (e.key === 'Enter') { F.q = e.target.value; leads(); } };
  document.querySelectorAll('[data-open]').forEach(function (b) { b.onclick = function () { openLead(b.dataset.open); }; });
  document.querySelectorAll('[data-act]').forEach(function (b) { b.onclick = function () { contact(b.dataset.p, b.dataset.act, b); }; });
}
function leadCard(l) {
  var st = todo(l) ? '<span class="tag red">CHƯA LIÊN HỆ</span>' : '<span class="tag ' + (l.status === 'Chốt' ? 'grn' : l.status === 'Mất' ? '' : 'amb') + '">' + esc(l.status) + '</span>';
  var t = (l.zaloClicks ? '<span class="tag blu">Bấm Zalo ×' + l.zaloClicks + '</span> ' : '') + (l.phoneClicks ? '<span class="tag blu">Bấm Gọi ×' + l.phoneClicks + '</span> ' : '') +
    (l.called ? '<span class="tag grn">Đã gọi</span> ' : '') + (l.messaged ? '<span class="tag grn">Đã nhắn</span> ' : '');
  return '<div class="card lead ' + (todo(l) ? 'todo' : '') + '"><div><h3>' + esc(l.name || '(chưa có tên)') + ' · ' + esc(l.phone) + '</h3>' +
    '<div class="mut small">' + esc(l.site) + (l.source || l.campaign ? ' · ' + esc((l.source + ' ' + l.campaign).trim()) : '') + ' · ' + esc(ago(l.at)) + '</div>' +
    '<div style="margin-top:4px">' + st + ' ' + t + '</div>' + (l.note ? '<div class="small mut">' + esc(l.note) + '</div>' : '') + '</div>' +
    '<div class="acts"><button class="btn z" data-act="zalo" data-p="' + esc(l.phone) + '">Zalo</button><button class="btn g" data-act="call" data-p="' + esc(l.phone) + '">Gọi</button><button class="btn" data-open="' + esc(l.phone) + '">Chi tiết</button></div></div>';
}
function contact(phone, act, btn) {
  if (act === 'zalo') window.open('https://zalo.me/' + phone, '_blank', 'noopener'); else window.open('tel:' + phone, '_self');
  btn.disabled = true;
  run('crmLog', phone, act).then(function (r) {
    var l = D.leads.filter(function (x) { return x.phone === phone; })[0];
    if (l) { l.called = r.called; l.messaged = r.messaged; l.contactedAt = r.contactedAt; l.status = r.status; }
    badges(); render(); toast('Đã ghi nhận ' + (act === 'call' ? 'đã gọi' : 'đã nhắn'));
  }).catch(function (e) { btn.disabled = false; fail(e); });
}
function openLead(phone) {
  var l = D.leads.filter(function (x) { return x.phone === phone; })[0]; if (!l) return;
  $('#dlgBody').innerHTML = '<h2 style="margin:0">' + esc(l.name || '(chưa có tên)') + ' · ' + esc(l.phone) + '</h2><p class="mut small">' + esc(l.site) + ' · ' + esc(l.email) + ' · gửi form ' + l.submits + ' lần · nhận lúc ' + esc(fmt(l.at)) + '</p>' +
    '<div class="row"><button class="btn z" data-a="zalo">Nhắn Zalo</button><button class="btn g" data-a="call">Gọi</button><button class="btn" data-a="sms">Đã nhắn SMS</button></div>' +
    '<div class="row"><input id="nm" placeholder="Tên" value="' + esc(l.name) + '"><select id="st">' + STATUS.map(function (s) { return '<option' + (s === l.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>' +
    '<input id="as" placeholder="Người phụ trách" value="' + esc(l.assignee) + '"><input id="vl" type="number" min="0" placeholder="Giá trị chốt (VNĐ)" value="' + (l.value || '') + '"></div>' +
    '<textarea id="nt" rows="3" placeholder="Nhu cầu, ghi chú">' + esc(l.note) + '</textarea><div class="row" style="margin-top:8px"><button class="btn p" id="sv">Lưu</button><button class="btn" id="cl">Đóng</button></div>' +
    '<h3>Lịch sử truy cập</h3><ul class="tl" id="tl"><li class="mut">Đang tải…</li></ul>';
  $('#dlg').showModal();
  $('#cl').onclick = function () { $('#dlg').close(); };
  document.querySelectorAll('#dlgBody [data-a]').forEach(function (b) { b.onclick = function () {
    var a = b.dataset.a; if (a === 'zalo') window.open('https://zalo.me/' + phone, '_blank', 'noopener'); if (a === 'call') window.open('tel:' + phone, '_self');
    run('crmLog', phone, a).then(function (r) { l.called = r.called; l.messaged = r.messaged; l.contactedAt = r.contactedAt; l.status = r.status; badges(); toast('Đã ghi nhận'); $('#dlg').close(); render(); }).catch(fail); }; });
  $('#sv').onclick = function () {
    var f = { name: $('#nm').value, status: $('#st').value, assignee: $('#as').value, value: $('#vl').value, note: $('#nt').value };
    run('crmUpdateLead', phone, f).then(function () { l.name = f.name; l.status = f.status; l.assignee = f.assignee; l.value = Number(f.value) || 0; l.note = f.note; badges(); $('#dlg').close(); render(); toast('Đã lưu'); }).catch(fail);
  };
  run('crmEvents', l.vid).then(function (ev) {
    $('#tl').innerHTML = ev.map(function (e) { return '<li><span class="mut">' + esc(fmt(e.at)) + '</span> ' + (e.type === 'click' ? 'Bấm <b>' + esc(CH[e.channel] || e.channel) + '</b>' : e.type === 'form' ? 'Gửi form' : 'Xem trang') + ' · <span class="mut small">' + esc(e.url) + '</span></li>'; }).join('') || '<li class="mut">Chưa có</li>';
  }).catch(function () { $('#tl').innerHTML = '<li class="mut">Không tải được</li>'; });
}

function clicks() {
  var list = D.clicks.filter(function (c) { return F.clicks === 'all' || c.alert; });
  $('#main').innerHTML = '<div class="card small mut">Người đã <b>bấm Zalo / Gọi / Messenger</b> trên website. Dòng đỏ là chưa để lại số điện thoại và chưa ai kiểm tra. Đối chiếu giờ bấm với tin nhắn Zalo hoặc cuộc gọi nhỡ trên điện thoại, rồi tick "Đã kiểm tra".</div>' +
    '<div class="row"><select id="fc"><option value="todo">Chưa xử lý</option><option value="all">Tất cả</option></select><span class="mut">' + list.length + ' lượt</span></div>' +
    '<div class="card tw"><table><tr><th>Lúc</th><th>Website</th><th>Kênh</th><th>Trang</th><th>Nguồn</th><th>SĐT</th><th>Đã kiểm tra</th></tr>' +
    (list.map(function (c) { return '<tr><td>' + esc(fmt(c.at)) + '<br><span class="mut small">' + esc(ago(c.at)) + '</span></td><td>' + esc(c.site) + '</td><td><span class="tag blu">' + esc(CH[c.channel] || c.channel) + '</span></td><td class="small">' + esc(c.url) + '</td><td class="small">' + esc((c.source + ' ' + c.campaign).trim()) + '</td><td>' + (c.leftPhone ? '<span class="tag grn">Đã để lại</span>' : '<span class="tag red">Chưa</span>') + '</td><td><input type="checkbox" data-ck="' + c.row + '"' + (c.checked ? ' checked' : '') + '></td></tr>'; }).join('') || '<tr><td colspan="7" class="mut">Không có lượt nào.</td></tr>') + '</table></div>';
  $('#fc').value = F.clicks; $('#fc').onchange = function (e) { F.clicks = e.target.value; clicks(); };
  document.querySelectorAll('[data-ck]').forEach(function (b) { b.onchange = function () {
    var c = D.clicks.filter(function (x) { return String(x.row) === b.dataset.ck; })[0];
    run('crmClickDone', c.row, c.vid, b.checked).then(function () { c.checked = b.checked; c.alert = (!c.leftPhone && !c.checked) ? 'CHƯA XỬ LÝ' : ''; badges(); clicks(); }).catch(function (e) { b.checked = !b.checked; fail(e); }); }; });
}

function camp() {
  var c = D.campaigns;
  $('#main').innerHTML = '<div class="card tw"><table><tr>' + c[0].map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr>' +
    (c.slice(1).map(function (r) { return '<tr>' + r.map(function (x, i) { return '<td>' + (i < 3 ? '<b>' + esc(x) + '</b>' : esc(x)) + '</td>'; }).join('') + '</tr>'; }).join('') || '<tr><td class="mut">Chưa có chiến dịch. Thêm ở tab Chiến dịch của file Sheet.</td></tr>') + '</table></div><p class="mut small">Khai báo chiến dịch và nhập chi phí trong file Sheet (tab Chiến dịch, Chi phí).</p>';
}

function sites() {
  $('#main').innerHTML = D.sites.map(function (s, i) { return '<div class="card"><b>' + esc(s.name) + '</b> <span class="mut">' + esc(s.domain) + '</span> <span class="tag">mã ' + esc(s.key) + '</span>' +
    '<pre>' + esc(s.snippet || '(dán URL ứng dụng web vào ô G2 của tab Website để tạo đoạn mã)') + '</pre>' + (s.snippet ? '<button class="btn" data-cp="' + i + '">Sao chép đoạn mã</button>' : '') + '</div>'; }).join('') || '<div class="card mut">Chưa có website.</div>';
  document.querySelectorAll('[data-cp]').forEach(function (b) { b.onclick = function () {
    var s = D.sites[b.dataset.cp].snippet, ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Đã sao chép'); } catch (e) { toast('Không sao chép được, hãy bôi đen và copy'); } document.body.removeChild(ta); }; });
}
try { google.script.url.getLocation(function (loc) { KEY = ((loc && loc.parameter) || {}).k || ''; if (KEY.constructor === Array) KEY = KEY[0]; load(); }); } catch (e) { load(); }
</script>
</body>
</html>
