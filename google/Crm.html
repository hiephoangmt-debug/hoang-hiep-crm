      (best ? ' Chiến dịch hiệu quả nhất: <b>' + esc(best.name) + '</b> (' + vnd(best.cost / best.leads) + '/khách).' : '') + (bad ? ' Cần xem ngay: <b>' + esc(bad.name) + '</b> (chi ' + vnd(bad.cost) + ' chưa có khách).' : '') + '</div></div>';

      '<p><b>Các chỉ số</b></p><ul><li><b>CTR</b> = click ÷ hiển thị. Search thường 3 đến 8%. Dưới 2% là quảng cáo hoặc từ khoá chưa sát.</li><li><b>CPC</b> = chi phí ÷ click. Giá mỗi lần khách bấm vào quảng cáo.</li><li><b>CPL</b> = chi phí ÷ số khách để lại số. Đây là chỉ số quan trọng nhất để so sánh chiến dịch.</li><li><b>ROAS</b> = doanh thu ÷ chi phí. Cần ghi "Giá trị chốt" ở hồ sơ khách. Trên 1x là có lãi trên doanh thu.</li><li><b>So với kỳ trước</b> = cùng độ dài ngày ngay trước kỳ đang xem.</li></ul>' +
      '<p><b>Khi nào kết luận được</b></p><ul><li>Chờ ít nhất 5 đến 7 ngày hoặc 30 click mỗi chiến dịch. Dưới 5 khách thì chỉ là tham khảo, số lệch rất nhanh.</li><li>Đừng sửa nhiều thứ cùng lúc. Mỗi lần đổi một thứ, đợi 3 đến 5 ngày.</li></ul>' +
      '<p><b>Tăng, giữ hay giảm ngân sách</b></p><ul><li>CPL thấp hơn trung bình và có từ 3 khách: tăng 15 đến 20% mỗi 2 đến 3 ngày.</li><li>CPL cao hơn 50%: giảm giá thầu hoặc cắt từ khoá, khung giờ kém.</li><li>Chi trên 300.000đ mà chưa có khách: kiểm tra trang đích và theo dõi, rồi mới tính chuyện chạy tiếp.</li></ul>' +
      '<p><b>Để số liệu chính xác</b></p><ol><li>Mọi link quảng cáo đều gắn <code>utm_campaign</code> đúng tên khai báo ở tab Chiến dịch.</li><li>Mã CRM có trên mọi trang đích và đã xuất bản.</li><li>Tập lệnh chi phí Google Ads chạy hằng ngày. Chi phí Facebook nhập tay ở tab Chi phí.</li><li>Gọi khách trong 5 đến 15 phút, ghi giá trị chốt khi có giao dịch.</li></ol>' +
      '<p><b>Thói quen hằng tuần</b></p><ol><li>Chọn "7 ngày" xem tóm tắt, chiến dịch nào "Cần xử lý" làm trước.</li><li>Đối chiếu click Google với người truy cập CRM, lệch nhiều là lỗi theo dõi.</li><li>Chuyển sang "Tháng này" so sánh với "Tháng trước" để thấy xu hướng.</li></ol></div></details>';
    var charts = hBars('Chi phí theo chiến dịch', L.map(function (x) { return { label: x.name, value: x.cost, color: '#12305C' }; }), vnd) +
      hBars('Khách để lại số theo chiến dịch', L.map(function (x) { return { label: x.name, value: x.leads, color: '#F28C28' }; })) +
      hBars('Giá mỗi khách (CPL), thấp là tốt', wl.map(function (x) { return { label: x.name, value: Math.round(x.cost / x.leads), color: x.cost / x.leads > avgCpl * 1.5 ? '#C62828' : x.cost / x.leads < avgCpl * 0.7 ? '#1E8E4F' : '#5E6B85' }; }), vnd, 'xanh lá: tốt hơn trung bình, đỏ: cao hơn trung bình 50%') +
      miniBars(P.daily, 'cost', '#5E6B85', 'Chi phí theo ngày', vnd) + miniBars(P.daily, 'leads', '#F28C28', 'Khách theo ngày');
    return sum + '<div id="plansec"></div><div class="grid">' + k + '</div>' + charts + '<div class="card tw"><b>Số liệu từng chiến dịch</b><table><tr><th>Chiến dịch</th><th>Thời gian chạy</th><th>Chi phí</th><th title="So với kỳ liền trước có cùng số ngày. Kỳ trước chi rất ít thì số này sẽ rất lớn.">So kỳ trước ⓘ</th><th>Hiển thị</th><th>Click QC</th><th>CTR</th><th>CPC</th><th>Truy cập</th><th>Bấm Zalo/Gọi</th><th>Khách</th><th title="So với kỳ liền trước có cùng số ngày. Kỳ trước chi rất ít thì số này sẽ rất lớn.">So kỳ trước ⓘ</th><th>Giá/khách</th><th>Chốt</th><th>Doanh thu</th><th>ROAS</th></tr>' +
      (rows || '<tr><td colspan="16" class="mut">Chưa có chiến dịch hoặc chi phí trong khoảng này. Khai báo ở tab Chiến dịch của Sheet và chạy tập lệnh chi phí.</td></tr>') + '</table></div>' +
      '<h3 style="margin:16px 0 8px">Đánh giá và đề xuất</h3>' + (advice || '<div class="card mut">Chưa có dữ liệu để đánh giá.</div>') + guide;
  });
}

var DIMS = [['area', 'Khu vực (tỉnh/thành)'], ['district', 'Quận/huyện'], ['project', 'Dự án quan tâm'], ['site', 'Website phát sinh'], ['source', 'Nguồn khách'], ['sale', 'Sale phụ trách'], ['status', 'Trạng thái'], ['budget', 'Ngân sách'], ['purpose', 'Nhu cầu mua']];
function dimKey(d, l) {
  var b = budgetOf(l);
  return d === 'area' ? l.province : d === 'district' ? l.district : d === 'project' ? (l.project || 'Chưa có dự án') : d === 'site' ? l.site : d === 'source' ? (l.source || l.srcType) :
    d === 'sale' ? (l.assignee || 'Chưa giao') : d === 'status' ? l.status : d === 'purpose' ? l.purpose : (b ? (b < 2e9 ? 'Dưới 2 tỷ' : b <= 5e9 ? '2 đến 5 tỷ' : 'Trên 5 tỷ') : '');
}
function stats() {
  var all = D.leads.filter(function (l) { return isBds(l.site) && dayOf(l.at) >= R.from && dayOf(l.at) <= R.to; });
  var groups = {};
  all.forEach(function (l) {
    var k = dimKey(F.dim, l) || 'Chưa rõ', g = groups[k] || (groups[k] = { k: k, n: 0, unc: 0, contacted: 0, viewed: 0, won: 0, rev: 0, hot: 0 });
    g.n++; if (todo(l)) g.unc++; else g.contacted++; if (l.viewCount) g.viewed++; if (l.status === 'Chốt') { g.won++; g.rev += l.value || 0; } var h = heat(l); if (h && h[0] === 'Nóng') g.hot++;
  });
  var rows = Object.keys(groups).map(function (k) { return groups[k]; }).sort(function (a, b) { return b.n - a.n; });
  var tot = rows.reduce(function (a, g) { a.n += g.n; a.unc += g.unc; a.contacted += g.contacted; a.viewed += g.viewed; a.won += g.won; a.rev += g.rev; a.hot += g.hot; return a; }, { n: 0, unc: 0, contacted: 0, viewed: 0, won: 0, rev: 0, hot: 0 });
  var kp = [[tot.n, 'Khách trong kỳ'], [pct(tot.contacted, tot.n), 'Đã liên hệ'], [pct(tot.viewed, tot.n), 'Đã đi xem dự án'], [tot.hot, 'Khách nóng'], [pct(tot.won, tot.n), 'Tỉ lệ chốt'], [money(tot.rev), 'Doanh thu đã chốt']];
  var top = rows[0], best = rows.filter(function (g) { return g.n >= 2 && g.won; }).sort(function (a, b) { return b.won / b.n - a.won / a.n; })[0];
  $('#main').innerHTML = rangeBar() +
    '<div class="card"><div class="row" style="margin:0"><b>Thống kê khách hàng theo</b><select id="dim">' + DIMS.map(function (d) { return '<option value="' + d[0] + '"' + (F.dim === d[0] ? ' selected' : '') + '>' + d[1] + '</option>'; }).join('') + '</select></div>' +
    '<div class="small mut" style="margin-top:6px">' + (top ? 'Nhiều khách nhất: <b>' + esc(top.k) + '</b> (' + top.n + ' khách, ' + pct(top.n, tot.n) + ').' : 'Chưa có khách trong khoảng này.') + (best ? ' Tỉ lệ chốt cao nhất: <b>' + esc(best.k) + '</b> (' + pct(best.won, best.n) + ').' : '') + ' Bấm vào một dòng để xem danh sách khách của nhóm đó.</div></div>' +
    '<div class="grid">' + kp.map(function (x) { return '<div class="kpi"><b' + (String(x[0]).length > 9 ? ' class="long"' : '') + '>' + esc(x[0]) + '</b><span>' + x[1] + '</span></div>'; }).join('') + '</div>' +
    hBars('Số khách theo ' + DIMS.filter(function (d) { return d[0] === F.dim; })[0][1].toLowerCase(), rows.map(function (g) { return { label: g.k, value: g.n, color: '#12305C' }; }).slice(0, 15)) +
    hBars('Số khách đã chốt', rows.map(function (g) { return { label: g.k, value: g.won, color: '#1E8E4F' }; }).slice(0, 15)) +
    (F.dim !== 'status' ? hBars('Theo trạng thái', countBy(all, function (l) { return l.status; })) : '') + (F.dim !== 'source' ? hBars('Theo nguồn', countBy(all, function (l) { return l.source || l.srcType; })) : '') +
    dayBars(all, function (l) { return dayOf(l.at); }, R.from, R.to, '#F28C28', 'Khách phát sinh theo ngày') +
    '<div class="card tw"><table class="stt"><tr><th>Nhóm</th><th>Số khách</th><th>Tỉ lệ</th><th>Chưa liên hệ</th><th>Đã liên hệ</th><th>Đã đi xem</th><th>Khách nóng</th><th>Đã chốt</th><th>Tỉ lệ chốt</th><th>Doanh thu</th></tr>' +
    (rows.map(function (g, i) { return '<tr class="drill" data-g="' + i + '"><td><b>' + esc(g.k) + '</b></td><td>' + g.n + '</td><td>' + pct(g.n, tot.n) + '</td><td>' + (g.unc ? '<span class="tag red">' + g.unc + '</span>' : 0) + '</td><td>' + g.contacted + '</td><td>' + g.viewed + '</td><td>' + g.hot + '</td><td>' + g.won + '</td><td>' + pct(g.won, g.n) + '</td><td>' + money(g.rev) + '</td></tr>'; }).join('') || '<tr><td colspan="10" class="mut">Chưa có khách trong khoảng ngày này.</td></tr>') +
    '</table></div><p class="mut small">Thống kê theo ngày phát sinh khách. Chỉ tính khách bất động sản.</p>';
  bindRange();
  $('#dim').onchange = function (e) { F.dim = e.target.value; stats(); };
  document.querySelectorAll('.drill').forEach(function (r) { r.onclick = function () {
    var g = rows[r.dataset.g], v = g.k; F.status = 'all'; F.site = ''; F.src = ''; F.prov = ''; F.area = ''; F.proj = ''; F.as = ''; F.q = ''; F.bud = ''; F.df = R.from; F.dt = R.to; F.page = 1;
    var d = F.dim;
    if (d === 'area' && v !== 'Chưa rõ') F.prov = v; else if (d === 'district' && v !== 'Chưa rõ') F.area = v; else if (d === 'project') F.proj = v === 'Chưa có dự án' ? '' : v; else if (d === 'site') F.site = v; else if (d === 'source') F.src = v;
    else if (d === 'sale') F.as = v === 'Chưa giao' ? '__none' : v; else if (d === 'status') F.status = v; else if (d === 'purpose' || d === 'budget') F.q = d === 'purpose' ? v : '';
    tab = 'leads'; document.querySelectorAll('#nav button').forEach(function (x) { x.classList.toggle('on', x.dataset.t === 'leads'); }); render(); window.scrollTo(0, 0); }; });
}

function sites() {
  $('#main').innerHTML = D.sites.filter(function (s) { return inG(s.name); }).map(function (s, i) { return '<div class="card"><b>' + esc(s.name) + '</b> <span class="mut">' + esc(s.domain) + '</span> <span class="tag">mã ' + esc(s.key) + '</span>' +
    '<pre>' + esc(s.snippet || '(dán URL ứng dụng web vào ô G2 của tab Website để tạo đoạn mã)') + '</pre>' + (s.snippet ? '<button class="btn" data-cp="' + i + '">Sao chép đoạn mã</button>' : '') + '</div>'; }).join('') || '<div class="card mut">Chưa có website.</div>';
  document.querySelectorAll('[data-cp]').forEach(function (b) { b.onclick = function () {
    var s = D.sites.filter(function (s) { return inG(s.name); })[b.dataset.cp].snippet, ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Đã sao chép'); } catch (e) { toast('Không sao chép được, hãy bôi đen và copy'); } document.body.removeChild(ta); }; });
}
if (KEY) { load(); }  // mở trong file Sheet: khoá đã được gắn sẵn
else { var started = false; setTimeout(function () { if (!started) { started = true; load(); } }, 3000);
  try { google.script.url.getLocation(function (loc) { var k = ((loc && loc.parameter) || {}).k || ''; if (k.constructor === Array) k = k[0]; KEY = k; if (!started) { started = true; load(); } }); } catch (e) { if (!started) { started = true; load(); } } }
</script>
</body>
</html>
