<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ảnh quảng cáo Casamia Balanca</title>
<!--
  Mẫu ảnh quảng cáo. Mỗi khối .ad là 1 ảnh; khổ do class: .sq (1080x1080) hoặc .st (1080x1920).
  Xuất ảnh: node ads/render-ads.js  →  ads/out/*.png
-->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{--navy:#0b2a5b;--navy-2:#061a3d;--orange:#f47c20;--orange-2:#e06a10;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Be Vietnam Pro",sans-serif;background:#ccc;display:flex;flex-wrap:wrap;gap:40px;padding:40px}
  .ad{position:relative;overflow:hidden;color:#fff;background:var(--navy);width:1080px}
  .ad.sq{height:1080px}.ad.st{height:1920px}
  .bg{position:absolute;inset:0;background-size:cover;background-position:center}
  .shade{position:absolute;inset:0}
  .in{position:absolute;inset:0;display:flex;flex-direction:column;padding:64px}
  .st .in{padding:200px 72px 290px} /* vùng an toàn Story/Reels: chừa ~14% trên và dưới */
  .brand{display:flex;align-items:center;gap:14px;font-weight:800;letter-spacing:6px;font-size:26px}
  .brand i{width:46px;height:5px;background:var(--orange);display:inline-block}
  .brand small{font-weight:700;letter-spacing:4px;color:var(--orange);font-size:22px}
  .tag{display:inline-block;align-self:flex-start;background:var(--orange);color:#fff;font-weight:800;font-size:26px;padding:10px 22px;border-radius:999px;letter-spacing:1px}
  h1{font-weight:800;line-height:1.08;letter-spacing:-1px}
  .big{white-space:nowrap;font-weight:800;line-height:1;letter-spacing:-4px;color:var(--orange);text-shadow:0 6px 30px rgba(0,0,0,.35)}
  .big small{font-size:.38em;letter-spacing:-1px}
  .sub{font-weight:600;opacity:.97;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  h1{text-shadow:0 2px 16px rgba(0,0,0,.35)}
  .chips{display:flex;flex-wrap:wrap;gap:14px}
  .chip{background:rgba(255,255,255,.96);color:var(--navy);border-radius:16px;padding:16px 22px;font-weight:700;font-size:28px;line-height:1.2;border-left:8px solid var(--orange)}
  .chip b{display:block;color:var(--orange);font-size:40px;font-weight:800}
  .cta{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;border-radius:22px;padding:18px 18px 18px 30px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .cta span{color:var(--navy);font-weight:700;font-size:28px;line-height:1.25}
  .cta span b{display:block;font-size:34px;font-weight:800}
  .cta em{font-style:normal;background:var(--orange);color:#fff;font-weight:800;font-size:30px;padding:20px 28px;border-radius:16px;white-space:nowrap}
  .fine{font-size:19px;opacity:.75;font-weight:500;margin-top:16px}
  .sp{flex:1}
  /* Khổ dọc: ảnh đặt ở dải giữa để giữ độ nét */
  .st .bg{top:30%;bottom:28%;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%)}
  .st .shade{background:linear-gradient(180deg,rgba(6,26,61,.0) 0%,rgba(6,26,61,.0) 100%)!important}
  .st{background:linear-gradient(180deg,#0b2a5b 0%,#061a3d 100%)}
  .glow{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(244,124,32,.35),rgba(244,124,32,0) 70%)}
</style>
</head>
<body>

<!-- ===== 1. THUÊ LẠI 60 TRIỆU/THÁNG ===== -->
<template id="t-thue60">
  <div class="bg" style="background-image:url(../public/img/forestside.jpg);background-position:60% 50%"></div>
  <div class="shade" style="background:linear-gradient(180deg,rgba(6,26,61,.92) 0%,rgba(6,26,61,.55) 42%,rgba(6,26,61,.25) 60%,rgba(6,26,61,.94) 100%)"></div>
  <div class="in">
    <div class="brand"><i></i>CASAMIA BALANCA <small>HỘI AN</small></div>
    <div style="height:var(--g1)"></div>

    <div class="big" style="font-size:var(--big)">60 triệu<small>/tháng</small></div>
    <div class="sp"></div>
    <div class="chips">
      <div class="chip"><b>300 triệu</b>đặt cọc giữ căn</div>
      <div class="chip"><b>0% lãi</b>24 tháng · vay 70%</div>

    <div class="fine">Theo CSBH áp dụng từ 09/2026 · Hình ảnh phối cảnh minh hoạ · Hotline/Zalo 0904 567 009</div>
  </div>
</template>

      <path d="M470 420 L250 395" stroke="#f47c20" stroke-width="5" stroke-dasharray="12 10"/>

      <path d="M470 420 L330 60" stroke="#fff" stroke-width="4" stroke-dasharray="4 12" opacity=".7"/>
      <!-- điểm -->
      <g><circle cx="250" cy="395" r="16" fill="#fff"/><circle cx="250" cy="395" r="7" fill="#f47c20"/>
        <rect x="70" y="300" width="250" height="70" rx="14" fill="#fff"/><text x="195" y="330" fill="#0b2a5b" font-size="26" font-weight="800" text-anchor="middle">🏮 Phố cổ</text><text x="195" y="358" fill="#e06a10" font-size="22" font-weight="700" text-anchor="middle">~10 phút</text></g>
      <g><circle cx="700" cy="215" r="16" fill="#fff"/><circle cx="700" cy="215" r="7" fill="#f47c20"/>

<!-- ===== 5. TÒ MÒ: 4,4 TRIỆU KHÁCH – 363 CĂN ===== -->
<template id="t-tomo">

    <div class="fine">Số liệu du lịch: UBND TP Hội An 2024 · CSBH từ 09/2026 · Hotline/Zalo 0904 567 009</div>
  </div>
</template>

<div id="stage"></div>
<script>
  // Mỗi mẫu xuất 2 khổ: vuông (bài đăng) và dọc (Story/Reels)
  const SIZES = {
    sq: { '--h1': '50px', '--big': '150px', '--sub': '32px', '--g1': '40px', '--g2': '30px' },
    st: { '--h1': '62px', '--big': '150px', '--sub': '38px', '--g1': '40px', '--g2': '40px' },
  };
  const stage = document.getElementById('stage');
  document.querySelectorAll('template').forEach(t => {
    for (const [size, vars] of Object.entries(SIZES)) {
      const el = document.createElement('div');
      el.className = 'ad ' + size;
      el.id = t.id.slice(2) + '-' + size;
      for (const [k, v] of Object.entries(vars)) el.style.setProperty(k, v);
      el.appendChild(t.content.cloneNode(true));
      stage.appendChild(el);
    }
  });
</script>
</body>
</html>
