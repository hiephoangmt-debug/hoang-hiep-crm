<!doctype html><html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Be+Vietnam+Pro:wght@300;500&display=swap&subset=vietnamese" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#06101f}
.card{position:relative;width:1080px;height:1350px;overflow:hidden;color:#f4e3b2;
 background:radial-gradient(ellipse 70% 45% at 50% 52%,#173a63 0%,#0c2142 45%,#06101f 100%)}
.foil{background:linear-gradient(115deg,#9c6a1e 0%,#e9c46a 22%,#fff4c8 38%,#d9a845 52%,#f6dc8c 68%,#a8761f 85%,#e9c46a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
svg{position:absolute;left:0;top:0}
.top{position:absolute;top:118px;width:100%;text-align:center}
.kicker{font-family:'Be Vietnam Pro',sans-serif;font-weight:300;font-size:22px;letter-spacing:12px;color:#d9b46a;padding-left:12px}
.date{font-family:'Cormorant Garamond',serif;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;font-weight:600;font-size:200px;line-height:.95;margin-top:18px;letter-spacing:4px}
.title1{font-family:'Great Vibes',cursive;font-size:96px;line-height:1;margin-top:-6px}
.title2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;letter-spacing:16px;margin-top:10px;padding-left:16px}
.msg{position:absolute;top:960px;width:100%;text-align:center;padding:0 140px}
.to{font-family:'Great Vibes',cursive;font-size:56px;line-height:1.1}
.msg p{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:31px;line-height:1.45;color:#efdcae;margin-top:14px}
.sign{position:absolute;top:1205px;width:100%;text-align:center}
.sign .s1{font-family:'Be Vietnam Pro',sans-serif;font-weight:300;font-size:17px;letter-spacing:6px;color:#b99556}
.sign .s2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:34px;letter-spacing:10px;margin-top:6px;padding-left:10px}
</style></head><body><div class="card">
<svg width="1080" height="1350" viewBox="0 0 1080 1350">
 <defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#a8761f"/><stop offset=".3" stop-color="#f6dc8c"/><stop offset=".5" stop-color="#fff4c8"/><stop offset=".7" stop-color="#d9a845"/><stop offset="1" stop-color="#9c6a1e"/>
  </linearGradient>
  <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="#d9a845" stop-opacity="0"/><stop offset=".2" stop-color="#e9c46a"/><stop offset=".5" stop-color="#fff4c8"/><stop offset=".8" stop-color="#e9c46a"/><stop offset="1" stop-color="#d9a845" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="goldHU" gradientUnits="userSpaceOnUse" x1="-230" y1="0" x2="230" y2="0"><stop offset="0" stop-color="#d9a845" stop-opacity="0"/><stop offset=".45" stop-color="#fff4c8"/><stop offset=".55" stop-color="#fff4c8"/><stop offset="1" stop-color="#d9a845" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f6dc8c" stop-opacity=".22"/><stop offset="1" stop-color="#f6dc8c" stop-opacity="0"/></radialGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="refl"><rect x="0" y="870" width="1080" height="90" fill="url(#fade)"/></mask>
  <g id="corner" fill="none" stroke="url(#gold)" stroke-width="2">
   <path d="M0 90 V0 H90"/><path d="M14 70 V14 H70"/><path d="M28 50 V28 H50"/>
   <path d="M14 14 L44 44" stroke-width="1.5"/><rect x="40" y="40" width="10" height="10" transform="rotate(45 45 45)" fill="url(#gold)"/>
  </g>
  <g id="dragonBody">
   <path id="bp" d="M95 840 Q170 690 265 790 Q335 865 420 770 Q520 650 615 770 Q690 860 770 770 Q835 700 880 735"/>
  </g>
 </defs>

 <!-- khung -->
 <rect x="34" y="34" width="1012" height="1282" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
 <rect x="48" y="48" width="984" height="1254" fill="none" stroke="#d9a845" stroke-opacity=".45" stroke-width="1"/>
 <use href="#corner" transform="translate(60 60)"/>
 <use href="#corner" transform="translate(1020 60) scale(-1 1)"/>
 <use href="#corner" transform="translate(60 1290) scale(1 -1)"/>
 <use href="#corner" transform="translate(1020 1290) scale(-1 -1)"/>
 <!-- phan cach duoi tieu de -->
 <g transform="translate(540 610)">
  <line x1="-230" y1="0" x2="-18" y2="0" stroke="url(#goldHU)" stroke-width="1.5"/>
  <line x1="18" y1="0" x2="230" y2="0" stroke="url(#goldHU)" stroke-width="1.5"/>
  <rect x="-7" y="-7" width="14" height="14" transform="rotate(45)" fill="url(#gold)"/>
  <circle cx="-26" cy="0" r="2.5" fill="#e9c46a"/><circle cx="26" cy="0" r="2.5" fill="#e9c46a"/>
 </g>

 <!-- Đà Nẵng: Cầu Rồng trên sông Hàn -->
 <circle cx="900" cy="700" r="120" fill="url(#halo)"/>
 <circle cx="900" cy="700" r="62" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity=".55"/>
 <!-- skyline mo -->
 <g fill="none" stroke="#d9a845" stroke-opacity=".28" stroke-width="1.3">
  <path d="M120 840 V770 H150 V740 H175 V840 M190 840 V705 L205 690 L220 705 V840 M240 840 V760 H270 V840"/>
  <path d="M640 840 V745 H668 V715 H690 V840 M708 840 V770 H740 V840 M960 840 V735 H985 V700 L998 680 L1010 700 V840"/>
 </g>
 <g id="bridge">
  <!-- than rong: ong vang -->
  <use href="#bp" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
  <use href="#bp" fill="none" stroke="#0c2142" stroke-width="15" stroke-linecap="round"/>
  <use href="#bp" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"/>
  <!-- vay lung -->
  <path d="M190 728 l8 -16 l6 14 M235 742 l10 -14 l4 16 M455 724 l8 -18 l6 16 M520 700 l6 -18 l8 16 M575 718 l10 -15 l4 16 M800 742 l8 -16 l6 14" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <!-- mat cau -->
  <line x1="70" y1="842" x2="1010" y2="842" stroke="#e2b95c" stroke-width="3"/>
  <line x1="70" y1="852" x2="1010" y2="852" stroke="#d9a845" stroke-opacity=".6" stroke-width="1"/>
  <g stroke="#e2b95c" stroke-width="1.5">
   <line x1="180" y1="852" x2="180" y2="880"/><line x1="340" y1="852" x2="340" y2="880"/><line x1="500" y1="852" x2="500" y2="880"/>
   <line x1="660" y1="852" x2="660" y2="880"/><line x1="820" y1="852" x2="820" y2="880"/><line x1="960" y1="852" x2="960" y2="880"/>
  </g>
  <!-- duoi rong -->
  <path d="M97 838 Q62 808 76 770 Q86 806 112 818 M95 842 Q58 844 44 822 Q72 832 100 830" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dau rong -->
  <g fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
   <path d="M872 742 Q895 700 940 698 L992 706 Q1004 711 994 719 L958 724 L990 740 Q982 750 956 746 Q920 752 884 750"/>
   <path d="M958 724 L990 740"/>
   <path d="M912 702 Q888 672 856 664 Q884 684 898 706"/>
   <path d="M930 699 Q916 660 884 642 Q920 664 922 700"/>
   <path d="M876 748 Q846 744 836 722 M874 736 Q850 718 860 692"/>
   <path d="M994 712 Q1022 732 1008 762 M986 706 Q1012 684 1006 660"/>
  </g>
  <circle cx="940" cy="712" r="4" fill="url(#gold)"/>
 </g>
 <!-- phan chieu song Han -->
 <g mask="url(#refl)" opacity=".55"><use href="#bridge" transform="translate(0 1724) scale(1 -1)"/></g>
 <g stroke="#e2b95c" stroke-width="1" opacity=".35">
  <line x1="160" y1="900" x2="420" y2="900"/><line x1="620" y1="908" x2="920" y2="908"/><line x1="320" y1="918" x2="760" y2="918"/>
 </g>
 <text x="1000" y="940" text-anchor="end" font-family="Cormorant Garamond,serif" font-style="italic" font-size="22" letter-spacing="3" fill="#d9b46a" opacity=".85">Cầu Rồng · Đà Nẵng</text>
 <!-- bui vang -->
 <g fill="#fff4c8">
  <circle cx="160" cy="420" r="1.6" opacity=".7"/><circle cx="230" cy="520" r="1" opacity=".6"/><circle cx="900" cy="440" r="1.8" opacity=".7"/>
  <circle cx="840" cy="560" r="1.1" opacity=".6"/><circle cx="120" cy="640" r="1.3" opacity=".5"/><circle cx="980" cy="580" r="1" opacity=".5"/>
  <circle cx="300" cy="660" r="1.2" opacity=".5"/><circle cx="760" cy="640" r="1.4" opacity=".6"/>
 </g>
</svg>

<div class="top">
 <div class="kicker">KÍNH CHÚC MỪNG</div>
 <div class="date foil">13 · 10</div>
 <div class="title1 foil">Ngày Doanh nhân</div>
 <div class="title2 foil">VIỆT NAM</div>
</div>
<div class="msg">
 <div class="to foil" id="to">Kính gửi Anh/Chị ……………</div>
 <p>Chúc Anh/Chị luôn dồi dào sức khỏe, vững vàng bản lĩnh,<br>gặt hái nhiều thành công và thịnh vượng<br>trên hành trình kiến tạo giá trị.</p>
</div>
<div class="sign">
 <div class="s1">TRÂN TRỌNG</div>
 <div class="s2 foil">HOÀNG HIỆP</div>
</div>
</div>
<script>
const n=new URLSearchParams(location.search).get('ten');

</script></body></html>
