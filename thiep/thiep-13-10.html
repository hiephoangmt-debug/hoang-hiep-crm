<!doctype html><html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Be+Vietnam+Pro:wght@400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:'Be Vietnam Pro','DejaVu Sans',sans-serif;overflow:hidden}
.card{position:relative;width:1080px;height:1350px;background:radial-gradient(ellipse at 50% 30%,#a8121c 0%,#7a0a12 55%,#4a0509 100%);color:#fff;overflow:hidden}
.frame{position:absolute;inset:28px;border:3px solid #e8c069;border-radius:6px}
.frame2{position:absolute;inset:40px;border:1px solid rgba(232,192,105,.55);border-radius:4px}
.rays{position:absolute;left:50%;top:420px;width:1600px;height:1600px;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,215,130,.07) 0 6deg,transparent 6deg 12deg);border-radius:50%}
.top{position:absolute;top:95px;width:100%;text-align:center}
.small{letter-spacing:8px;font-size:26px;color:#f3d48b;font-weight:600}
.date{font-family:'Playfair Display',serif;font-weight:900;font-size:190px;line-height:1;margin-top:14px;background:linear-gradient(180deg,#fff3c4,#e8b84a 55%,#b9842a);-webkit-background-clip:text;color:transparent;text-shadow:0 6px 18px rgba(0,0,0,.25)}
.title{font-family:'Playfair Display',serif;font-size:66px;font-weight:700;margin-top:6px;color:#fff6dc}
.sub{font-size:28px;color:#f3d48b;margin-top:12px;letter-spacing:2px}
.line{width:300px;height:2px;margin:22px auto 0;background:linear-gradient(90deg,transparent,#e8c069,transparent)}
svg.people{position:absolute;left:0;bottom:345px;width:1080px;height:440px}
.msg{position:absolute;bottom:120px;width:100%;text-align:center;padding:0 110px}
.msg p{font-size:28px;line-height:1.55;color:#fff3d6}
.msg .sign{font-family:'Dancing Script',cursive;font-size:46px;color:#f3d48b;margin-top:14px}
.foot{position:absolute;bottom:62px;width:100%;text-align:center;font-size:20px;letter-spacing:4px;color:#e8c069}
.star{position:absolute;color:#ffd96b;font-size:30px}
</style></head><body><div class="card">
<div class="rays"></div><div class="frame"></div><div class="frame2"></div>
<span class="star" style="left:120px;top:160px">✦</span><span class="star" style="right:130px;top:200px;font-size:22px">✦</span>
<span class="star" style="left:170px;top:420px;font-size:18px">✦</span><span class="star" style="right:170px;top:460px">✦</span>
<div class="top">
 <div class="small">CHÚC MỪNG</div>
 <div class="date">13.10</div>
 <div class="title">Ngày Doanh nhân Việt Nam</div>
 <div class="sub">Bản lĩnh · Tiên phong · Thịnh vượng</div>
 <div class="line"></div>
</div>

 </defs>

 </g>
 <g fill="url(#g)">

  <circle cx="540" cy="112" r="40"/>
  <path d="M500 105 Q505 62 540 60 Q580 62 582 108 Q560 80 520 88 Z" fill="#c08a2c"/>
  <path d="M470 470 L482 230 Q490 170 540 162 Q590 170 598 230 L610 470 Z"/>
  <path d="M520 168 L540 225 L560 168 Z" fill="#7a0a12"/>
  <path d="M482 240 L440 330 L455 338 L492 270 Z"/><path d="M598 240 L640 330 L625 338 L588 270 Z"/>
  <!-- Anh 2 (phải) -->
  <circle cx="750" cy="150" r="42"/>
  <path d="M680 470 L688 250 Q695 205 750 198 Q805 205 812 250 L820 470 Z"/>
  <path d="M738 205 L750 255 L762 205 Z" fill="#7a0a12"/>
  <path d="M688 255 L640 210 L650 198 L695 230 Z"/>
 </g>
 <g fill="#a8121c">
  <path d="M326 212 L334 212 L338 300 L330 312 L322 300 Z"/><path d="M746 212 L754 212 L758 300 L750 312 L742 300 Z"/>
 </g>
</svg>
<div class="msg">
 <p>Kính chúc các Anh, Chị Doanh nhân luôn dồi dào sức khỏe,<br>vững vàng bản lĩnh, thành công rực rỡ<br>và vạn sự hanh thông trên con đường kinh doanh!</p>
 <div class="sign">Trân trọng – Hoàng Hiệp</div>
</div>
<div class="foot">HOÀNG HIỆP · BẤT ĐỘNG SẢN</div>
</div></body></html>
