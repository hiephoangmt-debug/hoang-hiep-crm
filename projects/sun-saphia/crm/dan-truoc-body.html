    {id:'hoi-dap',m:/cau hoi thuong gap|hoi dap/,q:'Chưa thấy câu hỏi của mình? Anh/chị gõ vào đây, em trả lời ngay ạ.',c:['Giá bán','Pháp lý','Có mất phí không?']}
  ];

  var $=function(id){return document.getElementById(id)};
  var body=$('hmwBody'), panel=$('hmwPanel'), badge=$('hmwBadge'), bubble=$('hmwBubble');
  var started=false, gotPhone=false, curTopic=null, pending=null, askedPhone=0, H=[];
  function scroll(){body.scrollTop=body.scrollHeight;}
  function bot(t,d){setTimeout(function(){var e=document.createElement('div');e.className='hmw-msg hmw-bot';e.textContent=t;body.appendChild(e);scroll();},d||350);}
  function me(t){var e=document.createElement('div');e.className='hmw-msg hmw-me';e.textContent=t;body.appendChild(e);scroll();}
  function chips(list,d){setTimeout(function(){var w=document.createElement('div');w.className='hmw-chips';list.forEach(function(c){var b=document.createElement('button');b.type='button';b.className='hmw-chip';b.textContent=c;b.onclick=function(){handle(c);};w.appendChild(b);});body.appendChild(w);scroll();},d||500);}
  function acts(d){setTimeout(function(){var w=document.createElement('div');w.className='hmw-acts';w.innerHTML='<a class="o" href="'+TEL+'">📞 Gọi 0904 567 009</a><a href="'+ZALO+'" target="_blank" rel="noopener">💬 Chat Zalo</a>';body.appendChild(w);scroll();},d||600);}
  var DEF=['Nhận bảng giá','Khi nào mở bán?','Loại căn','Phía trước là gì?','Cách sân bay bao xa?','Hỗ trợ vay'];

  function start(topic){
    if(!started){started=true;bot('Chào anh/chị 👋 Em là trợ lý tư vấn Sun Saphia Residence – căn hộ mặt biển 30 tầng khu Saphia, cạnh bãi tắm Sơn Thủy, Đà Nẵng.',80);}
    if(topic){bot(topic.q,started?400:600);H.push({r:'bot',t:topic.q});chips(topic.c.concat(['Nhận bảng giá']),900);}
    else if(body.children.length<2){bot('Anh/chị cần tìm hiểu thông tin nào ạ?',500);chips(DEF,800);}
  }
  function sendCRM(phone,text){
    var msg='Chat web'+(curTopic?' – đang đọc: '+curTopic.id:'')+' – '+text;
    try{ if(window.crmLead) window.crmLead({name:'Khách chat web',phone:phone,message:msg}); }catch(e){}
    try{ if(window.gtag&&window.HM_TRACK&&!/\[/.test(window.HM_TRACK.form||'[')) gtag('event','conversion',{send_to:window.HM_TRACK.form}); }catch(e){}
  }
  function handle(text){
    text=(text||'').trim(); if(!text) return; me(text); H.push({r:'me',t:text});
    var digits=text.replace(/\D/g,''); if(/^84\d{9}$/.test(digits)) digits='0'+digits.slice(2);
    if(/^0\d{8,10}$/.test(digits)){
      gotPhone=true; sendCRM(digits,text);
      bot('Cảm ơn anh/chị! Em đã nhận số '+digits+'. Chuyên viên Hoàng Hiệp sẽ nhắn Zalo gửi tài liệu trong ít phút (giờ hành chính).\nCần gấp, anh/chị bấm Gọi hoặc Zalo bên dưới ạ.');
      acts(); return;
    }
    var n=' '+norm(text).replace(/\bko\b|\bk\b|\bkhong\b/g,' khong ').replace(/\bdc\b|\bdk\b/g,' duoc ')+' ', hit=null, best=0;
    KB.forEach(function(it){var s=0;it.k.forEach(function(k){if(n.indexOf(norm(k))>-1)s+=k.length;});if(s>best){best=s;hit=it;}});
    if(hit&&best>=5){
      bot(hit.a); H.push({r:'bot',t:hit.a});
      if(hit.lead&&!gotPhone&&!askedPhone){askedPhone=1;bot('👉 Anh/chị để lại số Zalo, em gửi tài liệu riêng cho mình nhé.',1000);}
      return;
    }
    ai(text);
  }
  function typing(){var e=document.createElement('div');e.className='hmw-msg hmw-bot';e.textContent='Em đang trả lời…';e.style.opacity='.6';body.appendChild(e);scroll();return e;}
  function ai(text){
    var C=window.HM_CRM, t=typing(), vid=''; try{vid=localStorage.getItem('crm_vid')||'';}catch(e){}
    function fail(){ t.remove(); var m='Câu này em xin chuyên viên Hoàng Hiệp trả lời trực tiếp cho chính xác ạ. Anh/chị để lại số Zalo, hoặc bấm Gọi / Zalo bên dưới.'; bot(m,50); H.push({r:'bot',t:m}); acts(); }
    if(!C||!window.HM_JSONP){fail();return;}
    var hist=H.slice(-5,-1).map(function(m){return {r:m.r,t:String(m.t).slice(0,200)};});
    window.HM_JSONP({action:'chat',project:'saphia',vid:vid,q:text,topic:curTopic?curTopic.id:'',history:JSON.stringify(hist)},function(j){
      if(!j||!j.a){fail();return;}
      t.remove(); bot(j.a,50); H.push({r:'bot',t:j.a});
    },20000);
  }
  function open(topic){
    panel.classList.add('open'); bubble.style.display='none'; badge.style.display='none';
    start(topic||null);
    if(window.innerWidth>600) setTimeout(function(){$('hmwInput').focus();},250);
  }
  $('hmwOpen').onclick=function(){ if(panel.classList.contains('open')) panel.classList.remove('open'); else open(pending); pending=null; };
  $('hmwClose').onclick=function(){panel.classList.remove('open');};
  $('hmwForm').onsubmit=function(e){e.preventDefault();var i=$('hmwInput');handle(i.value);i.value='';};
  bubble.onclick=function(e){bubble.style.display='none'; if(e.target.id==='hmwBubbleX'){shownCount=99;return;} open(pending); pending=null;};
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href$="#chat-tu-van"]');if(a){e.preventDefault();open();}});

  /* ---------- Theo dõi đoạn đang đọc: dừng ~12 giây → hỏi đúng chủ đề ---------- */
  var DWELL=12, GAP=35, MAXPOP=3, shown={}, shownCount=0, lastPop=0, dwell=0, lastId=null, cache=[];
  function sections(){
    if(!cache.length){ var els=document.querySelectorAll('.ladi-section, main > section, body > section');
      for(var i=0;i<els.length;i++){ var t=norm((els[i].innerText||'').slice(0,600)), tp=null;
        for(var j=0;j<TOPICS.length;j++){ if(TOPICS[j].m.test(t)){tp=TOPICS[j];break;} }
        cache.push({el:els[i],tp:tp}); } }
    return cache;
  }
  function current(){
    var y=window.innerHeight*0.45, s=sections();
    for(var i=0;i<s.length;i++){ var r=s[i].el.getBoundingClientRect(); if(r.top<=y&&r.bottom>=y) return s[i].tp; }
    return null;
  }
  setInterval(function(){
    if(document.visibilityState!=='visible') return;
    var tp=current(); curTopic=tp||curTopic;
    var id=tp?tp.id:null;
    if(id!==lastId){lastId=id;dwell=0;return;}
    if(!tp||panel.classList.contains('open')||gotPhone||shown[id]||shownCount>=MAXPOP) return;
    if(++dwell<DWELL) return;
    if((Date.now()-lastPop)/1000<GAP) return;
    shown[id]=1; shownCount++; lastPop=Date.now(); pending=tp;
    $('hmwBubbleText').textContent=tp.q; bubble.style.display='block'; badge.style.display='flex';
    setTimeout(function(){ if(pending===tp) bubble.style.display='none'; },25000);
  },1000);
  setTimeout(function(){cache=[];},4000);
})();
</script>

<!-- Gắn nhãn nút Zalo / Gọi của LadiPage để CRM ghi lượt bấm -->
<script>
(function () {
  function tag() {
    var ls = document.querySelectorAll('a[href^="tel:"], a[href*="zalo.me"]');
    for (var j = 0; j < ls.length; j++) { var a = ls[j]; if (a.hasAttribute('data-crm-click') || (a.closest && a.closest('#hmw'))) continue;
      a.setAttribute('data-crm-click', /zalo\.me/.test(a.getAttribute('href')) ? 'zalo' : 'phone'); }
    var els = document.querySelectorAll('[id^="BUTTON"], .ladi-button, [id^="HEADLINE"], [id^="PARAGRAPH"]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.hasAttribute('data-crm-click') || (el.closest && el.closest('.ladi-form, form, #hmw'))) continue;
      var t = (el.innerText || '').replace(/\s+/g, ' ').trim().toLowerCase();
      if (!t || t.length > 40) continue;
      if (/zalo/.test(t)) el.setAttribute('data-crm-click', 'zalo');
      else if (/^g[oọ]i( tư vấn| ngay)?$|^hotline|0904[\s.]?567[\s.]?009/.test(t)) el.setAttribute('data-crm-click', 'phone');
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tag); else tag();
  setTimeout(tag, 1500); setTimeout(tag, 4000);
})();
</script>
<!-- Đổi lời "Thank you!" mặc định của form LadiPage thành lời cảm ơn riêng -->
<script>
(function(){
  var MSG='Cảm ơn anh/chị! Chuyên viên sẽ gửi bảng giá & hồ sơ dự án qua Zalo 0904 567 009 trong ít phút.';
  var RE=/^\s*(thank you!?|thanks!?|cảm ơn!?)\s*$/i;
  var _alert=window.alert;
  window.alert=function(m){ return _alert.call(window, RE.test(String(m||''))?MSG:m); };
  function fix(root){
    var w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT,null,false),n;
    while((n=w.nextNode())){ if(RE.test(n.nodeValue)&&!(n.parentNode&&n.parentNode.closest&&n.parentNode.closest('#hmw'))) n.nodeValue=MSG; }
  }
  function start(){ fix(document.body); new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(x){ if(x.nodeType===3){ if(RE.test(x.nodeValue)) x.nodeValue=MSG; } else if(x.nodeType===1) fix(x); }); if(m.type==='characterData'&&RE.test(m.target.nodeValue)) m.target.nodeValue=MSG;});}).observe(document.body,{childList:true,subtree:true,characterData:true}); }
  if(document.body) start(); else document.addEventListener('DOMContentLoaded',start);
})();
</script>
