<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sun Saphia Residence · Xem dự án</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--navy:#0A2540;--or:#FF6A2B;--font:"Be Vietnam Pro",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0A2540;font-family:var(--font)}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;background:var(--navy);color:#fff}
.top .b{font-weight:800;font-size:16px;margin-right:auto}.top .b span{color:var(--or)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:0;border-radius:18px;padding:8px 13px;font:800 13.5px var(--font);background:#fff;color:var(--navy);cursor:pointer}
.tabs button.on{background:var(--or);color:#fff}
.top .who{font-size:12px;color:#c9d6e3}.top .out{background:none;border:1px solid #6d8099;color:#fff;border-radius:14px;padding:4px 9px;font:700 12px var(--font);cursor:pointer}
#view{position:fixed;left:0;right:0;bottom:0;top:52px;background:#fff}#view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}#view iframe.on{display:block}
/* cổng đăng nhập */
#gate{position:fixed;inset:0;z-index:9;background:linear-gradient(160deg,#0A2540,#12355c);display:flex;align-items:center;justify-content:center;padding:16px}
#gate .bx{background:#fff;border-radius:16px;max-width:370px;width:100%;padding:22px 20px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.35);border-top:5px solid var(--or)}
#gate .lg{width:54px;height:54px;border-radius:14px;margin:0 auto 10px;background:linear-gradient(135deg,#FF8A3D,#FF6A2B);color:#fff;font:800 22px Georgia,serif;display:flex;align-items:center;justify-content:center}
#gate h3{margin:0 0 4px;color:var(--navy);font-size:18px}#gate p{margin:0 0 12px;color:#41505f;font-size:13.5px;line-height:1.45}
#gate input{width:100%;border:1.5px solid #c9d3dd;border-radius:10px;padding:11px 12px;font-size:16px;text-align:center}
#gate .bt{margin-top:10px;width:100%;border:0;border-radius:10px;padding:12px;background:var(--or);color:#fff;font:800 15px var(--font);cursor:pointer}
#gate .lnk{background:none;border:0;color:var(--navy);font-weight:700;font-size:13px;margin-top:6px;padding:4px;text-decoration:underline;cursor:pointer}
#gate .or{display:flex;align-items:center;gap:8px;color:#8a96a3;font-size:12px;margin:14px 0 8px}#gate .or:before,#gate .or:after{content:"";flex:1;height:1px;background:#e2e7ec}
#gate .m{min-height:18px;margin-top:8px;font-size:13px;color:#d63b2f;font-weight:700}#gate .ok{color:#1b8a4a}
#gBtn{display:flex;justify-content:center;min-height:44px}
#gate a{color:var(--navy);font-weight:800;text-decoration:none}
</style></head>
<body>
<div class="top"><div class="b">Sun Saphia <span>Residence</span></div>
  <div class="tabs"><button data-t="d4" class="on">🏙 Mô hình 4D</button><button data-t="cc">🏠 Chọn căn</button><button data-t="f3">🏢 3D cả tầng</button></div>
  <span class="who" id="who"></span><button class="out" id="out" type="button">Thoát</button></div>
<div id="view"></div>

<div id="gate"><div class="bx"><div class="lg">SR</div><h3>Xem dự án Sun Saphia Residence</h3>
  <p>Dành riêng cho người được Hoàng Hiệp cấp quyền.</p>
  <div id="gWrap"><div id="gBtn"></div><div class="or">hoặc nhận mã qua email</div></div>
  <p id="tx" style="margin-bottom:8px">Nhập email đã được cấp quyền, mã 6 số sẽ gửi vào hộp thư:</p>
  <input id="in" type="email" autocomplete="email" autocapitalize="off" placeholder="Email của bạn">
  <button type="button" class="bt" id="bt">Gửi mã vào email</button>
  <button type="button" class="lnk" id="bk" style="display:none">← Nhập email khác</button>
  <div class="m" id="msg"></div>
  <p style="margin:10px 0 0">Chưa được cấp quyền? Liên hệ <a href="tel:0904567009">0904 567 009</a> · <a href="https://zalo.me/0904567009">Zalo</a></p></div></div>

<script>
(function(){
var API='https://script.google.com/macros/s/AKfycbyChbG-uvItjVlRk7JgLrwpUS6Cgah4nIA6BWHuEwgbXBqSlvAPJNSdZdp6pQ91d_rN/exec', SITE='kGYgRtNhbHZr';
var GCID='';   // Google OAuth Client ID (Web) – để trống thì ẩn nút Google
var U4D='https://rawcdn.githack.com/hiephoangmt-debug/hoang-hiep-crm/f0bd28439cff3f54f969e08282cf4afd7d3fb29f/projects/sun-saphia/4d/sun-saphia-4d.html';
var UCC='https://rawcdn.githack.com/hiephoangmt-debug/hoang-hiep-crm/ea12fd6aa6ee67472173d42ec35a8d5d813dbad7/projects/sun-saphia/chon-can/chon-can-app.html';
var $=function(i){ return document.getElementById(i); }, step='email', email='', KEY=null;
function msg(t,ok){ $('msg').textContent=t; $('msg').className='m'+(ok?' ok':''); }
function call(params,cb){ var name='xg'+Date.now()+Math.floor(Math.random()*1e4), s=document.createElement('script'), done=false, q=['cb='+name,'key='+SITE];
  for(var k in params) q.push(k+'='+encodeURIComponent(params[k]));
  window[name]=function(r){ done=true; try{delete window[name];}catch(e){} s.remove(); cb(r||{}); };
  s.src=API+'?'+q.join('&'); s.onerror=function(){ if(!done){ done=true; cb({error:1}); } }; setTimeout(function(){ if(!done){ done=true; cb({error:1}); } },20000); document.head.appendChild(s); }
function reason(r){ return r.error?'Không kết nối được, thử lại sau.':r.reason==='expired'?'Quyền xem đã hết hạn.':r.reason==='locked'?'Quyền xem đã bị khóa.':r.reason==='otp'?'Mã xác nhận không đúng hoặc đã hết hạn.':r.reason==='email'?'Email không hợp lệ.':r.reason==='google'?'Không xác thực được tài khoản Google.':'Email này chưa được cấp quyền.'; }
var page='xem-du-an';
// ---- vào xem ----
var frames={};
function tab(t){ [].forEach.call(document.querySelectorAll('.tabs button'),function(b){ b.classList.toggle('on',b.dataset.t===t); });
  if(!frames[t]){ var f=document.createElement('iframe'); f.allow='fullscreen'; f.title=t; var k='&k='+encodeURIComponent(KEY);
    f.src=t==='d4'?U4D+'?crm'+k:t==='cc'?UCC+'?x=1'+k:UCC+'?f=18&f3=1'+k; $('view').appendChild(f); frames[t]=f; }
  for(var x in frames) frames[x].classList.toggle('on',x===t); try{ localStorage.setItem('xTab',t); }catch(e){} }
function grant(name,key){ KEY=key; try{ localStorage.setItem('ssKey',key); localStorage.setItem('ssName',name||''); }catch(e){} $('who').textContent=name?('Xin chào '+name):''; $('gate').remove(); var t='d4'; try{ t=localStorage.getItem('xTab')||'d4'; }catch(e){} tab(t); }
[].forEach.call(document.querySelectorAll('.tabs button'),function(b){ b.onclick=function(){ if(KEY) tab(b.dataset.t); }; });
$('out').onclick=function(){ try{ localStorage.removeItem('ssKey'); }catch(e){} location.reload(); };
// ---- đăng nhập bằng email + mã 6 số ----
function toOtp(){ step='otp'; $('tx').textContent='Đã gửi mã 6 số tới '+email+'. Mở hộp thư (kể cả mục Spam/Quảng cáo) và nhập mã:'; var i=$('in'); i.value=''; i.type='text'; i.inputMode='numeric'; i.placeholder='Mã 6 số'; $('bt').textContent='Xác nhận'; $('bk').style.display='inline-block'; }
function toEmail(){ step='email'; $('tx').textContent='Nhập email đã được cấp quyền, mã 6 số sẽ gửi vào hộp thư:'; var i=$('in'); i.value=email; i.type='email'; i.placeholder='Email của bạn'; $('bt').textContent='Gửi mã vào email'; $('bk').style.display='none'; msg(''); }
function own(c,yes,no){ try{ crypto.subtle.digest('SHA-256',new TextEncoder().encode(c)).then(function(d){ var h=[].map.call(new Uint8Array(d),function(x){return ('0'+x.toString(16)).slice(-2)}).join(''); h==='029a64f4f8d4479b70daca4fcb4fb719cf27ea51878aea2339f4616e3e455146'?yes():no(); },no); }catch(e){ no(); } }
function go(){ var v=String($('in').value||'').trim(); if(!v) return;
  if(step==='email'){
    if(v.indexOf('@')<0){ msg('Đang kiểm tra…',1); own(v,function(){ grant('Hoàng Hiệp',v); },function(){ call({action:'access',code:v,page:page},function(r){ if(r.access===true) grant(r.name,v); else msg(reason(r)); }); }); return; }
    email=v.toLowerCase(); msg('Đang gửi mã…',1);
    call({action:'access_req',email:email},function(r){ if(r.sent){ toOtp(); msg(r.wait?'Mã vừa được gửi, vui lòng kiểm tra hộp thư.':'',1); } else msg(reason(r)); });
  } else { msg('Đang xác nhận…',1); call({action:'access_otp',email:email,otp:v,page:page},function(r){ if(r.access===true&&r.token) grant(r.name,r.token); else msg(reason(r)); }); } }
$('bt').onclick=go; $('in').onkeydown=function(e){ if(e.key==='Enter') go(); }; $('bk').onclick=toEmail;
// ---- đăng nhập bằng Google (Gmail) ----
if(/^[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com$/.test(GCID)){
  var gs=document.createElement('script'); gs.src='https://accounts.google.com/gsi/client'; gs.async=true;
  gs.onload=function(){ google.accounts.id.initialize({client_id:GCID,auto_select:true,callback:function(res){ msg('Đang kiểm tra tài khoản Google…',1);
      call({action:'access_google',cred:res.credential,page:page},function(r){ if(r.access===true&&r.token) grant(r.name,r.token); else msg(reason(r)+(r.email?' ('+r.email+')':'')); }); }});
    google.accounts.id.renderButton($('gBtn'),{theme:'filled_blue',size:'large',shape:'pill',text:'signin_with',locale:'vi',width:300}); };
  document.head.appendChild(gs);
} else $('gWrap').style.display='none';
// ---- đã đăng nhập trước đó (nhớ 30 ngày) ----
var Q=location.search, k=(/[?&]k=([^&#]+)/.exec(Q)||[])[1]; if(k) k=decodeURIComponent(k); else { try{ k=localStorage.getItem('ssKey'); }catch(e){} }
var pe=(/[?&]e=([^&#]+)/.exec(Q)||[])[1]; if(pe) $('in').value=decodeURIComponent(pe);
if(k&&k.indexOf('@')<0) own(k,function(){ grant('Hoàng Hiệp',k); },function(){ msg('Đang kiểm tra…',1); call({action:'access',code:k,page:page},function(r){ if(r.access===true){ var n=''; try{ n=localStorage.getItem('ssName')||r.name; }catch(e){} grant(n,k); } else { try{ localStorage.removeItem('ssKey'); }catch(e){} msg(''); } }); });
})();
</script>
</body></html>
