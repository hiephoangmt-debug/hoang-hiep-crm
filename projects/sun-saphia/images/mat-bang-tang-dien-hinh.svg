      <rect x="0" y="126" width="126" height="87" fill="#4FB3E0"/>
      <rect x="0" y="213" width="126" height="53" fill="#E86A78"/><rect x="0" y="266" width="126" height="53" fill="#E86A78"/>
      <rect x="0" y="319" width="126" height="53" fill="#E86A78"/><rect x="0" y="372" width="126" height="53" fill="#E86A78"/>
      <rect x="0" y="425" width="126" height="53" fill="#E86A78"/>
      <rect x="168" y="358" width="140" height="60" fill="#b9c1ca"/>
      <rect x="168" y="418" width="140" height="53" fill="#E86A78"/><rect x="168" y="471" width="140" height="53" fill="#E86A78"/>
