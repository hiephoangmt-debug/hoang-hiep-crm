  <g fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"><path d="M60 120 q25 -12 50 0 t50 0"/><path d="M760 112 q25 -12 50 0 t50 0"/><path d="M430 132 q25 -12 50 0 t50 0"/></g>
