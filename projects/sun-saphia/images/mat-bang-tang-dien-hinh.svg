  <!-- chú thích -->
  <g transform="translate(470,640)" font-size="17">
    <rect width="470" height="250" rx="14" fill="#fff" stroke="#e4ded2"/>
    <text x="22" y="38" font-size="19" font-weight="800" fill="#0A2540">Loại căn &amp; kích thước (theo layout CĐT)</text>
    <rect x="22" y="62" width="26" height="26" rx="5" fill="#E86A78"/><text x="60" y="81" fill="#0A2540"><tspan font-weight="800">Studio</tspan> · 3,8 × 9,0 m · 30–31 m²</text>
    <rect x="22" y="104" width="26" height="26" rx="5" fill="#4FB3E0"/><text x="60" y="123" fill="#0A2540"><tspan font-weight="800">1PN+1</tspan> · 6,2 × 9,0 m · 50–51 m²</text>
    <rect x="22" y="146" width="26" height="26" rx="5" fill="#F2C14E"/><text x="60" y="165" fill="#0A2540"><tspan font-weight="800">2PN</tspan> · 7,25 × 9,9 m · 60–70 m²</text>
    <text x="22" y="205" font-size="14" fill="#5d6b7a">Diện tích theo tài liệu giới thiệu dự án.</text>
    <text x="22" y="227" font-size="14" fill="#5d6b7a">Sơ đồ vẽ lại để minh họa, không theo tỷ lệ chính xác.</text>
  </g>
  <!-- 3 hướng view -->
  <g transform="translate(470,910)" font-size="16" font-weight="700">
    <rect width="470" height="120" rx="14" fill="url(#nav)"/>
    <text x="22" y="36" fill="#FF8A3D" font-weight="800">3 hướng view</text>
    <text x="22" y="66" fill="#fff">▲ Biển: dãy mặt Trường Sa + 2 căn 2PN nhô ra</text>
    <text x="22" y="96" fill="#fff">◀ ▼ Sông Hàn · đô thị: dãy phía sau, cánh Bắc</text>
  </g>
  <rect x="0" y="1048" width="1000" height="32" fill="#0A2540"/>
  <text x="500" y="1070" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Hotline/Zalo 0904 567 009 · sun-saphia-residence.com</text>
