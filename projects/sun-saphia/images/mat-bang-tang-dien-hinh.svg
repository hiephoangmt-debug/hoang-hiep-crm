      <rect x="395" y="182" width="53" height="140" fill="#E86A78"/><rect x="448" y="182" width="53" height="140" fill="#E86A78"/>
      <rect x="501" y="182" width="53" height="140" fill="#E86A78"/><rect x="554" y="182" width="53" height="140" fill="#E86A78"/>
      <rect x="607" y="182" width="53" height="140" fill="#E86A78"/><rect x="660" y="182" width="53" height="140" fill="#E86A78"/>
      <path d="M713 168 H742 Q756 168 756 182 V308 Q756 322 742 322 H713Z" fill="#E86A78"/>
