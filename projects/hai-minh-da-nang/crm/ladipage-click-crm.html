<!-- CRM Hoàng Hiệp: gắn nhãn nút Zalo / Gọi của LadiPage để CRM + Telegram ghi nhận lượt bấm.
     Dán vào LadiPage → Thiết lập → Mã tùy chỉnh → "Trước </body>" (dán SAU đoạn mã chat). -->
<script>
(function () {
  function tag() {
    var els = document.querySelectorAll('[id^="BUTTON"], .ladi-button, [id^="HEADLINE"], [id^="PARAGRAPH"]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.hasAttribute('data-crm-click') || (el.closest && el.closest('.ladi-form, form'))) continue;
      var t = (el.innerText || '').replace(/\s+/g, ' ').trim().toLowerCase();
      if (!t || t.length > 40) continue;
      if (/^(chat |nhắn )?zalo( ngay)?$|^chat zalo/.test(t)) el.setAttribute('data-crm-click', 'zalo');
      else if (/^g[oọ]i( tư vấn| ngay)?$|^hotline|0904[\s.]?567[\s.]?009/.test(t)) el.setAttribute('data-crm-click', 'phone');
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tag); else tag();
  setTimeout(tag, 1500); setTimeout(tag, 4000);
})();
</script>
