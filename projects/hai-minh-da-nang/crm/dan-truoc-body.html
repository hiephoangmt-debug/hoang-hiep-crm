  var DEF=['Nhận bảng giá','Khi nào ra mắt?','Phía trước là gì?','Loại căn','Dòng tiền cho thuê','Pháp lý 50 năm'];

  function start(topic){

  function handle(text){
    text=(text||'').trim(); if(!text) return; me(text); H.push({r:'me',t:text});
    var digits=text.replace(/\D/g,''); if(/^84\d{9}$/.test(digits)) digits='0'+digits.slice(2);
    if(/^0\d{8,10}$/.test(digits)){
      gotPhone=true; sendCRM(digits,text);
      bot('Cảm ơn anh/chị! Em đã nhận số '+digits+'. Chuyên viên Hoàng Hiệp sẽ nhắn Zalo gửi tài liệu trong ít phút (giờ hành chính).\nCần gấp, anh/chị bấm Gọi hoặc Zalo bên dưới ạ.');
      acts(); return;
    }
    var n=' '+norm(text).replace(/\bko\b|\bk\b|\bkhong\b/g,' khong ').replace(/\bdc\b|\bdk\b/g,' duoc ')+' ', hit=null, best=0;
    KB.forEach(function(it){var s=0;it.k.forEach(function(k){if(n.indexOf(norm(k))>-1)s+=k.length;});if(s>best){best=s;hit=it;}});
    if(hit&&best>=5){
      bot(hit.a); H.push({r:'bot',t:hit.a});
      if(hit.lead&&!gotPhone&&!askedPhone){askedPhone=1;bot('👉 Anh/chị để lại số Zalo, em gửi tài liệu riêng cho mình nhé.',1000);}
      return;

    if(!C||!window.HM_JSONP){fail();return;}
    var hist=H.slice(-5,-1).map(function(m){return {r:m.r,t:String(m.t).slice(0,200)};});

  /* ---------- Theo dõi đoạn đang đọc: dừng ~12 giây → hỏi đúng chủ đề ---------- */
  var DWELL=12, GAP=35, MAXPOP=3, shown={}, shownCount=0, lastPop=0, dwell=0, lastId=null, cache=[];
  function sections(){
    if(!cache.length){ var els=document.querySelectorAll('.ladi-section, main > section, body > section');
      for(var i=0;i<els.length;i++){ var t=norm((els[i].innerText||'').slice(0,600)), tp=null;

        cache.push({el:els[i],tp:tp}); } }
    return cache;
  }
  function current(){
    var y=window.innerHeight*0.45, s=sections();
    for(var i=0;i<s.length;i++){ var r=s[i].el.getBoundingClientRect(); if(r.top<=y&&r.bottom>=y) return s[i].tp; }
    return null;
  }
  setInterval(function(){
    if(document.visibilityState!=='visible') return;

    if(!tp||panel.classList.contains('open')||gotPhone||shown[id]||shownCount>=MAXPOP) return;
    if(++dwell<DWELL) return;
    if((Date.now()-lastPop)/1000<GAP) return;
    shown[id]=1; shownCount++; lastPop=Date.now(); pending=tp;

<!-- Đổi lời "Thank you!" mặc định của form LadiPage thành lời cảm ơn riêng -->
<script>
(function(){
  var MSG='Cảm ơn anh/chị! Chuyên viên sẽ gửi bảng giá & hồ sơ dự án qua Zalo 0904 567 009 trong ít phút.';
  var RE=/^\s*(thank you!?|thanks!?|cảm ơn!?)\s*$/i;
  var _alert=window.alert;
  window.alert=function(m){ return _alert.call(window, RE.test(String(m||''))?MSG:m); };
  function fix(root){
    var w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT,null,false),n;
    while((n=w.nextNode())){ if(RE.test(n.nodeValue)&&!(n.parentNode&&n.parentNode.closest&&n.parentNode.closest('#hmw'))) n.nodeValue=MSG; }
  }
  function start(){ fix(document.body); new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(x){ if(x.nodeType===3){ if(RE.test(x.nodeValue)) x.nodeValue=MSG; } else if(x.nodeType===1) fix(x); }); if(m.type==='characterData'&&RE.test(m.target.nodeValue)) m.target.nodeValue=MSG;});}).observe(document.body,{childList:true,subtree:true,characterData:true}); }
  if(document.body) start(); else document.addEventListener('DOMContentLoaded',start);
})();
</script>
