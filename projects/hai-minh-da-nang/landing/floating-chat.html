<style>
#hmw{--n:#0B2545;--o:#E8650A;--od:#C9540A;font-family:"Be Vietnam Pro",Arial,sans-serif}
#hmw *{box-sizing:border-box}
#hmw .hmw-dock{position:fixed;right:18px;bottom:22px;z-index:99990;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
#hmw .hmw-btn{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;border:0;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28);position:relative}
#hmw .hmw-btn svg{width:28px;height:28px;fill:#fff}
#hmw .hmw-zalo{background:#0068FF;font-weight:800;font-size:14px}
#hmw .hmw-call{background:var(--o);animation:hmwring 1.8s infinite}
#hmw .hmw-chat{background:var(--n)}
#hmw .hmw-tip{position:absolute;right:66px;white-space:nowrap;background:#fff;color:var(--n);font-size:13px;font-weight:700;padding:6px 10px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.18);pointer-events:none}
#hmw .hmw-badge{position:absolute;top:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:var(--o);color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;border:2px solid #fff}
@keyframes hmwring{0%,100%{transform:rotate(0)}5%,15%{transform:rotate(-14deg)}10%,20%{transform:rotate(14deg)}25%{transform:rotate(0)}}
#hmw .hmw-panel{position:fixed;right:18px;bottom:96px;z-index:99991;width:360px;max-width:calc(100vw - 24px);height:520px;max-height:calc(100vh - 120px);background:#fff;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.3);display:none;flex-direction:column;overflow:hidden}
#hmw .hmw-panel.open{display:flex}
#hmw .hmw-head{background:var(--n);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
#hmw .hmw-ava{width:38px;height:38px;border-radius:50%;background:var(--o);display:flex;align-items:center;justify-content:center;font-weight:800}
#hmw .hmw-head b{display:block;font-size:15px}
#hmw .hmw-head small{color:#B9C6DA;font-size:12px}
#hmw .hmw-x{margin-left:auto;background:none;border:0;color:#fff;font-size:24px;cursor:pointer;line-height:1}
#hmw .hmw-body{flex:1;overflow-y:auto;padding:14px;background:#F4F6FA}
#hmw .hmw-msg{max-width:85%;padding:10px 12px;border-radius:12px;margin:0 0 10px;font-size:14px;line-height:1.5;white-space:pre-line}
#hmw .hmw-bot{background:#fff;color:#1F2D3D;border:1px solid #DCE2EA;border-bottom-left-radius:4px}
#hmw .hmw-me{background:var(--o);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
#hmw .hmw-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
#hmw .hmw-chip{background:#fff;border:1px solid var(--o);color:var(--od);font-size:13px;font-weight:600;padding:6px 10px;border-radius:16px;cursor:pointer}
#hmw .hmw-acts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
#hmw .hmw-acts a{font-size:13px;font-weight:700;text-decoration:none;padding:7px 12px;border-radius:6px;color:#fff;background:var(--n)}
#hmw .hmw-acts a.o{background:var(--o)}
#hmw .hmw-foot{display:flex;gap:8px;padding:10px;border-top:1px solid #DCE2EA;background:#fff}
#hmw .hmw-foot input{flex:1;border:1px solid #C9D3E0;border-radius:20px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none}
#hmw .hmw-foot button{background:var(--o);color:#fff;border:0;border-radius:20px;padding:0 16px;font-weight:700;cursor:pointer;font-family:inherit}
@media (max-width:600px){
  #hmw .hmw-dock{right:12px;bottom:16px;gap:10px}
  #hmw .hmw-btn{width:50px;height:50px}
  #hmw .hmw-tip{display:none}
  #hmw .hmw-panel{right:12px;left:12px;width:auto;bottom:84px;height:70vh}
}
</style>

<div id="hmw">
  <div class="hmw-panel" id="hmwPanel" role="dialog" aria-label="Tư vấn căn hộ Hải Minh">
    <div class="hmw-head">
      <div class="hmw-ava">HM</div>
      <div><b>Tư vấn Hải Minh Đà Nẵng</b><small>Trả lời tự động 24/7</small></div>
      <button class="hmw-x" id="hmwClose" aria-label="Đóng">×</button>
    </div>
    <div class="hmw-body" id="hmwBody"></div>
    <form class="hmw-foot" id="hmwForm">
      <input id="hmwInput" type="text" placeholder="Nhập câu hỏi hoặc số điện thoại..." autocomplete="off" aria-label="Nhập tin nhắn">
      <button type="submit">Gửi</button>
    </form>
  </div>

  <div class="hmw-dock">
    <a class="hmw-btn hmw-zalo" href="https://zalo.me/0904567009" target="_blank" rel="noopener" aria-label="Chat Zalo"><span class="hmw-tip">Chat Zalo</span>Zalo</a>
    <a class="hmw-btn hmw-call" href="tel:0904567009" aria-label="Gọi hotline"><span class="hmw-tip">Gọi ngay</span>
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></a>
    <button class="hmw-btn hmw-chat" id="hmwOpen" aria-label="Mở chat tư vấn"><span class="hmw-tip">Hỏi đáp nhanh</span><span class="hmw-badge" id="hmwBadge">1</span>
      <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2zm3 6v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/></svg></button>
  </div>
</div>

<script>
(function(){
  var TEL='tel:0904567009', ZALO='https://zalo.me/0904567009';
  var KB=[
    {k:['gia','bang gia','bao nhieu','tien','ty','trieu'],a:'Bảng giá căn hộ Hải Minh được cập nhật theo từng đợt mở bán, chênh lệch theo tầng, hướng và view biển.\nAnh/chị để lại số điện thoại (Zalo), chuyên viên sẽ gửi bảng giá chi tiết từng căn và chính sách thanh toán đợt này.',lead:true},
    {k:['vi tri','o dau','dia chi','duong','cach bien','silver','ngu hanh son'],a:'Dự án nằm trên lô A2-1 và A2-2, trục biển Võ Nguyên Giáp – Trường Sa, phường Ngũ Hành Sơn, Đà Nẵng, đối diện Silver Shores (Hòn Ngọc Á Châu). Từ dự án đi bộ ra biển, gần phố du lịch An Thượng, Ngũ Hành Sơn và thuận đường đi Hội An.'},
    {k:['chu dau tu','cdt','ai lam','cong ty'],a:'Chủ đầu tư là Công ty TNHH Quản lý và Dịch vụ Hạ tầng kỹ thuật Miền Trung.'},
    {k:['loai can','dien tich','phong ngu','1pn','2pn','3pn','dual','m2','mat bang'],a:'Dự án có 5 dòng căn:\n• 1PN: 47,4 m²\n• 2PN: 66,5–68,8 m²\n• 2PN+1: 76,2–76,9 m²\n• 3PN: 78,6–80 m²\n• Dual Key: 101 m²\nAnh/chị quan tâm loại nào để em gửi mặt bằng chi tiết?',lead:true},
    {k:['quy mo','tang','cao','bao nhieu can','so can'],a:'Hải Minh là tòa tháp 30 tầng, cao khoảng 117 m, khoảng 400 căn hộ du lịch, tổng sàn hơn 45.000 m² trên khu đất khoảng 3.720 m².'},
    {k:['ra mat','mo ban','thang 11','khi nao ban','bao gio ban','le ra mat'],a:'Dự án Hải Minh dự kiến ra mắt trong tháng 11/2026. Anh/chị đăng ký trước sẽ được ưu tiên nhận bảng giá, mặt bằng và chính sách ngay khi chủ đầu tư công bố.',lead:true},
    {k:['tien do','thi cong','ban giao','xay'],a:'Dự án đang thi công. Anh/chị có thể đặt lịch xem công trường thực tế, hoặc nhận ảnh cập nhật tiến độ qua Zalo.',lead:true},
    {k:['phap ly','so hong','so do','giay to','so huu','thoi han','50 nam','bao nhieu nam','lau dai'],a:'Theo Quyết định điều chỉnh của UBND TP Đà Nẵng, khu đất dự án là đất thương mại, dịch vụ, Nhà nước giao đất có thu tiền sử dụng đất, thời hạn sử dụng đất 50 năm (9/2026 – 9/2076).\nHồ sơ pháp lý chi tiết từng căn sẽ được gửi kèm bảng giá. Anh/chị để lại số điện thoại hoặc bấm Gọi ngay để được tư vấn.',lead:true},
    {k:['cho thue','dong tien','loi nhuan','dau tu','ty suat','khai thac'],a:'Giá phòng ven biển trục Võ Nguyên Giáp phổ biến khoảng 1–3 triệu/đêm. Ví dụ minh họa với căn 3 tỷ, giá thuê 1,2 triệu/đêm, công suất 60%, chi phí 40%: thu nhập ròng khoảng 13 triệu/tháng.\n(Đây là ví dụ minh họa, không phải cam kết lợi nhuận.) Em có thể gửi bảng tính theo từng căn cho anh/chị.',lead:true},
    {k:['vay','ngan hang','thanh toan','tra gop','tien do thanh toan'],a:'Chính sách thanh toán và hỗ trợ ngân hàng thay đổi theo từng đợt. Anh/chị để lại số điện thoại, chuyên viên sẽ gửi chính sách mới nhất.',lead:true},
    {k:['condotel','chung cu','can ho du lich','loai hinh'],a:'Hải Minh là căn hộ du lịch (condotel) kết hợp thương mại dịch vụ, phù hợp nghỉ dưỡng và khai thác cho thuê du lịch.'},
    {k:['xem','tham quan','nha mau','gap','hen'],a:'Anh/chị muốn đặt lịch xem dự án? Bấm Gọi ngay hoặc để lại số điện thoại, chuyên viên sẽ gọi lại sắp xếp lịch.',lead:true}
  ];
  var CHIPS=['Khi nào ra mắt?','Bảng giá','Vị trí','Loại căn','Dòng tiền cho thuê','Pháp lý','Đặt lịch xem'];
  var $=function(id){return document.getElementById(id)};
  var body=$('hmwBody'), panel=$('hmwPanel'), badge=$('hmwBadge'), started=false, gotPhone=false;

  function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');}
  function scroll(){body.scrollTop=body.scrollHeight;}
  function bot(t,delay){setTimeout(function(){var d=document.createElement('div');d.className='hmw-msg hmw-bot';d.textContent=t;body.appendChild(d);scroll();},delay||350);}
  function me(t){var d=document.createElement('div');d.className='hmw-msg hmw-me';d.textContent=t;body.appendChild(d);scroll();}
  function chips(delay){setTimeout(function(){var w=document.createElement('div');w.className='hmw-chips';CHIPS.forEach(function(c){var b=document.createElement('button');b.type='button';b.className='hmw-chip';b.textContent=c;b.onclick=function(){handle(c);};w.appendChild(b);});body.appendChild(w);scroll();},delay||500);}
  function acts(delay){setTimeout(function(){var w=document.createElement('div');w.className='hmw-acts';w.innerHTML='<a class="o" href="'+TEL+'">📞 Gọi ngay</a><a href="'+ZALO+'" target="_blank" rel="noopener">💬 Chat Zalo</a>';body.appendChild(w);scroll();},delay||600);}
  function goForm(){var f=document.querySelector('form:not(#hmwForm)');if(f){f.scrollIntoView({behavior:'smooth',block:'center'});var i=f.querySelector('input');if(i)setTimeout(function(){i.focus();},600);}}

  function start(){
    if(started)return; started=true;
    bot('Xin chào anh/chị 👋 Em là trợ lý tư vấn dự án Căn hộ dịch vụ Hải Minh Đà Nẵng (condotel 30 tầng mặt biển Võ Nguyên Giáp).',100);
    bot('Anh/chị cần tìm hiểu thông tin nào ạ?',500);
    chips(800);
  }
  function handle(text){
    text=(text||'').trim(); if(!text)return; me(text);
    var digits=text.replace(/[^\d]/g,'');
    if(/^(\+?84|0)\d{8,10}$/.test(digits.replace(/^84/,'0'))||(digits.length>=9&&digits.length<=11&&/^0/.test(digits))){
      gotPhone=true;
      bot('Cảm ơn anh/chị! Em đã ghi nhận số '+text+'.\nĐể nhận bảng giá nhanh nhất, anh/chị vui lòng điền số này vào form "Đăng ký nhận bảng giá" trên trang, hoặc bấm Chat Zalo bên dưới.');
      acts(); setTimeout(goForm,1500); return;
    }
    var n=norm(text), hit=null, best=0;
    KB.forEach(function(item){var s=0;item.k.forEach(function(k){if(n.indexOf(k)>-1)s+=k.length;});if(s>best){best=s;hit=item;}});
    if(hit){
      bot(hit.a);
      if(hit.lead&&!gotPhone){bot('👉 Anh/chị nhập số điện thoại (Zalo) vào ô bên dưới để nhận tài liệu nhé.',900);acts(1100);}
      else chips(900);
    }else{
      bot('Câu hỏi này em xin chuyển chuyên viên tư vấn trực tiếp để trả lời chính xác ạ. Anh/chị bấm Gọi ngay / Chat Zalo bên dưới, hoặc để lại số điện thoại tại đây.');
      acts(); chips(900);
    }
  }
  function open(){panel.classList.add('open');badge.style.display='none';start();setTimeout(function(){$('hmwInput').focus();},200);}
  $('hmwOpen').onclick=function(){panel.classList.contains('open')?panel.classList.remove('open'):open();};
  $('hmwClose').onclick=function(){panel.classList.remove('open');};
  $('hmwForm').onsubmit=function(e){e.preventDefault();var i=$('hmwInput');handle(i.value);i.value='';};
  setTimeout(function(){if(!panel.classList.contains('open'))badge.style.display='flex';},8000);
})();
</script>
<!-- ============ HẾT ĐOẠN MÃ NÚT GỌI / ZALO / CHAT ============ -->
