<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
<defs>
 <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FB1DD"/><stop offset=".6" stop-color="#BFE0F0"/><stop offset="1" stop-color="#EEF3EC"/></linearGradient>
 <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56B5C9"/><stop offset=".35" stop-color="#2E97B4"/><stop offset="1" stop-color="#1A6A8C"/></linearGradient>
 <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E2D3BE"/><stop offset=".7" stop-color="#F3E9DA"/><stop offset="1" stop-color="#E8DAC4"/></linearGradient>
 <linearGradient id="light2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6DE" stop-opacity=".85"/><stop offset="1" stop-color="#FFF6DE" stop-opacity="0"/></linearGradient>
 <linearGradient id="duvet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#EEE9E1"/><stop offset="1" stop-color="#D6CFC4"/></linearGradient>
 <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDBDA4"/><stop offset="1" stop-color="#B09C80"/></linearGradient>
 <linearGradient id="floor2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BC97"/><stop offset="1" stop-color="#A9875F"/></linearGradient>
 <radialGradient id="vig2" cx=".55" cy=".45" r=".8"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2A1A0A" stop-opacity=".35"/></radialGradient>
