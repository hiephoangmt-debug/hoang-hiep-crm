</g>
<g fill="#F7F3EC"><rect x="566" y="58" width="588" height="14"/><rect x="566" y="58" width="16" height="486"/><rect x="1138" y="58" width="16" height="486"/><rect x="855" y="58" width="10" height="486"/></g>
