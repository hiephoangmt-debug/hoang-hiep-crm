<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
<defs>
 <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8EC3E6"/><stop offset=".7" stop-color="#CFE7F3"/><stop offset="1" stop-color="#F4F1E6"/></linearGradient>
 <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FA3BE"/><stop offset=".5" stop-color="#2A86A6"/><stop offset="1" stop-color="#1D6788"/></linearGradient>
 <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4EADB"/><stop offset="1" stop-color="#E9DAC3"/></linearGradient>
 <linearGradient id="light2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4D6" stop-opacity=".75"/><stop offset="1" stop-color="#FFF4D6" stop-opacity="0"/></linearGradient>
 <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9E4DC"/></linearGradient>
</defs>
<rect width="1200" height="800" fill="url(#wall2)"/>
<!-- big window right -->
<rect x="560" y="60" width="580" height="470" fill="url(#sky2)"/>
<g fill="#FFFFFF" opacity=".8"><ellipse cx="700" cy="150" rx="70" ry="18"/><ellipse cx="760" cy="140" rx="50" ry="22"/><ellipse cx="980" cy="200" rx="90" ry="16"/><ellipse cx="1040" cy="190" rx="50" ry="18"/></g>
<rect x="560" y="330" width="580" height="200" fill="url(#sea2)"/>
<g fill="#FFFFFF" opacity=".55"><rect x="600" y="360" width="80" height="3" rx="1.5"/><rect x="760" y="380" width="120" height="3" rx="1.5"/><rect x="940" y="352" width="90" height="3" rx="1.5"/><rect x="640" y="420" width="140" height="3" rx="1.5"/><rect x="900" y="440" width="150" height="3" rx="1.5"/><rect x="700" y="480" width="170" height="3" rx="1.5"/></g>
<!-- sail boat -->
<g transform="translate(1000 318)"><path d="M0 0 L0 -46 L26 0 Z" fill="#FFFFFF"/><path d="M-4 0 L-4 -36 L-22 0 Z" fill="#F7E9D2"/><rect x="-26" y="0" width="56" height="7" rx="3" fill="#0A2540"/></g>
<!-- frames -->
<g fill="#FFFFFF"><rect x="545" y="48" width="610" height="16"/><rect x="545" y="48" width="18" height="500"/><rect x="1140" y="48" width="18" height="500"/><rect x="845" y="48" width="12" height="500"/><rect x="545" y="530" width="610" height="18"/></g>
<rect x="545" y="530" width="610" height="18" fill="#D8C9B2"/>
<!-- light beam across room -->
<polygon points="560,540 1140,540 1000,800 200,800" fill="url(#light2)"/>
<g transform="translate(1080 500)"><rect x="-14" y="0" width="28" height="30" rx="6" fill="#0A2540"/><ellipse cx="-6" cy="-14" rx="6" ry="22" fill="#4E7A5A" transform="rotate(-15)"/><ellipse cx="8" cy="-12" rx="6" ry="20" fill="#4E7A5A" transform="rotate(18)"/></g>
<!-- headboard & bed -->
<rect x="40" y="300" width="520" height="230" rx="18" fill="#C9B79E"/>
<g fill="#BBA889"><rect x="70" y="330" width="6" height="170"/><rect x="170" y="330" width="6" height="170"/><rect x="270" y="330" width="6" height="170"/><rect x="370" y="330" width="6" height="170"/><rect x="470" y="330" width="6" height="170"/></g>
<rect x="20" y="500" width="760" height="200" rx="26" fill="url(#sheet)"/>
<rect x="20" y="590" width="760" height="110" rx="20" fill="#0A2540"/>
<rect x="20" y="590" width="760" height="18" fill="#E8875A" opacity=".9"/>
<g fill="#FFFFFF"><rect x="70" y="440" width="190" height="90" rx="28"/><rect x="290" y="440" width="190" height="90" rx="28"/></g>
<rect x="160" y="470" width="120" height="70" rx="22" fill="#E7D7BF"/>
<!-- tray with coffee & croissant -->
<g transform="translate(560 520)"><rect x="-90" y="-12" width="180" height="24" rx="8" fill="#B88A5E"/><rect x="-60" y="-50" width="38" height="38" rx="8" fill="#FFF8EF"/><path d="M-50 -60 q6 -12 0 -24 M-36 -60 q6 -12 0 -24" stroke="#FFFFFF" stroke-width="3" fill="none" opacity=".8"/><ellipse cx="30" cy="-22" rx="40" ry="16" fill="#E2A95E"/></g>
<!-- floor -->
<rect y="700" width="1200" height="100" fill="#CDB089"/>
<rect width="1200" height="800" fill="#FFE9C4" opacity=".05"/>
</svg>
