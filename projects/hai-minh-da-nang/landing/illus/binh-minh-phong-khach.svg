<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E3A63"/><stop offset=".45" stop-color="#C98B8B"/><stop offset=".78" stop-color="#FFB98A"/><stop offset="1" stop-color="#FFE2B8"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9A27E"/><stop offset=".25" stop-color="#5D7FA0"/><stop offset="1" stop-color="#173E5E"/></linearGradient>
 <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6DD"/><stop offset=".35" stop-color="#FFD08A"/><stop offset="1" stop-color="#FFB070" stop-opacity="0"/></radialGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8D9C4"/><stop offset="1" stop-color="#D9C4A6"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9A882"/><stop offset="1" stop-color="#A9855F"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3B5" stop-opacity=".55"/><stop offset="1" stop-color="#FFE3B5" stop-opacity="0"/></linearGradient>
 <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3ECE2"/><stop offset="1" stop-color="#D8CCBB"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="800" fill="url(#wall)"/>
<!-- window opening -->
<rect x="170" y="70" width="860" height="520" fill="url(#sky)"/>
<circle cx="600" cy="392" r="170" fill="url(#sun)"/>
<circle cx="600" cy="392" r="42" fill="#FFF3D6"/>
<rect x="170" y="400" width="860" height="190" fill="url(#sea)"/>
<g fill="#FFE7BF" opacity=".85">
 <rect x="560" y="410" width="80" height="4" rx="2"/><rect x="545" y="428" width="110" height="4" rx="2"/><rect x="570" y="448" width="60" height="4" rx="2"/><rect x="530" y="470" width="140" height="4" rx="2" opacity=".7"/><rect x="560" y="496" width="80" height="4" rx="2" opacity=".6"/><rect x="520" y="526" width="160" height="4" rx="2" opacity=".45"/><rect x="555" y="560" width="90" height="4" rx="2" opacity=".35"/>
</g>
<g fill="#FFFFFF" opacity=".35"><rect x="250" y="440" width="70" height="3" rx="1.5"/><rect x="860" y="468" width="90" height="3" rx="1.5"/><rect x="320" y="520" width="110" height="3" rx="1.5"/><rect x="800" y="545" width="120" height="3" rx="1.5"/></g>
<!-- clouds -->
<g fill="#FFD9C0" opacity=".55"><ellipse cx="330" cy="220" rx="120" ry="14"/><ellipse cx="880" cy="260" rx="150" ry="12"/><ellipse cx="760" cy="180" rx="90" ry="9"/></g>
<!-- birds -->
<g stroke="#5A4A5E" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M720 250 q8 -8 16 0 q8 -8 16 0"/><path d="M760 230 q6 -6 12 0 q6 -6 12 0"/></g>
<!-- glass railing -->
<rect x="170" y="500" width="860" height="90" fill="#FFFFFF" opacity=".12"/>
<rect x="170" y="496" width="860" height="5" fill="#0A2540" opacity=".55"/>
<!-- window frames -->
<g fill="#0A2540"><rect x="150" y="56" width="900" height="18"/><rect x="150" y="56" width="22" height="546"/><rect x="1028" y="56" width="22" height="546"/><rect x="590" y="56" width="16" height="546"/><rect x="150" y="586" width="900" height="16"/></g>
<!-- sheer curtains -->
<path d="M100 40 C140 200 110 420 150 640 L60 640 L60 40 Z" fill="#FFFFFF" opacity=".55"/>
<path d="M1100 40 C1060 200 1090 420 1050 640 L1140 640 L1140 40 Z" fill="#FFFFFF" opacity=".55"/>
<!-- floor -->
<rect y="602" width="1200" height="198" fill="url(#floor)"/>
<polygon points="200,602 1000,602 1180,800 20,800" fill="url(#beam)"/>
<!-- rug -->
<ellipse cx="600" cy="720" rx="420" ry="58" fill="#EFE6D8" opacity=".9"/>
<!-- sofa (back to viewer, facing sea) -->
<g>
 <rect x="300" y="610" width="600" height="110" rx="34" fill="url(#sofa)"/>
 <rect x="270" y="640" width="80" height="110" rx="30" fill="#E6DCCD"/>
 <rect x="850" y="640" width="80" height="110" rx="30" fill="#E6DCCD"/>
 <rect x="330" y="690" width="540" height="62" rx="18" fill="#EDE5D9"/>
 <ellipse cx="420" cy="618" rx="46" ry="30" fill="#0A2540" opacity=".9"/>
 <ellipse cx="780" cy="620" rx="44" ry="28" fill="#E8875A"/>
</g>
<!-- plant -->
<g transform="translate(1040 560)">
 <rect x="-34" y="120" width="68" height="70" rx="10" fill="#0A2540"/>
 <g fill="#4E7A5A"><ellipse cx="0" cy="40" rx="16" ry="70" transform="rotate(-20)"/><ellipse cx="10" cy="50" rx="15" ry="64" transform="rotate(25)"/><ellipse cx="-30" cy="70" rx="13" ry="52" transform="rotate(-48)"/><ellipse cx="34" cy="80" rx="12" ry="48" transform="rotate(50)"/></g>
</g>
<!-- coffee cup on side table -->
<g transform="translate(140 640)"><rect x="-40" y="0" width="80" height="10" rx="4" fill="#0A2540"/><rect x="-6" y="10" width="12" height="90" fill="#0A2540"/><rect x="-14" y="-24" width="28" height="24" rx="5" fill="#FFF8EF"/><path d="M-4 -34 q6 -10 0 -20 M6 -34 q6 -10 0 -20" stroke="#FFFFFF" stroke-width="2" fill="none" opacity=".7"/></g>
<!-- warm vignette -->
<rect width="1200" height="800" fill="#FFB070" opacity=".06"/>
</svg>
