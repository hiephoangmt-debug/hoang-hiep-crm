<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--gold:#E9B949;--gold2:#C8902A;--navy:#0A1424;--ink:#0B0F17;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink);font-family:Inter,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0;opacity:0}
.bg{position:absolute;inset:-6%;background-size:cover;background-position:center}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,18,.55) 0%,rgba(6,10,18,.15) 35%,rgba(6,10,18,.35) 65%,rgba(6,10,18,.92) 100%)}
.el{position:absolute;opacity:0;will-change:transform,opacity}
.tag{background:linear-gradient(180deg,#F6CF6A,#D9A13A);color:#1a1205;font-weight:900;font-size:44px;padding:14px 34px;border-radius:10px;
     box-shadow:0 8px 30px rgba(0,0,0,.45),inset 0 -3px 0 rgba(0,0,0,.18);letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.tag.sm{font-size:32px;padding:10px 24px}
.chip{background:rgba(10,20,36,.86);border:2px solid var(--gold);color:#fff;font-weight:800;font-size:36px;padding:14px 26px;border-radius:12px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.chip b{color:var(--gold)}
.big{font-weight:900;color:var(--gold);text-shadow:0 6px 30px rgba(0,0,0,.6);letter-spacing:-2px}
.title{font-weight:900;font-style:italic;text-transform:uppercase;text-shadow:0 4px 20px rgba(0,0,0,.7)}
.src{position:absolute;left:40px;bottom:36px;font-size:22px;color:rgba(255,255,255,.6);opacity:0}
.cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-weight:900;font-style:italic;font-size:50px;line-height:1.2;
     text-transform:uppercase;color:#fff;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.9)}
.cap .w{opacity:.55}.cap .w.on{opacity:1;color:var(--gold)}
.card{width:230px;height:330px;border-radius:18px;perspective:900px}
.card .in{position:absolute;inset:0;transform-style:preserve-3d}
.card .f,.card .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card .b{background:repeating-linear-gradient(45deg,#13233f 0 14px,#0e1b31 14px 28px);border:5px solid var(--gold);font-size:120px;font-weight:900;color:var(--gold)}
.card .f{background:#fff;color:#0c1a33;transform:rotateY(180deg);border:5px solid var(--gold);font-weight:900;text-align:center}
.card .f .n{font-size:26px;color:#8a6a1e;letter-spacing:2px}
.card .f .i{font-size:96px;line-height:1.2}
.card .f .t{font-size:38px;text-transform:uppercase}
.mini{position:absolute;top:70px;right:40px;display:flex;gap:12px;opacity:0}
.mini div{width:62px;height:86px;border-radius:8px;border:3px solid var(--gold);background:#13233f;color:var(--gold);font-weight:900;font-size:40px;display:flex;align-items:center;justify-content:center}
.mini div.on{background:#fff;color:#0c1a33;font-size:38px}
#waffle{display:grid;grid-template-columns:repeat(23,1fr);gap:7px;width:860px}
#waffle i{display:block;width:30px;height:30px;border-radius:5px;background:#2a3a58}
#waffle i.g{background:var(--gold)}
.road{position:absolute;left:90px;right:90px;top:1050px;height:14px;background:linear-gradient(90deg,var(--gold),#f3d48a);border-radius:7px;box-shadow:0 0 30px rgba(233,185,73,.5)}
.stop{position:absolute;width:300px;text-align:center;opacity:0}
.stop .dot{width:54px;height:54px;border-radius:50%;background:var(--navy);border:8px solid var(--gold);margin:0 auto 22px}
.stop .d{font-size:44px;font-weight:900;color:var(--gold)}
.stop .l{font-size:32px;font-weight:700;margin-top:8px;line-height:1.25}
.stamp{white-space:nowrap;border:10px solid #E5484D;color:#E5484D;font-weight:900;font-size:80px;padding:10px 40px;border-radius:18px;transform:rotate(-8deg);letter-spacing:4px;background:rgba(0,0,0,.25)}
.follow{background:#FE2C55;color:#fff;font-weight:900;font-size:46px;padding:20px 54px;border-radius:60px;box-shadow:0 10px 40px rgba(254,44,85,.5)}
.ring{width:120px;height:120px;border-radius:50%;border:8px solid #FF7A1A;box-shadow:0 0 40px #FF7A1A}
</style></head>

window.TOTAL = total;
function w(id, k){ // absolute time of k-th word (0-based) or word match
  const s=S[id]; if(typeof k==='string'){const i=s.words.findIndex(x=>x.word.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'').startsWith(k)); k=i<0?0:i;}
  return s.start + (s.words[Math.min(k,s.words.length-1)]||{start:0}).start;
}
const stage=document.getElementById('stage');
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const back=x=>{if(x<=0)return 0;if(x>=1)return 1;const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};

function add(html, css, t0, t1, anim='up'){
  const d=document.createElement('div'); d.className='el'; d.innerHTML=html; Object.assign(d.style,css); stage.appendChild(d);
  els.push({node:d,t0,t1,anim}); return d;
}
function layer(img, t0, t1, opts={}){

  stage.appendChild(L); els.push({node:L,t0,t1,anim:'bg',opts}); return L;
}

add('<div class="card"><div class="in"><div class="b">2</div><div class="f"><div class="n">LÁ BÀI 2</div><div class="i"><svg width="90" height="110" viewBox="0 0 24 30"><rect x="5" y="2" width="14" height="28" rx="1" fill="#0c1a33"/><rect x="8" y="5" width="3" height="2.4" fill="#E9B949"/><rect x="13" y="5" width="3" height="2.4" fill="#E9B949"/><rect x="8" y="9" width="3" height="2.4" fill="#E9B949"/><rect x="13" y="9" width="3" height="2.4" fill="#E9B949"/><rect x="8" y="13" width="3" height="2.4" fill="#E9B949"/><rect x="13" y="13" width="3" height="2.4" fill="#E9B949"/><rect x="8" y="17" width="3" height="2.4" fill="#E9B949"/><rect x="13" y="17" width="3" height="2.4" fill="#E9B949"/><rect x="8" y="21" width="3" height="2.4" fill="#E9B949"/><rect x="13" y="21" width="3" height="2.4" fill="#E9B949"/><rect x="8" y="25" width="3" height="2.4" fill="#E9B949"/><rect x="13" y="25" width="3" height="2.4" fill="#E9B949"/></svg></div><div class="t">Sản phẩm</div></div></div></div>',{left:'50%',top:'330px',marginLeft:'-115px'}, st('card2'), w('card2','một'),'flip');

layer('cdt-toa-thap-dem.jpg', st('card2b'), en('card2b'), {z0:1.1,z1:1.2,filter:'brightness(.35) blur(4px)'});
add('<div class="tag">Nhìn kỹ 782 căn</div>',{left:'50%',top:'250px',transform:'translateX(-50%)'}, st('card2b'), en('card2b'));

// ---------- RENDER ----------
window.render=function(t){
  for(const e of els){
    const n=e.node, a=e.anim; const vis=t>=e.t0-0.001 && t<e.t1;
    if(a==='bg'){
      const fi=ease((t-e.t0)/.45), fo=1-ease((t-(e.t1-.3))/.3);
      n.style.opacity=vis?Math.min(fi,fo):0;
      if(vis){const o=e.opts,p=Math.min(1,Math.max(0,(t-e.t0)/(e.t1-e.t0)));const z=o.z0+(o.z1-o.z0)*p;
        const b=n.firstChild;b.style.transform=`scale(${z})`;b.style.transformOrigin=`${o.ox||'50%'} ${o.oy||'50%'}`;}
      continue;
    }
    if(!vis){n.style.opacity=0;continue;}
    const p=(t-e.t0), fo=1-ease((t-(e.t1-.25))/.25);
    let op=1, tf='';
    const base=n.style.transform.includes('translateX(-50%)')?'translateX(-50%) ':'';
    if(a==='up'){const k=ease(p/.4);op=k;tf=`translateY(${(1-k)*40}px)`}
    else if(a==='fade'){op=ease(p/.5)}
    else if(a==='pop'){const k=back(p/.45);op=Math.min(1,p/.15);tf=`scale(${.6+.4*k})`}
    else if(a==='drop'){const k=back(p/.5);op=Math.min(1,p/.15);tf=`translateY(${(1-k)*-260}px) rotate(${(1-k)*-12}deg)`}
    else if(a==='stamp'){const k=ease(p/.25);op=k;tf=`scale(${2.2-1.2*k})`}
    else if(a==='shake'){op=ease(p/.2);tf=`translateX(${Math.sin(p*60)*Math.max(0,1-p/.6)*14}px)`}
    else if(a==='pulse'){op=ease(p/.3);tf=`scale(${1+.12*Math.sin(p*6)})`}
    else if(a==='flip'){ // card face down -> flips at t1 (handled: show until t1 then the tag replaces)
      op=Math.min(1,p/.15); const k=back(Math.min(1,p/.4)); tf=`translateY(${(1-k)*-200}px)`;
      const inn=n.querySelector('.in'); const dur=e.t1-e.t0; const fp=ease((p-(dur-.55))/.5); inn.style.transform=`rotateY(${fp*180}deg)`;
      const fo2=1-ease((t-(e.t1-.05))/.05); op=Math.min(op,1);
    }
    if(e.node.dataset.keep!=='1') n.style.opacity=Math.max(0,Math.min(op,fo));
    // stack transforms (keep centering)
    const keepX = e._x ?? (e._x = (n.style.transform.match(/translateX\(-50%\)/)?'translateX(-50%) ':''));
    n.style.transform=keepX+tf;
  }
  // counter
  {const p=ease((t-.3)/2.2);cnt.firstChild.textContent=(15.86*p).toFixed(2).replace('.',',');}
  // mini tracker
  if(t>=st('card1')){const ds=mini.children; ds[0].className=t>=w('card1','góc')?'on':''; if(ds[0].className)ds[0].textContent='✓';
    ds[1].className=t>=w('card2','một')?'on':''; if(ds[1].className)ds[1].textContent='✓';
    ds[2].className=t>=w('card3','vietcombank')?'on':''; if(ds[2].className)ds[2].textContent='✓';}
  // waffle fill
  {const p=ease((t-st('card2b')-.2)/1.6); const nAll=Math.floor(782*p); const g=t>=w('card2b','năm')?Math.floor(513*ease((t-w('card2b','năm'))/1.2)):0;
   const cells=waf.firstChild.children; for(let i=0;i<782;i++){cells[i].style.opacity=i<nAll?1:0; cells[i].className=i<g?'g':'';}}
  // bus along road
  {const xs=[240-65,540-65,840-65]; let x=60; const tt=stopT;
   if(tt.length===3){ if(t<tt[0]) x=60+(xs[0]-60)*ease((t-st('road'))/(tt[0]-st('road')));
     else if(t<tt[1]) x=xs[0]+(xs[1]-xs[0])*ease((t-tt[0]-1.2)/1.2);
     else if(t<tt[2]) x=xs[1]+(xs[2]-xs[1])*ease((t-tt[1]-1.2)/1.2); else x=xs[2];}
   bus.style.left=x+'px';}
  // captions
  const c=chunks.find(c=>t>=c.t0&&t<c.t1);
  if(c){capEl.style.opacity=1;capEl.innerHTML=c.ws.map(x=>`<span class="w${t>=x.t?' on':''}">${x.w}</span>`).join(' ');}else capEl.style.opacity=0;
};
window.READY=true;
</script></body></html>
