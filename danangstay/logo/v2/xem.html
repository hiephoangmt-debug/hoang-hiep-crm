<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f6fa;font-family:'Be Vietnam Pro',sans-serif;color:#0B2447}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:36px;width:1500px;box-sizing:border-box}
.card{background:#fff;border-radius:22px;padding:30px;box-shadow:0 20px 40px -28px rgba(11,36,71,.5)}
.card h3{margin:0 0 18px;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:#E8590C}
.lock{display:flex;align-items:center;gap:18px;margin:6px 0 26px}
.lock img{width:110px;height:110px}
.wm{font:600 44px/1 'Playfair Display',serif;letter-spacing:.02em}
.wm em{color:#E8590C}
.wm small{display:block;font:500 13px/1 'Be Vietnam Pro';letter-spacing:.32em;margin-top:10px;color:#41557a}
.row{display:flex;gap:18px;align-items:center}
.dark{background:#0B2447;border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:14px;color:#fff}
.dark img{width:58px;height:58px}.dark .wm{font-size:28px}.dark .wm small{color:#c9d6e6;font-size:10px}
.sm{display:flex;gap:14px;align-items:end;margin-top:20px}.sm img{display:block}
</style></head><body><div class="g">
<div class="card"><h3>A · Cầu Rồng</h3>
<div class="lock"><img src="a-cau-rong.svg"><div class="wm">Danang<em>Stay</em><small>ĐÀ NẴNG · HỘI AN · HUẾ</small></div></div>
<div class="dark"><img src="a-cau-rong.svg"><div class="wm">Danang<em>Stay</em><small>LOCAL TRAVEL CONCIERGE</small></div></div>
<div class="sm"><img src="a-cau-rong.svg" width="64"><img src="a-cau-rong.svg" width="40"><img src="a-cau-rong.svg" width="24"></div></div>
<div class="card"><h3>B · Cầu Vàng</h3>
<div class="lock"><img src="b-cau-vang.svg"><div class="wm">Danang<em>Stay</em><small>ĐÀ NẴNG · HỘI AN · HUẾ</small></div></div>
<div class="dark"><img src="b-cau-vang.svg"><div class="wm">Danang<em>Stay</em><small>LOCAL TRAVEL CONCIERGE</small></div></div>
<div class="sm"><img src="b-cau-vang.svg" width="64"><img src="b-cau-vang.svg" width="40"><img src="b-cau-vang.svg" width="24"></div></div>
<div class="card"><h3>C · Linh Ứng – Sơn Trà</h3>
<div class="lock"><img src="c-linh-ung.svg"><div class="wm">Danang<em>Stay</em><small>ĐÀ NẴNG · HỘI AN · HUẾ</small></div></div>
<div class="dark"><img src="c-linh-ung.svg"><div class="wm">Danang<em>Stay</em><small>LOCAL TRAVEL CONCIERGE</small></div></div>
<div class="sm"><img src="c-linh-ung.svg" width="64"><img src="c-linh-ung.svg" width="40"><img src="c-linh-ung.svg" width="24"></div></div>
</div></body></html>
