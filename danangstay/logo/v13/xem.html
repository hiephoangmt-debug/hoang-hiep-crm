<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Yellowtail&family=Satisfy&family=Cormorant+Garamond:ital,wght@1,600&family=Be+Vietnam+Pro:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:24px;width:1560px;box-sizing:border-box}
.c{border:1px solid #eef0f4;border-radius:18px;height:360px;position:relative;display:flex;align-items:center;justify-content:center}
.c small{position:absolute;left:16px;top:12px;font:600 11px/1 'Be Vietnam Pro';letter-spacing:.14em;color:#9aa3b5}
.logo{position:relative;padding:40px 10px 30px 40px}
.w{font-size:118px;line-height:1;background:linear-gradient(100deg,#F28C28 0%,#E8590C 18%,#D7263D 36%,#8E2DE2 54%,#1F6FB5 72%,#1BA39C 88%,#4CAF50 100%);-webkit-background-clip:text;color:transparent;padding:0 18px 22px 6px;white-space:nowrap}
.f1{font-family:'Kaushan Script',cursive}.f2{font-family:'Yellowtail',cursive;font-size:132px}.f3{font-family:'Satisfy',cursive;font-size:124px}
.head{position:absolute;width:86px;height:86px}
.tail{position:absolute}
.tg{position:absolute;right:24px;bottom:-46px;font:italic 600 26px/1 'Cormorant Garamond',serif;color:#2b3a55}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>

<div class="g">
