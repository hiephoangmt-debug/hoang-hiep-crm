<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef1f6;font-family:'Be Vietnam Pro',sans-serif;color:#0B2447}
.wrap{width:1500px;padding:34px;box-sizing:border-box;display:grid;grid-template-columns:520px 1fr;gap:28px}
.card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 22px 44px -30px rgba(11,36,71,.55)}
h3{margin:0 0 16px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#E8590C}
.badge img{width:460px;height:460px;display:block;margin:auto}
.lock{display:flex;align-items:center;gap:22px;padding:10px 0 24px}
.lock img{width:150px;height:150px}
.wm{font:700 64px/1 'Playfair Display',serif}.wm em{font-style:italic;font-weight:600;color:#E8590C}
.cities{display:flex;gap:18px;margin-top:14px;font:700 15px/1 'Be Vietnam Pro';letter-spacing:.18em;color:#41557a}
.cities span{display:flex;align-items:center;gap:8px}
.cities i{display:inline-block;width:12px;height:12px;border-radius:50%}
.dark{background:#0B2447;border-radius:18px;padding:22px 26px;display:flex;align-items:center;gap:18px;color:#fff;margin-bottom:22px}
.dark img{width:96px;height:96px}.dark .wm{font-size:44px;color:#fff}.dark .cities{color:#c9d6e6;font-size:12px}
.sm{display:flex;gap:22px;align-items:end;background:#f7f8fb;border-radius:14px;padding:18px}
</style></head><body><div class="wrap">
<div class="card badge"><h3>Huy hiệu tròn · 3 biểu tượng</h3><img src="huy-hieu-3-mien.svg"></div>
<div>
 <div class="card"><h3>Logo ngang (web, danh thiếp)</h3>
  <div class="lock"><img src="huy-hieu-3-mien.svg"><div><div class="wm">Danang<em>Stay</em></div>
  <div class="cities"><span><i style="background:#F2BB3A"></i>ĐÀ NẴNG</span><span><i style="background:#E8394D"></i>HỘI AN</span><span><i style="background:#C8463A"></i>HUẾ</span></div></div></div>
  <div class="dark"><img src="huy-hieu-3-mien.svg"><div><div class="wm">Danang<em>Stay</em></div>
  <div class="cities"><span><i style="background:#F2BB3A"></i>ĐÀ NẴNG</span><span><i style="background:#E8394D"></i>HỘI AN</span><span><i style="background:#C8463A"></i>HUẾ</span></div></div></div>
  <h3>Biểu tượng nhỏ (app, favicon) · Cầu Vàng</h3>
  <div class="sm"><img src="cau-vang-2tay.svg" width="110"><img src="cau-vang-2tay.svg" width="64"><img src="cau-vang-2tay.svg" width="40"><img src="huy-hieu-3-mien.svg" width="110"><img src="huy-hieu-3-mien.svg" width="64"></div>
 </div>
</div></div></body></html>
