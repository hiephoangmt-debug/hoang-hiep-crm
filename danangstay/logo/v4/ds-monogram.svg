<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" role="img" aria-label="DanangStay – DS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A3A68"/><stop offset="1" stop-color="#0B2447"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F9D368"/><stop offset="1" stop-color="#E3A21A"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#BFB8A8"/><stop offset=".5" stop-color="#EEE9DE"/><stop offset="1" stop-color="#B3AB9A"/></linearGradient>
    <g id="hand">
      <path d="M0 200 L2 150 C-8 144 -14 132 -14 120 L-14 82 C-14 77 -10 74 -6 74 C-2 74 2 77 2 82 L2 100 L4 70 C4 65 8 62 12 62 C16 62 20 65 20 70 L20 100 L22 66 C22 61 26 58 30 58 C34 58 38 61 38 66 L38 102 L40 76 C40 71 44 68 48 68 C52 68 55 71 55 76 L55 114 L62 104 C65 100 70 100 72 104 C74 108 72 112 70 116 L58 140 C54 148 48 152 42 154 L44 200Z" fill="url(#stone)" stroke="#6E6758" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <clipPath id="r"><rect width="200" height="200" rx="44"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- chữ DS -->
    <text x="98" y="128" text-anchor="end" font-family="'Playfair Display',Georgia,serif" font-weight="700" font-size="104" fill="#FFFFFF">D</text>
    <text x="96" y="128" text-anchor="start" font-family="'Playfair Display',Georgia,serif" font-style="italic" font-weight="600" font-size="104" fill="#F28C28">S</text>
    <!-- Cầu Vàng vắt ngang + hai bàn tay đá đỡ -->
    <use xlink:href="#hand" transform="translate(44 126) scale(.34)"/>
    <use xlink:href="#hand" transform="translate(156 126) scale(-.34 .34)"/>
    <path d="M18 156 C60 142 140 142 182 156 L182 164 C140 151 60 151 18 164Z" fill="url(#gold)" stroke="#B9800E" stroke-width="1"/>
    <!-- 3 chấm: Đà Nẵng · Hội An · Huế -->
    <circle cx="82" cy="184" r="5" fill="#F2BB3A"/><circle cx="100" cy="184" r="5" fill="#E8394D"/><circle cx="118" cy="184" r="5" fill="#C8463A"/>
  </g>
</svg>
