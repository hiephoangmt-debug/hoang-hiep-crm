    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9C2B3"/><stop offset=".45" stop-color="#ECE7DC"/><stop offset="1" stop-color="#B7AF9F"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F9D368"/><stop offset="1" stop-color="#E3A21A"/></linearGradient>
    <clipPath id="r"><rect width="200" height="200" rx="44"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
