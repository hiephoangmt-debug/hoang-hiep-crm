    <path d="M-6 126 C44 104 120 100 210 116" fill="none" stroke="#FFF2C4" stroke-width="2"/>
    <g stroke="#B9800E" stroke-width="1.6" opacity=".9">
      <path d="M8 121 L8 132 M20 117 L20 128 M32 114 L32 125 M44 111 L44 122 M56 109 L56 120 M68 108 L68 119 M80 107 L80 118 M92 106 L92 117 M104 106 L104 117 M116 106 L116 117 M128 107 L128 118 M140 108 L140 119 M152 109 L152 120 M164 111 L164 122 M176 112 L176 123 M188 114 L188 125"/>
