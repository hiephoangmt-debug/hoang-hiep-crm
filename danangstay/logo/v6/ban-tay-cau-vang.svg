<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Cầu Vàng – bàn tay đá nâng cầu">
  <defs>
    <linearGradient id="st" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F0E8"/><stop offset=".55" stop-color="#DAD4C7"/><stop offset="1" stop-color="#B8B09F"/></linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F9D368"/><stop offset="1" stop-color="#C98A12"/></linearGradient>
    <g id="finger"><rect x="-21" y="0" width="42" height="150" rx="21"/></g>
  </defs>
  <g fill="url(#st)" stroke="#5E584B" stroke-width="4" stroke-linejoin="round">
    <!-- bốn ngón phía sau cầu (nghiêng nhẹ sang phải) -->
    <use href="#finger" transform="translate(196 70) rotate(4)"/>
    <use href="#finger" transform="translate(236 38) rotate(6)"/>
    <use href="#finger" transform="translate(284 14) rotate(9)"/>
    <use href="#finger" transform="translate(340 34) rotate(14)"/>
    <!-- lòng bàn tay + cổ tay vươn lên từ vách đá -->
    <path d="M0 300 C30 262 70 232 120 196 L170 150 L372 150 C376 190 352 226 314 248 C270 274 214 288 150 300 Z"/>
  </g>
  <!-- Cầu Vàng: lan can + mặt cầu -->
  <g stroke="#D9A21E" stroke-width="3.2">
    <path d="M6 116 L6 146 M30 117 L30 147 M54 118 L54 148 M78 119 L78 149 M102 120 L102 150 M126 121 L126 151 M150 122 L150 152 M174 123 L174 153 M198 124 L198 154 M222 125 L222 155 M246 126 L246 156 M270 128 L270 158 M294 130 L294 160 M318 132 L318 162 M342 134 L342 164 M366 136 L366 166 M390 138 L390 168"/>
  </g>
  <path d="M-6 114 C120 116 270 124 406 138" fill="none" stroke="#F4C95A" stroke-width="5" stroke-linecap="round"/>
  <path d="M-6 146 C120 150 270 160 406 176 L406 200 C270 182 120 172 -6 170 Z" fill="url(#gd)" stroke="#8C5E08" stroke-width="3"/>
  <!-- ngón cái dựng phía trước cầu -->
  <path d="M150 34 C170 30 184 44 180 64 L162 172 C158 194 140 206 118 202 C98 198 86 182 92 162 L128 52 C132 40 140 36 150 34 Z"
        fill="url(#st)" stroke="#5E584B" stroke-width="4" stroke-linejoin="round"/>
  <!-- phần lòng bàn tay dưới mặt cầu (che gốc ngón cái để liền khối) -->
  <path d="M0 300 C30 262 58 238 84 214 L90 172 L170 175 C230 186 300 184 356 192 C344 214 332 232 314 248 C270 274 214 288 150 300 Z" fill="url(#st)"/>
  <path d="M0 300 C30 262 58 238 84 214 C88 200 90 188 92 172 M356 192 C344 214 332 232 314 248 C270 274 214 288 150 300" fill="none" stroke="#5E584B" stroke-width="4" stroke-linecap="round"/>
  <!-- nếp đốt ngón (gợi khối đá) -->
  <g fill="none" stroke="#9A9282" stroke-width="2.4" stroke-linecap="round">
    <path d="M128 98 C136 102 146 102 156 98"/>
    <path d="M200 92 C206 94 212 94 216 92"/><path d="M242 62 C248 64 254 64 258 62"/>
    <path d="M290 40 C296 42 302 42 306 40"/><path d="M344 62 C350 66 356 66 360 64"/>
  </g>
</svg>
