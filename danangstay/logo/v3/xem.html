<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef1f6;font-family:'Be Vietnam Pro',sans-serif;color:#0B2447}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:34px;width:1560px;box-sizing:border-box}
.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 22px 44px -30px rgba(11,36,71,.55)}
.top{padding:28px 30px 10px}
.card h3{margin:0 0 22px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#E8590C}
.big{display:flex;justify-content:center;padding:6px 0 26px}.big img{width:190px;height:190px}
.lock{display:flex;align-items:center;gap:16px;justify-content:center;padding:4px 0 26px}
.lock img{width:78px;height:78px}
.wm{font:600 40px/1 'Playfair Display',serif}
.wm em{color:#E8590C;font-style:italic}
.wm small{display:block;font:600 11.5px/1 'Be Vietnam Pro';letter-spacing:.34em;margin-top:9px;color:#5a6b88}
.dark{background:#0B2447;padding:22px 30px;display:flex;align-items:center;gap:14px;justify-content:center}
.dark .wm{color:#fff;font-size:30px}.dark .wm small{color:#9fb0c6;font-size:10px}.dark img{width:56px;height:56px}
.sm{display:flex;gap:18px;align-items:end;justify-content:center;padding:20px 0 26px;background:#f7f8fb}
</style></head><body><div class="g">
<div class="card"><div class="top"><h3>1 · Sóng Rồng</h3>
<div class="big"><img src="1-song-rong.svg"></div>
<div class="lock"><img src="1-song-rong.svg"><div class="wm">Danang<em>Stay</em><small>ĐÀ NẴNG · HỘI AN · HUẾ</small></div></div></div>
<div class="dark"><img src="1-song-rong.svg"><div class="wm">Danang<em>Stay</em><small>LOCAL TRAVEL CONCIERGE</small></div></div>
<div class="sm"><img src="1-song-rong.svg" width="64"><img src="1-song-rong.svg" width="40"><img src="1-song-rong.svg" width="24"><img src="1-song-rong.svg" width="16"></div></div>
<div class="card"><div class="top"><h3>2 · Bàn tay nâng</h3>
<div class="big"><img src="2-ban-tay.svg"></div>
<div class="lock"><img src="2-ban-tay.svg"><div class="wm">Danang<em>Stay</em><small>ĐÀ NẴNG · HỘI AN · HUẾ</small></div></div></div>
<div class="dark"><img src="2-ban-tay.svg"><div class="wm">Danang<em>Stay</em><small>LOCAL TRAVEL CONCIERGE</small></div></div>
<div class="sm"><img src="2-ban-tay.svg" width="64"><img src="2-ban-tay.svg" width="40"><img src="2-ban-tay.svg" width="24"><img src="2-ban-tay.svg" width="16"></div></div>
<div class="card"><div class="top"><h3>3 · Chữ D</h3>
<div class="big"><img src="3-chu-d.svg"></div>
<div class="lock"><img src="3-chu-d.svg"><div class="wm">Danang<em>Stay</em><small>ĐÀ NẴNG · HỘI AN · HUẾ</small></div></div></div>
<div class="dark"><img src="3-chu-d.svg"><div class="wm">Danang<em>Stay</em><small>LOCAL TRAVEL CONCIERGE</small></div></div>
<div class="sm"><img src="3-chu-d.svg" width="64"><img src="3-chu-d.svg" width="40"><img src="3-chu-d.svg" width="24"><img src="3-chu-d.svg" width="16"></div></div>
</div></body></html>
