<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Be+Vietnam+Pro:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9edf3;font-family:'Be Vietnam Pro',sans-serif}
.g{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:30px;width:1500px;box-sizing:border-box}
.p{border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 20px}
.light{background:#FBF8F2;color:#0B2447}.dark{background:#0B2447;color:#E9C46A}
.icon{width:300px;height:138px}
.light .icon{color:#C8902B}.dark .icon{color:#E9C46A}
.wm{font:700 74px/1 'Cormorant Garamond',serif;letter-spacing:.04em;margin-top:14px}
.wm em{font-style:italic;font-weight:600;color:#E8590C}
.dark .wm{color:#fff}
.line{display:flex;align-items:center;gap:14px;margin-top:14px;font:600 15px/1 'Be Vietnam Pro';letter-spacing:.42em}
.line:before,.line:after{content:"";width:46px;height:1.5px;background:currentColor;opacity:.6}
.light .line{color:#8a6a2a}.dark .line{color:#E9C46A}
.row{display:flex;align-items:center;gap:22px}
.row .icon{width:200px;height:92px}.row .wm{font-size:58px;margin:0}
.app{display:flex;gap:22px;align-items:end}
.sq{width:150px;height:150px;border-radius:34px;background:#0B2447;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#E9C46A}
.sq svg{width:118px;height:56px}.sq b{font:700 34px/1 'Cormorant Garamond',serif;color:#fff;letter-spacing:.06em;margin-top:6px}.sq b em{color:#E8590C;font-style:italic}
.sq.s{width:72px;height:72px;border-radius:18px}.sq.s svg{width:56px;height:26px}.sq.s b{font-size:17px;margin-top:3px}
</style></head><body><div class="g">
<div class="p light"><svg class="icon"><use href="bieu-tuong-net.svg#x"/></svg>__ICON__<div class="wm">Danang<em>Stay</em></div><div class="line">ĐÀ NẴNG · HỘI AN · HUẾ</div></div>
<div class="p dark">__ICON__<div class="wm">Danang<em>Stay</em></div><div class="line">ĐÀ NẴNG · HỘI AN · HUẾ</div></div>
<div class="p light"><div class="row">__ICON__<div><div class="wm">Danang<em>Stay</em></div><div class="line" style="justify-content:flex-start">ĐÀ NẴNG · HỘI AN · HUẾ</div></div></div></div>
<div class="p light"><div class="app"><div class="sq">__ICON__<b>D<em>S</em></b></div><div class="sq s">__ICON__<b>D<em>S</em></b></div></div></div>
</div></body></html>
