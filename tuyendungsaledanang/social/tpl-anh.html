<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{width:1080px;height:1350px;font-family:'Be Vietnam Pro',sans-serif;background:#1B2D6B;color:#fff;position:relative;overflow:hidden}
.ph{position:absolute;top:0;left:0;right:0;height:720px;background:url(../img/{{photo}}) {{pos}}/cover}
.ph:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,45,107,.55) 0%,rgba(27,45,107,0) 28%,rgba(27,45,107,0) 60%,#1B2D6B 100%)}
.top{position:absolute;z-index:2;top:52px;left:70px;right:70px;display:flex;justify-content:space-between;font-weight:800;font-size:26px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.top b{color:#f47c20}
.tag{position:absolute;z-index:2;top:600px;left:70px;background:#f47c20;font-weight:800;font-size:28px;padding:10px 22px;border-radius:99px}
.txt{position:absolute;top:690px;left:70px;right:70px}.head{font-size:60px;line-height:1.2;font-weight:900}
.head em{font-style:normal;color:#f47c20}
.sub{margin-top:26px;font-size:31px;line-height:1.5;color:#dfe5f5;font-weight:500}
.who{position:absolute;left:70px;bottom:192px;display:flex;align-items:center;gap:18px}
.who img{width:84px;height:84px;border-radius:50%;border:4px solid #f47c20}
.who b{display:block;font-size:30px}.who span{font-size:23px;color:#c9d2ea}
.cta{position:absolute;left:0;right:0;bottom:0;height:170px;background:#f47c20;display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.cta .l{font-size:26px;font-weight:700;line-height:1.4;white-space:nowrap}.cta .l b{font-size:32px;font-weight:900;display:block}
.cta .r{background:#fff;color:#1B2D6B;font-weight:900;font-size:32px;padding:20px 28px;border-radius:18px;white-space:nowrap}
</style></head><body>
<div class="ph"></div>
<div class="top"><span>TUYỂN SALE BĐS ĐÀ NẴNG <b>by Hoàng Hiệp</b></span><span>#HiệpChiaSẻ</span></div>
<div class="tag">{{tag}}</div>
<div class="txt"><div class="head">{{head}}</div><div class="sub">{{sub}}</div></div>
<div class="who"><img src="ava520.jpg"><div><b>Hoàng Hiệp chia sẻ</b><span>Giám đốc kinh doanh · Đà Nẵng</span></div></div>
<div class="cta"><div class="l"><b>Đào tạo từ 0 · Có người kèm</b>Data phân bổ mỗi ngày</div><div class="r">📞 0904 567 009</div></div>
</body></html>
